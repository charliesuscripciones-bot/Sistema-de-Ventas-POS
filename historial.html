<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Historial de ventas | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

/* CLIENTE */

.customer-banner{
  display:none;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
}

.customer-banner.visible{
  display:block;
}

.customer-banner-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}

.customer-banner-name{
  font-size:24px;
  font-weight:800;
}

.customer-banner-phone{
  margin-top:4px;
  color:#64748b;
}

/* BOTONES */

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:2px solid #ddd;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.business{
  color:#2680eb;
}

.business.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh{
  background:#2680eb;
  color:#fff;
  border-color:#2680eb;
}

.back{
  color:#111827;
}

/* FILTROS */

.filters{
  display:grid;
  grid-template-columns:1fr 170px 170px;
  gap:12px;
  margin-bottom:20px;
}

.filters input{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  background:#fff;
}

.filters input:focus{
  outline:none;
  border-color:#2680eb;
}

/* RESUMEN */

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.label{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
}

.value{
  font-size:28px;
  font-weight:800;
  margin-top:7px;
}

/* VENTAS */

.card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.sale{
  border:2px solid #eee;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
}

.sale:last-child{
  margin-bottom:0;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.date{
  font-weight:800;
}

.total{
  font-weight:800;
  font-size:19px;
}

.customer{
  color:#2680eb;
  font-weight:700;
  margin-top:7px;
}

.details{
  color:#6b7280;
  font-size:14px;
  margin-top:7px;
  word-break:break-word;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:9px;
  background:#dcfce7;
  color:#166534;
  font-weight:700;
  font-size:13px;
}

.status.open{
  background:#fef3c7;
  color:#92400e;
}

/* SALDO */

.balance-button{
  display:block;
  width:100%;
  margin-top:12px;
  padding:13px 15px;
  border-radius:12px;
  border:2px solid #f59e0b;
  background:#fffbeb;
  color:#92400e;
  text-align:left;
  font-size:15px;
  font-weight:800;
}

.balance-button:hover{
  background:#fef3c7;
}

.balance-button.paid{
  background:#dcfce7;
  border-color:#bbf7d0;
  color:#166534;
  cursor:default;
}

/* HISTORIAL DE ABONOS */

.payment-history{
  margin-top:15px;
  padding:15px;
  background:#f8fafc;
  border-radius:14px;
  border:1px solid #e2e8f0;
}

.payment-history-title{
  font-size:14px;
  font-weight:800;
  color:#334155;
  margin-bottom:10px;
}

.payment-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #e2e8f0;
}

.payment-row:last-child{
  border-bottom:0;
}

.payment-date{
  color:#64748b;
  font-size:13px;
}

.payment-amount{
  color:#16a34a;
  font-weight:800;
}

.payment-method{
  color:#64748b;
  font-size:12px;
  margin-top:3px;
}

.payment-total{
  margin-top:10px;
  padding-top:10px;
  border-top:2px solid #cbd5e1;
  display:flex;
  justify-content:space-between;
  font-weight:800;
  color:#334155;
}

.no-payments{
  color:#94a3b8;
  font-size:13px;
}

/* MODAL */

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-overlay.visible{
  display:flex;
}

.modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:22px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal h2{
  font-size:23px;
  margin-bottom:8px;
}

.modal-subtitle{
  color:#6b7280;
  margin-bottom:20px;
  line-height:1.4;
}

.modal-info{
  background:#f8fafc;
  border-radius:14px;
  padding:15px;
  margin-bottom:18px;
}

.modal-info strong{
  display:block;
  margin-bottom:5px;
}

.modal-balance{
  color:#dc2626;
  font-size:20px;
  font-weight:800;
}

.modal label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.modal input,
.modal select{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:18px;
  font-weight:700;
  margin-bottom:15px;
  background:#fff;
}

.modal input:focus,
.modal select:focus{
  outline:none;
  border-color:#2680eb;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-buttons button{
  padding:14px;
}

.btn-save{
  background:#16a34a;
  border-color:#16a34a;
  color:#fff;
}

.btn-liquidar{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff;
}

.btn-cancel{
  width:100%;
  margin-top:10px;
  background:#f1f5f9;
  border-color:#e2e8f0;
}

.modal-error{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  border-radius:10px;
  padding:11px;
  margin-bottom:12px;
  font-size:14px;
  font-weight:700;
}

.modal-error.visible{
  display:block;
}

/* MENSAJES */

.empty{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:12px;
  font-weight:700;
}

.success-message{
  background:#dcfce7;
  color:#166534;
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
  font-weight:700;
}

/* RESPONSIVE */

@media(max-width:700px){

  .filters{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .top{
    flex-direction:column;
  }

  .container{
    padding:18px 15px 35px;
  }

  .modal{
    padding:20px;
  }

  .modal-buttons{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================
   CONTEXTO DE LA URL
========================================= */

const urlParams =
new URLSearchParams(
  window.location.search
);

let selectedCustomerId =
urlParams.get("customer_id");


const requestedBusiness =
urlParams.get("business");


let currentBusiness =
BUSINESS_IDS[
  requestedBusiness
]
? requestedBusiness
: "BakeQuiri";


let sales = [];

let payments = [];

let paymentMethods = [];

let selectedSaleForPayment =
null;


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


function money(value){

  return "$" +
    Number(value || 0).toFixed(2);

}


/*
 * =====================================================
 * FECHA DE LA VENTA
 * =====================================================
 *
 * IMPORTANTE:
 *
 * Para el historial utilizamos primero
 * created_at porque representa el momento
 * real en que la cuenta fue creada.
 *
 * sale_date queda únicamente como respaldo.
 *
 * Esto evita que varias cuentas aparezcan
 * con la misma fecha/hora cuando sale_date
 * fue guardado con un valor predeterminado.
 */

function getSaleDate(sale){

  return (
    sale.created_at ||
    sale.sale_date ||
    null
  );

}


/*
 * Formato de fecha y hora para México.
 */

function formatDate(value){

  if(!value)
    return "Sin fecha";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "Fecha inválida";

  }

  return date.toLocaleString(
    "es-MX",
    {
      day:"2-digit",
      month:"2-digit",
      year:"2-digit",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  );

}


/*
 * Fecha utilizada por los filtros.
 */

function getSaleDateKey(sale){

  const value =
    getSaleDate(sale);

  if(!value)
    return "";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================
   ACTUALIZAR BOTONES DE NEGOCIO
========================================= */

function updateBusinessButtons(){

  document
    .querySelectorAll(
      ".business"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.business ===
          currentBusiness
        );

      }
    );

}


/* =========================================
   CARGAR MÉTODOS DE PAGO
========================================= */

async function loadPaymentMethods(){

  const businessId =
    BUSINESS_IDS[currentBusiness];

  const result =
    await supabaseClient
      .from("payment_methods")
      .select(
        "id,name,provider,active"
      )
      .eq(
        "business_id",
        businessId
      )
      .eq(
        "active",
        true
      )
      .order(
        "name"
      );

  if(result.error)
    throw result.error;

  paymentMethods =
    result.data || [];

}


/* =========================================
   RENDERIZAR MÉTODOS DE PAGO
========================================= */

function renderPaymentMethods(){

  const select =
    $("paymentMethod");

  select.innerHTML = "";

  if(!paymentMethods.length){

    const option =
      document.createElement("option");

    option.value = "";

    option.textContent =
      "No hay métodos de pago configurados";

    select.appendChild(option);

    return;

  }

  paymentMethods.forEach(
    method => {

      const option =
        document.createElement("option");

      option.value =
        method.id;

      option.textContent =
        method.name;

      select.appendChild(option);

    }
  );

}


/* =========================================
   CLIENTE
========================================= */

async function loadSelectedCustomer(){

  if(!selectedCustomerId){

    $("customerBanner")
      .classList.remove(
        "visible"
      );

    return;

  }


  try{

    const result =
      await supabaseClient
        .from("customers")
        .select(
          "id,name,phone"
        )
        .eq(
          "id",
          selectedCustomerId
        )
        .single();

    if(result.error)
      throw result.error;

    const customer =
      result.data;

    if(!customer)
      return;

    $("customerBannerName")
      .textContent =
      customer.name ||
      "Cliente";

    $("customerBannerPhone")
      .textContent =
      customer.phone
      ? "📱 " + customer.phone
      : "";

    $("customerBanner")
      .classList.add(
        "visible"
      );

  }
  catch(error){

    console.error(
      "No se pudo cargar el cliente:",
      error
    );

  }

}


/* =========================================
   CARGAR VENTAS
========================================= */

async function loadSales(){

  $("sales").innerHTML =
    '<div class="empty">' +
    "Cargando ventas..." +
    "</div>";

  try{

    const businessId =
      BUSINESS_IDS[currentBusiness];


    /* =====================================
       VENTAS
    ===================================== */

    const result =
      await supabaseClient
        .from("sales")
        .select(
          "id,business_id,customer_id,sale_date,total,balance,status,created_at"
        )
        .eq(
          "business_id",
          businessId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error)
      throw result.error;


    sales =
      result.data || [];


    /*
     * Orden de seguridad.
     *
     * Si por alguna razón Supabase no devuelve
     * el orden esperado, aquí volvemos a ordenar
     * usando created_at.
     */

    sales.sort(
      (a,b) => {

        const dateA =
          new Date(
            getSaleDate(a) || 0
          ).getTime();

        const dateB =
          new Date(
            getSaleDate(b) || 0
          ).getTime();

        return dateB - dateA;

      }
    );


    /* =====================================
       ABONOS
    ===================================== */

    const saleIds =
      sales.map(
        sale =>
          sale.id
      );


    payments = [];


    if(saleIds.length){

      const paymentsResult =
        await supabaseClient
          .from("payments")
          .select(
            "id,sale_id,amount,paid_at,payment_method_id"
          )
          .in(
            "sale_id",
            saleIds
          )
          .order(
            "paid_at",
            {
              ascending:true
            }
          );


      if(paymentsResult.error)
        throw paymentsResult.error;


      payments =
        paymentsResult.data || [];

    }


    /* =====================================
       MÉTODOS DE PAGO
    ===================================== */

    await loadPaymentMethods();

    renderPaymentMethods();


    /*
     * El cliente se mantiene al cambiar
     * de negocio.
     */

    await loadSelectedCustomer();

    await renderSales();

  }
  catch(error){

    console.error(error);

    $("sales").innerHTML =

      '<div class="error">' +

      "No se pudieron cargar las ventas: " +

      (
        error.message ||
        error
      ) +

      "</div>";

  }

}


/* =========================================
   RENDERIZAR VENTAS
========================================= */

async function renderSales(){

  const searchText =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const from =
    $("from").value;

  const to =
    $("to").value;


  let rows =
    sales.filter(
      sale => {

        const date =
          getSaleDateKey(
            sale
          );


        if(from && date < from)
          return false;

        if(to && date > to)
          return false;


        if(
          selectedCustomerId &&
          sale.customer_id !==
          selectedCustomerId
        )
          return false;


        return true;

      }
    );


  /* =====================================
     CLIENTES
  ===================================== */

  const customerMap =
    new Map();

  const customerIds =
    [
      ...new Set(
        rows
          .map(
            sale =>
              sale.customer_id
          )
          .filter(Boolean)
      )
    ];


  if(customerIds.length){

    const result =
      await supabaseClient
        .from("customers")
        .select(
          "id,name,phone"
        )
        .in(
          "id",
          customerIds
        );


    if(result.error)
      throw result.error;


    (result.data || [])
      .forEach(
        customer => {

          customerMap.set(
            customer.id,
            customer
          );

        }
      );

  }


  /* =====================================
     BÚSQUEDA
  ===================================== */

  rows =
    rows.filter(
      sale => {

        if(!searchText)
          return true;


        const customer =
          customerMap.get(
            sale.customer_id
          );


        const text =
          [
            customer?.name,
            customer?.phone,
            sale.id
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return text.includes(
          searchText
        );

      }
    );


  /* =====================================
     RESUMEN
  ===================================== */

  $("count").textContent =
    rows.length;


  $("total").textContent =
    money(
      rows.reduce(
        (sum,sale) =>
          sum +
          Number(
            sale.total || 0
          ),
        0
      )
    );


  $("balance").textContent =
    money(
      rows.reduce(
        (sum,sale) =>
          sum +
          Number(
            sale.balance || 0
          ),
        0
      )
    );


  /* =====================================
     SIN RESULTADOS
  ===================================== */

  if(!rows.length){

    $("sales").innerHTML =
      '<div class="empty">' +
      "No hay ventas que coincidan con los filtros." +
      "</div>";

    return;

  }


  $("sales").innerHTML =
    "";


  /* =====================================
     VENTAS
  ===================================== */

  rows.forEach(
    sale => {

      const customer =
        customerMap.get(
          sale.customer_id
        );


      const customerName =
        customer?.name ||
        "Consumidor general";


      const phone =
        customer?.phone
        ? " · 📱 " +
          customer.phone
        : "";


      const state =
        sale.status || "";


      const balance =
        Number(
          sale.balance || 0
        );


      /* =================================
         ABONOS
      ================================= */

      const salePayments =
        payments.filter(
          payment =>
            payment.sale_id ===
            sale.id
        );


      const totalPaid =
        salePayments.reduce(
          (sum,payment) =>
            sum +
            Number(
              payment.amount || 0
            ),
          0
        );


      let statusText;


      if(state === "paid"){

        statusText =
          "Pagada";

      }
      else if(state === "open"){

        statusText =
          "Pendiente";

      }
      else{

        statusText =
          state ||
          "Registrada";

      }


      /* =================================
         CONTENEDOR
      ================================= */

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "sale";


      /*
       * AQUÍ ESTÁ EL CAMBIO PRINCIPAL:
       *
       * La fecha visible utiliza created_at.
       */

      element.innerHTML =

        '<div class="top">' +

        '<div class="date">' +
        "Venta · " +
        formatDate(
          getSaleDate(sale)
        ) +
        "</div>" +

        '<div class="total">' +
        money(sale.total) +
        "</div>" +

        "</div>" +

        '<div class="customer">' +
        "👤 " +
        customerName +
        phone +
        "</div>" +

        '<div class="details">' +
        "ID: " +
        sale.id +
        "</div>" +

        '<span class="status ' +
        (
          state === "open"
          ? "open"
          : ""
        ) +
        '">' +

        (
          state === "paid"
          ? "✓ "
          : ""
        ) +

        statusText +

        "</span>";


      /* =================================
         HISTORIAL DE ABONOS
      ================================= */

      if(salePayments.length){

        const history =
          document.createElement(
            "div"
          );


        history.className =
          "payment-history";


        history.innerHTML =
          '<div class="payment-history-title">' +
          "💵 Historial de abonos" +
          "</div>";


        salePayments.forEach(
          payment => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "payment-row";


            const method =
              paymentMethods.find(
                method =>
                  method.id ===
                  payment.payment_method_id
              );


            row.innerHTML =

              '<div>' +

              '<div class="payment-date">' +
              "💵 " +
              formatDate(
                payment.paid_at
              ) +
              "</div>" +

              (
                method
                ? '<div class="payment-method">' +
                  "Método: " +
                  method.name +
                  "</div>"
                : ""
              ) +

              "</div>" +

              '<div class="payment-amount">' +
              "+" +
              money(
                payment.amount
              ) +
              "</div>";


            history.appendChild(
              row
            );

          }
        );


        const totalRow =
          document.createElement(
            "div"
          );


        totalRow.className =
          "payment-total";


        totalRow.innerHTML =

          "<span>Total abonado</span>" +

          "<span>" +
          money(totalPaid) +
          "</span>";


        history.appendChild(
          totalRow
        );


        element.appendChild(
          history
        );

      }


      /* =================================
         SALDO
      ================================= */

      if(balance > 0){

        const balanceButton =
          document.createElement(
            "button"
          );


        balanceButton.type =
          "button";


        balanceButton.className =
          "balance-button";


        balanceButton.innerHTML =
          "💰 Saldo pendiente: " +
          money(balance) +
          " · Registrar abono";


        balanceButton.addEventListener(
          "click",
          () => {

            openPaymentModal(
              sale,
              customerName
            );

          }
        );


        element.appendChild(
          balanceButton
        );

      }
      else{

        const paidButton =
          document.createElement(
            "button"
          );


        paidButton.type =
          "button";


        paidButton.className =
          "balance-button paid";


        paidButton.disabled =
          true;


        paidButton.innerHTML =
          "✓ Cuenta liquidada";


        element.appendChild(
          paidButton
        );

      }


      $("sales")
        .appendChild(
          element
        );

    }
  );

}


/* =========================================
   ABRIR MODAL
========================================= */

function openPaymentModal(
  sale,
  customerName
){

  selectedSaleForPayment =
    sale;


  $("paymentSubtitle")
    .textContent =
      customerName +
      " · Venta de " +
      money(
        sale.total
      );


  $("modalBalance")
    .textContent =
      money(
        sale.balance
      );


  $("paymentAmount")
    .value =
      "";


  $("modalError")
    .textContent =
      "";


  $("modalError")
    .classList.remove(
      "visible"
    );


  renderPaymentMethods();


  if(paymentMethods.length){

    $("paymentMethod")
      .value =
        paymentMethods[0].id;

  }


  $("paymentModal")
    .classList.add(
      "visible"
    );


  setTimeout(
    () => {

      $("paymentAmount")
        .focus();

    },
    100
  );

}


/* =========================================
   CERRAR MODAL
========================================= */

function closePaymentModal(){

  selectedSaleForPayment =
    null;

  $("paymentModal")
    .classList.remove(
      "visible"
    );

}


/* =========================================
   ERROR
========================================= */

function showPaymentError(
  message
){

  $("modalError")
    .textContent =
      message;

  $("modalError")
    .classList.add(
      "visible"
    );

}


/* =========================================
   REGISTRAR ABONO
========================================= */

async function registerPayment(
  amount
){

  if(!selectedSaleForPayment)
    return;


  const sale =
    selectedSaleForPayment;


  const currentBalance =
    Number(
      sale.balance || 0
    );


  amount =
    Number(amount);


  const paymentMethodId =
    $("paymentMethod").value;


  if(!Number.isFinite(amount)){

    showPaymentError(
      "Escribe una cantidad válida."
    );

    return;

  }


  if(amount <= 0){

    showPaymentError(
      "El abono debe ser mayor a $0.00."
    );

    return;

  }


  if(
    amount >
    currentBalance + 0.001
  ){

    showPaymentError(
      "El abono no puede ser mayor al saldo pendiente de " +
      money(currentBalance) +
      "."
    );

    return;

  }


  if(!paymentMethodId){

    showPaymentError(
      "Selecciona el método de pago del abono."
    );

    return;

  }


  $("savePayment")
    .disabled =
      true;


  $("payFull")
    .disabled =
      true;


  $("paymentMethod")
    .disabled =
      true;


  $("savePayment")
    .textContent =
      "⏳ Procesando...";


  $("payFull")
    .textContent =
      "⏳ Procesando...";


  try{

    const rpcResult =
      await supabaseClient
        .rpc(
          "registrar_abono_venta",
          {

            p_sale_id:
              sale.id,

            p_amount:
              amount,

            p_payment_method_id:
              paymentMethodId

          }
        );


    if(rpcResult.error)
      throw rpcResult.error;


    const result =
      Array.isArray(
        rpcResult.data
      )
      ? rpcResult.data[0]
      : rpcResult.data;


    if(!result){

      throw new Error(
        "Supabase no devolvió el resultado del abono."
      );

    }


    const newBalance =
      Number(
        result.new_balance || 0
      );


    const selectedMethod =
      paymentMethods.find(
        method =>
          method.id ===
          paymentMethodId
      );


    closePaymentModal();


    if(newBalance <= 0.001){

      $("message").innerHTML =
        '<div class="success-message">' +
        "✅ Cuenta liquidada correctamente con " +
        (
          selectedMethod?.name ||
          "el método seleccionado"
        ) +
        "." +
        "</div>";

    }
    else{

      $("message").innerHTML =
        '<div class="success-message">' +
        "💰 Abono registrado correctamente con " +
        (
          selectedMethod?.name ||
          "el método seleccionado"
        ) +
        ". Nuevo saldo: " +
        money(newBalance) +
        "</div>";

    }


    await loadSales();


    setTimeout(
      () => {

        $("message").innerHTML =
          "";

      },
      5000
    );

  }
  catch(error){

    console.error(
      "Error registrando abono:",
      error
    );


    showPaymentError(
      "No se pudo registrar el abono: " +
      (
        error.message ||
        "Error desconocido."
      )
    );

  }
  finally{

    $("savePayment")
      .disabled =
        false;


    $("payFull")
      .disabled =
        false;


    $("paymentMethod")
      .disabled =
        false;


    $("savePayment")
      .textContent =
        "💵 Registrar abono";


    $("payFull")
      .textContent =
        "✓ Liquidar cuenta";

  }

}


/* =========================================
   BOTÓN ABONO
========================================= */

$("savePayment")
.addEventListener(
  "click",
  async () => {

    await registerPayment(
      Number(
        $("paymentAmount").value
      )
    );

  }
);


/* =========================================
   LIQUIDAR
========================================= */

$("payFull")
.addEventListener(
  "click",
  async () => {

    if(!selectedSaleForPayment)
      return;


    const balance =
      Number(
        selectedSaleForPayment.balance ||
        0
      );


    await registerPayment(
      balance
    );

  }
);


/* =========================================
   CANCELAR
========================================= */

$("cancelPayment")
.addEventListener(
  "click",
  closePaymentModal
);


/* =========================================
   CERRAR FUERA DEL MODAL
========================================= */

$("paymentModal")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("paymentModal")
    ){

      closePaymentModal();

    }

  }
);


/* =========================================
   ESC
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closePaymentModal();

    }

  }
);


/* =========================================
   CAMBIAR NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
          button.dataset.business;


        if(
          business ===
          currentBusiness
        )
          return;


        currentBusiness =
          business;


        updateBusinessButtons();


        const params =
          new URLSearchParams();


        if(selectedCustomerId){

          params.set(
            "customer_id",
            selectedCustomerId
          );

        }


        params.set(
          "business",
          currentBusiness
        );


        window.history.replaceState(
          {},
          "",
          "cuentas.html?" +
          params.toString()
        );


        await loadSales();

      }
    );

  }
);


/* =========================================
   FILTROS
========================================= */

$("search")
.addEventListener(
  "input",
  renderSales
);


$("from")
.addEventListener(
  "change",
  renderSales
);


$("to")
.addEventListener(
  "change",
  renderSales
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refresh")
.addEventListener(
  "click",
  loadSales
);


/* =========================================
   DASHBOARD
========================================= */

$("back")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "dashboard.html" +
      "?business=" +
      encodeURIComponent(
        currentBusiness
      );

  }
);


/* =========================================
   INICIO
========================================= */

updateBusinessButtons();

loadSales();

</script>

</body>

</html>
