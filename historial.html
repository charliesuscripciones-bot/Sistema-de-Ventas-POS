<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial | Sistema de Ventas POS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f5f5f5;color:#171717
}
header{background:#111827;color:white;padding:25px 20px}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:#d1d5db}
.container{max-width:1100px;margin:auto;padding:20px}

.topbar{
 display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px
}
button{
 border:0;cursor:pointer;font-size:16px
}
.business-btn,.back{
 background:white;border:2px solid #ddd;border-radius:12px;
 padding:12px 22px;font-weight:700
}
.business-btn.active{
 background:#111827;color:white;border-color:#111827
}
.refresh{
 background:#2563eb;color:white;padding:12px 20px;
 border-radius:12px;font-weight:700
}
.back{margin-left:auto}

.card{
 background:white;border-radius:18px;padding:22px;
 box-shadow:0 4px 18px rgba(0,0,0,.06);
 margin-bottom:20px
}

.filters{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:12px
}
.filters label{
 display:block;color:#6b7280;font-size:13px;
 font-weight:700;margin-bottom:6px
}
.filters input,.filters select{
 width:100%;padding:12px;border:2px solid #ddd;
 border-radius:10px;font-size:16px;background:white
}

.metrics{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;margin-bottom:20px
}
.metric-card{
 background:white;border-radius:18px;padding:20px;
 box-shadow:0 4px 18px rgba(0,0,0,.06)
}
.metric-title{color:#6b7280;font-size:15px;margin-bottom:8px}
.metric{font-size:28px;font-weight:800}
.green{color:#16a34a}
.blue{color:#2563eb}
.orange{color:#d97706}

.section-title{
 font-size:22px;font-weight:800;margin:0 0 18px
}
table{width:100%;border-collapse:collapse}
th{
 text-align:left;color:#6b7280;font-size:13px;
 padding:10px 6px;border-bottom:2px solid #eee
}
td{padding:13px 6px;border-bottom:1px solid #eee}

.status-pill{
 display:inline-block;padding:5px 9px;border-radius:20px;
 font-size:12px;font-weight:700
}
.paid{background:#dcfce7;color:#166534}
.open{background:#fef3c7;color:#92400e}
.cancelled{background:#fee2e2;color:#991b1b}

.empty,.loading{
 text-align:center;color:#777;padding:30px 10px
}

.status{
 display:none;padding:13px 15px;border-radius:10px;
 margin-bottom:20px
}
.status.ok{
 display:block;background:#dcfce7;color:#166534
}
.status.error{
 display:block;background:#fee2e2;color:#991b1b
}

@media(max-width:700px){
 .filters,.metrics{grid-template-columns:1fr}
 .back{margin-left:0}
 th:nth-child(5),td:nth-child(5){display:none}
}
</style>
</head>

<body>

<header>
<h1>🧾 Historial de ventas</h1>
<p>Sistema de Ventas POS · Consulta de ventas</p>
</header>

<div class="container">

<div id="status" class="status"></div>

<div class="topbar">

<button class="business-btn active"
data-business="BakeQuiri">
BakeQuiri
</button>

<button class="business-btn"
data-business="SpicyRoll">
SpicyRoll
</button>

<button id="refresh" class="refresh">
🔄 Actualizar
</button>

<button id="back" class="back">
← Dashboard
</button>

</div>

<div class="card">

<div class="filters">

<div>
<label>Desde</label>
<input id="from" type="date">
</div>

<div>
<label>Hasta</label>
<input id="to" type="date">
</div>

<div>
<label>Estado</label>
<select id="statusFilter">
<option value="all">Todos</option>
<option value="paid">Pagadas</option>
<option value="open">Pendientes</option>
<option value="cancelled">Canceladas</option>
</select>
</div>

</div>

</div>

<div class="metrics">

<div class="metric-card">
<div class="metric-title">Ventas encontradas</div>
<div id="count" class="metric blue">0</div>
</div>

<div class="metric-card">
<div class="metric-title">Total vendido</div>
<div id="total" class="metric green">$0.00</div>
</div>

<div class="metric-card">
<div class="metric-title">Ticket promedio</div>
<div id="average" class="metric orange">$0.00</div>
</div>

</div>

<div class="card">

<h2 class="section-title">
📋 Ventas
</h2>

<div id="salesContainer">
<div class="loading">
Cargando ventas...
</div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

const BUSINESS_IDS = {

BakeQuiri:
"c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

SpicyRoll:
"ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

let currentBusiness="BakeQuiri";

const $=id=>document.getElementById(id);

function money(v){
return "$"+Number(v||0).toFixed(2);
}

function showStatus(message,type="error"){
$("status").textContent=message;
$("status").className="status "+type;
}

function today(){

const d=new Date();

return d.toISOString().slice(0,10);

}

function thirtyDaysAgo(){

const d=new Date();

d.setDate(d.getDate()-30);

return d.toISOString().slice(0,10);

}

async function loadHistory(){

$("salesContainer").innerHTML=
'<div class="loading">Cargando ventas...</div>';

try{

const businessId=
BUSINESS_IDS[currentBusiness];

let query=
supabaseClient
.from("sales")
.select("id,total,status,created_at")
.eq("business_id",businessId)
.order("created_at",{ascending:false})
.limit(500);

const from=$("from").value;
const to=$("to").value;

if(from){

query=query.gte(
"created_at",
from+"T00:00:00"
);

}

if(to){

const end=
new Date(to+"T00:00:00");

end.setDate(end.getDate()+1);

query=query.lt(
"created_at",
end.toISOString()
);

}

const result=await query;

if(result.error)
throw result.error;

let sales=result.data||[];

const selectedStatus=
$("statusFilter").value;

if(selectedStatus!=="all"){

sales=sales.filter(
sale=>sale.status===selectedStatus
);

}

const total=sales.reduce(
(sum,sale)=>
sum+Number(sale.total||0),
0
);

$("count").textContent=
sales.length;

$("total").textContent=
money(total);

$("average").textContent=
money(
sales.length
? total/sales.length
: 0
);

renderSales(sales);

showStatus(
"Historial actualizado correctamente.",
"ok"
);

}catch(error){

console.error(error);

showStatus(
"No se pudo cargar el historial: "+
(error.message||error)
);

}

}

function renderSales(sales){

const container=
$("salesContainer");

if(!sales.length){

container.innerHTML=
'<div class="empty">'+
'No hay ventas para los filtros seleccionados.'+
'</div>';

return;

}

const table=
document.createElement("table");

table.innerHTML=`

<thead>
<tr>
<th>Fecha</th>
<th>Hora</th>
<th>Total</th>
<th>Estado</th>
<th>ID</th>
</tr>
</thead>

<tbody></tbody>
`;

const tbody=
table.querySelector("tbody");

sales.forEach(sale=>{

const date=
new Date(sale.created_at);

const row=
document.createElement("tr");

let statusText="—";
let statusClass="";

if(sale.status==="paid"){
statusText="Pagada";
statusClass="paid";
}

if(sale.status==="open"){
statusText="Pendiente";
statusClass="open";
}

if(sale.status==="cancelled"){
statusText="Cancelada";
statusClass="cancelled";
}

row.innerHTML=`

<td>
${date.toLocaleDateString("es-MX")}
</td>

<td>
${date.toLocaleTimeString(
"es-MX",
{hour:"2-digit",minute:"2-digit"}
)}
</td>

<td>
<strong>${money(sale.total)}</strong>
</td>

<td>
<span class="status-pill ${statusClass}">
${statusText}
</span>
</td>

<td style="font-size:10px;color:#777">
${sale.id}
</td>

`;

tbody.appendChild(row);

});

container.innerHTML="";
container.appendChild(table);

}

document
.querySelectorAll(".business-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(".business-btn")
.forEach(b=>
b.classList.remove("active")
);

button.classList.add("active");

currentBusiness=
button.dataset.business;

loadHistory();

});

});

$("refresh")
.addEventListener(
"click",
loadHistory
);

$("from")
.addEventListener(
"change",
loadHistory
);

$("to")
.addEventListener(
"change",
loadHistory
);

$("statusFilter")
.addEventListener(
"change",
loadHistory
);

$("back")
.addEventListener(
"click",
()=>location.href="dashboard.html"
);

$("from").value=
thirtyDaysAgo();

$("to").value=
today();

loadHistory();

</script>

</body>
</html>
