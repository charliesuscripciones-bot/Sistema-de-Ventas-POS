<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Historial de ventas | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

.customer-banner{
  display:none;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
}

.customer-banner.visible{
  display:block;
}

.customer-banner-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:5px;
}

.customer-banner-name{
  font-size:24px;
  font-weight:800;
}

.customer-banner-phone{
  margin-top:4px;
  color:#64748b;
}

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:2px solid #ddd;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.business{
  color:#2680eb;
}

.business.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh{
  background:#2680eb;
  color:#fff;
  border-color:#2680eb;
}

.back{
  color:#111827;
}

.filters{
  display:grid;
  grid-template-columns:1fr 170px 170px;
  gap:12px;
  margin-bottom:20px;
}

.filters input{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  background:#fff;
}

.filters input:focus{
  outline:none;
  border-color:#2680eb;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.label{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
}

.value{
  font-size:28px;
  font-weight:800;
  margin-top:7px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.sale{
  border:2px solid #eee;
  border-radius:16px;
  padding:18px;
  margin-bottom:12px;
}

.sale:last-child{
  margin-bottom:0;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.date{
  font-weight:800;
}

.total{
  font-weight:800;
  font-size:19px;
}

.customer{
  color:#2680eb;
  font-weight:700;
  margin-top:7px;
}

.details{
  color:#6b7280;
  font-size:14px;
  margin-top:7px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:8px;
  background:#dcfce7;
  color:#166534;
  font-weight:700;
  font-size:13px;
}

.status.open{
  background:#fef3c7;
  color:#92400e;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:12px;
  font-weight:700;
}

@media(max-width:700px){

  .filters{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .top{
    flex-direction:column;
  }

  .container{
    padding:18px 15px 35px;
  }

}

</style>

</head>


<body>

<header>

<h1>
📊 Historial de ventas
</h1>

<p>
Consulta las ventas registradas de tus negocios
</p>

</header>


<div class="container">


<!-- =========================================
     HISTORIAL DE CLIENTE
========================================= -->

<div
  id="customerBanner"
  class="customer-banner">

  <div class="customer-banner-title">
    HISTORIAL DEL CLIENTE
  </div>

  <div
    id="customerBannerName"
    class="customer-banner-name">
  </div>

  <div
    id="customerBannerPhone"
    class="customer-banner-phone">
  </div>

</div>


<!-- BOTONES -->

<div class="toolbar">

<button
type="button"
class="business active"
data-business="BakeQuiri">

BakeQuiri

</button>


<button
type="button"
class="business"
data-business="SpicyRoll">

SpicyRoll

</button>


<button
type="button"
class="refresh"
id="refresh">

🔄 Actualizar

</button>


<button
type="button"
class="back"
id="back">

← Dashboard

</button>

</div>


<!-- FILTROS -->

<div class="filters">

<input
id="search"
type="search"
placeholder="🔎 Buscar cliente o venta"
autocomplete="off"
>


<input
id="from"
type="date"
>


<input
id="to"
type="date"
>

</div>


<!-- RESUMEN -->

<div class="summary">


<div class="summary-card">

<div class="label">
VENTAS
</div>

<div
id="count"
class="value">

0

</div>

</div>


<div class="summary-card">

<div class="label">
TOTAL VENDIDO
</div>

<div
id="total"
class="value">

$0.00

</div>

</div>


<div class="summary-card">

<div class="label">
PENDIENTE
</div>

<div
id="balance"
class="value">

$0.00

</div>

</div>


</div>


<!-- VENTAS -->

<div class="card">

<div id="sales">

<div class="empty">
Cargando ventas...
</div>

</div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

BakeQuiri:
"c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

SpicyRoll:
"ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";


let sales = [];


/* =========================================
   CLIENTE SELECCIONADO
========================================= */

const urlParams =
new URLSearchParams(
  window.location.search
);


let selectedCustomerId =
urlParams.get(
  "customer_id"
);


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


function money(value){

return "$" +
Number(value || 0).toFixed(2);

}


function formatDate(value){

if(!value)
return "Sin fecha";


return new Date(value)
.toLocaleString(
"es-MX",
{
dateStyle:"short",
timeStyle:"short"
}
);

}


/* =========================================
   CARGAR INFORMACIÓN DEL CLIENTE
========================================= */

async function loadSelectedCustomer(){

if(!selectedCustomerId){

return;

}


try{

const result =
await supabaseClient

.from("customers")

.select(
"id,name,phone"
)

.eq(
"id",
selectedCustomerId
)

.single();


if(result.error){

console.error(
  "No se pudo cargar el cliente:",
  result.error
);

return;

}


const customer =
result.data;


if(!customer){

return;

}


$("customerBannerName")
.textContent =
customer.name ||
"Cliente";


$("customerBannerPhone")
.textContent =
customer.phone
? "📱 " + customer.phone
: "";


$("customerBanner")
.classList.add(
"visible"
);

}

catch(error){

console.error(error);

}

}


/* =========================================
   CARGAR VENTAS
========================================= */

async function loadSales(){

$("sales").innerHTML =
'<div class="empty">Cargando ventas...</div>';


try{

const businessId =
BUSINESS_IDS[currentBusiness];


const result =
await supabaseClient

.from("sales")

.select(
"id,business_id,customer_id,sale_date,total,balance,status,created_at"
)

.eq(
"business_id",
businessId
)

.order(
"created_at",
{
ascending:false
}
);


if(result.error){

throw result.error;

}


sales =
result.data || [];


await loadSelectedCustomer();

await renderSales();

}

catch(error){

console.error(error);


$("sales").innerHTML =

'<div class="error">' +

"No se pudieron cargar las ventas: " +

(
error.message ||
error
) +

"</div>";

}

}


/* =========================================
   RENDERIZAR VENTAS
========================================= */

async function renderSales(){

const searchText =
$("search")
.value
.trim()
.toLowerCase();


const from =
$("from").value;


const to =
$("to").value;


let rows =
sales.filter(
sale => {

const date =
(
sale.sale_date ||
sale.created_at ||
""
).slice(0,10);


if(from && date < from)
return false;


if(to && date > to)
return false;


/* =======================================
   FILTRO DIRECTO POR CLIENTE
======================================= */

if(
selectedCustomerId &&
sale.customer_id !==
selectedCustomerId
){

return false;

}


return true;

}
);


/* =========================================
   CLIENTES
========================================= */

const customerMap =
new Map();


const customerIds =
[
...new Set(
rows
.map(
sale =>
sale.customer_id
)
.filter(Boolean)
)
];


if(customerIds.length){

const customersResult =
await supabaseClient

.from("customers")

.select(
"id,name,phone"
)

.in(
"id",
customerIds
);


if(customersResult.error){

throw customersResult.error;

}


(customersResult.data || [])
.forEach(
customer => {

customerMap.set(
customer.id,
customer
);

}
);

}


/* =========================================
   FILTRAR POR BÚSQUEDA
========================================= */

rows =
rows.filter(
sale => {

if(!searchText)
return true;


const customer =
customerMap.get(
sale.customer_id
);


const text =
[
customer?.name,
customer?.phone,
sale.id
]
.filter(Boolean)
.join(" ")
.toLowerCase();


return text.includes(
searchText
);

}
);


/* =========================================
   RESUMEN
========================================= */

$("count").textContent =
rows.length;


$("total").textContent =
money(
rows.reduce(
(sum,sale) =>
sum +
Number(
sale.total || 0
),
0
)
);


$("balance").textContent =
money(
rows.reduce(
(sum,sale) =>
sum +
Number(
sale.balance || 0
),
0
)
);


/* =========================================
   SIN RESULTADOS
========================================= */

if(!rows.length){

$("sales").innerHTML =

'<div class="empty">' +

"No hay ventas que coincidan con los filtros." +

"</div>";

return;

}


/* =========================================
   MOSTRAR VENTAS
========================================= */

$("sales").innerHTML =
"";


rows.forEach(
sale => {

const customer =
customerMap.get(
sale.customer_id
);


const element =
document.createElement(
"div"
);


element.className =
"sale";


const state =
sale.status || "";


const customerName =
customer?.name ||
"Consumidor general";


const phone =
customer?.phone
? " · 📱 " +
customer.phone
: "";


let statusText;


if(state === "open"){

statusText =
"Pendiente";

}
else if(state === "paid"){

statusText =
"Pagada";

}
else{

statusText =
state ||
"Registrada";

}


element.innerHTML =

'<div class="top">' +

'<div class="date">' +

"Venta · " +

formatDate(
sale.sale_date ||
sale.created_at
) +

"</div>" +

'<div class="total">' +

money(
sale.total
) +

"</div>" +

"</div>" +


'<div class="customer">' +

"👤 " +

customerName +

phone +

"</div>" +


'<div class="details">' +

"ID: " +

sale.id +

"</div>" +


'<span class="status ' +

(
state === "open"
? "open"
: ""
) +

'">' +

statusText +

"</span>" +


(
Number(
sale.balance || 0
) > 0

?

'<div class="details">' +

"Saldo pendiente: " +

"<strong>" +

money(
sale.balance
) +

"</strong>" +

"</div>"

:

""

);


$("sales")
.appendChild(
element
);

}

);

}


/* =========================================
   CAMBIAR NEGOCIO
========================================= */

document
.querySelectorAll(
".business"
)
.forEach(
button => {

button.addEventListener(
"click",
async () => {

const business =
button.dataset.business;


if(
business ===
currentBusiness
){

return;

}


currentBusiness =
business;


document
.querySelectorAll(
".business"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);


button.classList.add(
"active"
);


/*
  Si cambiamos de negocio,
  el cliente seleccionado podría
  no pertenecer al nuevo negocio.
  Por seguridad quitamos el filtro.
*/

selectedCustomerId =
null;


$("customerBanner")
.classList.remove(
"visible"
);


window.history.replaceState(
{},
"",
"historial.html"
);


await loadSales();

}
);

}
);


/* =========================================
   FILTROS
========================================= */

$("search")
.addEventListener(
"input",
renderSales
);


$("from")
.addEventListener(
"change",
renderSales
);


$("to")
.addEventListener(
"change",
renderSales
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refresh")
.addEventListener(
"click",
loadSales
);


/* =========================================
   DASHBOARD
========================================= */

$("back")
.addEventListener(
"click",
() => {

window.location.href =
"dashboard.html";

}
);


/* =========================================
   INICIO
========================================= */

loadSales();

</script>

</body>

</html>
