<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Historial de ventas | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

.status{
  display:none;
  margin-bottom:18px;
  padding:15px;
  border-radius:12px;
  font-weight:600;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.business-btn,
.action-btn{
  border:2px solid #ddd;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.business-btn{
  color:#2680eb;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh-btn{
  background:#2680eb;
  color:#fff;
  border-color:#2680eb;
}

.dashboard-btn{
  color:#111827;
}

.filters{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.filters-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
}

.field label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#2680eb;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-label{
  color:#6b7280;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.summary-value{
  font-size:27px;
  font-weight:800;
}

.summary-card.sales .summary-value{
  color:#2563eb;
}

.summary-card.total .summary-value{
  color:#16a34a;
}

.summary-card.pending .summary-value{
  color:#dc2626;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  font-size:24px;
  margin-bottom:18px;
}

.sale{
  border:2px solid #eee;
  border-radius:16px;
  margin-bottom:15px;
  overflow:hidden;
}

.sale-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  cursor:pointer;
}

.sale-header:hover{
  background:#fafafa;
}

.sale-main{
  min-width:0;
}

.sale-number{
  font-size:18px;
  font-weight:800;
}

.sale-customer{
  margin-top:5px;
  color:#6b7280;
  font-size:14px;
}

.sale-date{
  margin-top:4px;
  color:#6b7280;
  font-size:13px;
}

.sale-right{
  text-align:right;
  white-space:nowrap;
}

.sale-total{
  font-size:21px;
  font-weight:800;
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.badge.paid{
  background:#dcfce7;
  color:#166534;
}

.badge.open{
  background:#fee2e2;
  color:#991b1b;
}

.sale-body{
  display:none;
  border-top:1px solid #eee;
  padding:18px;
  background:#fafafa;
}

.sale.open .sale-body{
  display:block;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.detail-row:last-child{
  border-bottom:none;
}

.detail-label{
  color:#6b7280;
}

.detail-value{
  font-weight:700;
  text-align:right;
}

.products-title,
.payments-title{
  font-weight:800;
  margin:15px 0 8px;
}

.product-line,
.payment-line{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  font-size:14px;
}

.product-line{
  border-bottom:1px solid #eee;
}

.balance{
  margin-top:15px;
  padding:13px;
  border-radius:11px;
  background:#fff;
  font-weight:800;
}

.balance.pending{
  color:#dc2626;
}

.balance.paid{
  color:#16a34a;
}

.history{
  margin-top:15px;
  padding-top:15px;
  border-top:2px solid #eee;
}

.history-title{
  font-weight:800;
  margin-bottom:8px;
}

.payment-history-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  font-size:14px;
  color:#4b5563;
}

.payment-history-item strong{
  color:#16a34a;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:850px){

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .filters-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .container{
    padding:18px 15px 35px;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .summary-value{
    font-size:22px;
  }

  .sale-header{
    align-items:flex-start;
  }

  .sale-right{
    text-align:right;
  }

  .detail-row,
  .product-line,
  .payment-line{
    font-size:13px;
  }

}

</style>

</head>

<body>

<header>

  <h1>📊 Historial de ventas</h1>

  <p>
    Consulta de ventas, pagos y cuentas
  </p>

</header>


<div class="container">

  <div
    id="status"
    class="status">
  </div>


  <!-- BARRA -->

  <div class="toolbar">

    <button
      type="button"
      class="business-btn active"
      data-business="BakeQuiri">
      BakeQuiri
    </button>

    <button
      type="button"
      class="business-btn"
      data-business="SpicyRoll">
      SpicyRoll
    </button>

    <button
      type="button"
      class="action-btn refresh-btn"
      id="refreshButton">
      🔄 Actualizar
    </button>

    <button
      type="button"
      class="action-btn dashboard-btn"
      id="dashboardButton">
      ← Dashboard
    </button>

  </div>


  <!-- FILTROS -->

  <div class="filters">

    <div class="filters-grid">

      <div class="field">

        <label for="search">
          Cliente
        </label>

        <input
          id="search"
          type="search"
          placeholder="🔎 Nombre o teléfono"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label for="dateFrom">
          Desde
        </label>

        <input
          id="dateFrom"
          type="date"
        >

      </div>


      <div class="field">

        <label for="dateTo">
          Hasta
        </label>

        <input
          id="dateTo"
          type="date"
        >

      </div>

    </div>

  </div>


  <!-- RESUMEN -->

  <div class="summary">

    <div class="summary-card sales">

      <div class="summary-label">
        VENTAS
      </div>

      <div
        id="totalSales"
        class="summary-value">
        0
      </div>

    </div>


    <div class="summary-card total">

      <div class="summary-label">
        TOTAL VENDIDO
      </div>

      <div
        id="totalAmount"
        class="summary-value">
        $0.00
      </div>

    </div>


    <div class="summary-card pending">

      <div class="summary-label">
        SALDO PENDIENTE
      </div>

      <div
        id="totalPending"
        class="summary-value">
        $0.00
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        PAGADO
      </div>

      <div
        id="totalPaid"
        class="summary-value">
        $0.00
      </div>

    </div>

  </div>


  <!-- VENTAS -->

  <div class="card">

    <h2>
      🧾 Ventas
    </h2>

    <div id="sales">

      <div class="loading">
        Cargando historial...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
  "BakeQuiri";

let sales = [];

let customers = [];

let products = [];

let payments = [];

let paymentMethods = [];


/* =========================================
   UTILIDADES
========================================= */

const $ =
  id =>
    document.getElementById(id);


function money(value){

  return "$" +
    Number(value || 0).toFixed(2);

}


function formatDate(value){

  if(!value)
    return "Sin fecha";

  const date =
    new Date(value);

  return date.toLocaleDateString(
    "es-MX",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function formatDateTime(value){

  if(!value)
    return "Sin fecha";

  const date =
    new Date(value);

  return date.toLocaleString(
    "es-MX",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function showStatus(
  message,
  type="ok"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}


function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}


/* =========================================
   CARGAR HISTORIAL
========================================= */

async function loadHistory(){

  clearStatus();

  $("sales").innerHTML =
    '<div class="loading">Cargando historial...</div>';


  try{

    const businessId =
      BUSINESS_IDS[currentBusiness];


    /*
      CLIENTES
    */

    const customersResult =
      await supabaseClient

        .from("customers")

        .select(
          "id,name,phone"
        )

        .eq(
          "business_id",
          businessId
        );


    if(customersResult.error){

      throw customersResult.error;

    }


    customers =
      customersResult.data || [];


    /*
      PRODUCTOS
    */

    const productsResult =
      await supabaseClient

        .from("products")

        .select(
          "id,name"
        )

        .eq(
          "business_id",
          businessId
        );


    if(productsResult.error){

      throw productsResult.error;

    }


    products =
      productsResult.data || [];


    /*
      MÉTODOS DE PAGO
    */

    const methodsResult =
      await supabaseClient

        .from("payment_methods")

        .select(
          "id,name"
        )

        .eq(
          "business_id",
          businessId
        );


    if(methodsResult.error){

      throw methodsResult.error;

    }


    paymentMethods =
      methodsResult.data || [];


    /*
      VENTAS
    */

    const salesResult =
      await supabaseClient

        .from("sales")

        .select(
          "id,business_id,customer_id,sale_date,total,balance,status,created_at"
        )

        .eq(
          "business_id",
          businessId
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(salesResult.error){

      throw salesResult.error;

    }


    sales =
      salesResult.data || [];


    /*
      DETALLES DE VENTA
    */

    const paymentsResult =
      await supabaseClient

        .from("payments")

        .select(
          "id,business_id,sale_id,payment_method_id,amount,paid_at,notes"
        )

        .eq(
          "business_id",
          businessId
        )

        .order(
          "paid_at",
          {
            ascending:false
          }
        );


    if(paymentsResult.error){

      throw paymentsResult.error;

    }


    payments =
      paymentsResult.data || [];


    /*
      Intentamos cargar detalles.
    */

    const itemsResult =
      await supabaseClient

        .from("sale_items")

        .select(
          "id,sale_id,product_id,description,quantity,unit_price,subtotal"
        );


    if(
      !itemsResult.error
    ){

      window.saleItems =
        itemsResult.data || [];

    }
    else{

      window.saleItems =
        [];

    }


    renderHistory();

  }

  catch(error){

    console.error(error);

    $("sales").innerHTML =
      '<div class="empty">' +
      'No se pudo cargar el historial.' +
      '</div>';

    showStatus(
      "Error al cargar historial: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   FILTRAR VENTAS
========================================= */

function getFilteredSales(){

  const searchText =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const dateFrom =
    $("dateFrom").value;


  const dateTo =
    $("dateTo").value;


  return sales.filter(
    sale => {

      const customer =
        customers.find(
          item =>
            item.id ===
            sale.customer_id
        );


      if(searchText){

        const text =
          [
            customer?.name,
            customer?.phone
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        if(
          !text.includes(searchText)
        ){

          return false;

        }

      }


      const saleDate =
        new Date(
          sale.sale_date ||
          sale.created_at
        );


      if(dateFrom){

        const from =
          new Date(
            dateFrom +
            "T00:00:00"
          );


        if(
          saleDate < from
        ){

          return false;

        }

      }


      if(dateTo){

        const to =
          new Date(
            dateTo +
            "T23:59:59"
          );


        if(
          saleDate > to
        ){

          return false;

        }

      }


      return true;

    }
  );

}


/* =========================================
   RENDER
========================================= */

function renderHistory(){

  const filteredSales =
    getFilteredSales();


  let totalAmount =
    0;

  let totalPending =
    0;


  filteredSales.forEach(
    sale => {

      totalAmount +=
        Number(
          sale.total || 0
        );

      totalPending +=
        Number(
          sale.balance || 0
        );

    }
  );


  const totalPaid =
    totalAmount -
    totalPending;


  $("totalSales").textContent =
    filteredSales.length;


  $("totalAmount").textContent =
    money(totalAmount);


  $("totalPending").textContent =
    money(totalPending);


  $("totalPaid").textContent =
    money(
      Math.max(
        0,
        totalPaid
      )
    );


  if(!filteredSales.length){

    $("sales").innerHTML =
      '<div class="empty">' +
      'No hay ventas que coincidan con los filtros.' +
      '</div>';

    return;

  }


  $("sales").innerHTML =
    "";


  filteredSales.forEach(
    sale => {

      $("sales").appendChild(
        createSaleElement(
          sale
        )
      );

    }
  );

}


/* =========================================
   CREAR VENTA
========================================= */

function createSaleElement(
  sale
){

  const customer =
    customers.find(
      item =>
        item.id ===
        sale.customer_id
    );


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "sale";


  const header =
    document.createElement(
      "div"
    );

  header.className =
    "sale-header";


  const main =
    document.createElement(
      "div"
    );

  main.className =
    "sale-main";


  const number =
    document.createElement(
      "div"
    );

  number.className =
    "sale-number";

  number.textContent =
    "Venta #" +
    sale.id.substring(
      0,
      8
    );


  const customerElement =
    document.createElement(
      "div"
    );

  customerElement.className =
    "sale-customer";

  customerElement.textContent =
    customer?.name ||
    "Consumidor general";


  const date =
    document.createElement(
      "div"
    );

  date.className =
    "sale-date";

  date.textContent =
    formatDateTime(
      sale.sale_date ||
      sale.created_at
    );


  main.append(
    number,
    customerElement,
    date
  );


  const right =
    document.createElement(
      "div"
    );

  right.className =
    "sale-right";


  const total =
    document.createElement(
      "div"
    );

  total.className =
    "sale-total";

  total.textContent =
    money(sale.total);


  const badge =
    document.createElement(
      "span"
    );

  badge.className =
    "badge " +
    (
      Number(sale.balance || 0) > 0
      ? "open"
      : "paid"
    );


  badge.textContent =
    Number(sale.balance || 0) > 0
    ? "PENDIENTE"
    : "PAGADA";


  right.append(
    total,
    badge
  );


  header.append(
    main,
    right
  );


  const body =
    document.createElement(
      "div"
    );

  body.className =
    "sale-body";


  /*
    INFORMACIÓN
  */

  const infoTitle =
    document.createElement(
      "div"
    );

  infoTitle.className =
    "products-title";

  infoTitle.textContent =
    "Información de la venta";


  body.appendChild(
    infoTitle
  );


  addDetail(
    body,
    "Cliente",
    customer?.name ||
    "Consumidor general"
  );


  if(customer?.phone){

    addDetail(
      body,
      "Teléfono",
      customer.phone
    );

  }


  addDetail(
    body,
    "Total",
    money(sale.total)
  );


  addDetail(
    body,
    "Saldo pendiente",
    money(sale.balance)
  );


  /*
    PRODUCTOS
  */

  const items =
    (window.saleItems || [])
      .filter(
        item =>
          item.sale_id ===
          sale.id
      );


  const productsTitle =
    document.createElement(
      "div"
    );

  productsTitle.className =
    "products-title";

  productsTitle.textContent =
    "🛒 Productos";


  body.appendChild(
    productsTitle
  );


  if(items.length){

    items.forEach(
      item => {

        const line =
          document.createElement(
            "div"
          );

        line.className =
          "product-line";


        const description =
          item.description ||
          products.find(
            product =>
              product.id ===
              item.product_id
          )?.name ||
          "Producto";


        const left =
          document.createElement(
            "span"
          );

        left.textContent =
          Number(item.quantity) +
          " × " +
          description;


        const right =
          document.createElement(
            "strong"
          );

        right.textContent =
          money(
            item.subtotal
          );


        line.append(
          left,
          right
        );


        body.appendChild(
          line
        );

      }
    );

  }
  else{

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "sale-details";

    empty.textContent =
      "No hay detalle de productos disponible.";

    body.appendChild(
      empty
    );

  }


  /*
    PAGOS
  */

  const salePayments =
    payments.filter(
      payment =>
        payment.sale_id ===
        sale.id
    );


  const paymentsTitle =
    document.createElement(
      "div"
    );

  paymentsTitle.className =
    "payments-title";

  paymentsTitle.textContent =
    "💵 Pagos registrados";


  body.appendChild(
    paymentsTitle
  );


  if(salePayments.length){

    salePayments.forEach(
      payment => {

        const line =
          document.createElement(
            "div"
          );

        line.className =
          "payment-line";


        const method =
          paymentMethods.find(
            item =>
              item.id ===
              payment.payment_method_id
          );


        const left =
          document.createElement(
            "span"
          );

        left.textContent =
          formatDateTime(
            payment.paid_at
          ) +
          " · " +
          (
            method?.name ||
            "Pago"
          );


        const right =
          document.createElement(
            "strong"
          );

        right.textContent =
          money(
            payment.amount
          );


        line.append(
          left,
          right
        );


        body.appendChild(
          line
        );

      }
    );

  }
  else{

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "sale-details";

    empty.textContent =
      "No hay pagos registrados.";

    body.appendChild(
      empty
    );

  }


  /*
    SALDO
  */

  const balance =
    document.createElement(
      "div"
    );

  balance.className =
    "balance " +
    (
      Number(sale.balance || 0) > 0
      ? "pending"
      : "paid"
    );


  balance.textContent =
    Number(sale.balance || 0) > 0
    ? "Saldo pendiente: " +
      money(sale.balance)
    : "✓ Venta completamente pagada";


  body.appendChild(
    balance
  );


  header.addEventListener(
    "click",
    () => {

      wrapper.classList.toggle(
        "open"
      );

    }
  );


  wrapper.append(
    header,
    body
  );


  return wrapper;

}


/* =========================================
   DETALLE
========================================= */

function addDetail(
  container,
  label,
  value
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "detail-row";


  const labelElement =
    document.createElement(
      "span"
    );

  labelElement.className =
    "detail-label";

  labelElement.textContent =
    label;


  const valueElement =
    document.createElement(
      "span"
    );

  valueElement.className =
    "detail-value";

  valueElement.textContent =
    value;


  row.append(
    labelElement,
    valueElement
  );


  container.appendChild(
    row
  );

}


/* =========================================
   EVENTOS
========================================= */

$("search")
.addEventListener(
  "input",
  renderHistory
);


$("dateFrom")
.addEventListener(
  "change",
  renderHistory
);


$("dateTo")
.addEventListener(
  "change",
  renderHistory
);


$("refreshButton")
.addEventListener(
  "click",
  loadHistory
);


$("dashboardButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "index.html";

  }
);


/* =========================================
   NEGOCIOS
========================================= */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        async () => {

          if(
            button.dataset.business ===
            currentBusiness
          ){

            return;

          }


          currentBusiness =
            button.dataset.business;


          document
            .querySelectorAll(
              ".business-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          await loadHistory();

        }
      );

    }
  );


/* =========================================
   INICIO
========================================= */

loadHistory();

</script>
