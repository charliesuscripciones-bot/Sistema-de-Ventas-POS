<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Clientes | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:#f5f5f5;
  color:#171717;
}

header{
  background:#111827;
  color:white;
  padding:25px 20px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  display:none;
  padding:14px 16px;
  border-radius:12px;
  margin-bottom:20px;
  font-weight:600;
  white-space:pre-line;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.offline{
  display:block;
  background:#fff7ed;
  color:#9a3412;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:0;
  cursor:pointer;
  font-size:16px;
  -webkit-tap-highlight-color:transparent;
}

.business-btn,
.refresh,
.dashboard{
  border-radius:12px;
  padding:12px 20px;
  font-weight:700;
}

.business-btn{
  background:white;
  border:2px solid #ddd;
}

.business-btn.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
}

.dashboard{
  background:white;
  border:2px solid #ddd;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin:0 0 18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1 / -1;
}

label{
  font-weight:700;
  color:#4b5563;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
  font-family:inherit;
}

input:focus,
textarea:focus{
  outline:none;
  border-color:#2563eb;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.save{
  margin-top:15px;
  background:#16a34a;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  font-weight:800;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel{
  margin-top:15px;
  margin-left:8px;
  background:#e5e7eb;
  color:#111827;
  padding:14px 22px;
  border-radius:12px;
  font-weight:700;
}

.search{
  margin-bottom:15px;
}

.customer{
  border-bottom:1px solid #eee;
  padding:17px 0;
}

.customer:last-child{
  border-bottom:0;
}

.customer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.customer-name{
  font-size:19px;
  font-weight:800;
}

.customer-info{
  color:#6b7280;
  margin-top:7px;
  line-height:1.6;
}

.customer-business{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:8px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:700;
}

.customer-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.edit{
  background:#2563eb;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.count{
  color:#6b7280;
  margin-bottom:15px;
  font-weight:600;
}

.helper{
  margin-top:8px;
  color:#6b7280;
  font-size:14px;
  line-height:1.5;
}

.connection{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  padding:6px 10px;
  border-radius:8px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:700;
}

.connection.offline{
  background:#fff7ed;
  color:#9a3412;
}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .customer-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .customer-actions{
    width:100%;
  }

  .edit,
  .delete{
    flex:1;
  }

  .business-btn,
  .refresh,
  .dashboard{
    flex:1;
  }

}

</style>

</head>


<body>


<header>

<h1>👥 Clientes</h1>

<p>
Sistema de Ventas POS · Clientes compartidos
</p>

<div
  id="connection"
  class="connection"
>
🟢 En línea
</div>

</header>


<div class="container">


<div
  id="status"
  class="status"
></div>


<!-- ======================================
     BOTONES
====================================== -->

<div class="topbar">


<button
  type="button"
  class="business-btn active"

👥 Todos

<button

<!-- ======================================

<div class="card">


<h2

<div class="form-grid">

Nombre *

Teléfono

Notas

<!-- ======================================
     LISTA
====================================== -->

<div class="card">


<h2 class="section-title">
📋 Clientes registrados
</h2>


<input
  id="search"
  class="search"
  type="search"
  placeholder="🔎 Buscar por nombre, teléfono o notas"
  autocomplete="off"
>


<div
  id="count"
  class="count"
>
0 clientes
</div>


<div id="customersContainer">

<div class="loading">
Cargando clientes...
</div>

</div>


</div>


</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

"use strict";


/* ======================================
   SUPABASE
====================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


let supabaseClient = null;


try{

  if(
    window.supabase &&
    typeof window.supabase.createClient ===
    "function"
  ){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

  }

}
catch(error){

  console.error(
    "Error iniciando Supabase:",
    error
  );

}


/* ======================================
   ALMACENAMIENTO LOCAL
====================================== */

const STORAGE_KEY =
"pos_clientes_compartidos_v2";


/* ======================================
   ESTADO
====================================== */

let currentBusiness =
"Todos";

let customers = [];

let editingId =
null;


/* ======================================
   ELEMENTOS
====================================== */

const $ =
id =>
document.getElementById(id);


/* ======================================
   ID LOCAL
====================================== */

function generateLocalId(){

  return (
    "local-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10)
  );

}


/* ======================================
   MENSAJES
====================================== */

function showStatus(
  message,
  type="ok"
){

  const status =
    $("status");

  status.textContent =
    message;

  status.className =
    "status " + type;

}


function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}


/* ======================================
   CONEXIÓN
====================================== */

function updateConnection(){

  const connection =
    $("connection");


  if(navigator.onLine){

    connection.textContent =
      "🟢 En línea";

    connection.className =
      "connection";

  }
  else{

    connection.textContent =
      "🟠 Modo offline";

    connection.className =
      "connection offline";

  }

}


window.addEventListener(
  "online",
  () => {

    updateConnection();

    loadCustomers();

  }
);


window.addEventListener(
  "offline",
  () => {

    updateConnection();

    showStatus(
      "🟠 Sin Internet. Se utilizarán los clientes guardados en este dispositivo.",
      "offline"
    );

  }
);


/* ======================================
   LOCAL STORAGE
====================================== */

function saveLocalCustomers(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(customers)
    );

    return true;

  }
  catch(error){

    console.error(
      "Error guardando localmente:",
      error
    );

    return false;

  }

}


function loadLocalCustomers(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){

      customers = [];

      return;

    }


    const data =
      JSON.parse(raw);


    customers =
      Array.isArray(data)
      ? data
      : [];

  }
  catch(error){

    console.error(
      "Error leyendo almacenamiento local:",
      error
    );

    customers = [];

  }

}


/* ======================================
   CARGAR CLIENTES
====================================== */

async function loadCustomers(){

  loadLocalCustomers();

  renderCustomers();


  if(!navigator.onLine){

    showStatus(
      customers.length
      ? "🟠 Modo offline. Mostrando clientes guardados en este dispositivo."
      : "🟠 Modo offline. No hay clientes guardados todavía.",
      "offline"
    );

    return;

  }


  if(!supabaseClient){

    showStatus(
      "⚠️ Supabase no está disponible. Se utilizará el almacenamiento local.",
      "offline"
    );

    return;

  }


  try{

    /*
      IMPORTANTE:

      NO usamos business_id.

      La tabla customers de tu Supabase
      no tiene esa columna.

      Los clientes son globales/compartidos.
    */

    const result =
      await supabaseClient

        .from("customers")

        .select("*")

        .order(
          "name",
          {
            ascending:true
          }
        );


    if(result.error){

      throw result.error;

    }


    customers =
      Array.isArray(result.data)
      ? result.data
      : [];


    saveLocalCustomers();


    renderCustomers();


    showStatus(
      customers.length === 1
      ? "✅ 1 cliente cargado desde Supabase."
      : "✅ " +
        customers.length +
        " clientes cargados desde Supabase.",
      "ok"
    );

  }
  catch(error){

    console.error(
      "Error cargando clientes:",
      error
    );


    /*
      Si Supabase falla,
      mantenemos los datos locales.
    */

    loadLocalCustomers();

    renderCustomers();


    if(customers.length){

      showStatus(
        "🟠 No se pudo conectar con Supabase.\n" +
        "Mostrando los clientes guardados localmente.",
        "offline"
      );

    }
    else{

      showStatus(
        "❌ No se pudieron cargar los clientes.\n\n" +
        "Error: " +
        (
          error.message ||
          String(error)
        ),
        "error"
      );

    }

  }

}


/* ======================================
   RENDER CLIENTES
====================================== */

function renderCustomers(){

  const container =
    $("customersContainer");


  const query =
    $("search")
      .value
      .trim()
      .toLowerCase();


  let list =
    [...customers];


  /*
    FILTRO VISUAL

    Como los clientes son compartidos,
    BakeQuiri y SpicyRoll muestran
    el mismo catálogo.

    Por eso NO filtramos por business_id.
  */


  if(query){

    list =
      list.filter(
        customer => {

          const text = [

            customer.name,
            customer.phone,
            customer.notes

          ]

          .filter(Boolean)

          .join(" ")

          .toLowerCase();


          return text.includes(
            query
          );

        }
      );

  }


  $("count").textContent =
    list.length +
    (
      list.length === 1
      ? " cliente"
      : " clientes"
    );


  if(!list.length){

    container.innerHTML =
      '<div class="empty">' +
      (
        query
        ? "🔎 No se encontraron clientes."
        : "👥 No hay clientes registrados."
      ) +
      '</div>';

    return;

  }


  container.innerHTML =
    "";


  list.forEach(
    customer => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "customer";


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "customer-top";


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "customer-name";

      name.textContent =
        customer.name ||
        "Cliente sin nombre";


      const details =
        document.createElement(
          "div"
        );

      details.className =
        "customer-info";


      const parts = [];


      if(customer.phone){

        parts.push(
          "📱 " +
          customer.phone
        );

      }


      if(customer.notes){

        parts.push(
          "📝 " +
          customer.notes
        );

      }


      details.textContent =
        parts.join(" · ");


      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "customer-business";

      badge.textContent =
        "👥 Cliente compartido";


      info.append(
        name,
        details,
        badge
      );


      /* ================================
         ACCIONES
      ================================= */

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "customer-actions";


      const edit =
        document.createElement(
          "button"
        );

      edit.type =
        "button";

      edit.className =
        "edit";

      edit.textContent =
        "✏️ Editar";


      edit.addEventListener(
        "click",
        () => {

          editCustomer(
            customer
          );

        }
      );


      const del =
        document.createElement(
          "button"
        );

      del.type =
        "button";

      del.className =
        "delete";

      del.textContent =
        "🗑️ Eliminar";


      del.addEventListener(
        "click",
        () => {

          deleteCustomer(
            customer
          );

        }
      );


      actions.append(
        edit,
        del
      );


      top.append(
        info,
        actions
      );


      item.append(
        top
      );


      container.append(
        item
      );

    }
  );

}


/* ======================================
   CREAR CLIENTE
====================================== */

async function createCustomer(){

  const name =
    $("name")
      .value
      .trim();


  const phone =
    $("phone")
      .value
      .trim();


  const notes =
    $("notes")
      .value
      .trim();


  if(!name){

    showStatus(
      "⚠️ El nombre del cliente es obligatorio.",
      "error"
    );

    return;

  }


  const saveButton =
    $("saveButton");


  saveButton.disabled =
    true;

  saveButton.textContent =
    "Guardando...";


  try{

    /*
      Primero intentamos guardar
      directamente en Supabase.
    */

    if(
      navigator.onLine &&
      supabaseClient
    ){

      const result =
        await supabaseClient

          .from("customers")

          .insert({

            name:
              name,

            phone:
              phone || null,

            notes:
              notes || null

          });


      if(result.error){

        throw result.error;

      }


      showStatus(
        "✅ Cliente guardado correctamente.\n" +
        "El cliente está disponible para BakeQuiri y SpicyRoll.",
        "ok"
      );


      resetForm();

      await loadCustomers();

      return;

    }


    /*
      MODO OFFLINE
    */

    const localCustomer = {

      id:
        generateLocalId(),

      name:
        name,

      phone:
        phone || null,

      notes:
        notes || null,

      created_at:
        new Date().toISOString(),

      local_only:
        true

    };


    customers.push(
      localCustomer
    );


    saveLocalCustomers();

    renderCustomers();

    resetForm();


    showStatus(
      "🟠 Cliente guardado en este dispositivo.\n" +
      "Se podrá sincronizar cuando vuelva Internet.",
      "offline"
    );

  }
  catch(error){

    console.error(
      "Error creando cliente:",
      error
    );


    /*
      Si falla Supabase,
      guardamos localmente.
    */

    const localCustomer = {

      id:
        generateLocalId(),

      name:
        name,

      phone:
        phone || null,

      notes:
        notes || null,

      created_at:
        new Date().toISOString(),

      local_only:
        true

    };


    customers.push(
      localCustomer
    );


    saveLocalCustomers();

    renderCustomers();

    resetForm();


    showStatus(
      "🟠 Supabase rechazó el registro.\n" +
      "El cliente quedó guardado localmente.\n\n" +
      "Error: " +
      (
        error.message ||
        String(error)
      ),
      "offline"
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

  }

}


/* ======================================
   EDITAR
====================================== */

function editCustomer(
  customer
){

  editingId =
    customer.id;


  $("formTitle").textContent =
    "✏️ Editar cliente";


  $("name").value =
    customer.name ||
    "";


  $("phone").value =
    customer.phone ||
    "";


  $("notes").value =
    customer.notes ||
    "";


  $("saveButton").textContent =
    "Guardar cambios";


  $("cancelButton").style.display =
    "inline-block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* ======================================
   ACTUALIZAR
====================================== */

async function updateCustomer(){

  const name =
    $("name")
      .value
      .trim();


  const phone =
    $("phone")
      .value
      .trim();


  const notes =
    $("notes")
      .value
      .trim();


  if(!name){

    showStatus(
      "⚠️ El nombre del cliente es obligatorio.",
      "error"
    );

    return;

  }


  const saveButton =
    $("saveButton");


  saveButton.disabled =
    true;

  saveButton.textContent =
    "Guardando...";


  try{

    /*
      CLIENTE LOCAL
    */

    if(
      String(editingId)
        .startsWith("local-")
    ){

      const index =
        customers.findIndex(
          customer =>
            customer.id ===
            editingId
        );


      if(index !== -1){

        customers[index] = {

          ...customers[index],

          name:
            name,

          phone:
            phone || null,

          notes:
            notes || null

        };

      }


      saveLocalCustomers();

      renderCustomers();

      resetForm();


      showStatus(
        "✅ Cliente actualizado localmente.",
        "ok"
      );


      return;

    }


    /*
      CLIENTE DE SUPABASE
    */

    if(
      !navigator.onLine ||
      !supabaseClient
    ){

      const index =
        customers.findIndex(
          customer =>
            customer.id ===
            editingId
        );


      if(index !== -1){

        customers[index] = {

          ...customers[index],

          name:
            name,

          phone:
            phone || null,

          notes:
            notes || null

        };

      }


      saveLocalCustomers();

      renderCustomers();

      resetForm();


      showStatus(
        "🟠 Actualizado localmente porque no hay conexión.",
        "offline"
      );


      return;

    }


    const result =
      await supabaseClient

        .from("customers")

        .update({

          name:
            name,

          phone:
            phone || null,

          notes:
            notes || null

        })

        .eq(
          "id",
          editingId
        );


    if(result.error){

      throw result.error;

    }


    showStatus(
      "✅ Cliente actualizado correctamente.",
      "ok"
    );


    resetForm();

    await loadCustomers();

  }
  catch(error){

    console.error(
      "Error actualizando cliente:",
      error
    );


    showStatus(
      "❌ No se pudo actualizar el cliente.\n\n" +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

  }

}


/* ======================================
   ELIMINAR
====================================== */

async function deleteCustomer(
  customer
){

  const confirmed =
    confirm(
      "¿Eliminar a " +
      customer.name +
      "?\n\n" +
      "Esta acción eliminará el cliente."
    );


  if(!confirmed){

    return;

  }


  try{

    /*
      CLIENTE LOCAL
    */

    if(
      String(customer.id)
        .startsWith("local-")
    ){

      customers =
        customers.filter(
          item =>
            item.id !==
            customer.id
        );


      saveLocalCustomers();

      renderCustomers();


      showStatus(
        "✅ Cliente eliminado.",
        "ok"
      );


      return;

    }


    /*
      SUPABASE
    */

    if(
      !navigator.onLine ||
      !supabaseClient
    ){

      showStatus(
        "🟠 No hay conexión. No se puede eliminar este cliente de Supabase.",
        "offline"
      );

      return;

    }


    const result =
      await supabaseClient

        .from("customers")

        .delete()

        .eq(
          "id",
          customer.id
        );


    if(result.error){

      throw result.error;

    }


    showStatus(
      "✅ Cliente eliminado correctamente.",
      "ok"
    );


    await loadCustomers();

  }
  catch(error){

    console.error(
      "Error eliminando cliente:",
      error
    );


    showStatus(
      "❌ No se pudo eliminar el cliente.\n\n" +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

}


/* ======================================
   RESET FORMULARIO
====================================== */

function resetForm(){

  editingId =
    null;


  $("customerForm")
    .reset();


  $("formTitle").textContent =
    "➕ Nuevo cliente";


  $("saveButton").textContent =
    "Guardar cliente";


  $("cancelButton").style.display =
    "none";

}


/* ======================================
   FORMULARIO
====================================== */

$("customerForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();


      if(editingId){

        updateCustomer();

      }
      else{

        createCustomer();

      }

    }
  );


/* ======================================
   CANCELAR
====================================== */

$("cancelButton")
  .addEventListener(
    "click",
    () => {

      resetForm();

      clearStatus();

    }
  );


/* ======================================
   BUSCAR
====================================== */

$("search")
  .addEventListener(
    "input",
    () => {

      renderCustomers();

    }
  );


/* ======================================
   BOTONES DE NEGOCIO
====================================== */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentBusiness =
            button.dataset.business;


          document
            .querySelectorAll(
              ".business-btn"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          /*
            IMPORTANTE:

            NO filtramos clientes por negocio.

            Los clientes son compartidos.
          */

          renderCustomers();

        }
      );

    }
  );


/* ======================================
   ACTUALIZAR
====================================== */

$("refresh")
  .addEventListener(
    "click",
    () => {

      loadCustomers();

    }
  );


/* ======================================
   VOLVER AL POS
====================================== */

$("dashboard")
  .addEventListener(
    "click",
    () => {

      const business =
        currentBusiness ===
        "Todos"
        ? "BakeQuiri"
        : currentBusiness;


      window.location.href =
        "index.html?business=" +
        encodeURIComponent(
          business
        );

    }
  );


/* ======================================
   INICIO
====================================== */

updateConnection();

loadCustomers();

</script>
