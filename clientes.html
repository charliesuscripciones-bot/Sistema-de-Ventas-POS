<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Clientes | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  color:#171717;
}

header{
  background:#111827;
  color:white;
  padding:25px 20px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  display:none;
  padding:14px 16px;
  border-radius:12px;
  margin-bottom:20px;
  font-weight:600;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:0;
  cursor:pointer;
  font-size:16px;
}

.business-btn,
.dashboard{
  background:white;
  border:2px solid #ddd;
  border-radius:12px;
  padding:12px 20px;
  font-weight:700;
}

.business-btn.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-weight:700;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin:0 0 18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1 / -1;
}

label{
  font-weight:700;
  color:#4b5563;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.save{
  margin-top:15px;
  background:#16a34a;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  font-weight:800;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel{
  margin-top:15px;
  margin-left:8px;
  background:#e5e7eb;
  color:#111827;
  padding:14px 22px;
  border-radius:12px;
  font-weight:700;
}

.search{
  margin-bottom:15px;
}

.customer{
  border-bottom:1px solid #eee;
  padding:17px 0;
}

.customer:last-child{
  border-bottom:0;
}

.customer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.customer-name{
  font-size:19px;
  font-weight:800;
}

.customer-info{
  color:#6b7280;
  margin-top:7px;
  line-height:1.6;
}

.customer-business{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:8px;
  background:#eef2ff;
  color:#3730a3;
  font-size:13px;
  font-weight:700;
}

.customer-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.edit{
  background:#2563eb;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.count{
  color:#6b7280;
  margin-bottom:15px;
  font-weight:600;
}

.editing-title{
  color:#2563eb;
}

.helper{
  margin-top:8px;
  color:#6b7280;
  font-size:14px;
}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .customer-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .customer-actions{
    width:100%;
  }

  .edit,
  .delete{
    flex:1;
  }

  .business-btn,
  .refresh,
  .dashboard{
    flex:1;
  }

}

</style>

</head>

<body>

<header>

<h1>👥 Clientes</h1>

<p>
Sistema de Ventas POS · Administración de clientes
</p>

</header>


<div class="container">

<div id="status" class="status"></div>


<!-- =========================================
     BOTONES
========================================= -->

<div class="topbar">

<button
type="button"
class="business-btn active"
data-business="Todos">

👥 Todos

</button>


<button
type="button"
class="business-btn"
data-business="BakeQuiri">

BakeQuiri

</button>


<button
type="button"
class="business-btn"
data-business="SpicyRoll">

SpicyRoll

</button>


<button
type="button"
id="refresh"
class="refresh">

🔄 Actualizar

</button>


<button
type="button"
id="dashboard"
class="dashboard">

← Dashboard

</button>

</div>


<!-- =========================================
     FORMULARIO
========================================= -->

<div class="card">

<h2
id="formTitle"
class="section-title">

➕ Nuevo cliente

</h2>


<form id="customerForm">

<div class="form-grid">


<div class="field">

<label for="name">
Nombre *
</label>

<input
id="name"
type="text"
placeholder="Nombre del cliente"
required>

</div>


<div class="field">

<label for="phone">
Teléfono
</label>

<input
id="phone"
type="tel"
placeholder="662 123 4567">

</div>


<div class="field full">

<label for="notes">
Notas
</label>

<textarea
id="notes"
placeholder="Notas del cliente"></textarea>

</div>


</div>


<div class="helper">
Los clientes son compartidos entre BakeQuiri y SpicyRoll.
</div>


<button
type="submit"
class="save"
id="saveButton">

Guardar cliente

</button>


<button
type="button"
class="cancel"
id="cancelButton"
style="display:none">

Cancelar edición

</button>

</form>

</div>


<!-- =========================================
     LISTA DE CLIENTES
========================================= -->

<div class="card">

<h2 class="section-title">

📋 Clientes registrados

</h2>


<input
id="search"
class="search"
type="search"
placeholder="🔎 Buscar por nombre, teléfono o notas">


<div
id="count"
class="count">

0 clientes

</div>


<div id="customersContainer">

<div class="loading">

Cargando clientes...

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================
   ESTADO
========================================= */

let currentBusiness =
"Todos";


let customers = [];


let editingId = null;


/* =========================================
   ELEMENTOS
========================================= */

const $ = id =>
document.getElementById(id);


/* =========================================
   MENSAJES
========================================= */

function showStatus(
  message,
  type="ok"
){

  const status =
  $("status");

  status.textContent =
  message;

  status.className =
  "status " + type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================
   CARGAR CLIENTES
========================================= */

async function loadCustomers(){

  $("customersContainer").innerHTML =
  '<div class="loading">' +
  'Cargando clientes...' +
  '</div>';


  try{

    /*
      IMPORTANTE:

      Los clientes son compartidos.

      Por eso YA NO filtramos directamente
      por el negocio seleccionado.

      Primero obtenemos todos los clientes
      pertenecientes a nuestros negocios.
    */

    const result =
    await supabaseClient

      .from("customers")

      .select(
        "id,business_id,name,phone,notes,created_at"
      )

      .in(
        "business_id",
        Object.values(BUSINESS_IDS)
      )

      .order(
        "name",
        {
          ascending:true
        }
      );


    if(result.error){

      throw result.error;

    }


    customers =
    result.data || [];


    renderCustomers();


    showStatus(
      customers.length === 1
      ? "1 cliente cargado correctamente."
      : customers.length +
        " clientes cargados correctamente.",
      "ok"
    );

  }

  catch(error){

    console.error(error);


    $("customersContainer").innerHTML =
    '<div class="empty">' +
    'No se pudieron cargar los clientes.' +
    '</div>';


    showStatus(
      "Error al cargar clientes: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   OBTENER NEGOCIO DEL CLIENTE
========================================= */

function getBusinessName(
  businessId
){

  if(
    businessId ===
    BUSINESS_IDS.BakeQuiri
  ){

    return "BakeQuiri";

  }


  if(
    businessId ===
    BUSINESS_IDS.SpicyRoll
  ){

    return "SpicyRoll";

  }


  return "Negocio";

}


/* =========================================
   MOSTRAR CLIENTES
========================================= */

function renderCustomers(){

  const container =
  $("customersContainer");


  const query =
  $("search")
    .value
    .trim()
    .toLowerCase();


  let list =
  customers;


  /* =====================================
     FILTRO POR NEGOCIO
  ===================================== */

  if(
    currentBusiness !==
    "Todos"
  ){

    const businessId =
    BUSINESS_IDS[currentBusiness];


    list =
    list.filter(
      customer =>
      customer.business_id ===
      businessId
    );

  }


  /* =====================================
     BUSCADOR
  ===================================== */

  if(query){

    list =
    list.filter(
      customer => {

        const text = [

          customer.name,

          customer.phone,

          customer.notes

        ]

        .filter(Boolean)

        .join(" ")

        .toLowerCase();


        return text.includes(
          query
        );

      }
    );

  }


  $("count").textContent =
  list.length +
  (
    list.length === 1
    ? " cliente"
    : " clientes"
  );


  if(!list.length){

    container.innerHTML =
    '<div class="empty">' +
    (
      query
      ? "No se encontraron clientes."
      : "No hay clientes registrados."
    ) +
    '</div>';

    return;

  }


  container.innerHTML =
  "";


  list.forEach(
    customer => {

      const item =
      document.createElement(
        "div"
      );


      item.className =
      "customer";


      const top =
      document.createElement(
        "div"
      );


      top.className =
      "customer-top";


      const info =
      document.createElement(
        "div"
      );


      const name =
      document.createElement(
        "div"
      );


      name.className =
      "customer-name";


      name.textContent =
      customer.name;


      const details =
      document.createElement(
        "div"
      );


      details.className =
      "customer-info";


      const parts = [];


      if(customer.phone){

        parts.push(
          "📱 " +
          customer.phone
        );

      }


      if(customer.notes){

        parts.push(
          "📝 " +
          customer.notes
        );

      }


      details.textContent =
      parts.length
      ? parts.join(" · ")
      : "Sin información adicional";


      const business =
      document.createElement(
        "div"
      );


      business.className =
      "customer-business";


      business.textContent =
      getBusinessName(
        customer.business_id
      );


      info.append(
        name,
        details,
        business
      );


      /* =================================
         BOTONES
      ================================= */

      const actions =
      document.createElement(
        "div"
      );


      actions.className =
      "customer-actions";


      const edit =
      document.createElement(
        "button"
      );


      edit.type =
      "button";


      edit.className =
      "edit";


      edit.textContent =
      "✏️ Editar";


      edit.addEventListener(
        "click",
        () =>
        editCustomer(customer)
      );


      const del =
      document.createElement(
        "button"
      );


      del.type =
      "button";


      del.className =
      "delete";


      del.textContent =
      "🗑️ Eliminar";


      del.addEventListener(
        "click",
        () =>
        deleteCustomer(customer)
      );


      actions.append(
        edit,
        del
      );


      top.append(
        info,
        actions
      );


      item.append(
        top
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   CREAR / EDITAR CLIENTE
========================================= */

$("customerForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    clearStatus();


    const name =
    $("name")
      .value
      .trim();


    const phone =
    $("phone")
      .value
      .trim();


    const notes =
    $("notes")
      .value
      .trim();


    if(!name){

      showStatus(
        "El nombre es obligatorio.",
        "error"
      );

      return;

    }


    const saveButton =
    $("saveButton");


    saveButton.disabled =
    true;


    try{

      /* =================================
         EDITAR CLIENTE
      ================================= */

      if(editingId){

        const result =
        await supabaseClient

          .from("customers")

          .update({

            name:name,

            phone:
            phone || null,

            notes:
            notes || null

          })

          .eq(
            "id",
            editingId
          );


        if(result.error){

          throw result.error;

        }


        showStatus(
          "Cliente actualizado correctamente.",
          "ok"
        );

      }


      /* =================================
         NUEVO CLIENTE
      ================================= */

      else{

        /*
          Para mantener el sistema actual:

          Si estamos viendo un negocio específico,
          el cliente se asocia a ese negocio.

          Si estamos en "Todos", por seguridad
          lo asociamos a BakeQuiri.
        */

        const businessName =
        currentBusiness === "Todos"
        ? "BakeQuiri"
        : currentBusiness;


        const businessId =
        BUSINESS_IDS[
          businessName
        ];


        const result =
        await supabaseClient

          .from("customers")

          .insert({

            business_id:
            businessId,

            name:name,

            phone:
            phone || null,

            notes:
            notes || null

          });


        if(result.error){

          throw result.error;

        }


        showStatus(
          "Cliente guardado correctamente.",
          "ok"
        );

      }


      resetForm();


      await loadCustomers();

    }

    catch(error){

      console.error(error);


      showStatus(
        "No se pudo guardar el cliente: " +
        (
          error.message ||
          error
        ),
        "error"
      );

    }

    finally{

      saveButton.disabled =
      false;

    }

  }
);


/* =========================================
   EDITAR CLIENTE
========================================= */

function editCustomer(
  customer
){

  editingId =
  customer.id;


  $("name").value =
  customer.name || "";


  $("phone").value =
  customer.phone || "";


  $("notes").value =
  customer.notes || "";


  $("formTitle").textContent =
  "✏️ Editando cliente";


  $("formTitle").classList.add(
    "editing-title"
  );


  $("saveButton").textContent =
  "Guardar cambios";


  $("cancelButton").style.display =
  "inline-block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================
   CANCELAR EDICIÓN
========================================= */

function resetForm(){

  editingId =
  null;


  $("customerForm").reset();


  $("formTitle").textContent =
  "➕ Nuevo cliente";


  $("formTitle").classList.remove(
    "editing-title"
  );


  $("saveButton").textContent =
  "Guardar cliente";


  $("cancelButton").style.display =
  "none";

}


$("cancelButton")
.addEventListener(
  "click",
  resetForm
);


/* =========================================
   ELIMINAR CLIENTE
========================================= */

async function deleteCustomer(
  customer
){

  const confirmed =
  confirm(

    "¿Eliminar a " +
    customer.name +
    "?\n\n" +

    "Esta acción eliminará el cliente " +
    "de la base de datos."

  );


  if(!confirmed){

    return;

  }


  try{

    const result =
    await supabaseClient

      .from("customers")

      .delete()

      .eq(
        "id",
        customer.id
      );


    if(result.error){

      throw result.error;

    }


    showStatus(
      "Cliente eliminado correctamente.",
      "ok"
    );


    if(
      editingId ===
      customer.id
    ){

      resetForm();

    }


    await loadCustomers();

  }

  catch(error){

    console.error(error);


    showStatus(
      "No se pudo eliminar el cliente: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   BUSCADOR
========================================= */

$("search")
.addEventListener(
  "input",
  renderCustomers
);


/* =========================================
   CAMBIO DE FILTRO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        currentBusiness =
        button.dataset.business;


        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          btn => {

            btn.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        renderCustomers();

      }
    );

  }
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refresh")
.addEventListener(
  "click",
  loadCustomers
);


/* =========================================
   DASHBOARD
========================================= */

$("dashboard")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "dashboard.html";

  }
);


/* =========================================
   INICIO
========================================= */

loadCustomers();

</script>

</body>
</html>
