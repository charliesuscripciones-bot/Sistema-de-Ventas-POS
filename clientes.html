<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Clientes | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  color:#171717;
}

header{
  background:#111827;
  color:white;
  padding:25px 20px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  display:none;
  padding:14px 16px;
  border-radius:12px;
  margin-bottom:20px;
  font-weight:600;
  white-space:pre-line;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.offline{
  display:block;
  background:#fff7ed;
  color:#9a3412;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:0;
  cursor:pointer;
  font-size:16px;
  -webkit-tap-highlight-color:transparent;
}

.business-btn,
.dashboard{
  background:white;
  border:2px solid #ddd;
  border-radius:12px;
  padding:12px 20px;
  font-weight:700;
}

.business-btn.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-weight:700;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.section-title{
  font-size:22px;
  font-weight:800;
  margin:0 0 18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1 / -1;
}

label{
  font-weight:700;
  color:#4b5563;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
  font-family:inherit;
}

input:focus,
textarea:focus{
  outline:none;
  border-color:#2563eb;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.save{
  margin-top:15px;
  background:#16a34a;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  font-weight:800;
}

.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel{
  margin-top:15px;
  margin-left:8px;
  background:#e5e7eb;
  color:#111827;
  padding:14px 22px;
  border-radius:12px;
  font-weight:700;
}

.search{
  margin-bottom:15px;
}

.customer{
  border-bottom:1px solid #eee;
  padding:17px 0;
}

.customer:last-child{
  border-bottom:0;
}

.customer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.customer-name{
  font-size:19px;
  font-weight:800;
}

.customer-info{
  color:#6b7280;
  margin-top:7px;
  line-height:1.6;
}

.customer-business{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:8px;
  background:#eef2ff;
  color:#3730a3;
  font-size:13px;
  font-weight:700;
}

.shared{
  background:#dcfce7;
  color:#166534;
}

.customer-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.edit{
  background:#2563eb;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.delete{
  background:#fee2e2;
  color:#991b1b;
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.count{
  color:#6b7280;
  margin-bottom:15px;
  font-weight:600;
}

.helper{
  margin-top:8px;
  color:#6b7280;
  font-size:14px;
  line-height:1.5;
}

.connection{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  padding:6px 10px;
  border-radius:8px;
  background:#dcfce7;
  color:#166534;
  font-size:13px;
  font-weight:700;
}

.connection.offline{
  background:#fff7ed;
  color:#9a3412;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .customer-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .customer-actions{
    width:100%;
  }

  .edit,
  .delete{
    flex:1;
  }

  .business-btn,
  .refresh,
  .dashboard{
    flex:1;
  }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

let supabaseClient = null;

try{

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function"
  ){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

  }

}
catch(error){

  console.error(
    "Supabase no disponible:",
    error
  );

}


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================
   ALMACENAMIENTO LOCAL
========================================= */

const STORAGE_KEY =
"pos_clientes_compartidos_v1";


/* =========================================
   ESTADO
========================================= */

let currentBusiness =
"Todos";

let customers = [];

let editingId =
null;


/* =========================================
   UTILIDAD
========================================= */

const $ =
id =>
document.getElementById(id);


function generateId(){

  return (
    "local-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,10)
  );

}


/* =========================================
   STATUS
========================================= */

function showStatus(
  message,
  type="ok"
){

  const status =
    $("status");

  status.textContent =
    message;

  status.className =
    "status " + type;

}


function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}


/* =========================================
   CONEXIÓN
========================================= */

function updateConnection(){

  const element =
    $("connection");

  if(navigator.onLine){

    element.textContent =
      "🟢 En línea";

    element.className =
      "connection";

  }
  else{

    element.textContent =
      "🟠 Modo offline";

    element.className =
      "connection offline";

  }

}


window.addEventListener(
  "online",
  () => {

    updateConnection();

    showStatus(
      "🟢 Conexión recuperada. Los clientes locales siguen disponibles.",
      "ok"
    );

  }
);


window.addEventListener(
  "offline",
  () => {

    updateConnection();

    showStatus(
      "🟠 Sin Internet. El módulo de clientes continúa funcionando en modo offline.",
      "offline"
    );

  }
);


/* =========================================
   GUARDAR LOCALMENTE
========================================= */

function saveLocalCustomers(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        customers
      )
    );

    return true;

  }
  catch(error){

    console.error(
      "No se pudo guardar localmente:",
      error
    );

    showStatus(
      "No se pudieron guardar los clientes en este dispositivo.",
      "error"
    );

    return false;

  }

}


/* =========================================
   CARGAR LOCALMENTE
========================================= */

function loadLocalCustomers(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      customers = [];

      return;

    }

    const parsed =
      JSON.parse(raw);

    customers =
      Array.isArray(parsed)
      ? parsed
      : [];

  }
  catch(error){

    console.error(
      "Error leyendo clientes locales:",
      error
    );

    customers = [];

  }

}


/* =========================================
   CARGAR CLIENTES
========================================= */

async function loadCustomers(){

  /*
    PRIMERO:

    cargamos los datos locales.

    Esto hace que el POS siga funcionando
    aunque no exista conexión.
  */

  loadLocalCustomers();

  renderCustomers();


  /*
    SI NO HAY INTERNET:

    no intentamos consultar Supabase.
  */

  if(!navigator.onLine){

    showStatus(
      customers.length
      ? "🟠 Modo offline. Se muestran los clientes guardados en este dispositivo."
      : "🟠 Modo offline. Todavía no hay clientes guardados en este dispositivo.",
      "offline"
    );

    return;

  }


  /*
    SI HAY INTERNET:

    intentamos actualizar desde Supabase.
  */

  if(!supabaseClient){

    showStatus(
      "🟠 Supabase no está disponible. El módulo continúa usando almacenamiento local.",
      "offline"
    );

    return;

  }


  try{

    const result =
      await supabaseClient
        .from("customers")
        .select(
          "id,business_id,name,phone,notes,created_at"
        )
        .in(
          "business_id",
          [
            BUSINESS_IDS.BakeQuiri,
            BUSINESS_IDS.SpicyRoll
          ]
        )
        .order(
          "name",
          {
            ascending:true
          }
        );


    if(result.error){

      throw result.error;

    }


    /*
      IMPORTANTE:

      Si Supabase responde correctamente,
      actualizamos la copia local.

      Si falla, NO borramos la copia local.
    */

    if(
      Array.isArray(
        result.data
      )
    ){

      customers =
        result.data;

      saveLocalCustomers();

      renderCustomers();

      showStatus(
        customers.length === 1
        ? "🟢 1 cliente sincronizado."
        : "🟢 " +
          customers.length +
          " clientes sincronizados.",
        "ok"
      );

    }

  }
  catch(error){

    console.error(
      "Error sincronizando clientes:",
      error
    );


    /*
      NO mostramos un error destructivo.

      Los datos locales permanecen.
    */

    showStatus(
      "🟠 No se pudo sincronizar con Internet. Se conservaron los clientes locales.",
      "offline"
    );

  }

}


/* =========================================
   RENDER CLIENTES
========================================= */

function renderCustomers(){

  const container =
    $("customersContainer");

  const query =
    $("search")
      .value
      .trim()
      .toLowerCase();


  let list =
    [...customers];


  /*
    FILTRO POR NEGOCIO

    Solo visual.
  */

  if(
    currentBusiness !==
    "Todos"
  ){

    const businessId =
      BUSINESS_IDS[
        currentBusiness
      ];


    list =
      list.filter(
        customer => {

          /*
            Si el cliente está marcado
            como compartido, aparece
            en ambos negocios.
          */

          if(
            customer.shared === true
          ){

            return true;

          }

          return (
            customer.business_id ===
            businessId
          );

        }
      );

  }


  /*
    BUSCADOR
  */

  if(query){

    list =
      list.filter(
        customer => {

          const text = [

            customer.name,
            customer.phone,
            customer.notes

          ]

          .filter(Boolean)

          .join(" ")

          .toLowerCase();


          return text.includes(
            query
          );

        }
      );

  }


  $("count").textContent =
    list.length +
    (
      list.length === 1
      ? " cliente"
      : " clientes"
    );


  if(!list.length){

    container.innerHTML =
      '<div class="empty">' +

      (
        query
        ? "No se encontraron clientes."
        : "No hay clientes registrados."
      ) +

      "</div>";

    return;

  }


  container.innerHTML =
    "";


  list.forEach(
    customer => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "customer";


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "customer-top";


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "customer-name";

      name.textContent =
        customer.name ||
        "Cliente sin nombre";


      const details =
        document.createElement(
          "div"
        );

      details.className =
        "customer-info";


      const parts = [];


      if(customer.phone){

        parts.push(
          "📱 " +
          customer.phone
        );

      }


      if(customer.notes){

        parts.push(
          "📝 " +
          customer.notes
        );

      }


      details.textContent =
        parts.join(" · ");


      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        "customer-business shared";

      badge.textContent =
        "👥 Disponible en BakeQuiri + SpicyRoll";


      info.append(
        name,
        details,
        badge
      );


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "customer-actions";


      const edit =
        document.createElement(
          "button"
        );

      edit.type =
        "button";

      edit.className =
        "edit";

      edit.textContent =
        "Editar";


      edit.addEventListener(
        "click",
        () =>
          editCustomer(
            customer
          )
      );


      const del =
        document.createElement(
          "button"
        );

      del.type =
        "button";

      del.className =
        "delete";

      del.textContent =
        "Eliminar";


      del.addEventListener(
        "click",
        () =>
          deleteCustomer(
            customer
          )
      );


      actions.append(
        edit,
        del
      );


      top.append(
        info,
        actions
      );


      item.appendChild(
        top
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   CREAR CLIENTE
========================================= */

async function createCustomer(){

  const name =
    $("name")
      .value
      .trim();


  const phone =
    $("phone")
      .value
      .trim();


  const notes =
    $("notes")
      .value
      .trim();


  if(!name){

    showStatus(
      "El nombre del cliente es obligatorio.",
      "error"
    );

    return;

  }


  const saveButton =
    $("saveButton");


  saveButton.disabled =
    true;

  saveButton.textContent =
    "GUARDANDO...";


  /*
    Guardamos PRIMERO en local.

    Esto garantiza que funcione
    aunque no haya Internet.
  */

  const localCustomer = {

    id:
      generateId(),

    business_id:
      currentBusiness === "SpicyRoll"
      ? BUSINESS_IDS.SpicyRoll
      : BUSINESS_IDS.BakeQuiri,

    name:
      name,

    phone:
      phone || null,

    notes:
      notes || null,

    shared:
      true,

    created_at:
      new Date().toISOString(),

    local:
      true

  };


  customers.push(
    localCustomer
  );


  saveLocalCustomers();

  renderCustomers();

  resetForm();


  /*
    Si estamos offline:

    terminamos aquí.
  */

  if(!navigator.onLine){

    showStatus(
      "🟠 Cliente guardado en este dispositivo. Se podrá sincronizar cuando haya Internet.",
      "offline"
    );

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

    return;

  }


  /*
    Intentamos guardarlo también
    en Supabase.

    Si falla, NO perdemos
    el cliente local.
  */

  try{

    if(!supabaseClient){

      throw new Error(
        "Supabase no disponible"
      );

    }


    /*
      Se intenta usar el negocio actual
      como business_id.

      La copia local ya está segura.
    */

    const result =
      await supabaseClient
        .from("customers")
        .insert({

          business_id:
            localCustomer.business_id,

          name:
            name,

          phone:
            phone || null,

          notes:
            notes || null

        })
        .select(
          "id,business_id,name,phone,notes,created_at"
        )
        .single();


    if(result.error){

      throw result.error;

    }


    /*
      Reemplazamos el registro local
      por el registro real de Supabase.
    */

    customers =
      customers.map(
        customer =>
          customer.id ===
          localCustomer.id
          ? {
              ...result.data,
              shared:true
            }
          : customer
      );


    saveLocalCustomers();

    renderCustomers();


    showStatus(
      "✅ Cliente guardado y sincronizado correctamente.",
      "ok"
    );

  }
  catch(error){

    console.error(
      "No se pudo sincronizar el cliente:",
      error
    );


    showStatus(
      "🟠 Cliente guardado localmente. No se pudo sincronizar con Supabase todavía.",
      "offline"
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

  }

}


/* =========================================
   EDITAR
========================================= */

function editCustomer(
  customer
){

  editingId =
    customer.id;


  $("formTitle").textContent =
    "✏️ Editar cliente";


  $("name").value =
    customer.name || "";


  $("phone").value =
    customer.phone || "";


  $("notes").value =
    customer.notes || "";


  $("saveButton").textContent =
    "Guardar cambios";


  $("cancelButton").style.display =
    "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   ACTUALIZAR
========================================= */

async function updateCustomer(){

  const name =
    $("name")
      .value
      .trim();


  const phone =
    $("phone")
      .value
      .trim();


  const notes =
    $("notes")
      .value
      .trim();


  if(!name){

    showStatus(
      "El nombre del cliente es obligatorio.",
      "error"
    );

    return;

  }


  const saveButton =
    $("saveButton");


  saveButton.disabled =
    true;

  saveButton.textContent =
    "GUARDANDO...";


  /*
    Actualizamos inmediatamente
    la copia local.
  */

  const index =
    customers.findIndex(
      customer =>
        customer.id ===
        editingId
    );


  if(index === -1){

    resetForm();

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

    return;

  }


  const original =
    customers[index];


  customers[index] = {

    ...original,

    name:
      name,

    phone:
      phone || null,

    notes:
      notes || null

  };


  saveLocalCustomers();

  renderCustomers();

  resetForm();


  /*
    Si el registro es local,
    todavía no tiene un UUID de Supabase.
  */

  if(
    String(editingId)
      .startsWith("local-")
  ){

    showStatus(
      "🟢 Cliente actualizado localmente.",
      "ok"
    );

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

    return;

  }


  /*
    Si no hay conexión,
    conservamos el cambio local.
  */

  if(!navigator.onLine){

    showStatus(
      "🟠 Cambio guardado localmente. Se sincronizará cuando haya Internet.",
      "offline"
    );

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

    return;

  }


  try{

    if(!supabaseClient){

      throw new Error(
        "Supabase no disponible"
      );

    }


    const result =
      await supabaseClient
        .from("customers")
        .update({

          name:
            name,

          phone:
            phone || null,

          notes:
            notes || null

        })
        .eq(
          "id",
          editingId
        );


    if(result.error){

      throw result.error;

    }


    showStatus(
      "✅ Cliente actualizado correctamente.",
      "ok"
    );

  }
  catch(error){

    console.error(
      "Error actualizando cliente:",
      error
    );


    showStatus(
      "🟠 Cambio guardado localmente. No se pudo sincronizar todavía.",
      "offline"
    );

  }
  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Guardar cliente";

  }

}


/* =========================================
   ELIMINAR
========================================= */

async function deleteCustomer(
  customer
){

  const confirmed =
    confirm(
      "¿Eliminar a " +
      customer.name +
      "?\n\n" +
      "El cliente será eliminado de este dispositivo."
    );


  if(!confirmed){

    return;

  }


  /*
    ELIMINACIÓN LOCAL INMEDIATA
  */

  customers =
    customers.filter(
      item =>
        item.id !==
        customer.id
    );


  saveLocalCustomers();

  renderCustomers();


  /*
    Si es un cliente creado localmente,
    no hay nada que borrar en Supabase.
  */

  if(
    String(customer.id)
      .startsWith("local-")
  ){

    showStatus(
      "Cliente eliminado correctamente.",
      "ok"
    );

    return;

  }


  /*
    Si estamos offline,
    no intentamos conectar.
  */

  if(!navigator.onLine){

    showStatus(
      "🟠 Cliente eliminado localmente. La eliminación se sincronizará después.",
      "offline"
    );

    return;

  }


  try{

    if(!supabaseClient){

      throw new Error(
        "Supabase no disponible"
      );

    }


    const result =
      await supabaseClient
        .from("customers")
        .delete()
        .eq(
          "id",
          customer.id
        );


    if(result.error){

      throw result.error;

    }


    showStatus(
      "✅ Cliente eliminado correctamente.",
      "ok"
    );

  }
  catch(error){

    console.error(
      "Error eliminando cliente:",
      error
    );


    showStatus(
      "🟠 Cliente eliminado de este dispositivo. No se pudo sincronizar con Supabase.",
      "offline"
    );

  }

}


/* =========================================
   RESET FORMULARIO
========================================= */

function resetForm(){

  editingId =
    null;


  $("customerForm")
    .reset();


  $("formTitle").textContent =
    "➕ Nuevo cliente";


  $("saveButton").textContent =
    "Guardar cliente";


  $("cancelButton").style.display =
    "none";

}


/* =========================================
   FORMULARIO
========================================= */

$("customerForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();


      if(editingId){

        updateCustomer();

      }
      else{

        createCustomer();

      }

    }
  );


/* =========================================
   CANCELAR
========================================= */

$("cancelButton")
  .addEventListener(
    "click",
    () => {

      resetForm();

      clearStatus();

    }
  );


/* =========================================
   BUSCAR
========================================= */

$("search")
  .addEventListener(
    "input",
    () => {

      renderCustomers();

    }
  );


/* =========================================
   CAMBIAR NEGOCIO
========================================= */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(

      button.addEventListener(
        "click",
        () => {

          currentBusiness =
            button.dataset.business;


          document
            .querySelectorAll(

            )
            .forEach(
              item =>

            );

          );


          renderCustomers();

        }
      );

    }
  );

$("refresh")

  );

loadCustomers();
