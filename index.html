<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{

}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",

  background:#f5f5f5;
  color:#222;

}

header{
  background:#111827;
  color:#fff;

}

header h1{
  font-size:28px;

}

header p{

}

.container{
  width:100%;

  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:14px 16px;
  border-radius:12px;
  font-size:14px;
  display:none;
  font-weight:700;
  white-space:pre-line;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{

}

.status.warn{

}

.business-btn{

}

.business-btn.active{

}

.navigation{

.nav-btn{

.products{

.product{

  padding:18px 14px;

  background:#fff;
  text-align:left;
  transition:.15s;
}

.product:hover{

  transform:translateY(-1px);
}

.product:active{

}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:700;
  font-size:17px;
  margin-bottom:9px;
}

.price{

}

.stock{

.cart-item{

  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:700;
}

.cart-price{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.quantity{

  font-size:18px;
}

.total{

  font-size:25px;
  font-weight:800;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #eee;
}

.payment-title,

  margin-bottom:10px;
  font-weight:800;
  font-size:17px;
}

.payments{

  gap:9px;
}

.payment{

  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.payment.active{

  color:#fff;
  border-color:#111827;
}

.customer-box{

.customer-row{

.customer-search{

  font-size:15px;

.add-client{

  cursor:pointer;

.customer-results{

  border-radius:11px;

  background:#fff;

  right:0;

}

.customer-result{

  border-bottom:1px solid #eee;
  background:#fff;
  padding:13px;
  text-align:left;
  cursor:pointer;
}

.customer-result:last-child{

.customer-result:hover{

}

.customer-result strong{

}

.customer-result small{

.selected-customer{

.clear-customer{

  margin-left:8px;
  padding:0;

.general-customer{

.account{

.offline-badge{

"use strict";


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerServiceWorker(){

  if(
    !("serviceWorker" in navigator)
  ){

    return;

  }

  try{

    const registration =
      await navigator.serviceWorker.register(
        "./sw.js",
        {
          scope:"./",
          updateViaCache:"none"
        }
      );

    await registration.update()
      .catch(()=>{});

    if(
      registration.waiting
    ){

      registration.waiting.postMessage({
        type:"SKIP_WAITING"
      });

    }

    console.log(
      "[POS] Service Worker activo:",
      registration.scope
    );

  }

  catch(error){

    console.error(
      "[POS] Service Worker:",
      error
    );

  }

}


/* =========================================================
   SUPABASE REST
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   ESTADO
========================================================= */

let currentBusiness =
"BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId =
null;

let selectedCustomerId =
null;


/* =========================================================
   INDEXED DB
========================================================= */

const DB_NAME =
"POS_OFFLINE_DB";

const DB_VERSION =
1;

const STORE_DATA =
"data";

const STORE_QUEUE =
"sales_queue";


let dbPromise =
null;


function openDatabase(){

  if(dbPromise){

    return dbPromise;

  }

  dbPromise =
    new Promise(
      (resolve,reject) => {

        const request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

        request.onupgradeneeded =
          event => {

            const db =
              event.target.result;

            if(
              !db.objectStoreNames.contains(
                STORE_DATA
              )
            ){

              db.createObjectStore(
                STORE_DATA
              );

            }

            if(
              !db.objectStoreNames.contains(
                STORE_QUEUE
              )
            ){

              db.createObjectStore(
                STORE_QUEUE,
                {
                  keyPath:"local_id"
                }
              );

            }

          };


        request.onsuccess =
          () => {

            resolve(
              request.result
            );

          };


        request.onerror =
          () => {

            reject(
              request.error
            );

          };

      }
    );

  return dbPromise;

}


async function dbPut(
  store,
  key,
  value
){

  const db =
    await openDatabase();

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readwrite"
        );

      transaction
        .objectStore(store)
        .put(
          value,
          key
        );

      transaction.oncomplete =
        () => resolve(true);

      transaction.onerror =
        () => reject(
          transaction.error
        );

    }
  );

}


async function dbGet(
  store,
  key
){

  const db =
    await openDatabase();

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readonly"
        );

      const request =
        transaction
          .objectStore(store)
          .get(key);

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


async function dbGetAll(
  store
){

  const db =
    await openDatabase();

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readonly"
        );

      const request =
        transaction
          .objectStore(store)
          .getAll();

      request.onsuccess =
        () => resolve(
          request.result || []
        );

      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


async function dbDelete(
  store,
  key
){

  const db =
    await openDatabase();

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readwrite"
        );

      transaction
        .objectStore(store)
        .delete(key);

      transaction.oncomplete =
        () => resolve(true);

      transaction.onerror =
        () => reject(
          transaction.error
        );

    }
  );

}


/* =========================================================
   GUARDAR DATOS OFFLINE
========================================================= */

async function saveOfflineData(){

  try{

    await dbPut(
      STORE_DATA,
      "business_" +
      currentBusiness,
      {
        business:
          currentBusiness,

        savedAt:
          new Date().toISOString(),

        products:
          products || [],

        payments:
          payments || []
      }
    );


    await dbPut(
      STORE_DATA,
      "customers",
      {
        savedAt:
          new Date().toISOString(),

        customers:
          customers || []
      }
    );


    console.log(
      "[POS] Datos guardados en IndexedDB:",
      currentBusiness
    );

  }

  catch(error){

    console.error(
      "[POS] Error guardando IndexedDB:",
      error
    );

  }

}


/* =========================================================
   CARGAR DATOS OFFLINE
========================================================= */

async function loadOfflineData(){

  try{

    const businessData =
      await dbGet(
        STORE_DATA,
        "business_" +
        currentBusiness
      );


    const customerData =
      await dbGet(
        STORE_DATA,
        "customers"
      );


    if(
      !businessData
    ){

      return false;

    }


    products =
      Array.isArray(
        businessData.products
      )
      ? businessData.products
      : [];


    payments =
      Array.isArray(
        businessData.payments
      )
      ? businessData.payments
      : [];


    customers =
      Array.isArray(
        customerData?.customers
      )
      ? customerData.customers
      : [];


    selectedPaymentId =
      payments.some(
        payment =>
          payment.id ===
          selectedPaymentId
      )
      ? selectedPaymentId
      : (
          payments[0]?.id ||
          null
        );


    selectedCustomerId =
      customers.some(
        customer =>
          customer.id ===
          selectedCustomerId
      )
      ? selectedCustomerId
      : null;


    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();


    console.log(
      "[POS] OFFLINE:",
      currentBusiness,
      "productos:",
      products.length,
      "pagos:",
      payments.length,
      "clientes:",
      customers.length
    );


    return true;

  }

  catch(error){

    console.error(
      "[POS] Error cargando IndexedDB:",
      error
    );

    return false;

  }

}


/* =========================================================
   HELPERS

function $(id){

}


function money(value){

  return "$" +
    Number(
      value || 0
    ).toFixed(2);

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function showStatus(
  message,
  type="error"
){

  $("status").textContent =
    message;

  $("status").className =
    "status " + type;

}


function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}


/* =========================================================
   REST SUPABASE
========================================================= */

async function supabaseRequest(
  path,
  options={}
){

  const headers =
    new Headers(
      options.headers || {}
    );


  headers.set(
    "apikey",
    SUPABASE_KEY
  );


  headers.set(
    "Authorization",
    "Bearer " +
    SUPABASE_KEY
  );


  headers.set(
    "Accept",
    "application/json"
  );


  if(
    options.body &&
    !headers.has(
      "Content-Type"
    )
  ){

    headers.set(
      "Content-Type",
      "application/json"
    );

  }


  const response =
    await fetch(
      SUPABASE_URL +
      path,
      {
        ...options,
        headers
      }
    );


  const text =
    await response.text();


  let data = null;


  if(text){

    try{

      data =
        JSON.parse(text);

    }

    catch{

      data =
        text;

    }

  }


  if(
    !response.ok
  ){

    const message =
      data?.message ||
      data?.error_description ||
      data?.hint ||
      (
        typeof data ===
        "string"
        ? data
        : "Error Supabase"
      );


    throw new Error(
      message
    );

  }


  return data;

}


/* =========================================================
   CARGAR DATOS
========================================================= */

    $("products").innerHTML =
      '<div class="empty">' +
      "No existen productos guardados en este dispositivo." +
      "</div>";


    $("payments").innerHTML =
      '<div class="empty">' +
      "No existen métodos de pago guardados." +
      "</div>";


    showStatus(
      "📴 No hay Internet y todavía no existe una copia offline de " +
      currentBusiness +
      ".\n\nConéctate una vez a Internet para descargar los productos, clientes y métodos de pago.",
      "warn"
    );


    return;

  }


  /*
   * ONLINE
   */

  const businessId =
    BUSINESS_IDS[
      currentBusiness
    ];


  try{

    const productsQuery =
      "/rest/v1/products" +
      "?select=id,name,price,cost,stock,active,business_id" +
      "&business_id=eq." +
      encodeURIComponent(
        businessId
      ) +
      "&active=eq.true" +
      "&order=name";


    const paymentsQuery =
      "/rest/v1/payment_methods" +
      "?select=id,name,provider,active,business_id" +
      "&business_id=eq." +
      encodeURIComponent(
        businessId
      ) +
      "&active=eq.true" +
      "&order=name";


    const customersQuery =
      "/rest/v1/customers" +
      "?select=id,name,phone,notes" +
      "&order=name";


    const [
      productsData,
      paymentsData,
      customersData
    ] =
      await Promise.all([
        supabaseRequest(
          productsQuery
        ),

        supabaseRequest(
          paymentsQuery
        ),

        supabaseRequest(
          customersQuery
        )
      ]);


    products =
      Array.isArray(
        productsData
      )
      ? productsData
      : [];


    payments =
      Array.isArray(
        paymentsData
      )
      ? paymentsData
      : [];


    customers =
      Array.isArray(
        customersData
      )
      ? customersData
      : [];


    /*
     * GUARDAR INMEDIATAMENTE.
     */

    await saveOfflineData();


    /*
     * Selecciones válidas.
     */

    if(
      !payments.some(
        payment =>
          payment.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }


    if(
      !customers.some(
        customer =>
          customer.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }


    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();


    showStatus(
      currentBusiness +
      " actualizado.\n" +
      products.length +
      " productos · " +
      customers.length +
      " clientes · " +
      payments.length +
      " métodos de pago guardados para uso offline.",
      "ok"
    );


    /*
     * Intentar sincronizar ventas
     * que hayan quedado pendientes.
     */

    await syncPendingSales();

  }

  catch(error){

    console.error(
      "[POS] Error online:",
      error
    );


    /*
     * Aunque navigator.onLine diga true,
     * si Supabase no responde usamos
     * IndexedDB.
     */

    const loaded =
      await loadOfflineData();


    if(loaded){

      showStatus(
        "No se pudo conectar con Supabase.\n" +
        "Se utilizaron los últimos datos guardados de " +
        currentBusiness +
        ".",
        "warn"
      );

      return;

    }


    showStatus(
      error?.message ||
      "No se pudo cargar la información.",
      "error"
    );

  }

}

/* =========================================================
   CARRITO
========================================================= */

function addToCart(
  product
){

  const stock =
    Number(
      product.stock || 0
    );


  if(
    stock <= 0
  ){

    showStatus(
      "Este producto está agotado."
    );

    return;

  }


  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );


  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia disponible."
      );

    }

  }

  else{

    cart.push({

      ...product,

      quantity:1

    });

  }


  renderCart();

}


function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id ===
        id
    );


  if(!item){

    return;

  }


  const product =
    products.find(
      p =>
        p.id ===
        id
    );


  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );


  const newQuantity =
    item.quantity +
    amount;


  if(
    newQuantity >
    max
  ){

    showStatus(
      "No hay suficiente existencia disponible."
    );

    return;

  }


  item.quantity =
    newQuantity;


  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !==
          id
      );

  }


  renderCart();

}


function getCartTotal(){

  return cart.reduce(
    (
      sum,
      item
    ) =>

      sum +
      (
        Number(
          item.price
        ) *
        Number(
          item.quantity
        )
      ),

    0
  );

}


function renderCart(){

  const container =
    $("cart");


  container.innerHTML =
    "";


  if(
    !cart.length
  ){

    container.innerHTML =
      '<div class="empty">' +
      "El carrito está vacío" +
      "</div>";


    $("total").textContent =
      "$0.00";


    return;

  }


  cart.forEach(
    item => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "cart-item";


      const info =
        document.createElement(
          "div"
        );


      info.innerHTML =

        '<div class="cart-name">' +

        escapeHTML(
          item.name
        ) +

        "</div>" +

        '<div class="cart-price">' +

        money(
          item.price
        ) +

        " c/u</div>";


      const controls =
        document.createElement(
          "div"
        );


      controls.className =
        "quantity";


      const minus =
        document.createElement(
          "button"
        );


      minus.type =
        "button";


      minus.textContent =
        "−";


      minus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            -1
          )
      );


      const quantity =
        document.createElement(
          "span"
        );


      quantity.textContent =
        item.quantity;


      const plus =
        document.createElement(
          "button"
        );


      plus.type =
        "button";


      plus.textContent =
        "+";


      plus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            1
          )
      );


      controls.append(
        minus,
        quantity,
        plus
      );


      info.appendChild(
        controls
      );


      const subtotal =
        document.createElement(
          "strong"
        );


      subtotal.textContent =
        money(
          Number(
            item.price
          ) *
          Number(
            item.quantity
          )
        );


      row.append(
        info,
        subtotal
      );


      container.appendChild(
        row
      );

    }
  );


  $("total").textContent =
    money(
      getCartTotal()
    );

}

/* =========================================================
   COLA DE VENTAS OFFLINE
========================================================= */

async function queueSale(
  isPending
){

  const items =
    cart.map(
      item => ({

        product_id:
          item.id,

        description:
          item.name,

        quantity:
          Number(
            item.quantity
          ),

        unit_price:
          Number(
            item.price
          ),

        subtotal:
          Number(
            item.price
          ) *
          Number(
            item.quantity
          )

      })
    );


  const sale = {

    local_id:
      "offline-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2),

    created_at:
      new Date().toISOString(),

    business_id:
      BUSINESS_IDS[
        currentBusiness
      ],

    business:
      currentBusiness,

    customer_id:
      selectedCustomerId ||
      null,

    payment_method_id:
      isPending
      ? null
      : selectedPaymentId,

    items,

    p_is_pending:
      isPending,

    total:
      items.reduce(
        (
          total,
          item
        ) =>
          total +
          item.subtotal,
        0
      )

  };


  await dbPut(
    STORE_QUEUE,
    sale.local_id,
    sale
  );


  /*
   * Actualizar existencia local.
   */

  items.forEach(
    item => {

      const product =
        products.find(
          p =>
            p.id ===
            item.product_id
        );


      if(product){

        product.stock =
          Math.max(
            0,
            Number(
              product.stock || 0
            ) -
            Number(
              item.quantity
            )
          );

      }

    }
  );


  await saveOfflineData();


  return sale;

}


/* =========================================================
   SINCRONIZAR VENTAS
========================================================= */

async function syncPendingSales(){

  if(
    !navigator.onLine
  ){

    return;

  }


  let queue = [];


  try{

    queue =
      await dbGetAll(
        STORE_QUEUE
      );

  }

  catch(error){

    console.error(
      "[POS] No se pudo leer cola:",
      error
    );

    return;

  }


  if(
    !queue.length
  ){

    return;

  }


  console.log(
    "[POS] Ventas pendientes:",
    queue.length
  );


  for(
    const sale of queue
  ){

    try{

      await supabaseRequest(
        "/rest/v1/rpc/register_sale",
        {
          method:"POST",

          body:JSON.stringify({

            p_business_id:
              sale.business_id,

            p_customer_id:
              sale.customer_id,

            p_payment_method_id:
              sale.payment_method_id,

            p_items:
              sale.items,

            p_is_pending:
              sale.p_is_pending

          })
        }
      );


      await dbDelete(
        STORE_QUEUE,
        sale.local_id
      );


      console.log(
        "[POS] Venta offline sincronizada:",
        sale.local_id
      );

    }

    catch(error){

      console.warn(
        "[POS] Venta todavía pendiente:",
        sale.local_id,
        error
      );

      /*
       * No eliminamos la venta.
       * Se intentará nuevamente.
       */

    }

  }

}


/* =========================================================
   REGISTRAR VENTA
========================================================= */

async function registerSale(
  isPending
){

  clearStatus();


  if(
    !cart.length
  ){

    showStatus(
      "Agrega al menos un producto."
    );

    return;

  }


  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago."
    );

    return;

  }


  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente."
    );

    return;

  }


  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");


  const original =
    button.textContent;


  button.disabled =
    true;


  button.textContent =
    "GUARDANDO...";


  try{

    /*
     * OFFLINE
     */

    if(
      !navigator.onLine
    ){

      const sale =
        await queueSale(
          isPending
        );


      cart = [];


      selectedCustomerId =
        null;


      $("customerSearch").value =
        "";


      $("customerResults").innerHTML =
        "";


      $("customerResults").style.display =
        "none";


      renderSelectedCustomer();

      renderCart();

      renderProducts();


      showStatus(
        "✅ Venta guardada en el dispositivo.\n\n" +
        "No hay Internet.\n" +
        "Se sincronizará automáticamente cuando vuelva la conexión.\n\n" +
        "Total: " +
        money(
          sale.total
        ),
        "warn"
      );


      return;

    }


    /*
     * ONLINE
     */

    const items =
      cart.map(
        item => ({

          product_id:
            item.id,

          description:
            item.name,

          quantity:
            Number(
              item.quantity
            ),

          unit_price:
            Number(
              item.price
            ),

          subtotal:
            Number(
              item.price
            ) *
            Number(
              item.quantity
            )

        })
      );


    const total =
      items.reduce(
        (
          sum,
          item
        ) =>
          sum +
          item.subtotal,
        0
      );


    await supabaseRequest(
      "/rest/v1/rpc/register_sale",
      {
        method:"POST",

        body:JSON.stringify({

          p_business_id:
            BUSINESS_IDS[
              currentBusiness
            ],

          p_customer_id:
            selectedCustomerId ||
            null,

          p_payment_method_id:
            isPending
            ? null
            : selectedPaymentId,

          p_items:
            items,

          p_is_pending:
            isPending

        })
      }
    );


    const customer =
      customers.find(
        c =>
          c.id ===
          selectedCustomerId
      );


    const payment =
      payments.find(
        p =>
          p.id ===
          selectedPaymentId
      );


    alert(
      (
        isPending
        ? "Cuenta registrada"
        : "Venta registrada"
      ) +

      "\n\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(total) +

      (
        isPending
        ? ""
        : "\nPago: " +
          (
            payment?.name ||
            "Pago"
          )
      )
    );


    cart = [];


    selectedCustomerId =
      null;


    $("customerSearch").value =
      "";


    $("customerResults").innerHTML =
      "";


    $("customerResults").style.display =
      "none";


    renderSelectedCustomer();

    renderCart();


    await loadBusinessData();


    showStatus(
      isPending
      ? "Cuenta guardada correctamente."
      : "Venta guardada correctamente.",
      "ok"
    );

  }

  catch(error){

    console.error(
      "[POS] registerSale:",
      error
    );


    /*
     * Si falló la red aunque
     * navigator.onLine diga true,
     * guardamos la venta localmente.
     */

    if(
      !navigator.onLine
    ){

      try{

        const sale =
          await queueSale(
            isPending
          );


        cart = [];


        selectedCustomerId =
          null;


        renderSelectedCustomer();

        renderCart();

        renderProducts();


        showStatus(
          "Venta guardada localmente.\n" +
          "Se sincronizará cuando vuelva Internet.\n\n" +
          "Total: " +
          money(
            sale.total
          ),
          "warn"
        );

        return;

      }

      catch(queueError){

        console.error(
          queueError
        );

      }

    }


    showStatus(
      "No se pudo registrar la operación:\n" +
      (
        error?.message ||
        String(error)
      )
    );

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      original;

  }

}

        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        await loadBusinessData();

      }
    );

  }
);


/* =========================================================
   CONEXIÓN
========================================================= */

window.addEventListener(
  "online",
  async () => {

    showStatus(
      "🌐 Internet restaurado.\nSincronizando...",
      "ok"
    );


    await syncPendingSales();

    await loadBusinessData();

  }
);


window.addEventListener(
  "offline",
  () => {

    showStatus(
      "📴 MODO OFFLINE\n\n" +
      "Los productos, clientes y métodos de pago se cargarán desde el dispositivo.",
      "warn"
    );


    loadOfflineData();

  }
);


/* =========================================================
   INICIO
========================================================= */

async function startApp(){

  /*
   * El Service Worker se registra,
   * pero NO bloquea el inicio del POS.
   */

  registerServiceWorker();


  try{

    /*
     * Abrimos IndexedDB primero.
     */

    await openDatabase();


    /*
     * Si estamos offline,
     * cargar inmediatamente.
     */

    if(
      !navigator.onLine
    ){

      const loaded =
        await loadOfflineData();


      if(
        loaded
      ){

        showStatus(
          "📴 MODO OFFLINE\n\n" +
          currentBusiness +
          "\n" +
          products.length +
          " productos · " +
          customers.length +
          " clientes · " +
          payments.length +
          " métodos de pago",
          "warn"
        );

      }

      else{

        showStatus(
          "📴 Sin Internet.\n\n" +
          "Todavía no existe información guardada para este dispositivo. Conéctate una vez a Internet para preparar el POS offline.",
          "warn"
        );

      }


      return;

    }


    /*
     * ONLINE.
     */

    await loadBusinessData();

  }

  catch(error){

    console.error(
      "[POS] Error iniciando:",
      error
    );


    /*
     * Último intento:
     * cargar IndexedDB.
     */

    const loaded =
      await loadOfflineData();


    if(
      loaded
    ){

      showStatus(
        "📴 Se inició con los últimos datos guardados localmente.",
        "warn"
      );

    }

    else{

      showStatus(
        error?.message ||
        "No se pudo iniciar el POS."
      );

    }

  }

}


startApp();

</script>
