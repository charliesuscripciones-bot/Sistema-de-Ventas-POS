<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema POS">
<title>Sistema de Ventas POS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
min-height:100%;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f5f5;
color:#222;
min-height:100vh;
}

body.modal-open{
overflow:hidden;
}

header{
background:#111827;
color:#fff;
padding:calc(22px + env(safe-area-inset-top)) 20px 22px;
}

header h1{
font-size:28px;
line-height:1.15;
}

header p{
font-size:15px;
opacity:.75;
margin-top:8px;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
padding:20px;
}

.status{
margin:0 0 15px;
padding:14px 16px;
border-radius:12px;
font-size:14px;
display:none;
font-weight:700;
white-space:pre-line;
}

.status.error{display:block;background:#fee2e2;color:#991b1b}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.warn{display:block;background:#fef3c7;color:#92400e}

.businesses{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.business-btn,.nav-btn{
border:none;
padding:13px 20px;
border-radius:12px;
background:#fff;
border:2px solid #ddd;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.business-btn{
flex:1;
}

.business-btn.active{
background:#111827;
color:#fff;
border-color:#111827;
}

.navigation{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-bottom:20px;
}

.nav-btn{
color:#2563eb;
}

.nav-btn.accounts{
background:#fff7ed;
border-color:#f59e0b;
color:#b45309;
}

.nav-btn.clients{
background:#ecfdf5;
border-color:#10b981;
color:#047857;
}

.nav-btn.history{
background:#f5f3ff;
border-color:#7c3aed;
color:#6d28d9;
}

.nav-btn.inventory{
background:#eff6ff;
border-color:#2563eb;
color:#1d4ed8;
}

.layout{
display:grid;
grid-template-columns:1fr 390px;
gap:20px;
}

.card{
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
font-size:21px;
margin-bottom:16px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
border:2px solid #ddd;
border-radius:14px;
padding:18px 14px;
cursor:pointer;
background:#fff;
text-align:left;
transition:.15s;
}

.product:hover{
border-color:#2563eb;
}

.product:active{
transform:scale(.98);
}

.product.disabled{
opacity:.5;
cursor:not-allowed;
}

.product-name{
font-weight:700;
font-size:17px;
margin-bottom:9px;
}

.price{
font-size:23px;
font-weight:800;
color:#2563eb;
}

.stock{
font-size:14px;
color:#666;
margin-top:7px;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px 0;
border-bottom:1px solid #eee;
gap:12px;
}

.cart-name{
font-weight:700;
}

.cart-price{
font-size:13px;
color:#666;
margin-top:4px;
}

.quantity{
display:flex;
align-items:center;
gap:8px;
margin-top:8px;
}

.quantity button{
width:32px;
height:32px;
border:none;
border-radius:7px;
background:#eee;
cursor:pointer;
font-size:18px;
}

.total{
display:flex;
justify-content:space-between;
font-size:25px;
font-weight:800;
margin-top:20px;
padding-top:18px;
border-top:2px solid #eee;
}

.payment-title,.customer-title{
margin-top:20px;
margin-bottom:10px;
font-weight:800;
font-size:17px;
}

.payments{
display:grid;
gap:9px;
}

.payment{
padding:14px;
border:2px solid #ddd;
border-radius:11px;
background:#fff;
cursor:pointer;
text-align:left;
font-size:16px;
font-weight:700;
}

.payment.active{
background:#111827;
color:#fff;
border-color:#111827;
}

.customer-box{
position:relative;
}

.customer-row{
display:flex;
gap:8px;
}

.customer-search{
flex:1;
padding:13px;
border:2px solid #ddd;
border-radius:11px;
font-size:15px;
min-width:0;
background:#fff;
}

.customer-search:focus{
outline:none;
border-color:#2563eb;
}

.add-client{
border:none;
background:#2563eb;
color:#fff;
padding:0 14px;
border-radius:11px;
font-weight:800;
cursor:pointer;
white-space:nowrap;
}

.customer-results{
margin-top:8px;
display:none;
border:2px solid #ddd;
border-radius:11px;
overflow:hidden;
background:#fff;
box-shadow:0 8px 25px rgba(0,0,0,.12);
position:absolute;
left:0;
right:0;
z-index:100;
}

.customer-result{
display:block;
width:100%;
border:none;
border-bottom:1px solid #eee;
background:#fff;
padding:13px;
text-align:left;
cursor:pointer;
}

.customer-result:hover{
background:#f3f4f6;
}

.customer-result strong{
display:block;
font-size:15px;
}

.customer-result small{
display:block;
color:#6b7280;
margin-top:4px;
}

.selected-customer{
margin-top:8px;
padding:12px;
border-radius:9px;
background:#eff6ff;
border:2px solid #bfdbfe;
color:#1d4ed8;
font-size:14px;
font-weight:600;
}

.clear-customer{
border:none;
background:none;
color:#dc2626;
font-weight:700;
cursor:pointer;
margin-left:8px;
}

.general-customer{
margin-top:8px;
padding:13px;
border-radius:9px;
background:#f3f4f6;
color:#555;
font-weight:700;
cursor:pointer;
}

.charge,.account{
width:100%;
margin-top:15px;
padding:16px;
border:none;
border-radius:12px;
color:#fff;
font-size:18px;
font-weight:800;
cursor:pointer;
}

.charge{
background:#16a34a;
}

.account{
margin-top:10px;
background:#f59e0b;
}

.charge:disabled,.account:disabled{
opacity:.6;
cursor:wait;
}

.empty{
color:#777;
text-align:center;
padding:30px 10px;
}

.offline-badge{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:20px;
background:#fef3c7;
color:#92400e;
font-size:12px;
font-weight:800;
}


/* =========================================================
   MODAL AGREGAR CLIENTE
========================================================= */

.client-modal{
position:fixed;
inset:0;
z-index:999999;
display:none;
align-items:center;
justify-content:center;
padding:16px;
background:rgba(0,0,0,.65);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);
}

.client-modal.show{
display:flex !important;
}

.client-modal-box{
width:100%;
max-width:430px;
max-height:calc(100vh - 32px);
overflow-y:auto;
background:#fff;
border-radius:22px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
animation:modalIn .18s ease-out;
}

@keyframes modalIn{
from{
opacity:0;
transform:translateY(20px) scale(.97);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.client-modal-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
padding:20px;
background:#111827;
color:#fff;
}

.client-modal-header h3{
font-size:20px;
}

.client-modal-header p{
font-size:13px;
opacity:.75;
margin-top:4px;
}

.close-modal{
width:40px;
height:40px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.14);
color:#fff;
font-size:27px;
line-height:1;
cursor:pointer;
flex-shrink:0;
}

.client-form{
padding:20px;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
font-size:14px;
font-weight:800;
margin-bottom:7px;
color:#374151;
}

.form-group input,
.form-group textarea{
width:100%;
padding:13px 14px;
border:2px solid #ddd;
border-radius:11px;
font-size:16px;
font-family:inherit;
background:#fff;
}

.form-group textarea{
min-height:80px;
resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
outline:none;
border-color:#2563eb;
}

.client-form-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.modal-cancel,
.modal-save{
border:none;
border-radius:11px;
padding:14px;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.modal-cancel{
background:#f3f4f6;
color:#374151;
}

.modal-save{
background:#2563eb;
color:#fff;
}

.modal-save:disabled{
opacity:.6;
cursor:wait;
}

.modal-error{
display:none;
padding:11px 13px;
border-radius:10px;
background:#fee2e2;
color:#991b1b;
font-size:13px;
font-weight:700;
margin-bottom:15px;
white-space:pre-line;
}

.modal-error.show{
display:block;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){
.navigation{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:850px){
.layout{
grid-template-columns:1fr;
}

.navigation{
grid-template-columns:1fr 1fr;
}
}

@media(max-width:500px){
.container{
padding:15px;
}

header h1{
font-size:25px;
}

header p{
font-size:14px;
}

.navigation{
grid-template-columns:1fr 1fr;
}

.card{
padding:16px;
}

.products{
grid-template-columns:1fr 1fr;
}

.product{
padding:15px 12px;
}

.product-name{
font-size:15px;
}

.price{
font-size:20px;
}

.customer-row{
flex-direction:column;
}

.add-client{
padding:12px;
}

.client-modal{
padding:10px;
}

.client-modal-box{
border-radius:18px;
}

.client-form{
padding:16px;
}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const SUPABASE_URL=
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY=
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS={
BakeQuiri:"c435ee25-6a2b-4134-b3f8-90b38d6bde0c",
SpicyRoll:"ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"
};

let supabaseClient=null;

let currentBusiness="BakeQuiri";

let products=[];
let payments=[];
let customers=[];
let cart=[];

let selectedPaymentId=null;
let selectedCustomerId=null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
return document.getElementById(id);
}

function money(value){
return "$"+Number(value||0).toFixed(2);
}

function escapeHTML(value){
return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function showStatus(message,type="error"){
$("status").textContent=message;
$("status").className="status "+type;
}

function clearStatus(){
$("status").textContent="";
$("status").className="status";
}


/* =========================================================
   INDEXED DB
========================================================= */

const DB_NAME="SistemaPOSOffline";
const DB_VERSION=1;
const STORE_NAME="data";

let dbPromise=null;

function openOfflineDB(){

if(dbPromise){
return dbPromise;
}

dbPromise=new Promise((resolve,reject)=>{

const request=indexedDB.open(
DB_NAME,
DB_VERSION
);

request.onupgradeneeded=event=>{

const db=event.target.result;

if(!db.objectStoreNames.contains(STORE_NAME)){

db.createObjectStore(
STORE_NAME,
{keyPath:"key"}
);

}

};

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

return dbPromise;
}

async function saveOfflineData(business,data){

try{

const db=await openOfflineDB();

return new Promise((resolve,reject)=>{

const transaction=db.transaction(
STORE_NAME,
"readwrite"
);

const store=transaction.objectStore(
STORE_NAME
);

store.put({
key:"business_"+business,
business,
savedAt:Date.now(),
...data
});

transaction.oncomplete=()=>{
resolve(true);
};

transaction.onerror=()=>{
reject(transaction.error);
};

});

}catch(error){

console.error(
"Error guardando datos offline:",
error
);

return false;
}
}

async function getOfflineData(business){

try{

const db=await openOfflineDB();

return new Promise((resolve,reject)=>{

const transaction=db.transaction(
STORE_NAME,
"readonly"
);

const store=transaction.objectStore(
STORE_NAME
);

const request=store.get(
"business_"+business
);

request.onsuccess=()=>{
resolve(request.result||null);
};

request.onerror=()=>{
reject(request.error);
};

});

}catch(error){

console.error(
"Error leyendo datos offline:",
error
);

return null;
}
}


/* =========================================================
   SUPABASE
========================================================= */

function initializeSupabase(){

if(
!window.supabase||
typeof window.supabase.createClient!=="function"
){

throw new Error(
"No se pudo cargar Supabase."
);

}

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);
}


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerServiceWorker(){

if(!("serviceWorker" in navigator)){
return;
}

try{

const registration=
await navigator.serviceWorker.register(
"./sw.js",
{
scope:"./",
updateViaCache:"none"
}
);

console.log(
"[POS] Service Worker:",
registration.scope
);

try{
await registration.update();
}catch(error){
console.warn(
"[POS] Error actualizando SW:",
error
);
}

if(registration.waiting){

registration.waiting.postMessage(
"SKIP_WAITING"
);

}

}catch(error){

console.warn(
"[POS] Service Worker:",
error
);

}
}


/* =========================================================
   DATOS ONLINE
========================================================= */

async function loadOnlineData(){

const businessId=
BUSINESS_IDS[currentBusiness];

const productsResult=
await supabaseClient
.from("products")
.select(
"id,name,price,cost,stock,active,business_id"
)
.eq(
"business_id",
businessId
)
.eq(
"active",
true
)
.order("name");

if(productsResult.error){
throw productsResult.error;
}

const paymentsResult=
await supabaseClient
.from("payment_methods")
.select(
"id,name,provider,active,business_id"
)
.eq(
"business_id",
businessId
)
.eq(
"active",
true
)
.order("name");

if(paymentsResult.error){
throw paymentsResult.error;
}


/*
 * Clientes.
 *
 * Intentamos primero con business_id.
 * Si esa columna no existe, usamos la estructura
 * anterior de la tabla.
 */

let customersResult=
await supabaseClient
.from("customers")
.select(
"id,name,phone,notes,business_id"
)
.or(
"business_id.is.null,business_id.eq."+businessId
)
.order("name");

if(customersResult.error){

customersResult=
await supabaseClient
.from("customers")
.select(
"id,name,phone,notes"
)
.order("name");

if(customersResult.error){
throw customersResult.error;
}
}

products=productsResult.data||[];
payments=paymentsResult.data||[];
customers=customersResult.data||[];

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);

}


/* =========================================================
   DATOS OFFLINE
========================================================= */

async function loadOfflineData(){

const cached=
await getOfflineData(currentBusiness);

if(!cached){

products=[];
payments=[];
customers=[];

renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();

showStatus(
"Este negocio todavía no tiene datos guardados en este dispositivo. Conéctate a Internet una vez para descargar los datos.",
"warn"
);

return false;
}

products=
Array.isArray(cached.products)
?cached.products
:[];

payments=
Array.isArray(cached.payments)
?cached.payments
:[];

customers=
Array.isArray(cached.customers)
?cached.customers
:[];

renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();

showStatus(
"Modo OFFLINE activo.\n"+
"Productos: "+products.length+
" · Métodos de pago: "+payments.length+
" · Clientes: "+customers.length,
"warn"
);

return true;
}


/* =========================================================
   CARGAR NEGOCIO
========================================================= */

async function loadBusinessData(){

clearStatus();

$("products").innerHTML=
'<div class="empty">Cargando productos...</div>';

$("payments").innerHTML=
'<div class="empty">Cargando métodos de pago...</div>';

if(!navigator.onLine){

await loadOfflineData();
return;
}

try{

await loadOnlineData();

renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();

showStatus(
currentBusiness+
" actualizado correctamente.\n"+
"Datos guardados para uso OFFLINE.",

);

error

const container=$("products");

container.innerHTML="";

if(!products.length){

container.innerHTML=
'<div class="empty">No hay productos disponibles.</div>';

return;
}

products.forEach(product=>{

Number(product.stock||0);

document.createElement("button");

"product"+

'<div class="price">'+

(
stock>0
?"Existencia: "+stock
:"Agotado"
)+

);

/* =========================================================
   CARRITO
========================================================= */

function addToCart(product){

const stock=
Number(product.stock||0);

if(stock<=0){

showStatus(
"Este producto está agotado."
);

return;
}

const item=
cart.find(i=>i.id===product.id);

if(item){

if(item.quantity<stock){

item.quantity++;

}else{

showStatus(
"No puedes agregar más unidades que la existencia disponible."
);

return;
}

}else{

cart.push({
...product,
quantity:1
});

}

renderCart();
}

function changeQuantity(id,amount){

const item=
cart.find(i=>i.id===id);

if(!item)return;

const product=
products.find(p=>p.id===id);

const max=
Number(
product?.stock??
item.stock??
0
);

const newQuantity=
item.quantity+amount;

if(newQuantity>max){

showStatus(
"No hay suficiente existencia disponible."
);

return;
}

item.quantity=newQuantity;

if(item.quantity<=0){

cart=
cart.filter(i=>i.id!==id);

}

renderCart();
}

function getCartTotal(){

return cart.reduce(
(sum,item)=>
sum+
Number(item.price)*
Number(item.quantity),
0
);
}

function renderCart(){

const container=$("cart");

container.innerHTML="";

if(!cart.length){

container.innerHTML=
'<div class="empty">El carrito está vacío</div>';

$("total").textContent="$0.00";

return;
}

cart.forEach(item=>{

const row=
document.createElement("div");

row.className="cart-item";

const info=
document.createElement("div");

info.innerHTML=
'<div class="cart-name">'+
escapeHTML(item.name)+
'</div>'+
'<div class="cart-price">'+
money(item.price)+
" c/u</div>";

const controls=
document.createElement("div");

controls.className="quantity";

const minus=
document.createElement("button");

minus.type="button";
minus.textContent="−";

minus.addEventListener(
"click",
()=>changeQuantity(item.id,-1)
);

const quantity=
document.createElement("span");

quantity.textContent=item.quantity;

const plus=
document.createElement("button");

plus.type="button";
plus.textContent="+";

plus.addEventListener(
"click",
()=>changeQuantity(item.id,1)
);

controls.append(
minus,
quantity,
plus
);

info.appendChild(controls);

const subtotal=
document.createElement("strong");

subtotal.textContent=
money(
Number(item.price)*
Number(item.quantity)
);

row.append(
info,
subtotal
);

container.appendChild(row);

});

$("total").textContent=
money(getCartTotal());
}

   CLIENTES - BÚSQUEDA

function renderSelectedCustomer(){

customers.find(
c=>String(c.id)===String(selectedCustomerId)
);

const selectedElement=

$("generalCustomer");

'<button type="button" class="clear-customer" id="clearCustomer">Quitar</button>';

clearSelectedCustomer;

function clearSelectedCustomer(){

selectedCustomerId=null;

$("customerResults").innerHTML="";

renderSelectedCustomer();
}

function renderCustomerResults(query){

const container=$("customerResults");

const search=
String(query||"")
.trim()
.toLowerCase();

if(!search){

container.innerHTML="";
container.style.display="none";

return;
}

const filtered=
customers.filter(customer=>{

const name=
String(customer.name||"").toLowerCase();

const phone=
String(customer.phone||"").toLowerCase();

const notes=
String(customer.notes||"").toLowerCase();

return(
name.includes(search)||
phone.includes(search)||
notes.includes(search)
);

});

document.createElement("div");

}

filtered.slice(0,20).forEach(customer=>{

document.createElement("button");

button.type="button";

button.className="customer-result";

button.innerHTML=
"<strong>"+
escapeHTML(
customer.name||
"Cliente sin nombre"
)+
"</strong>"+
(
customer.phone
?"<small>📱 "+
escapeHTML(customer.phone)+
"</small>"
:""
);

button.onclick=()=>{

selectedCustomerId=
customer.id;

$("customerSearch").value=
customer.name||"";

container.style.display="none";

};

});

/* =========================================================
   GUARDAR CLIENTE
========================================================= */

async function saveNewClient(){

const name=
$("newClientName").value.trim();

const phone=
$("newClientPhone").value.trim();

const notes=
$("newClientNotes").value.trim();

if(!name){

showClientModalError(
"Escribe el nombre del cliente."
);

$("newClientName").focus();

return;
}

const saveButton=
$("saveClientButton");

const originalText=
saveButton.textContent;

saveButton.disabled=true;
saveButton.textContent="Guardando...";

try{

const businessId=
BUSINESS_IDS[currentBusiness];


/* -------------------------
   OFFLINE
------------------------- */

if(!navigator.onLine){

const temporaryId=
"offline-client-"+Date.now();

const newClient={
id:temporaryId,
name,
phone:phone||null,
notes:notes||null,
business_id:businessId,
offline:true
};

customers.push(newClient);

customers.sort(
(a,b)=>
String(a.name||"").localeCompare(
String(b.name||"")
)
);

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);

selectedCustomerId=
temporaryId;

$("customerSearch").value=name;

renderSelectedCustomer();

closeClientModal();

showStatus(
"Cliente agregado correctamente en modo OFFLINE.\n"+
"Quedó seleccionado para esta venta.",
"ok"
);

return;
}


/* -------------------------
   ONLINE
------------------------- */

if(!supabaseClient){
initializeSupabase();
}

let result=
await supabaseClient
.from("customers")
.insert({
name,
phone:phone||null,
notes:notes||null,
business_id:businessId
})
.select(
"id,name,phone,notes,business_id"
)
.single();


/*
 * Compatibilidad si customers
 * todavía no tiene business_id.
 */

if(
result.error &&
(
String(result.error.message||"")
.toLowerCase().includes("business_id")||
String(result.error.message||"")
.toLowerCase().includes("column")
)
){

result=
await supabaseClient
.from("customers")
.insert({
name,
phone:phone||null,
notes:notes||null
})
.select(
"id,name,phone,notes"
)
.single();

}

if(result.error){
throw result.error;
}

if(!result.data){

throw new Error(
"Supabase no devolvió el cliente creado."
);
}

const newClient=result.data;

customers=[
...customers,
newClient
].sort(
(a,b)=>
String(a.name||"").localeCompare(
String(b.name||"")
)
);

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);

selectedCustomerId=
newClient.id;

$("customerSearch").value=
newClient.name||name;

renderSelectedCustomer();

closeClientModal();

showStatus(
"Cliente agregado correctamente.\n"+
"Quedó seleccionado para esta venta.",
"ok"
);

}catch(error){

console.error(
"[POS] Error creando cliente:",
error
);

showClientModalError(
"No se pudo guardar el cliente.\n\n"+
(error?.message||String(error))
);

}finally{

saveButton.disabled=false;
saveButton.textContent=originalText;

}
}

/* =========================================================
   REGISTRAR VENTA
========================================================= */

async function registerSale(isPending){

clearStatus();

if(!cart.length){

showStatus(
"Agrega al menos un producto."
);

return;
}

if(!isPending&&!selectedPaymentId){

showStatus(
"Selecciona un método de pago."
);

return;
}

if(isPending&&!selectedCustomerId){

showStatus(
"Para dejar una venta a cuenta debes seleccionar un cliente."
);

return;
}

if(!navigator.onLine){

showStatus(
"Estás OFFLINE.\n\n"+
"El registro de la venta offline se habilitará en la siguiente etapa.",
"warn"
);

return;
}

const button=
isPending
?$("accountButton")
:$("chargeButton");

const originalText=
button.textContent;

button.disabled=true;

button.textContent=
isPending
?"GUARDANDO..."
:"REGISTRANDO...";

try{

const items=
cart.map(item=>({

product_id:item.id,
description:item.name,
quantity:Number(item.quantity),
unit_price:Number(item.price),
subtotal:
Number(item.price)*
Number(item.quantity)

}));

const businessId=
BUSINESS_IDS[currentBusiness];

const result=
await supabaseClient.rpc(
"register_sale",
{
p_business_id:businessId,
p_customer_id:selectedCustomerId||null,
p_payment_method_id:
isPending
?null
:selectedPaymentId,
p_items:items,
p_is_pending:isPending
}
);

if(result.error){
throw result.error;
}

alert(
isPending
?"Cuenta registrada correctamente."
:"Venta registrada correctamente."
);

cart=[];

selectedCustomerId=null;

$("customerSearch").value="";

$("customerResults").innerHTML="";

$("customerResults").style.display="none";

renderSelectedCustomer();

await loadBusinessData();

showStatus(
isPending
?"Cuenta guardada correctamente."
:"Venta guardada correctamente.",
"ok"
);

}catch(error){

console.error(
"registerSale:",
error
);

showStatus(
"No se pudo registrar la operación:\n"+
(error?.message||String(error))
);

}finally{

button.disabled=false;
button.textContent=originalText;

}
}
