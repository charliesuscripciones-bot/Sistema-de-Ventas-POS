<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 20px;
}

header h1{
  font-size:28px;
}

header p{
  font-size:15px;
  opacity:.75;
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:15px 17px;
  border-radius:12px;
  font-size:15px;
  display:none;
  font-weight:600;
  white-space:pre-line;
  line-height:1.5;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.offline{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.status.sync{
  display:block;
  background:#eff6ff;
  color:#1d4ed8;
}

.sync-box{
  display:none;
  margin-bottom:20px;
  padding:15px;
  border-radius:14px;
  border:2px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
  font-weight:700;
  font-size:16px;
}

.sync-box.visible{
  display:block;
}

.sync-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  height:38px;
  padding:0 10px;
  border-radius:20px;
  background:#2563eb;
  color:#fff;
  margin-left:6px;
}

.businesses{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.nav-btn{
  border:none;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  border:2px solid #ddd;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}

.nav-btn{
  color:#2563eb;
}

.nav-btn.accounts{
  background:#fff7ed;
  border-color:#f59e0b;
  color:#b45309;
}

.nav-btn.clients{
  background:#ecfdf5;
  border-color:#10b981;
  color:#047857;
}

.nav-btn.history{
  background:#f5f3ff;
  border-color:#7c3aed;
  color:#6d28d9;
}

.nav-btn.inventory{
  background:#eff6ff;
  border-color:#2563eb;
  color:#1d4ed8;
}

.layout{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
  font-size:21px;
  margin-bottom:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:2px solid #ddd;
  border-radius:14px;
  padding:18px 14px;
  cursor:pointer;
  background:#fff;
  text-align:left;
}

.product:hover{
  border-color:#2563eb;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:700;
  font-size:17px;
  margin-bottom:9px;
}

.price{
  font-size:23px;
  font-weight:800;
  color:#2563eb;
}

.stock{
  font-size:14px;
  color:#666;
  margin-top:7px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:700;
}

.cart-price{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:7px;
  background:#eee;
  cursor:pointer;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:25px;
  font-weight:800;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #eee;
}

.payment-title,
.customer-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:800;
  font-size:17px;
}

.payments{
  display:grid;
  gap:9px;
}

.payment{
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.customer-box{
  position:relative;
}

.customer-row{
  display:flex;
  gap:8px;
}

.customer-search{
  flex:1;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:15px;
  min-width:0;
  background:#fff;
}

.customer-search:focus{
  outline:none;
  border-color:#2563eb;
}

.add-client{
  border:none;
  background:#2563eb;
  color:#fff;
  padding:0 14px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.customer-results{
  margin-top:8px;
  display:none;
  border:2px solid #ddd;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;
  left:0;
  right:0;
  z-index:100;
}

.customer-result{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid #eee;
  background:#fff;
  padding:13px;
  text-align:left;
  cursor:pointer;
}

.customer-result:hover{
  background:#f3f4f6;
}

.customer-result strong{
  display:block;
  font-size:15px;
}

.customer-result small{
  display:block;
  color:#6b7280;
  margin-top:4px;
}

.selected-customer{
  margin-top:8px;
  padding:12px;
  border-radius:9px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-size:14px;
  font-weight:600;
}

.clear-customer{
  border:none;
  background:none;
  color:#dc2626;
  font-weight:700;
  cursor:pointer;
  margin-left:8px;
}

.general-customer{
  margin-top:8px;
  padding:13px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-weight:700;
  cursor:pointer;
}

.charge,
.account{
  width:100%;
  margin-top:15px;
  padding:16px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.account{
  margin-top:10px;
  background:#f59e0b;
}

.charge:disabled,
.account:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

.offline-mode{
  border:2px solid #f59e0b;
}

button{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:950px){

  .navigation{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  header h1{
    font-size:25px;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .business-btn{
    flex:1;
  }

  .layout{
    gap:15px;
  }

  .card{
    padding:16px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:15px 12px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:20px;
  }

  .customer-row{
    flex-direction:column;
  }

  .add-client{
    padding:12px;
  }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

/* =====================================================
   ESTADO
===================================================== */

let supabaseClient = null;

let currentBusiness =
"BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId =
null;

let selectedCustomerId =
null;

/* =====================================================
   CACHE OFFLINE
===================================================== */

const CACHE_KEY =
"POS_OFFLINE_CACHE_V2";

const QUEUE_KEY =
"POS_OFFLINE_QUEUE_V2";

/* =====================================================
   COLA OFFLINE
===================================================== */

function getOfflineQueue(){

  try{

    const raw =
      localStorage.getItem(
        QUEUE_KEY
      );

    if(!raw){

      return [];

    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch(error){

    console.warn(
      "Cola offline inválida:",
      error
    );

    return [];

  }

}

function saveOfflineQueue(
  queue
){

  try{

    localStorage.setItem(
      QUEUE_KEY,
      JSON.stringify(queue)
    );

    updateSyncBox();

  }

  catch(error){

    console.error(
      "No se pudo guardar la cola offline:",
      error
    );

    showStatus(
      "No se pudo guardar la venta en este dispositivo.",
      "error"
    );

  }

}

function addToOfflineQueue(
  sale
){

  const queue =
    getOfflineQueue();

  queue.push({

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : (
        Date.now() +
        "-" +
        Math.random()
      ),

    createdAt:
      new Date().toISOString(),

    ...sale

  });

  saveOfflineQueue(
    queue
  );

}

function updateSyncBox(){

  const queue =
    getOfflineQueue();

  const box =
    $("syncBox");

  const number =
    $("syncNumber");

  if(!box || !number){

    return;

  }

  number.textContent =
    queue.length;

  if(queue.length > 0){

    box.classList.add(
      "visible"
    );

  }

  else{

    box.classList.remove(
      "visible"
    );

  }

}

/* =====================================================
   CACHE
===================================================== */

function saveOfflineCache(){

  try{

    const data = {

      products,

      payments,

      customers,

      currentBusiness,

      savedAt:
        new Date().toISOString()

    };

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(data)
    );

  }

  catch(error){

    console.warn(
      "No se pudo guardar cache:",
      error
    );

  }

}

function loadOfflineCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if(!raw){

      return false;

    }

    const data =
      JSON.parse(raw);

    if(!data){

      return false;

    }

    products =
      Array.isArray(data.products)
      ? data.products
      : [];

    payments =
      Array.isArray(data.payments)
      ? data.payments
      : [];

    customers =
      Array.isArray(data.customers)
      ? data.customers
      : [];

    return true;

  }

  catch(error){

    console.warn(
      "Cache offline inválido:",
      error
    );

    return false;

  }

}

/* =====================================================
   UTILIDADES
===================================================== */

function $(id){

  return document.getElementById(id);

}

function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);

}

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}

function showStatus(
  message,
  type="error"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}

function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}

/* =====================================================
   ESTADO DE CONEXIÓN
===================================================== */

function showOfflineStatus(){

  showStatus(

    "📴 Modo offline\n\n" +

    "El POS está funcionando con los datos guardados en este dispositivo. " +

    "Las ventas nuevas se guardarán localmente y se sincronizarán cuando sea posible.",

    "offline"

  );

}

function showSupabaseProblemStatus(
  error
){

  const message =
    error?.message ||
    String(error || "");

  showStatus(

    "⚠️ No fue posible actualizar los datos desde Supabase.\n\n" +

    "El POS seguirá utilizando la información guardada localmente.\n\n" +

    "Detalle: " +
    message,

    "offline"

  );

}

function showOnlineStatus(){

  clearStatus();

}

/* =====================================================
   DETECTAR ERRORES DE RED
===================================================== */

function isNetworkError(
  error
){

  if(!navigator.onLine){

    return true;

  }

  const message =
    String(
      error?.message ||
      error ||
      ""
    ).toLowerCase();

  return(

    message.includes(
      "failed to fetch"
    ) ||

    message.includes(
      "networkerror"
    ) ||

    message.includes(
      "network error"
    ) ||

    message.includes(
      "fetch failed"
    ) ||

    message.includes(
      "load failed"
    ) ||

    message.includes(
      "offline"
    )

  );

}

/* =====================================================
   SUPABASE
===================================================== */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    throw new Error(
      "No se pudo cargar Supabase."
    );

  }

  supabaseClient =
    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

}

/* =====================================================
   CARGAR DATOS
===================================================== */

async function loadBusinessData(){

  $("products").innerHTML =
    '<div class="empty">' +
    'Cargando productos...' +
    '</div>';

  $("payments").innerHTML =
    '<div class="empty">' +
    'Cargando métodos de pago...' +
    '</div>';

  const businessId =
    BUSINESS_IDS[
      currentBusiness
    ];

  try{

    /*
      IMPORTANTE:

      navigator.onLine NO garantiza que Supabase
      esté disponible.

      Por eso primero intentamos realmente
      consultar Supabase.
    */

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("customers")

        .select(
          "id,name,phone,notes"
        )

        .order("name")

    ]);

    if(productsResult.error){

      throw productsResult.error;

    }

    if(paymentsResult.error){

      throw paymentsResult.error;

    }

    if(customersResult.error){

      throw customersResult.error;

    }

    products =
      productsResult.data || [];

    payments =
      paymentsResult.data || [];

    customers =
      customersResult.data || [];

    saveOfflineCache();

    if(
      !payments.some(
        p =>
          p.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }

    if(
      !customers.some(
        c =>
          c.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

    showOnlineStatus();

    /*
      Después de actualizar datos intentamos
      sincronizar las ventas pendientes.
    */

    await syncOfflineQueue();

  }

  catch(error){

    console.warn(
      "No se pudo cargar Supabase:",
      error
    );

    /*
      Si realmente estamos offline:
      usamos cache silenciosamente.

      Si sí hay Internet pero Supabase responde
      con un error, NO decimos que no hay Internet.
    */

    if(
      loadOfflineCache()
    ){

      if(
        !payments.some(
          p =>
            p.id ===
            selectedPaymentId
        )
      ){

        selectedPaymentId =
          payments[0]?.id ||
          null;

      }

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      if(
        isNetworkError(error)
      ){

        showOfflineStatus();

      }

      else{

        showSupabaseProblemStatus(
          error
        );

      }

      updateSyncBox();

    }

    else{

      products = [];

      payments = [];

      customers = [];

      $("products").innerHTML =
        '<div class="empty">' +
        'No hay datos guardados para trabajar offline.' +
        '</div>';

      $("payments").innerHTML =
        '<div class="empty">' +
        'No hay métodos de pago guardados.' +
        '</div>';

      if(
        isNetworkError(error)
      ){

        showStatus(

          "📴 No hay conexión disponible y todavía no existe información guardada offline.",

          "offline"

        );

      }

      else{

        showStatus(

          "⚠️ Supabase respondió con un error.\n\n" +

          (
            error?.message ||
            String(error)
          ),

          "error"

        );

      }

    }

  }

}

/* =====================================================
   PRODUCTOS
===================================================== */

function renderProducts(){

  const container =
    $("products");

  container.innerHTML =
    "";

  if(!products.length){

    container.innerHTML =
      '<div class="empty">' +
      'No hay productos disponibles.' +
      '</div>';

    return;

  }

  products.forEach(
    product => {

   CARRITO
===================================================== */

function addToCart(product){

  const stock =
    Number(
      product.stock || 0
    );

  if(stock <= 0){

    showStatus(
      "Este producto está agotado.",
      "error"
    );

    return;

  }

  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );

  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia.",
        "error"
      );

    }

  }

  else{

    cart.push({

      ...product,

      quantity:1

    });

  }

  renderCart();

}

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id === id
    );

  if(!item){

    return;

  }

  const product =
    products.find(
      p =>
        p.id === id
    );

  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  const newQuantity =
    item.quantity +
    amount;

  if(newQuantity > max){

    showStatus(
      "No hay suficiente existencia disponible.",
      "error"
    );

    return;

  }

  item.quantity =
    newQuantity;

  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !== id
      );

  }

  renderCart();

}

function getCartTotal(){

  return cart.reduce(

    (sum,item) =>

      sum +

      Number(
        item.price
      ) *

      Number(
        item.quantity
      ),

    0

  );

}

function renderCart(){

  const container =
    $("cart");

  container.innerHTML =
    "";

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      'El carrito está vacío' +
      '</div>';

    $("total").textContent =
      "$0.00";

    return;

  }

  cart.forEach(
    item => {

      const subtotal =

        Number(
          item.price
        ) *

        Number(
          item.quantity
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cart-item";

      const info =
        document.createElement(
          "div"
        );

      info.innerHTML =

        '<div class="cart-name">' +

        escapeHTML(
          item.name
        ) +

        '</div>' +

        '<div class="cart-price">' +

        money(
          item.price
        ) +

        ' c/u</div>';

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "quantity";

      const minus =
        document.createElement(
          "button"
        );

      minus.type =
        "button";

      minus.textContent =
        "−";

      minus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            -1
          )
      );

      const quantity =
        document.createElement(
          "span"
        );

      quantity.textContent =
        item.quantity;

      const plus =
        document.createElement(
          "button"
        );

      plus.type =
        "button";

      plus.textContent =
        "+";

      plus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            1
          )
      );

      controls.append(
        minus,
        quantity,
        plus
      );

      info.appendChild(
        controls
      );

      const subtotalElement =
        document.createElement(
          "strong"
        );

      subtotalElement.textContent =
        money(
          subtotal
        );

      row.append(
        info,
        subtotalElement
      );

      container.appendChild(
        row
      );

    }
  );

  $("total").textContent =
    money(
      getCartTotal()
    );

}

/* =====================================================
   CREAR OBJETO DE VENTA
===================================================== */

function buildSalePayload(
  isPending
){

  const items =
    cart.map(
      item => ({

        product_id:
          item.id,

        description:
          item.name,

        quantity:
          Number(
            item.quantity
          ),

        unit_price:
          Number(
            item.price
          ),

        subtotal:
          Number(
            item.price
          ) *
          Number(
            item.quantity
          )

      })
    );

  return {

    businessId:
      BUSINESS_IDS[
        currentBusiness
      ],

    customerId:
      selectedCustomerId ||
      null,

    paymentMethodId:
      isPending
      ? null
      : selectedPaymentId,

    items,

    isPending,

    businessName:
      currentBusiness

  };

}

/* =====================================================
   ENVIAR VENTA A SUPABASE
===================================================== */

async function sendSaleToSupabase(
  sale
){

  const result =
    await supabaseClient.rpc(
      "register_sale",
      {

        p_business_id:
          sale.businessId,

        p_customer_id:
          sale.customerId,

        p_payment_method_id:
          sale.paymentMethodId,

        p_items:
          sale.items,

        p_is_pending:
          sale.isPending

      }
    );

  if(result.error){

    throw result.error;

  }

  return result;

}

/* =====================================================
   SINCRONIZAR COLA OFFLINE
===================================================== */

let syncingQueue =
false;

async function syncOfflineQueue(){

  if(syncingQueue){

    return;

  }

  if(!navigator.onLine){

    updateSyncBox();

    return;

  }

  const queue =
    getOfflineQueue();

  if(!queue.length){

    updateSyncBox();

    return;

  }

  if(!supabaseClient){

    return;

  }

  syncingQueue =
    true;

  showStatus(

    "🔄 Hay " +
    queue.length +
    " venta(s) pendiente(s).\n\n" +
    "Intentando sincronizar...",

    "sync"

  );

  const remaining = [];

  for(
    const sale of queue
  ){

    try{

      await sendSaleToSupabase(
        sale
      );

      /*
        Venta sincronizada correctamente.
        No se agrega a remaining.
      */

    }

    catch(error){

      console.warn(
        "No se pudo sincronizar venta:",
        error
      );

      /*
        Si todavía falla, permanece en cola.
      */

      remaining.push(
        sale
      );

    }

  }

  saveOfflineQueue(
    remaining
  );

  syncingQueue =
    false;

  if(!remaining.length){

    showStatus(

      "✅ Todas las ventas pendientes fueron sincronizadas correctamente.",

      "ok"

    );

    /*
      Actualizamos inventario y datos desde Supabase.
    */

    setTimeout(
      async () => {

        await refreshDataSilently();

      },
      500
    );

  }

  else{

    if(
      isNetworkError(
        new Error(
          "sync"
        )
      )
    ){

      showOfflineStatus();

    }

    else{

      showStatus(

        "⚠️ Algunas ventas todavía no pudieron sincronizarse.\n\n" +

        "Permanecen guardadas en este dispositivo y se volverán a intentar automáticamente.",

        "offline"

      );

    }

  }

}

/* =====================================================
   ACTUALIZAR DATOS SIN MOLESTAR AL USUARIO
===================================================== */

async function refreshDataSilently(){

  try{

    const businessId =
      BUSINESS_IDS[
        currentBusiness
      ];

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("customers")

        .select(
          "id,name,phone,notes"
        )

        .order("name")

    ]);

    if(productsResult.error){

      throw productsResult.error;

    }

    if(paymentsResult.error){

      throw paymentsResult.error;

    }

    if(customersResult.error){

      throw customersResult.error;

    }

    products =
      productsResult.data || [];

    payments =
      paymentsResult.data || [];

    customers =
      customersResult.data || [];

    saveOfflineCache();

    renderProducts();

    renderPayments();

    renderSelectedCustomer();

  }

  catch(error){

    console.warn(
      "No se pudieron actualizar datos:",
      error
    );

  }

}

/* =====================================================
   REGISTRAR VENTA
===================================================== */

async function registerSale(
  isPending
){

  clearStatus();

  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "error"
    );

    return;

  }

  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago.",
      "error"
    );

    return;

  }

  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente.",
      "error"
    );

    return;

  }

  const sale =
    buildSalePayload(
      isPending
    );

  const total =
    getCartTotal();

  const customer =
    customers.find(
      c =>
        c.id ===
        selectedCustomerId
    );

  const paymentName =
    payments.find(
      p =>
        p.id ===
        selectedPaymentId
    )?.name ||
    "Pago";

  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";

  try{

    /*
      Si no hay Internet:
      guardar directamente en la cola.
    */

    if(!navigator.onLine){

      addToOfflineQueue(
        sale
      );

      updateLocalStock();

      cart = [];

      selectedCustomerId =
        null;

      $("customerSearch").value =
        "";

      $("customerResults").innerHTML =
        "";

      $("customerResults").style.display =
        "none";

      renderSelectedCustomer();

      renderCart();

      showOfflineStatus();

      alert(

        "📴 Venta guardada en este dispositivo.\n\n" +

        "Total: " +
        money(total) +

        "\n\n" +

        "Se sincronizará automáticamente cuando vuelva Internet."

      );

      return;

    }

    /*
      Con Internet intentamos enviarla inmediatamente.
    */

    try{

      await sendSaleToSupabase(
        sale
      );

    }

    catch(error){

      /*
        Aquí está una de las correcciones importantes.

        Si Supabase falla aunque el teléfono tenga Internet,
        NO vamos a decir "no tienes Internet".

        La venta queda guardada localmente.
      */

      console.warn(
        "No se pudo enviar la venta:",
        error
      );

      addToOfflineQueue(
        sale
      );

      updateLocalStock();

      cart = [];

      selectedCustomerId =
        null;

      $("customerSearch").value =
        "";

      $("customerResults").innerHTML =
        "";

      $("customerResults").style.display =
        "none";

      renderSelectedCustomer();

      renderCart();

      showStatus(

        "⚠️ No fue posible enviar la operación a Supabase.\n\n" +

        "La venta quedó guardada localmente y se intentará sincronizar automáticamente.\n\n" +

        "Internet detectado: " +

        (
          navigator.onLine
          ? "SÍ"
          : "NO"
        ),

        "offline"

      );

      alert(

        "⚠️ La venta quedó guardada localmente.\n\n" +

        "No se perdió la venta.\n\n" +

        "El sistema intentará sincronizarla automáticamente."

      );

      return;

    }

    /*
      Venta enviada correctamente.
    */

    updateLocalStock();

    alert(

      (

        isPending
        ? "Cuenta registrada"
        : "Venta registrada"

      ) +

      "\n\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(
        total
      ) +

      (

        isPending
        ? ""
        : "\nPago: " +
          paymentName

      )

    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    renderCart();

    await refreshDataSilently();

    showStatus(

      isPending

      ? "✅ Cuenta guardada correctamente."

      : "✅ Venta guardada correctamente.",

      "ok"

    );

  }

  catch(error){

    console.error(
      "registerSale:",
      error
    );

    showStatus(

      "No se pudo completar la operación.\n\n" +

      (
        error?.message ||
        String(error)
      ),

      "error"

    );

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      originalText;

    updateSyncBox();

  }

}

/* =====================================================
   ACTUALIZAR STOCK LOCALMENTE
===================================================== */

function updateLocalStock(){

  cart.forEach(
    item => {

      const product =
        products.find(
          p =>
            p.id ===
            item.id
        );

      if(!product){

        return;

      }

      const currentStock =
        Number(
          product.stock || 0
        );

      const quantity =
        Number(
          item.quantity || 0
        );

      product.stock =
        Math.max(
          0,
          currentStock -
          quantity
        );

    }
  );

  saveOfflineCache();

  renderProducts();

}

          error => {

            console.warn(
              "No se pudo registrar Service Worker:",
              error
            );

          }
        );

    }
  );

}

/* =====================================================
   INICIO
===================================================== */

async function startApp(){

  updateSyncBox();

  try{

    initializeSupabase();

  }

  catch(error){

    console.error(
      "Supabase:",
      error
    );

  }

  /*
    Si tenemos cache, podemos mostrarla
    inmediatamente mientras intentamos
    actualizar desde Internet.
  */

  const hasCache =
    loadOfflineCache();

  if(hasCache){

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

  }

  /*
    Intentamos cargar datos reales.
  */

  await loadBusinessData();

  /*
    Si quedaron ventas pendientes,
    intentamos sincronizarlas.
  */

  await syncOfflineQueue();

  updateSyncBox();

}

startApp();

</script>
