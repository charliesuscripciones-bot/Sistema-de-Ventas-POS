<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ventas POS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      font-size: 13px;
      opacity: .7;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .businesses {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .business-btn {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      background: white;
      border: 1px solid #ddd;
      font-weight: 600;
      cursor: pointer;
    }

    .business-btn.active {
      background: #111827;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      background: white;
    }

    .product:hover {
      border-color: #111827;
    }

    .product-name {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
    }

    .stock {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-name {
      font-weight: 600;
    }

    .cart-price {
      font-size: 13px;
      color: #666;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .quantity button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: #eee;
      cursor: pointer;
      font-size: 18px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 700;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid #eee;
    }

    .payment-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .payments {
      display: grid;
      gap: 8px;
    }

    .payment {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      cursor: pointer;
    }

    .payment.active {
      background: #111827;
      color: white;
    }

    .charge {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 30px 10px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🧾 Sistema de Ventas POS</h1>
  <p>Administración de negocios y ventas</p>
</header>

<div class="container">

  <div class="businesses">
    <button class="business-btn active" onclick="changeBusiness('BakeQuiri', this)">
      BakeQuiri
    </button>

    <button class="business-btn" onclick="changeBusiness('SpicyRoll', this)">
      SpicyRoll
    </button>
  </div>

  <div class="layout">

    <div class="card">
      <h2>Productos</h2>
      <div id="products" class="products"></div>
    </div>

    <div class="card">

      <h2>🛒 Carrito</h2>

      <div id="cart"></div>

      <div class="total">
        <span>Total</span>
        <span id="total">$0.00</span>
      </div>

      <div class="payment-title">
        Método de pago
      </div>

      <div id="payments" class="payments"></div>

      <button class="charge" onclick="chargeSale()">
        COBRAR
      </button>

    </div>

  </div>
</div>

<script>

const businesses = {

  BakeQuiri: {
    products: [
      {
        id: "521c6278-6fe3-40f2-9ee1-70c9e6155eb2",
        name: "Panquecito de Elote",
        price: 25,
        stock: 20
      },
      {
        id: "8c77f084-c4f0-41d7-84b6-98bbb9697d96",
        name: "Panquecito de Plátano",
        price: 25,
        stock: 20
      }
    ],

    payments: [
      "Clip — Tap to Pay",
      "Clip — Transferencia",
      "Efectivo"
    ]
  },

  SpicyRoll: {
    products: [
      {
        id: "899c8809-0dc4-47f3-85dc-375a7d8825be",
        name: "Onigiri de Res con Tocino",
        price: 60,
        stock: 50
      }
    ],

    payments: [
      "BBVA",
      "Clip — Tap to Pay",
      "Clip — Transferencia",
      "Efectivo"
    ]
  }

};

let currentBusiness = "BakeQuiri";
let cart = [];
let selectedPayment = "Efectivo";

function renderProducts() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  businesses[currentBusiness].products.forEach(product => {

    const div = document.createElement("div");

    div.className = "product";

    div.onclick = () => addToCart(product);

    div.innerHTML = `
      <div class="product-name">${product.name}</div>
      <div class="price">$${product.price.toFixed(2)}</div>
      <div class="stock">Existencia: ${product.stock}</div>
    `;

    container.appendChild(div);

  });

}

function renderPayments() {

  const container = document.getElementById("payments");

  container.innerHTML = "";

  businesses[currentBusiness].payments.forEach(payment => {

    const button = document.createElement("button");

    button.className =
      "payment " +
      (payment === selectedPayment ? "active" : "");

    button.innerText = payment;

    button.onclick = () => {

      selectedPayment = payment;

      renderPayments();

    };

    container.appendChild(button);

  });

}

function addToCart(product) {

  const existing = cart.find(item => item.id === product.id);

  if (existing) {

    if (existing.quantity < product.stock) {
      existing.quantity++;
    }

  } else {

    cart.push({
      ...product,
      quantity: 1
    });

  }

  renderCart();

}

function changeQuantity(id, amount) {

  const item = cart.find(item => item.id === id);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.id !== id);
  }

  renderCart();

}

function renderCart() {

  const container = document.getElementById("cart");

  container.innerHTML = "";

  if (cart.length === 0) {

    container.innerHTML =
      `<div class="empty">El carrito está vacío</div>`;

    document.getElementById("total").innerText = "$0.00";

    return;
  }

  let total = 0;

  cart.forEach(item => {

    const subtotal = item.price * item.quantity;

    total += subtotal;

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div>
        <div class="cart-name">${item.name}</div>
        <div class="cart-price">
          $${item.price.toFixed(2)} c/u
        </div>

        <div class="quantity">

          <button onclick="changeQuantity('${item.id}', -1)">
            −
          </button>

          <span>${item.quantity}</span>

          <button onclick="changeQuantity('${item.id}', 1)">
            +
          </button>

        </div>

      </div>

      <strong>
        $${subtotal.toFixed(2)}
      </strong>

    `;

    container.appendChild(div);

  });

  document.getElementById("total").innerText =
    "$" + total.toFixed(2);

}

function changeBusiness(name, button) {

  currentBusiness = name;

  cart = [];

  selectedPayment =
    businesses[name].payments[0];

  document.querySelectorAll(".business-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderProducts();
  renderPayments();
  renderCart();

}

function chargeSale() {

  if (cart.length === 0) {

    alert("Agrega al menos un producto.");

    return;
  }

  let total = 0;

  cart.forEach(item => {
    total += item.price * item.quantity;
  });

  const sale = {

    id: crypto.randomUUID(),

    business: currentBusiness,

    total: total,

    payment: selectedPayment,

    items: cart.map(item => ({
      product_id: item.id,
      product: item.name,
      quantity: item.quantity,
      unit_price: item.price,
      subtotal: item.price * item.quantity
    })),

    created_at: new Date().toISOString()

  };

  console.log("VENTA:", sale);

  alert(
    "Venta registrada\n\n" +
    currentBusiness +
    "\nTotal: $" +
    total.toFixed(2) +
    "\nPago: " +
    selectedPayment
  );

  cart = [];

  renderCart();

}

renderProducts();
renderPayments();
renderCart();

</script>

</body>
</html>
