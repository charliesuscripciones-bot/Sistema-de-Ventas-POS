<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sistema de Ventas POS</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222}header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:10}header h1{font-size:22px}header p{font-size:13px;opacity:.7;margin-top:4px}.container{max-width:1100px;margin:auto;padding:20px}.businesses{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.business-btn{border:none;padding:12px 18px;border-radius:10px;background:#fff;border:1px solid #ddd;font-weight:600;cursor:pointer}.business-btn.active{background:#111827;color:#fff}.layout{display:grid;grid-template-columns:1fr 380px;gap:20px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.card h2{font-size:18px;margin-bottom:15px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{border:1px solid #ddd;border-radius:12px;padding:15px;cursor:pointer;background:#fff}.product.disabled{opacity:.5;cursor:not-allowed}.product-name{font-weight:600;margin-bottom:8px}.price{font-size:18px;font-weight:700}.stock{font-size:12px;color:#666;margin-top:5px}.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:12px}.cart-name{font-weight:600}.cart-price{font-size:13px;color:#666}.quantity{display:flex;align-items:center;gap:8px;margin-top:6px}.quantity button{width:28px;height:28px;border:none;border-radius:6px;background:#eee;cursor:pointer;font-size:18px}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-top:20px;padding-top:15px;border-top:2px solid #eee}.payment-title{margin-top:20px;margin-bottom:10px;font-weight:600}.payments{display:grid;gap:8px}.payment{padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;cursor:pointer}.payment.active{background:#111827;color:#fff}.charge{width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px;background:#16a34a;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.charge:disabled{opacity:.6;cursor:wait}.empty{color:#777;text-align:center;padding:30px 10px}.status{margin:0 0 15px;padding:10px 12px;border-radius:9px;font-size:13px;display:none}.status.error{display:block;background:#fee2e2;color:#991b1b}.status.ok{display:block;background:#dcfce7;color:#166534}@media(max-width:800px){.layout{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>🧾 Sistema de Ventas POS</h1><p>Administración de negocios y ventas</p></header><div class="container"><div id="status" class="status"></div><div class="businesses"><button class="business-btn active" onclick="changeBusiness('BakeQuiri',this)">BakeQuiri</button><button class="business-btn" onclick="changeBusiness('SpicyRoll',this)">SpicyRoll</button></div><div class="layout"><div class="card"><h2>Productos</h2><div id="products" class="products"></div></div><div class="card"><h2>🛒 Carrito</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">$0.00</span></div><div class="payment-title">Método de pago</div><div id="payments" class="payments"></div><button id="chargeButton" class="charge" onclick="chargeSale()">COBRAR</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://jrxklpstlloeckihcduv.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp",supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const BUSINESS_IDS={BakeQuiri:"c435ee25-6a2b-4134-b3f8-90b38d6bde0c",SpicyRoll:"ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"};let currentBusiness="BakeQuiri",products=[],payments=[],cart=[],selectedPaymentId=null;function money(v){return "$"+Number(v||0).toFixed(2)}function showStatus(m,t="error"){const e=document.getElementById("status");e.textContent=m;e.className="status "+t}function clearStatus(){const e=document.getElementById("status");e.textContent="";e.className="status"}async function loadBusinessData(){clearStatus();const b=BUSINESS_IDS[currentBusiness];const[{data:pr,error:pe},{data:pm,error:me}]=await Promise.all([supabase.from("products").select("id,name,price,cost,stock,active").eq("business_id",b).eq("active",true).order("name"),supabase.from("payment_methods").select("id,name,provider,active").eq("business_id",b).eq("active",true).order("name")]);if(pe)throw new Error("No pude cargar los productos: "+pe.message);if(me)throw new Error("No pude cargar los métodos de pago: "+me.message);products=pr||[];payments=pm||[];if(!payments.some(p=>p.id===selectedPaymentId))selectedPaymentId=payments[0]?.id||null;renderProducts();renderPayments();renderCart()}function renderProducts(){const c=document.getElementById("products");c.innerHTML="";if(!products.length){c.innerHTML='<div class="empty">No hay productos activos para este negocio.</div>';return}products.forEach(p=>{const s=Number(p.stock||0),d=document.createElement("div");d.className="product"+(s<=0?" disabled":"");d.onclick=()=>{if(s>0)addToCart(p)};d.innerHTML=`<div class="product-name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="stock">Existencia: ${s}</div>`;c.appendChild(d)})}function renderPayments(){const c=document.getElementById("payments");c.innerHTML="";if(!payments.length){c.innerHTML='<div class="empty">No hay métodos de pago activos.</div>';return}payments.forEach(p=>{const b=document.createElement("button");b.className="payment "+(p.id===selectedPaymentId?"active":"");b.innerText=p.name;b.onclick=()=>{selectedPaymentId=p.id;renderPayments()};c.appendChild(b)})}function addToCart(p){const x=cart.find(i=>i.id===p.id),s=Number(p.stock||0);if(x){if(x.quantity<s)x.quantity++;else showStatus("No puedes agregar más unidades que la existencia disponible.")}else if(s>0)cart.push({...p,quantity:1});renderCart()}function changeQuantity(id,a){const x=cart.find(i=>i.id===id);if(!x)return;const max=Number(products.find(p=>p.id===id)?.stock||x.stock||0);x.quantity+=a;if(x.quantity>max)x.quantity=max;if(x.quantity<=0)cart=cart.filter(i=>i.id!==id);renderCart()}function renderCart(){const c=document.getElementById("cart");c.innerHTML="";if(!cart.length){c.innerHTML='<div class="empty">El carrito está vacío</div>';document.getElementById("total").innerText="$0.00";return}let total=0;cart.forEach(i=>{const sub=Number(i.price)*Number(i.quantity);total+=sub;const d=document.createElement("div");d.className="cart-item";d.innerHTML=`<div><div class="cart-name">${esc(i.name)}</div><div class="cart-price">${money(i.price)} c/u</div><div class="quantity"><button onclick="changeQuantity('${i.id}',-1)">−</button><span>${i.quantity}</span><button onclick="changeQuantity('${i.id}',1)">+</button></div></div><strong>${money(sub)}</strong>`;c.appendChild(d)});document.getElementById("total").innerText=money(total)}function changeBusiness(n,b){currentBusiness=n;cart=[];selectedPaymentId=null;document.querySelectorAll(".business-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");loadBusinessData().catch(e=>showStatus(e.message))}async function chargeSale(){clearStatus();if(!cart.length){showStatus("Agrega al menos un producto.");return}if(!selectedPaymentId){showStatus("Selecciona un método de pago.");return}const btn=document.getElementById("chargeButton");btn.disabled=true;btn.textContent="REGISTRANDO...";try{const items=cart.map(i=>({product_id:i.id,description:i.name,quantity:Number(i.quantity),unit_price:Number(i.price),subtotal:Number(i.price)*Number(i.quantity)}));const{data,error}=await supabase.rpc("register_sale",{p_business_id:BUSINESS_IDS[currentBusiness],p_customer_id:null,p_payment_method_id:selectedPaymentId,p_items:items,p_is_pending:false});if(error)throw error;const pay=payments.find(p=>p.id===selectedPaymentId)?.name||"Pago",total=items.reduce((s,i)=>s+i.subtotal,0);alert("Venta registrada\n\n"+currentBusiness+"\nTotal: "+money(total)+"\nPago: "+pay);cart=[];await loadBusinessData();showStatus("Venta guardada correctamente en Supabase.","ok");console.log("register_sale response:",data)}catch(e){console.error(e);showStatus("No se pudo registrar la venta: "+(e.message||e))}finally{btn.disabled=false;btn.textContent="COBRAR"}}function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}loadBusinessData().catch(e=>showStatus(e.message||"No se pudo conectar con Supabase."));</script></body></html>
