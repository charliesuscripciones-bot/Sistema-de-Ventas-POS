<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:22px;
}

header p{
  font-size:13px;
  opacity:.7;
  margin-top:4px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.businesses{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn{
  border:none;
  padding:12px 18px;
  border-radius:10px;
  background:#fff;
  border:1px solid #ddd;
  font-weight:600;
  cursor:pointer;
}

.business-btn.active{
  background:#111827;
  color:#fff;
}

.layout{
  display:grid;
  grid-template-columns:1fr 380px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
  font-size:18px;
  margin-bottom:15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
  background:#fff;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:600;
  margin-bottom:8px;
}

.price{
  font-size:18px;
  font-weight:700;
}

.stock{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:600;
}

.cart-price{
  font-size:13px;
  color:#666;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:6px;
  background:#eee;
  cursor:pointer;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:700;
  margin-top:20px;
  padding-top:15px;
  border-top:2px solid #eee;
}

.payment-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:600;
}

.payments{
  display:grid;
  gap:8px;
}

.payment{
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  cursor:pointer;
  text-align:left;
}

.payment.active{
  background:#111827;
  color:#fff;
}

.charge{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.charge:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.status{
  margin:0 0 15px;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  display:none;
  font-weight:600;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.warn{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.pending{
  margin:0 0 15px;
  padding:14px;
  border-radius:12px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-weight:700;
  display:none;
}

.pending.visible{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.pending-number{
  background:#2563eb;
  color:white;
  min-width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:800;
}

.offline-badge{
  display:inline-block;
  margin-left:6px;
  padding:4px 8px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-size:11px;
}

.online-badge{
  display:inline-block;
  margin-left:6px;
  padding:4px 8px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:11px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

</style>

</head>


<body>


<header>

  <h1>

  </h1>

  <p>

</header>


<div class="container">


  <div

<!-- =======================================================

======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   NEGOCIOS
========================================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   ESTADO
========================================================= */

let currentBusiness =
"BakeQuiri";

let products =
[];

let payments =
[];

let cart =
[];

let selectedPaymentId =
null;


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEYS = {

  products:
  "pos_products_cache_v2",

  payments:
  "pos_payments_cache_v2",

  pending:
  "pos_pending_sales_v2"

};


/* =========================================================
   HELPERS
========================================================= */

const $ =
id =>
document.getElementById(id);


const money =
value =>
"$" +
Number(value || 0).toFixed(2);


function isOnline(){

  return navigator.onLine;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "error"
){

  const element =
  $("status");


  element.textContent =
  message;


  element.className =
  "status " +
  type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================================
   CACHE LOCAL
========================================================= */

function getCachedProducts(
  business
){

  try{

    const cache =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEYS.products
      ) || "{}"
    );


    return cache[
      business
    ] || [];

  }

  catch(error){

    console.warn(
      "Error leyendo productos locales:",
      error
    );

    return [];

  }

}


function saveCachedProducts(
  business,
  data
){

  try{

    const cache =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEYS.products
      ) || "{}"
    );


    cache[
      business
    ] =
    data;


    localStorage.setItem(
      STORAGE_KEYS.products,
      JSON.stringify(cache)
    );

  }

  catch(error){

    console.warn(
      "No se pudieron guardar productos:",
      error
    );

  }

}


function getCachedPayments(
  business
){

  try{

    const cache =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEYS.payments
      ) || "{}"
    );


    return cache[
      business
    ] || [];

  }

  catch(error){

    console.warn(
      "Error leyendo métodos locales:",
      error
    );

    return [];

  }

}


function saveCachedPayments(
  business,
  data
){

  try{

    const cache =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEYS.payments
      ) || "{}"
    );


    cache[
      business
    ] =
    data;


    localStorage.setItem(
      STORAGE_KEYS.payments,
      JSON.stringify(cache)
    );

  }

  catch(error){

    console.warn(
      "No se pudieron guardar métodos:",
      error
    );

  }

}


/* =========================================================
   COLA DE VENTAS
========================================================= */

function getPendingSales(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEYS.pending
      ) || "[]"
    );

  }

  catch(error){

    console.warn(
      "Error leyendo cola:",
      error
    );

    return [];

  }

}


function savePendingSales(
  sales
){

  localStorage.setItem(
    STORAGE_KEYS.pending,
    JSON.stringify(
      sales
    )
  );

  updatePendingUI();

}


/* =========================================================
   UI DE PENDIENTES
========================================================= */

function updatePendingUI(){

  const pending =
  getPendingSales();


  const box =
  $("pendingBox");


  const count =
  $("pendingCount");


  count.textContent =
  pending.length;


  if(
    pending.length > 0
  ){

    box.classList.add(
      "visible"
    );

  }

  else{

    box.classList.remove(
      "visible"
    );

  }

}


/* =========================================================
   CARGAR DATOS DEL NEGOCIO
========================================================= */

async function loadBusinessData(){

  clearStatus();


  $("products").innerHTML =
  '<div class="empty">Cargando productos...</div>';


  $("payments").innerHTML =
  '<div class="empty">Cargando métodos de pago...</div>';


  const businessId =
  BUSINESS_IDS[
    currentBusiness
  ];


  try{

    /*
    =======================================================
    INTENTAR INTERNET
    =======================================================
    */

    if(
      isOnline()
    ){

      const [
        productsResult,
        paymentsResult
      ] =
      await Promise.all([

        supabaseClient

          .from("products")

          .select(
            "id,name,price,cost,stock,active"
          )

          .eq(
            "business_id",
            businessId
          )

          .eq(
            "active",
            true
          )

          .order(
            "name"
          ),


        supabaseClient

          .from("payment_methods")

          .select(
            "id,name,provider,active"
          )

          .eq(
            "business_id",
            businessId
          )

          .eq(
            "active",
            true
          )

          .order(
            "name"
          )

      ]);


      if(
        productsResult.error
      ){

        throw new Error(
          "No pude cargar los productos: " +
          productsResult.error.message
        );

      }


      if(
        paymentsResult.error
      ){

        throw new Error(
          "No pude cargar los métodos de pago: " +
          paymentsResult.error.message
        );

      }


      products =
      productsResult.data ||
      [];


      payments =
      paymentsResult.data ||
      [];


      /*
      Guardamos copia local.
      */

      saveCachedProducts(
        currentBusiness,
        products
      );


      saveCachedPayments(
        currentBusiness,
        payments
      );


    }

    else{

      /*
      =====================================================
      SIN INTERNET
      =====================================================
      */

      products =
      getCachedProducts(
        currentBusiness
      );


      payments =
      getCachedPayments(
        currentBusiness
      );


      if(
        !products.length
      ){

        throw new Error(
          "No hay productos guardados para trabajar offline. Abre el POS con Internet al menos una vez."
        );

      }

    }


    /*
    =======================================================
    MÉTODO DE PAGO
    =======================================================
    */

    if(
      !payments.some(
        payment =>
        payment.id ===
        selectedPaymentId
      )
    ){

      selectedPaymentId =
      payments[0]?.id ||
      null;

    }


    renderProducts();

    renderPayments();

    renderCart();

    updatePendingUI();


    /*
    =======================================================
    ESTADO
    =======================================================
    */

    if(
      isOnline()
    ){

      showStatus(
        "Conectado. Datos actualizados.",
        "ok"
      );

    }

    else{

      showStatus(
        "Modo OFFLINE. Puedes continuar registrando ventas.",
        "warn"
      );

    }


  }

  catch(error){

    console.error(
      "loadBusinessData:",
      error
    );


    /*
    =======================================================
    ÚLTIMO INTENTO: CACHE
    =======================================================
    */

    products =
    getCachedProducts(
      currentBusiness
    );


    payments =
    getCachedPayments(
      currentBusiness
    );


    if(
      products.length
    ){

      if(
        !payments.some(
          payment =>
          payment.id ===
          selectedPaymentId
        )
      ){

        selectedPaymentId =
        payments[0]?.id ||
        null;

      }


      renderProducts();

      renderPayments();

      renderCart();

      showStatus(
        "Trabajando con los datos guardados en el dispositivo.",
        "warn"
      );

    }

    else{

      $("products").innerHTML =
      '<div class="empty">' +
      "No hay datos disponibles offline." +
      "</div>";


      $("payments").innerHTML =
      '<div class="empty">' +
      "No hay métodos de pago guardados." +
      "</div>";


      showStatus(
        error.message ||
        "No se pudo cargar el POS.",
        "error"
      );

    }

  }

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

  const container =
  $("products");


  container.innerHTML =
  "";


  if(
    !products.length
  ){

    container.innerHTML =
    '<div class="empty">' +
    "No hay productos activos para este negocio." +
    "</div>";

    return;

  }


  products.forEach(
    product => {

      const stock =
      Number(
        product.stock || 0
      );


      const button =
      document.createElement(
        "button"
      );


      button.type =
      "button";


      button.className =
      "product" +
      (
        stock <= 0
        ? " disabled"
        : ""
      );


      button.disabled =
      stock <= 0;


      button.innerHTML =
      '<div class="product-name">' +
      esc(product.name) +
      "</div>" +

      '<div class="price">' +
      money(product.price) +
      "</div>" +

      '<div class="stock">' +
      "Existencia: " +
      stock +
      "</div>";


      button.addEventListener(
        "click",
        () =>
        addToCart(
          product
        )
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   MÉTODOS DE PAGO
========================================================= */

function renderPayments(){

  const container =
  $("payments");


  container.innerHTML =
  "";


  if(
    !payments.length
  ){

    container.innerHTML =
    '<div class="empty">' +
    "No hay métodos de pago activos." +
    "</div>";

    return;

  }


  payments.forEach(
    payment => {

      const button =
      document.createElement(
        "button"
      );


      button.type =
      "button";


      button.className =
      "payment" +
      (
        payment.id ===
        selectedPaymentId
        ? " active"
        : ""
      );


      button.textContent =
      payment.name;


      button.addEventListener(
        "click",
        () => {

          selectedPaymentId =
          payment.id;

          renderPayments();

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   CARRITO
========================================================= */

function addToCart(
  product
){

  const stock =
  Number(
    product.stock || 0
  );


  const item =
  cart.find(
    i =>
    i.id ===
    product.id
  );


  if(
    item
  ){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia disponible.",
        "warn"
      );

    }

  }

  else if(
    stock > 0
  ){

    cart.push({

      ...product,

      quantity:1

    });

  }


  renderCart();

}


function changeQuantity(
  id,
  amount
){

  const item =
  cart.find(
    i =>
    i.id ===
    id
  );


  if(
    !item
  ){

    return;

  }


  const product =
  products.find(
    p =>
    p.id ===
    id
  );


  const max =
  Number(
    product?.stock ??
    item.stock ??
    0
  );


  item.quantity +=
  amount;


  if(
    item.quantity >
    max
  ){

    item.quantity =
    max;

  }


  if(
    item.quantity <=
    0
  ){

    cart =
    cart.filter(
      i =>
      i.id !==
      id
    );

  }


  renderCart();

}


function renderCart(){

  const container =
  $("cart");


  container.innerHTML =
  "";


  if(
    !cart.length
  ){

    container.innerHTML =
    '<div class="empty">' +
    "El carrito está vacío" +
    "</div>";


    $("total").textContent =
    "$0.00";


    return;

  }


  let total =
  0;


  cart.forEach(
    item => {

      const subtotal =
      Number(
        item.price
      ) *
      Number(
        item.quantity
      );


      total +=
      subtotal;


      const row =
      document.createElement(
        "div"
      );


      row.className =
      "cart-item";


      const info =
      document.createElement(
        "div"
      );


      info.innerHTML =
      '<div class="cart-name">' +
      esc(item.name) +
      "</div>" +

      '<div class="cart-price">' +
      money(item.price) +
      " c/u</div>";


      const controls =
      document.createElement(
        "div"
      );


      controls.className =
      "quantity";


      const minus =
      document.createElement(
        "button"
      );


      minus.type =
      "button";


      minus.textContent =
      "−";


      minus.addEventListener(
        "click",
        () =>
        changeQuantity(
          item.id,
          -1
        )
      );


      const quantity =
      document.createElement(
        "span"
      );


      quantity.textContent =
      item.quantity;


      const plus =
      document.createElement(
        "button"
      );


      plus.type =
      "button";


      plus.textContent =
      "+";


      plus.addEventListener(
        "click",
        () =>
        changeQuantity(
          item.id,
          1
        )
      );


      controls.append(
        minus,
        quantity,
        plus
      );


      info.appendChild(
        controls
      );


      const subtotalElement =
      document.createElement(
        "strong"
      );


      subtotalElement.textContent =
      money(
        subtotal
      );


      row.append(
        info,
        subtotalElement
      );


      container.appendChild(
        row
      );

    }
  );


  $("total").textContent =
  money(total);

}


/* =========================================================
   CAMBIO DE NEGOCIO
========================================================= */

async function changeBusiness(
  name,
  button
){

  if(
    name ===
    currentBusiness &&
    products.length
  ){

    return;

  }


  currentBusiness =
  name;


  cart =
  [];


  selectedPaymentId =
  null;


  document
    .querySelectorAll(
      ".business-btn"
    )
    .forEach(
      button =>
      button.classList.remove(
        "active"
      )
    );


  button.classList.add(
    "active"
  );


  await loadBusinessData();

}


/* =========================================================
   CREAR OBJETO DE VENTA
========================================================= */

function createPendingSale(){

  const items =
  cart.map(
    item => ({

      product_id:
      item.id,

      description:
      item.name,

      quantity:
      Number(
        item.quantity
      ),

      unit_price:
      Number(
        item.price
      ),

      subtotal:
      Number(
        item.price
      ) *
      Number(
        item.quantity
      )

    })
  );


  return {

    local_id:
    crypto.randomUUID
    ? crypto.randomUUID()
    : (
      Date.now() +
      "-" +
      Math.random()
    ),

    created_at:
    new Date().toISOString(),

    business:
    currentBusiness,

    business_id:
    BUSINESS_IDS[
      currentBusiness
    ],

    customer_id:
    null,

    payment_method_id:
    selectedPaymentId,

    items:
    items,

    p_is_pending:
    false

  };

}


/* =========================================================
   GUARDAR VENTA OFFLINE
========================================================= */

function saveSaleOffline(
  sale
){

  const pending =
  getPendingSales();


  pending.push(
    sale
  );


  savePendingSales(
    pending
  );


  /*
  ---------------------------------------------------------
  ACTUALIZAR STOCK LOCALMENTE
  ---------------------------------------------------------
  */

  sale.items.forEach(
    item => {

      const product =
      products.find(
        p =>
        p.id ===
        item.product_id
      );


      if(
        product
      ){

        product.stock =
        Math.max(
          0,
          Number(
            product.stock || 0
          ) -
          Number(
            item.quantity
          )
        );

      }

    }
  );


  saveCachedProducts(
    currentBusiness,
    products
  );


  renderProducts();


  cart =
  [];


  renderCart();


  updatePendingUI();


  showStatus(
    "Venta guardada en el dispositivo. Se sincronizará automáticamente cuando vuelva Internet.",
    "warn"
  );


  return true;

}


/* =========================================================
   ENVIAR UNA VENTA A SUPABASE
========================================================= */

async function sendSaleToSupabase(
  sale
){

  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "register_sale",
    {

      p_business_id:
      sale.business_id,

      p_customer_id:
      sale.customer_id,

      p_payment_method_id:
      sale.payment_method_id,

      p_items:
      sale.items,

      p_is_pending:
      false

    }
  );


  if(
    error
  ){

    throw error;

  }


  return data;

}


/* =========================================================
   SINCRONIZAR VENTAS PENDIENTES
========================================================= */

async function syncPendingSales(){

  const pending =
  getPendingSales();


  updatePendingUI();


  if(
    !pending.length
  ){

    return;

  }


  if(
    !isOnline()
  ){

    return;

  }


  console.log(
    "Intentando sincronizar",
    pending.length,
    "ventas pendientes..."
  );


  const remaining =
  [];


  for(
    const sale
    of pending
  ){

    try{

      await sendSaleToSupabase(
        sale
      );


      console.log(
        "Venta sincronizada:",
        sale.local_id
      );

    }

    catch(error){

      console.warn(
        "No se pudo sincronizar venta:",
        sale.local_id,
        error
      );


      /*
      Se conserva en la cola.
      */

      remaining.push(
        sale
      );

    }

  }


  savePendingSales(
    remaining
  );


  if(
    pending.length >
    0 &&
    remaining.length ===
    0
  ){

    showStatus(
      "Todas las ventas pendientes fueron sincronizadas correctamente.",
      "ok"
    );

  }

  else if(
    remaining.length >
    0
  ){

    showStatus(
      remaining.length +
      " operación(es) siguen pendientes de sincronizar.",
      "warn"
    );

  }

}


/* =========================================================
   COBRAR
========================================================= */

async function chargeSale(){

  clearStatus();


  if(
    !cart.length
  ){

    showStatus(
      "Agrega al menos un producto."
    );

    return;

  }


  if(
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago."
    );

    return;

  }


  const button =
  $("chargeButton");


  button.disabled =
  true;


  button.textContent =
  "REGISTRANDO...";


  try{

    const sale =
    createPendingSale();


    const total =
    sale.items.reduce(
      (
        sum,
        item
      ) =>
      sum +
      item.subtotal,
      0
    );


    const paymentName =
    payments.find(
      payment =>
      payment.id ===
      selectedPaymentId
    )?.name ||
    "Pago";


    /*
    =======================================================
    SIN INTERNET
    =======================================================
    */

    if(
      !isOnline()
    ){

      saveSaleOffline(
        sale
      );


      alert(
        "Venta guardada offline\n\n" +

        currentBusiness +

        "\nTotal: " +

        money(total) +

        "\nPago: " +

        paymentName +

        "\n\nSe sincronizará automáticamente al recuperar Internet."
      );


      return;

    }


    /*
    =======================================================
    CON INTERNET
    =======================================================
    */

    try{

      const data =
      await sendSaleToSupabase(
        sale
      );


      cart =
      [];


      renderCart();


      await loadBusinessData();


      showStatus(
        "Venta guardada correctamente en Supabase.",
        "ok"
      );


      alert(
        "Venta registrada\n\n" +

        currentBusiness +

        "\nTotal: " +

        money(total) +

        "\nPago: " +

        paymentName
      );


      console.log(
        "register_sale response:",
        data
      );

    }

    catch(networkError){

      /*
      =====================================================
      SI FALLÓ LA RED:
      GUARDAR OFFLINE
      =====================================================
      */

      console.warn(
        "Falló la venta online. Se guardará offline.",
        networkError
      );


      saveSaleOffline(
        sale
      );


      alert(
        "La conexión falló.\n\n" +

        "La venta quedó guardada en el dispositivo y será sincronizada automáticamente."
      );

    }

  }

  catch(error){

    console.error(
      error
    );


    showStatus(
      "No se pudo registrar la venta: " +
      (
        error.message ||
        error
      )
    );

  }

  finally{

    button.disabled =
    false;


    button.textContent =
    "COBRAR";

  }

}


/* =========================================================
   EVENTO: INTERNET RECUPERADO
========================================================= */

window.addEventListener(
  "online",
  async () => {

    console.log(
      "Internet recuperado."
    );


    showStatus(
      "Internet recuperado. Sincronizando...",
      "ok"
    );


    await loadBusinessData();


    await syncPendingSales();

  }
);


/* =========================================================
   EVENTO: SIN INTERNET
========================================================= */

window.addEventListener(
  "offline",
  () => {

    showStatus(
      "Sin Internet. El POS continuará trabajando offline.",
      "warn"
    );

    updatePendingUI();

  }
);


/* =========================================================
   CAMBIO DE NEGOCIO
========================================================= */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          changeBusiness(
            button.dataset.business,
            button
          );

        }
      );

    }
  );


/* =========================================================
   BOTÓN COBRAR
========================================================= */

$("chargeButton")
  .addEventListener(
    "click",
    chargeSale
  );


/* =========================================================
   REGISTRAR SERVICE WORKER
========================================================= */

if(
  "serviceWorker"
  in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )

        .then(
          registration => {

            console.log(
              "Service Worker registrado:",
              registration.scope
            );

          }
        )

        .catch(
          error => {

            console.warn(
              "No se pudo registrar el Service Worker:",
              error
            );

          }
        );

    }
  );

}


/* =========================================================
   INICIO
========================================================= */

updatePendingUI();


loadBusinessData();


/*
Sincronización automática cada 15 segundos
mientras la página esté abierta.
*/

setInterval(
  () => {

    if(
      navigator.onLine
    ){

      syncPendingSales();

    }

  },
  15000
);


/*
Intento inicial de sincronización.
*/

setTimeout(
  () => {

    if(
      navigator.onLine
    ){

      syncPendingSales();

    }

  },
  3000
);

</script>
