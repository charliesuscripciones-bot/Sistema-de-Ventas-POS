<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema POS">
<title>Sistema de Ventas POS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{width:100%;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;color:#222;min-height:100vh
}
header{
  background:#111827;color:#fff;
  padding:calc(22px + env(safe-area-inset-top)) 20px 22px
}
header h1{font-size:28px;line-height:1.15}
header p{font-size:15px;opacity:.75;margin-top:8px}
.container{width:100%;max-width:1100px;margin:auto;padding:20px}

.status{
  margin:0 0 15px;padding:14px 16px;border-radius:12px;
  font-size:14px;display:none;font-weight:700;white-space:pre-line
}
.status.error{display:block;background:#fee2e2;color:#991b1b}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.warn{display:block;background:#fef3c7;color:#92400e}

.businesses{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.business-btn,.nav-btn{
  border:none;padding:13px 20px;border-radius:12px;background:#fff;
  border:2px solid #ddd;font-weight:700;cursor:pointer;font-size:16px
}
.business-btn{flex:1}
.business-btn.active{background:#111827;color:#fff;border-color:#111827}

.navigation{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:10px;margin-bottom:20px
}
.nav-btn{color:#2563eb}
.nav-btn.accounts{background:#fff7ed;border-color:#f59e0b;color:#b45309}
.nav-btn.clients{background:#ecfdf5;border-color:#10b981;color:#047857}
.nav-btn.history{background:#f5f3ff;border-color:#7c3aed;color:#6d28d9}
.nav-btn.inventory{background:#eff6ff;border-color:#2563eb;color:#1d4ed8}

.layout{display:grid;grid-template-columns:1fr 390px;gap:20px}
.card{
  background:#fff;border-radius:18px;padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.06)
}
.card h2{font-size:21px;margin-bottom:16px}

.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{
  border:2px solid #ddd;border-radius:14px;padding:18px 14px;
  cursor:pointer;background:#fff;text-align:left;transition:.15s
}
.product:hover{border-color:#2563eb;transform:translateY(-1px)}
.product:active{transform:scale(.98)}
.product.disabled{opacity:.5;cursor:not-allowed}
.product-name{font-weight:700;font-size:17px;margin-bottom:9px}
.price{font-size:23px;font-weight:800;color:#2563eb}
.stock{font-size:14px;color:#666;margin-top:7px}

.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 0;border-bottom:1px solid #eee;gap:12px
}
.cart-name{font-weight:700}
.cart-price{font-size:13px;color:#666;margin-top:4px}
.quantity{display:flex;align-items:center;gap:8px;margin-top:8px}
.quantity button{
  width:32px;height:32px;border:none;border-radius:7px;
  background:#eee;cursor:pointer;font-size:18px
}
.total{
  display:flex;justify-content:space-between;font-size:25px;
  font-weight:800;margin-top:20px;padding-top:18px;border-top:2px solid #eee
}
.payment-title,.customer-title{margin-top:20px;margin-bottom:10px;font-weight:800;font-size:17px}
.payments{display:grid;gap:9px}
.payment{
  padding:14px;border:2px solid #ddd;border-radius:11px;
  background:#fff;cursor:pointer;text-align:left;font-size:16px;font-weight:700
}
.payment.active{background:#111827;color:#fff;border-color:#111827}

.customer-box{position:relative}
.customer-row{display:flex;gap:8px}
.customer-search{
  flex:1;padding:13px;border:2px solid #ddd;border-radius:11px;
  font-size:15px;min-width:0;background:#fff
}
.customer-search:focus{outline:none;border-color:#2563eb}
.add-client{
  border:none;background:#2563eb;color:#fff;padding:0 14px;
  border-radius:11px;font-weight:800;cursor:pointer;white-space:nowrap
}
.customer-results{
  margin-top:8px;display:none;border:2px solid #ddd;border-radius:11px;
  overflow:hidden;background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;left:0;right:0;z-index:100
}
.customer-result{
  display:block;width:100%;border:none;border-bottom:1px solid #eee;
  background:#fff;padding:13px;text-align:left;cursor:pointer
}
.customer-result:last-child{border-bottom:none}
.customer-result:hover{background:#f3f4f6}
.customer-result strong{display:block;font-size:15px}
.customer-result small{display:block;color:#6b7280;margin-top:4px}
.selected-customer{
  margin-top:8px;padding:12px;border-radius:9px;background:#eff6ff;
  border:2px solid #bfdbfe;color:#1d4ed8;font-size:14px;font-weight:600
}
.clear-customer{
  border:none;background:none;color:#dc2626;font-weight:700;
  cursor:pointer;margin-left:8px;padding:0
}
.general-customer{
  margin-top:8px;padding:13px;border-radius:9px;background:#f3f4f6;
  color:#555;font-weight:700;cursor:pointer;border:2px solid transparent
}
.general-customer:hover{background:#e5e7eb;border-color:#d1d5db}

.charge,.account{
  width:100%;margin-top:15px;padding:16px;border:none;border-radius:12px;
  color:#fff;font-size:18px;font-weight:800;cursor:pointer
}
.charge{background:#16a34a}
.account{margin-top:10px;background:#f59e0b}
.charge:disabled,.account:disabled{opacity:.6;cursor:wait}

.empty{color:#777;text-align:center;padding:30px 10px}
.loading{opacity:.65;pointer-events:none}
button{-webkit-tap-highlight-color:transparent}

@media(max-width:950px){
  .navigation{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .navigation{grid-template-columns:1fr 1fr}
  .products{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){
  .container{padding:15px}
  header h1{font-size:25px}
  header p{font-size:14px}
  .navigation{grid-template-columns:1fr 1fr}
  .business-btn{flex:1;min-width:0}
  .layout{gap:15px}
  .card{padding:16px}
  .products{grid-template-columns:1fr 1fr}
  .product{padding:15px 12px}
  .product-name{font-size:15px}
  .price{font-size:20px}
  .customer-row{flex-direction:column}
  .add-client{padding:12px}
}
</style>
</head>

<body>

<header>
<h1>🧾 Sistema de Ventas POS</h1>
<p>Administración de negocios y ventas</p>
</header>

<div class="container">

<div id="status" class="status"></div>

<div class="businesses">
<button type="button" class="business-btn active" data-business="BakeQuiri">🧁 BakeQuiri</button>
<button type="button" class="business-btn" data-business="SpicyRoll">🍣 SpicyRoll</button>
</div>

<div class="navigation">
<button type="button" class="nav-btn accounts" id="accountsButton">💰 Cuentas pendientes</button>
<button type="button" class="nav-btn clients" id="clientsButton">👥 Clientes</button>
<button type="button" class="nav-btn history" id="historyButton">🧾 Historial</button>
<button type="button" class="nav-btn inventory" id="inventoryButton">📦 Inventario</button>
<button type="button" class="nav-btn" id="dashboardButton">📊 Dashboard</button>
</div>

<div class="layout">

<div class="card">
<h2>Productos</h2>
<div id="products">
<div class="loading">Cargando productos...</div>
</div>
</div>

<div class="card">

<h2>🛒 Carrito</h2>

<div id="cart">
<div class="empty">El carrito está vacío</div>
</div>

<div class="total">
<span>Total</span>
<span id="total">$0.00</span>
</div>

<div class="customer-title">👤 Cliente</div>

<div class="customer-box">

<div class="customer-row">

<input
type="search"
id="customerSearch"
class="customer-search"
placeholder="🔎 Buscar cliente por nombre o teléfono"
autocomplete="off"
>

<button type="button" id="addClientButton" class="add-client">
+ Cliente
</button>

</div>

<div id="customerResults" class="customer-results"></div>

<div id="selectedCustomer" class="selected-customer" style="display:none"></div>

<div id="generalCustomer" class="general-customer">
👤 Consumidor general
</div>

</div>

<div class="payment-title">Método de pago</div>

<div id="payments" class="payments">
<div class="empty">Cargando métodos de pago...</div>
</div>

<button type="button" id="chargeButton" class="charge">
💵 COBRAR
</button>

<button type="button" id="accountButton" class="account">
🟠 DEJAR A CUENTA
</button>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   SERVICE WORKER
========================================================= */

if("serviceWorker" in navigator){

  window.addEventListener("load",async()=>{

    try{

      const registration =
        await navigator.serviceWorker.register("./sw.js",{
          scope:"./",
          updateViaCache:"none"
        });

      console.log("[POS] SW:",registration.scope);

      await registration.update().catch(()=>{});

      if(registration.waiting){
        registration.waiting.postMessage("SKIP_WAITING");
      }

    }catch(error){

      console.warn("[POS] SW:",error);

    }

  });

}


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

let supabaseClient=null;


/* =========================================================
   NEGOCIOS
========================================================= */

const BUSINESS_IDS={

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   ESTADO
========================================================= */

let currentBusiness="BakeQuiri";

let products=[];
let payments=[];
let customers=[];
let cart=[];

let selectedPaymentId=null;
let selectedCustomerId=null;


/* =========================================================
   CACHE OFFLINE
========================================================= */

const OFFLINE_CACHE_KEY =
"POS_OFFLINE_DATA_V3";


function getOfflineData(){

  try{

    const raw =
      localStorage.getItem(
        OFFLINE_CACHE_KEY
      );

    if(!raw){
      return null;
    }

    return JSON.parse(raw);

  }catch(error){

    console.warn(
      "[POS] Cache offline dañada:",
      error
    );

    return null;

  }

}


function saveOfflineData(){

  try{

    const payload={

      version:3,

      savedAt:
        new Date().toISOString(),

      businesses:{}

    };


    Object.keys(BUSINESS_IDS)
      .forEach(
        business=>{

          payload.businesses[business]={

            products:
              business === currentBusiness
              ? products
              : [],

            payments:
              business === currentBusiness
              ? payments
              : []

          };

        }
      );


    /*
     * Clientes son compartidos.
     */

    payload.customers =
      customers;


    /*
     * Si ya había información de otro
     * negocio almacenada, conservarla.
     */

    const previous =
      getOfflineData();


    if(previous?.businesses){

      Object.keys(
        previous.businesses
      ).forEach(
        business=>{

          if(
            business !==
            currentBusiness &&
            previous.businesses[business]
          ){

            payload.businesses[business]=
              previous.businesses[business];

          }

        }
      );

    }


    localStorage.setItem(
      OFFLINE_CACHE_KEY,
      JSON.stringify(payload)
    );


    console.log(
      "[POS] Datos offline guardados:",
      new Date().toLocaleString()
    );

  }catch(error){

    console.error(
      "[POS] No se pudieron guardar datos offline:",
      error
    );

  }

}


function loadOfflineData(){

  const cache =
    getOfflineData();


  if(!cache){

    return false;

  }


  const businessData =
    cache.businesses?.[
      currentBusiness
    ];


  if(!businessData){

    return false;

  }


  products =
    Array.isArray(
      businessData.products
    )
    ? businessData.products
    : [];


  payments =
    Array.isArray(
      businessData.payments
    )
    ? businessData.payments
    : [];


  customers =
    Array.isArray(
      cache.customers
    )
    ? cache.customers
    : [];


  if(
    !payments.some(
      p=>p.id===selectedPaymentId
    )
  ){

    selectedPaymentId =
      payments[0]?.id ||
      null;

  }


  if(
    !customers.some(
      c=>c.id===selectedCustomerId
    )
  ){

    selectedCustomerId=null;

  }


  renderProducts();
  renderPayments();
  renderCart();
  renderSelectedCustomer();


  const savedAt =
    cache.savedAt
    ? new Date(
        cache.savedAt
      ).toLocaleString("es-MX")
    : "";


  showStatus(
    "Modo OFFLINE activo.\n" +
    "Productos, clientes y métodos de pago cargados desde el dispositivo." +
    (
      savedAt
      ? "\nÚltima actualización: "+savedAt
      : ""
    ),
    "warn"
  );


  return true;

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function money(value){

  return "$"+
    Number(value||0)
      .toFixed(2);

}


function escapeHTML(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showStatus(
  message,
  type="error"
){

  $("status").textContent=
    message;

  $("status").className=
    "status "+type;

}


function clearStatus(){

  $("status").textContent="";
  $("status").className="status";

}


/* =========================================================
   SUPABASE
========================================================= */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient!=="function"
  ){

    throw new Error(
      "No se pudo cargar Supabase."
    );

  }


  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadBusinessData(){

  /*
   * PRIMERO:
   * si no hay Internet, NO intentar Supabase.
   * Cargar inmediatamente desde localStorage.
   */

  if(!navigator.onLine){

    const loaded =
      loadOfflineData();


    if(!loaded){

      $("products").innerHTML=
        '<div class="empty">No hay productos guardados para uso offline.</div>';

      $("payments").innerHTML=
        '<div class="empty">No hay métodos de pago guardados para uso offline.</div>';

      customers=[];

      showStatus(
        "Estás sin Internet y todavía no existe una copia local de los datos.\n\nConéctate una vez a Internet, abre el POS y espera a que termine de cargar para preparar el modo offline.",
        "warn"
      );

    }

    return;

  }


  clearStatus();


  $("products").innerHTML=
    '<div class="empty">Cargando productos...</div>';

  $("payments").innerHTML=
    '<div class="empty">Cargando métodos de pago...</div>';


  const businessId=
    BUSINESS_IDS[
      currentBusiness
    ];


  try{

    /*
     * Hacer las consultas simultáneamente.
     */

    const [
      productsResult,
      paymentsResult,
      customersResult
    ] =
    await Promise.all([

      supabaseClient
        .from("products")
        .select(
          "id,name,price,cost,stock,active,business_id"
        )
        .eq(
          "business_id",
          businessId
        )
        .eq(
          "active",
          true
        )
        .order("name"),

      supabaseClient
        .from("payment_methods")
        .select(
          "id,name,provider,active,business_id"
        )
        .eq(
          "business_id",
          businessId
        )
        .eq(
          "active",
          true
        )
        .order("name"),

      /*
       * customers NO tiene business_id.
       */

      supabaseClient
        .from("customers")
        .select(
          "id,name,phone,notes"
        )
        .order("name")

    ]);


    if(productsResult.error)
      throw new Error(
        "Productos: "+
        productsResult.error.message
      );


    if(paymentsResult.error)
      throw new Error(
        "Métodos de pago: "+
        paymentsResult.error.message
      );


    if(customersResult.error)
      throw new Error(
        "Clientes: "+
        customersResult.error.message
      );


    products =
      productsResult.data||[];

    payments =
      paymentsResult.data||[];

    customers =
      customersResult.data||[];


    if(
      !payments.some(
        p=>p.id===selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id||
        null;

    }


    if(
      !customers.some(
        c=>c.id===selectedCustomerId
      )
    ){

      selectedCustomerId=null;

    }


    /*
     * PINTAR LOS DATOS.
     */

    renderProducts();
    renderPayments();
    renderCart();
    renderSelectedCustomer();


    /*
     * ESTA ES LA PARTE IMPORTANTE:
     * guardar inmediatamente una copia local.
     */

    saveOfflineData();


    showStatus(
      currentBusiness+
      " actualizado.\nLos productos, métodos de pago y clientes quedaron guardados para uso offline.",
      "ok"
    );

  }catch(error){

    console.error(
      "[POS] Error online:",
      error
    );


    /*
     * Si la consulta falla aunque navigator.onLine
     * diga que hay Internet, intentar la copia local.
     */

    const loaded =
      loadOfflineData();


    if(loaded){

      showStatus(
        "No se pudo contactar Supabase.\nSe cargaron los datos guardados localmente para continuar.",
        "warn"
      );

      return;

    }


    $("products").innerHTML=
      '<div class="empty">No se pudieron cargar los productos.</div>';

    $("payments").innerHTML=
      '<div class="empty">No se pudieron cargar los métodos de pago.</div>';


    showStatus(
      error?.message||
      "No se pudo cargar el sistema.",
      "error"
    );

  }

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

  const container=
    $("products");

  container.innerHTML="";


  if(!products.length){

    container.innerHTML=
      '<div class="empty">No hay productos activos para este negocio.</div>';

    return;

  }


  products.forEach(
    product=>{

      const stock=
        Number(product.stock||0);


      const button=
        document.createElement("button");


      button.type="button";

      button.className=
        "product"+
        (
          stock<=0
          ? " disabled"
          : ""
        );

      button.disabled=
        stock<=0;


      button.innerHTML=
        '<div class="product-name">'+
        escapeHTML(product.name)+
        '</div>'+
        '<div class="price">'+
        money(product.price)+
        '</div>'+
        '<div class="stock">'+
        (
          stock>0
          ? "Existencia: "+stock
          : "Agotado"
        )+
        '</div>';


      button.addEventListener(
        "click",
        ()=>addToCart(product)
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   PAGOS
========================================================= */

function renderPayments(){

  const container=
    $("payments");

  container.innerHTML="";


  if(!payments.length){

    container.innerHTML=
      '<div class="empty">No hay métodos de pago activos.</div>';

    return;

  }


  payments.forEach(
    payment=>{

      const button=
        document.createElement("button");


      button.type="button";

      button.className=
        "payment"+
        (
          payment.id===
          selectedPaymentId
          ? " active"
          : ""
        );


      button.textContent=
        payment.name;


      button.addEventListener(
        "click",
        ()=>{

          selectedPaymentId=
            payment.id;

          renderPayments();

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   CARRITO
========================================================= */

function addToCart(product){

  const stock=
    Number(product.stock||0);


  if(stock<=0){

    showStatus(
      "Este producto está agotado."
    );

    return;

  }


  const item=
    cart.find(
      i=>i.id===product.id
    );


  if(item){

    if(item.quantity<stock){

      item.quantity++;

    }else{

      showStatus(
        "No puedes agregar más unidades que la existencia disponible."
      );

    }

  }else{

    cart.push({
      ...product,
      quantity:1
    });

  }


  renderCart();

}


function changeQuantity(
  id,
  amount
){

  const item=
    cart.find(
      i=>i.id===id
    );


  if(!item)return;


  const product=
    products.find(
      p=>p.id===id
    );


  const max=
    Number(
      product?.stock ??
      item.stock ??
      0
    );


  const next=
    item.quantity+
    amount;


  if(next>max){

    showStatus(
      "No hay suficiente existencia disponible."
    );

    return;

  }


  item.quantity=
    next;


  if(item.quantity<=0){

    cart=
      cart.filter(
        i=>i.id!==id
      );

  }


  renderCart();

}


function getCartTotal(){

  return cart.reduce(
    (sum,item)=>
      sum+
      Number(item.price)*
      Number(item.quantity),
    0
  );

}


function renderCart(){

  const container=
    $("cart");

  container.innerHTML="";


  if(!cart.length){

    container.innerHTML=
      '<div class="empty">El carrito está vacío</div>';

    $("total").textContent=
      "$0.00";

    return;

  }


  cart.forEach(
    item=>{

      const row=
        document.createElement("div");

      row.className=
        "cart-item";


      const info=
        document.createElement("div");


      info.innerHTML=
        '<div class="cart-name">'+
        escapeHTML(item.name)+
        '</div>'+
        '<div class="cart-price">'+
        money(item.price)+
        ' c/u</div>';


      const controls=
        document.createElement("div");

      controls.className=
        "quantity";


      const minus=
        document.createElement("button");

      minus.type="button";
      minus.textContent="−";

      minus.addEventListener(
        "click",
        ()=>changeQuantity(item.id,-1)
      );


      const quantity=
        document.createElement("span");

      quantity.textContent=
        item.quantity;


      const plus=
        document.createElement("button");

      plus.type="button";
      plus.textContent="+";

      plus.addEventListener(
        "click",
        ()=>changeQuantity(item.id,1)
      );


      controls.append(
        minus,
        quantity,
        plus
      );


      info.appendChild(
        controls
      );


      const subtotal=
        document.createElement("strong");

      subtotal.textContent=
        money(
          Number(item.price)*
          Number(item.quantity)
        );


      row.append(
        info,
        subtotal
      );


      container.appendChild(
        row
      );

    }
  );


  $("total").textContent=
    money(
      getCartTotal()
    );

}


/* =========================================================
   CLIENTE
========================================================= */

function renderSelectedCustomer(){

  const selected=
    customers.find(
      c=>c.id===selectedCustomerId
    );


  const element=
    $("selectedCustomer");

  const general=
    $("generalCustomer");


  if(!selected){

    selectedCustomerId=null;

    element.style.display="none";
    element.innerHTML="";

    general.style.display="block";

    return;

  }


  general.style.display="none";

  element.style.display="block";

  element.innerHTML=
    "👤 <strong>"+
    escapeHTML(
      selected.name||"Cliente"
    )+
    "</strong>"+
    (
      selected.phone
      ? " · 📱 "+
        escapeHTML(selected.phone)
      : ""
    )+
    '<button type="button" class="clear-customer" id="clearCustomer">Quitar</button>';


  $("clearCustomer")
    .addEventListener(
      "click",
      clearSelectedCustomer
    );

}


function clearSelectedCustomer(){

  selectedCustomerId=null;

  $("customerSearch").value="";

  $("customerResults").innerHTML="";

  $("customerResults").style.display="none";

  renderSelectedCustomer();

}


function renderCustomerResults(query){

  const container=
    $("customerResults");


  const search=
    String(query||"")
      .trim()
      .toLowerCase();


  if(!search){

    container.innerHTML="";
    container.style.display="none";

    return;

  }


  const filtered=
    customers.filter(
      customer=>{

        const name=
          String(customer.name||"")
            .toLowerCase();

        const phone=
          String(customer.phone||"")
            .toLowerCase();

        const notes=
          String(customer.notes||"")
            .toLowerCase();

        return(
          name.includes(search)||
          phone.includes(search)||
          notes.includes(search)
        );

      }
    );


  container.innerHTML="";


  if(!filtered.length){

    const empty=
      document.createElement("div");

    empty.className="empty";

    empty.textContent=
      "No encontramos ese cliente.";

    container.appendChild(empty);

    container.style.display="block";

    return;

  }


  filtered
    .slice(0,10)
    .forEach(
      customer=>{

        const button=
          document.createElement("button");

        button.type="button";

        button.className=
          "customer-result";

        button.innerHTML=
          "<strong>"+
          escapeHTML(
            customer.name||
            "Cliente sin nombre"
          )+
          "</strong>"+
          (
            customer.phone
            ? "<small>📱 "+
              escapeHTML(customer.phone)+
              "</small>"
            : ""
          );


        button.addEventListener(
          "click",
          ()=>{

            selectedCustomerId=
              customer.id;

            $("customerSearch").value=
              customer.name||"";

            container.innerHTML="";
            container.style.display="none";

            renderSelectedCustomer();

          }
        );


        container.appendChild(
          button
        );

      }
    );


  container.style.display=
    "block";

}

/* =========================================================
   CAMBIAR NEGOCIO
========================================================= */

async function changeBusiness(
  name,
  button
){

  if(name===currentBusiness)return;


  currentBusiness=name;

  cart=[];

  selectedPaymentId=null;

  selectedCustomerId=null;


  $("customerSearch").value="";

  $("customerResults").innerHTML="";

  $("customerResults").style.display="none";


  document
    .querySelectorAll(".business-btn")
    .forEach(
      b=>
        b.classList.remove("active")
    );


  button.classList.add("active");


  /*
   * Si estamos offline, loadBusinessData()
   * cargará automáticamente el cache
   * correspondiente al negocio.
   */

  await loadBusinessData();

}


/* =========================================================
   REGISTRAR VENTA
========================================================= */

async function registerSale(
  isPending
){

  clearStatus();


  if(!cart.length){

    showStatus(
      "Agrega al menos un producto."
    );

    return;

  }


  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago."
    );

    return;

  }


  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente."
    );

    return;

  }


  /*
   * IMPORTANTE:
   * Esta versión conserva el registro remoto
   * cuando hay Internet.
   *
   * Offline todavía NO envía la venta a Supabase.
   * Primero aseguramos que productos/clientes/pagos
   * funcionen correctamente offline.
   */

  if(!navigator.onLine){

    showStatus(
      "Estás en modo OFFLINE.\n\nLos productos, clientes y métodos de pago están disponibles, pero el registro de la venta requiere conexión a Internet en esta versión.",
      "warn"
    );

    return;

  }


  const button=
    isPending
    ? $("accountButton")
    : $("chargeButton");


  const originalText=
    button.textContent;


  button.disabled=true;

  button.textContent=
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";


  try{

    const items=
      cart.map(
        item=>({

          product_id:item.id,

          description:item.name,

          quantity:Number(
            item.quantity
          ),

          unit_price:Number(
            item.price
          ),

          subtotal:
            Number(item.price)*
            Number(item.quantity)

        })
      );


    const businessId=
      BUSINESS_IDS[
        currentBusiness
      ];


    const result=
      await supabaseClient
        .rpc(
          "register_sale",
          {

            p_business_id:
              businessId,

            p_customer_id:
              selectedCustomerId||
              null,

            p_payment_method_id:
              isPending
              ? null
              : selectedPaymentId,

            p_items:
              items,

            p_is_pending:
              isPending

          }
        );


    if(result.error){

      throw result.error;

    }


    const customer=
      customers.find(
        c=>c.id===selectedCustomerId
      );


    const paymentName=
      payments.find(
        p=>p.id===selectedPaymentId
      )?.name||
      "Pago";


    alert(
      (
        isPending
        ? "Cuenta registrada"
        : "Venta registrada"
      )+
      "\n\n"+
      currentBusiness+
      "\nCliente: "+
      (
        customer?.name||
        "Consumidor general"
      )+
      "\nTotal: "+
      money(
        getCartTotal()
      )+
      (
        isPending
        ? ""
        : "\nPago: "+paymentName
      )
    );


    cart=[];

    selectedCustomerId=null;

    $("customerSearch").value="";

    $("customerResults").innerHTML="";

    $("customerResults").style.display="none";

    renderSelectedCustomer();


    await loadBusinessData();


    showStatus(
      isPending
      ? "Cuenta guardada correctamente."
      : "Venta guardada correctamente.",
      "ok"
    );

  }catch(error){

    console.error(
      "registerSale:",
      error
    );

    showStatus(
      "No se pudo registrar la operación:\n"+
      (
        error?.message||
        String(error)
      ),
      "error"
    );

  }finally{

    button.disabled=false;

    button.textContent=
      originalText;

  }

}

/* =========================================================
   CONEXIÓN
========================================================= */

window.addEventListener(
  "offline",
  ()=>{

    /*
     * No borrar datos.
     * Cambiar inmediatamente al cache.
     */

    loadOfflineData();

  }
);

  "online",
  async()=>{

    showStatus(
      "Internet restaurado. Actualizando datos...",
      "ok"
    );

    await loadBusinessData();

  }
);


/* =========================================================
   INICIO
========================================================= */

async function startApp(){

  /*
   * Inicializar Supabase si la librería está disponible.
   */

  try{

    initializeSupabase();

  }catch(error){

    console.warn(
      "[POS] Supabase no disponible:",
      error
    );

  }


  /*
   * SI ESTÁ OFFLINE:
   * cargar directamente desde localStorage.
   */

  if(!navigator.onLine){

    loadOfflineData();

    return;

  }


  /*
   * SI ESTÁ ONLINE:
   * descargar datos y guardar copia local.
   */

  if(supabaseClient){

    await loadBusinessData();

  }else{

    /*
     * Fallback por si el CDN no cargó.
     */

    const loaded=
      loadOfflineData();

    if(!loaded){

      showStatus(
        "No se pudo cargar Supabase y tampoco existe una copia local de los datos.",
        "error"
      );

    }

  }

}


startApp();
