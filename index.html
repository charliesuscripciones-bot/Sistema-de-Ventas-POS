<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Sistema POS"
>

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f5f5f5;
  color:#222;

  min-height:100vh;

  padding-bottom:
    env(safe-area-inset-bottom);
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

header{
  background:#111827;
  color:#fff;

  padding-top:
    calc(18px + env(safe-area-inset-top));

  padding-right:18px;
  padding-bottom:18px;
  padding-left:18px;

  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:22px;
}

header p{
  font-size:13px;
  opacity:.7;
  margin-top:4px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;

  padding:10px 12px;

  border-radius:9px;

  font-size:13px;

  display:none;

  white-space:pre-line;
}

.status.error{
  display:block;

  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;

  background:#dcfce7;
  color:#166534;
}

.status.warn{
  display:block;

  background:#fef3c7;
  color:#92400e;
}

.businesses{
  display:flex;

  gap:10px;

  margin-bottom:20px;

  flex-wrap:wrap;
}

.business-btn{
  border:none;

  padding:12px 18px;

  border-radius:10px;

  background:#fff;

  border:1px solid #ddd;

  font-weight:600;

  cursor:pointer;
}

.business-btn.active{
  background:#111827;
  color:#fff;
}

.business-btn:active{
  transform:scale(.98);
}

.layout{
  display:grid;

  grid-template-columns:
    1fr 380px;

  gap:20px;
}

.card{
  background:#fff;

  border-radius:14px;

  padding:18px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.06);
}

.card h2{
  font-size:18px;

  margin-bottom:15px;
}

.products{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.product{
  border:1px solid #ddd;

  border-radius:12px;

  padding:15px;

  cursor:pointer;

  background:#fff;
}

.product:active{
  transform:scale(.98);
}

.product.disabled{
  opacity:.5;

  cursor:not-allowed;
}

.product-name{
  font-weight:600;

  margin-bottom:8px;
}

.price{
  font-size:18px;

  font-weight:700;
}

.stock{
  font-size:12px;

  color:#666;

  margin-top:5px;
}

.cart-item{
  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:12px 0;

  border-bottom:1px solid #eee;

  gap:12px;
}

.cart-name{
  font-weight:600;
}

.cart-price{
  font-size:13px;

  color:#666;
}

.quantity{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:6px;
}

.quantity button{
  width:28px;

  height:28px;

  border:none;

  border-radius:6px;

  background:#eee;

  cursor:pointer;

  font-size:18px;
}

.quantity button:active{
  transform:scale(.92);
}

.total{
  display:flex;

  justify-content:space-between;

  font-size:22px;

  font-weight:700;

  margin-top:20px;

  padding-top:15px;

  border-top:2px solid #eee;
}

.payment-title{
  margin-top:20px;

  margin-bottom:10px;

  font-weight:600;
}

.payments{
  display:grid;

  gap:8px;
}

.payment{
  padding:12px;

  border:1px solid #ddd;

  border-radius:9px;

  background:#fff;

  cursor:pointer;

  text-align:left;

  font-weight:600;
}

.payment.active{
  background:#111827;

  color:#fff;
}

.charge{
  width:100%;

  margin-top:15px;

  padding:15px;

  border:none;

  border-radius:10px;

  background:#16a34a;

  color:#fff;

  font-size:17px;

  font-weight:700;

  cursor:pointer;
}

.charge:active{
  transform:scale(.98);
}

.charge:disabled{
  opacity:.6;

  cursor:wait;
}

.empty{
  color:#777;

  text-align:center;

  padding:30px 10px;
}

.loading{
  text-align:center;

  padding:25px;

  color:#666;

  font-weight:600;
}

@media(max-width:800px){

  .container{
    padding:14px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .card{
    border-radius:16px;
  }

}

@media(max-width:420px){

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:13px;
  }

  .product-name{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }

}

</style>

</head>


<body>

<header>

<h1>
🧾 Sistema de Ventas POS
</h1>

<p>
Administración de negocios y ventas
</p>

</header>


<div class="container">


<div
  id="status"
  class="status">
</div>


<!-- NEGOCIOS -->

<div class="businesses">

<button
  type="button"
  class="business-btn active"
  data-business="BakeQuiri">

BakeQuiri

</button>


<button
  type="button"
  class="business-btn"
  data-business="SpicyRoll">

SpicyRoll

</button>

</div>


<!-- POS -->

<div class="layout">


<!-- PRODUCTOS -->

<div class="card">

<h2>
Productos
</h2>

<div
  id="products"
  class="products">

<div class="loading">
Cargando productos...
</div>

</div>

</div>


<!-- CARRITO -->

<div class="card">

<h2>
🛒 Carrito
</h2>

<div id="cart">

<div class="empty">
El carrito está vacío
</div>

</div>


<div class="total">

<span>
Total
</span>

<span id="total">
$0.00
</span>

</div>


<div class="payment-title">
Método de pago
</div>


<div
  id="payments"
  class="payments">

<div class="loading">
Cargando métodos de pago...
</div>

</div>


<button
  type="button"
  id="chargeButton"
  class="charge">

COBRAR

</button>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
  "BakeQuiri";


let products = [];

let payments = [];

let cart = [];

let selectedPaymentId =
  null;


/* =====================================================
   HELPERS
===================================================== */

function $(id){

  return document.getElementById(id);

}


function money(value){

  return "$" +
    Number(value || 0).toFixed(2);

}


function showStatus(
  message,
  type = "error"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}


function clearStatus(){

  const element =
    $("status");

  element.textContent =
    "";

  element.className =
    "status";

}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function esc(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   NEGOCIO DESDE URL
===================================================== */

function getBusinessFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const business =
    params.get("business");


  if(
    business &&
    BUSINESS_IDS[business]
  ){

    return business;

  }


  return "BakeQuiri";

}


/* =====================================================
   ACTUALIZAR URL
===================================================== */

function updateBusinessURL(){

  const url =
    new URL(
      window.location.href
    );

  url.searchParams.set(
    "business",
    currentBusiness
  );

  window.history.replaceState(
    {},
    "",
    url
  );

}


/* =====================================================
   CARGAR NEGOCIO
===================================================== */

async function loadBusinessData(){

  clearStatus();


  const businessId =
    BUSINESS_IDS[currentBusiness];


  $("products").innerHTML =
    '<div class="loading">' +
    'Cargando productos...' +
    '</div>';


  $("payments").innerHTML =
    '<div class="loading">' +
    'Cargando métodos de pago...' +
    '</div>';


  const [

    productsResult,

    paymentsResult

  ] = await Promise.all([

    supabaseClient

      .from("products")

      .select(
        "id,name,price,cost,stock,active"
      )

      .eq(
        "business_id",
        businessId
      )

      .eq(
        "active",
        true
      )

      .order(
        "name"
      ),


    supabaseClient

      .from("payment_methods")

      .select(
        "id,name,provider,active"
      )

      .eq(
        "business_id",
        businessId
      )

      .eq(
        "active",
        true
      )

      .order(
        "name"
      )

  ]);


  if(productsResult.error){

    throw new Error(
      "No pude cargar los productos: " +
      productsResult.error.message
    );

  }


  if(paymentsResult.error){

    throw new Error(
      "No pude cargar los métodos de pago: " +
      paymentsResult.error.message
    );

  }


  products =
    productsResult.data || [];


  payments =
    paymentsResult.data || [];


  if(
    !payments.some(
      payment =>
        payment.id ===
        selectedPaymentId
    )
  ){

    selectedPaymentId =
      payments[0]?.id ||
      null;

  }


  renderProducts();

  renderPayments();

  renderCart();

}


/* =====================================================
   PRODUCTOS
===================================================== */

function renderProducts(){

  const container =
    $("products");


  container.innerHTML =
    "";


  if(!products.length){

    container.innerHTML =
      '<div class="empty">' +
      'No hay productos activos para este negocio.' +
      '</div>';

    return;

  }


  products.forEach(
    product => {

      const stock =
        Number(
          product.stock || 0
        );


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "product" +
        (
          stock <= 0
            ? " disabled"
            : ""
        );


      element.innerHTML =

        '<div class="product-name">' +

        esc(product.name) +

        '</div>' +

        '<div class="price">' +

        money(product.price) +

        '</div>' +

        '<div class="stock">' +

        'Existencia: ' +

        stock +

        '</div>';


      element.addEventListener(
        "click",
        function(){

          if(stock > 0){

            addToCart(
              product
            );

          }

        }
      );


      container.appendChild(
        element
      );

    }
  );

}


/* =====================================================
   MÉTODOS DE PAGO
===================================================== */

function renderPayments(){

  const container =
    $("payments");


  container.innerHTML =
    "";


  if(!payments.length){

    container.innerHTML =
      '<div class="empty">' +
      'No hay métodos de pago activos.' +
      '</div>';

    return;

  }


  payments.forEach(
    payment => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "payment " +
        (
          payment.id ===
          selectedPaymentId
            ? "active"
            : ""
        );


      button.textContent =
        payment.name;


      button.addEventListener(
        "click",
        function(){

          selectedPaymentId =
            payment.id;

          renderPayments();

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   CARRITO
===================================================== */

function addToCart(product){

  const existing =
    cart.find(
      item =>
        item.id ===
        product.id
    );


  const stock =
    Number(
      product.stock || 0
    );


  if(existing){

    if(
      existing.quantity <
      stock
    ){

      existing.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia disponible.",
        "warn"
      );

    }

  }

  else{

    cart.push({

      ...product,

      quantity:1

    });

  }


  renderCart();

}


/* =====================================================
   CANTIDAD
===================================================== */

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      x =>
        x.id === id
    );


  if(!item){
    return;
  }


  const product =
    products.find(
      x =>
        x.id === id
    );


  const max =
    Number(
      product?.stock ||
      item.stock ||
      0
    );


  item.quantity +=
    amount;


  if(
    item.quantity >
    max
  ){

    item.quantity =
      max;

  }


  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        x =>
          x.id !== id
      );

  }


  renderCart();

}


/* =====================================================
   RENDER CARRITO
===================================================== */

function renderCart(){

  const container =
    $("cart");


  container.innerHTML =
    "";


  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      'El carrito está vacío' +
      '</div>';


    $("total").textContent =
      "$0.00";


    return;

  }


  let total =
    0;


  cart.forEach(
    item => {

      const subtotal =
        Number(item.price) *
        Number(item.quantity);


      total +=
        subtotal;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "cart-item";


      row.innerHTML =

        '<div>' +

        '<div class="cart-name">' +

        esc(item.name) +

        '</div>' +

        '<div class="cart-price">' +

        money(item.price) +

        ' c/u' +

        '</div>' +

        '<div class="quantity">' +

        '<button type="button" ' +

        'data-action="minus">' +

        '−' +

        '</button>' +

        '<span>' +

        item.quantity +

        '</span>' +

        '<button type="button" ' +

        'data-action="plus">' +

        '+' +

        '</button>' +

        '</div>' +

        '</div>' +

        '<strong>' +

        money(subtotal) +

        '</strong>';


      row
        .querySelector(
          '[data-action="minus"]'
        )
        .addEventListener(
          "click",
          function(){

            changeQuantity(
              item.id,
              -1
            );

          }
        );


      row
        .querySelector(
          '[data-action="plus"]'
        )
        .addEventListener(
          "click",
          function(){

            changeQuantity(
              item.id,
              1
            );

          }
        );


      container.appendChild(
        row
      );

    }
  );


  $("total").textContent =
    money(total);

}


/* =====================================================
   CAMBIAR NEGOCIO
===================================================== */

async function changeBusiness(
  business
){

  if(
    business ===
    currentBusiness
  ){

    return;

  }


  currentBusiness =
    business;


  cart = [];

  selectedPaymentId =
    null;


  document
    .querySelectorAll(
      ".business-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          button.dataset.business ===
          currentBusiness

        );

      }
    );


  updateBusinessURL();


  renderCart();


  try{

    await loadBusinessData();

  }

  catch(error){

    console.error(
      error
    );

    showStatus(
      error.message ||
      "No se pudo cargar el negocio."
    );

  }

}


/* =====================================================
   COBRAR
===================================================== */

async function chargeSale(){

  clearStatus();


  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "warn"
    );

    return;

  }


  if(!selectedPaymentId){

    showStatus(
      "Selecciona un método de pago.",
      "warn"
    );

    return;

  }


  const button =
    $("chargeButton");


  button.disabled =
    true;


  button.textContent =
    "REGISTRANDO...";


  try{

    const items =
      cart.map(
        item => ({

          product_id:
            item.id,

          description:
            item.name,

          quantity:
            Number(
              item.quantity
            ),

          unit_price:
            Number(
              item.price
            ),

          subtotal:
            Number(
              item.price
            ) *
            Number(
              item.quantity
            )

        })
      );


    const result =
      await supabaseClient.rpc(
        "register_sale",
        {

          p_business_id:
            BUSINESS_IDS[
              currentBusiness
            ],

          p_customer_id:
            null,

          p_payment_method_id:
            selectedPaymentId,

          p_items:
            items,

          p_is_pending:
            false

        }
      );


    if(result.error){

      throw result.error;

    }


    const payment =
      payments.find(
        p =>
          p.id ===
          selectedPaymentId
      );


    const paymentName =
      payment?.name ||
      "Pago";


    const total =
      items.reduce(
        (
          sum,
          item
        ) =>
          sum +
          item.subtotal,
        0
      );


    alert(

      "Venta registrada\n\n" +

      currentBusiness +

      "\nTotal: " +

      money(total) +

      "\nPago: " +

      paymentName

    );


    cart = [];


    await loadBusinessData();


    showStatus(
      "Venta guardada correctamente en Supabase.",
      "ok"
    );


    console.log(
      "register_sale response:",
      result.data
    );

  }

  catch(error){

    console.error(
      "[POS] Error:",
      error
    );


    showStatus(
      "No se pudo registrar la venta:\n\n" +
      (
        error.message ||
        String(error)
      ),
      "error"
    );

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      "COBRAR";

  }

}


/* =====================================================
   EVENTOS
===================================================== */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function(){

          changeBusiness(
            button.dataset.business
          );

        }
      );

    }
  );


$("chargeButton")
  .addEventListener(
    "click",
    chargeSale
  );


/* =====================================================
   INICIO
===================================================== */

async function start(){

  try{

    currentBusiness =
      getBusinessFromURL();


    document
      .querySelectorAll(
        ".business-btn"
      )
      .forEach(
        button => {

          button.classList.toggle(

            "active",

            button.dataset.business ===
            currentBusiness

          );

        }
      );


    updateBusinessURL();


    await loadBusinessData();

  }

  catch(error){

    console.error(
      "[POS] Error inicializando:",
      error
    );


    showStatus(
      error.message ||
      "No se pudo conectar con Supabase.",
      "error"
    );

  }

}


start();

</script>

</body>

</html>
