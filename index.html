<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  margin-top:8px;
  color:#d1d5db;
  font-size:17px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

.status{
  display:none;
  margin-bottom:18px;
  padding:15px;
  border-radius:12px;
  font-weight:600;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

/* MENU */

.businesses{
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.customers-btn,
.accounts-btn,
.history-btn{
  padding:15px 22px;
  border-radius:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.business-btn{
  border:2px solid #ddd;
  background:white;
  color:#2680eb;
}

.business-btn.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

/* CLIENTES */

.customers-btn{
  border:2px solid #16a34a;
  background:#f0fdf4;
  color:#15803d;
}

/* CUENTAS */

.accounts-btn{
  border:2px solid #f59e0b;
  background:#fff7ed;
  color:#b45309;
}

/* HISTORIAL */

.history-btn{
  border:2px solid #2563eb;
  background:#eff6ff;
  color:#1d4ed8;
}

/* LAYOUT */

.layout{
  display:grid;
  grid-template-columns:1fr 400px;
  gap:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  font-size:25px;
  margin-bottom:20px;
}

/* PRODUCTOS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product{
  border:2px solid #ddd;
  border-radius:16px;
  padding:22px 15px;
  cursor:pointer;
  background:white;
  text-align:center;
}

.product.disabled{
  opacity:.45;
  cursor:not-allowed;
}

.product-name{
  color:#2680eb;
  font-weight:700;
  font-size:18px;
  margin-bottom:12px;
}

.price{
  color:#2680eb;
  font-size:27px;
  font-weight:800;
}

.stock{
  color:#666;
  font-size:17px;
  margin-top:10px;
}

/* CARRITO */

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee;
  gap:15px;
}

.cart-name{
  font-weight:700;
  font-size:18px;
}

.cart-price{
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.quantity button{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#eee;
  color:#2680eb;
  font-size:24px;
  cursor:pointer;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-size:19px;
  font-weight:600;
}

.subtotal{
  font-size:19px;
  font-weight:700;
  white-space:nowrap;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:28px;
  font-weight:800;
  margin-top:25px;
  padding-top:20px;
  border-top:3px solid #eee;
}

/* CLIENTE */

.customer-box{
  margin-top:20px;
  padding-top:20px;
  border-top:2px solid #eee;
}

.customer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.customer-title{
  font-size:20px;
  font-weight:700;
}

.manage-customers{
  border:none;
  background:#2680eb;
  color:white;
  border-radius:9px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
}

.customer-search{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  margin-bottom:10px;
}

.customer-select{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:11px;
  background:white;
  font-size:16px;
}

.customer-info{
  margin-top:10px;
  padding:10px 12px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-size:14px;
}

/* PAGOS */

.payment-title{
  margin-top:25px;
  margin-bottom:12px;
  font-size:20px;
  font-weight:700;
}

.payments{
  display:grid;
  gap:10px;
}

.payment{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  border-radius:12px;
  background:white;
  color:#2680eb;
  cursor:pointer;
  text-align:left;
  font-size:17px;
  font-weight:600;
}

.payment.active{
  background:#111827;
  color:white;
  border-color:#111827;
}

/* COBRAR */

.charge-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.charge,
.pending{
  width:100%;
  padding:18px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.pending{
  background:#f59e0b;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .business-btn,
  .customers-btn,
  .accounts-btn,
  .history-btn{
    flex:1;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:20px;
  }

  .charge-buttons{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

<h1>🧾 Sistema de Ventas POS</h1>

<p>
Administración de negocios y ventas
</p>

</header>

<div class="container">

<div id="status" class="status"></div>

<!-- =========================================
     MENU PRINCIPAL
========================================= -->

<div class="businesses">

<button
type="button"
class="business-btn active"
data-business="BakeQuiri">
BakeQuiri
</button>

<button
type="button"
class="business-btn"
data-business="SpicyRoll">
SpicyRoll
</button>

<button
type="button"
class="customers-btn"
id="customersButton">
👥 Clientes
</button>

<button
type="button"
class="accounts-btn"
id="accountsButton">
💳 Cuentas pendientes
</button>

<button
type="button"
class="history-btn"
id="historyButton">
📊 Historial de ventas
</button>

</div>

<div class="layout">

<!-- PRODUCTOS -->

<div class="card">

<h2>Productos</h2>

<div id="products">

<div class="empty">
Cargando productos...
</div>

</div>

</div>

<!-- CARRITO -->

<div class="card">

<h2>🛒 Carrito</h2>

<div id="cart">

<div class="empty">
El carrito está vacío
</div>

</div>

<div class="total">

<span>Total</span>

<span id="total">
$0.00
</span>

</div>

<!-- CLIENTE -->

<div class="customer-box">

<div class="customer-header">

<div class="customer-title">
👤 Cliente
</div>

<button
type="button"
class="manage-customers"
id="manageCustomers">
+ Cliente
</button>

</div>

<input
id="customerSearch"
class="customer-search"
type="search"
placeholder="🔎 Buscar cliente por nombre o teléfono"
autocomplete="off">

<select
id="customerSelect"
class="customer-select">

<option value="">
Consumidor general
</option>

</select>

<div
id="customerInfo"
class="customer-info">

Consumidor general

</div>

</div>

<!-- PAGOS -->

<div class="payment-title">
Método de pago
</div>

<div
id="payments"
class="payments">

<div class="empty">
Cargando métodos de pago...
</div>

</div>

<div class="charge-buttons">

<button
type="button"
id="chargeButton"
class="charge">
💵 COBRAR
</button>

<button
type="button"
id="pendingButton"
class="pending">
🟠 DEJAR A CUENTA
</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

let currentBusiness =
"BakeQuiri";

let products = [];

let customers = [];

/* =========================================
   UTILIDADES
========================================= */

const $ =
id => document.getElementById(id);

const money =
value =>
"$" + Number(value || 0).toFixed(2);

/* =========================================
   BOTÓN CLIENTES
========================================= */

$("customersButton")
.addEventListener(
  "click",
  function(){

    window.location.href =
    "clientes.html";

  }
);

/* =========================================
   BOTÓN CUENTAS
========================================= */

$("accountsButton")
.addEventListener(
  "click",
  function(){

    window.location.href =
    "cuentas.html";

  }
);

/* =========================================
   BOTÓN HISTORIAL
========================================= */

$("historyButton")
.addEventListener(
  "click",
  function(){

    window.location.href =
    "historial.html";

  }
);

/* =========================================
   + CLIENTE
========================================= */

$("manageCustomers")
.addEventListener(
  "click",
  function(){

    window.location.href =
    "clientes.html";

  }
);

/* =========================================
   CARGAR PRODUCTOS
========================================= */

async function loadProducts(){

  const businessId =
  BUSINESS_IDS[currentBusiness];

  const result =
  await supabaseClient

  .from("products")

  .select(
    "id,name,price,stock,active"
  )

  .eq(
    "business_id",
    businessId
  )

  .eq(
    "active",
    true
  )

  .order("name");

  if(result.error){

    console.error(result.error);

    $("products").innerHTML =
    '<div class="empty">No se pudieron cargar los productos.</div>';

    return;

  }

  products =
  result.data || [];

  renderProducts();

}

/* =========================================
   MOSTRAR PRODUCTOS
========================================= */

function renderProducts(){

  const container =
  $("products");

  if(!products.length){

    container.innerHTML =
    '<div class="empty">No hay productos activos.</div>';

    return;

  }

  container.innerHTML = "";

  products.forEach(
    product => {

      const button =
      document.createElement("button");

      button.type =
      "button";

      button.className =
      "product";

      if(Number(product.stock || 0) <= 0){

        button.classList.add("disabled");

        button.disabled = true;

      }

      button.innerHTML = `

        <div class="product-name">
          ${product.name}
        </div>

        <div class="price">
          ${money(product.price)}
        </div>

        <div class="stock">
          Existencia: ${Number(product.stock || 0)}
        </div>

      `;

      container.appendChild(button);

    }
  );

}

/* =========================================
   CAMBIO DE NEGOCIO
========================================= */

document
.querySelectorAll(".business-btn")
.forEach(
  button => {

    button.addEventListener(
      "click",
      async function(){

        currentBusiness =
        button.dataset.business;

        document
        .querySelectorAll(".business-btn")
        .forEach(
          b =>
          b.classList.remove("active")
        );

        button.classList.add("active");

        await loadProducts();

      }
    );

  }
);

/* =========================================
   INICIO
========================================= */

loadProducts();

</script>

</body>
</html>
