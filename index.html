<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 20px;
}

header h1{
  font-size:28px;
}

header p{
  font-size:15px;
  opacity:.75;
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:14px 15px;
  border-radius:12px;
  font-size:15px;
  display:none;
  font-weight:700;
  white-space:pre-line;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.offline{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.sync-box{
  display:none;
  margin-bottom:15px;
  padding:16px;
  border-radius:14px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-weight:700;
}

.sync-box.visible{
  display:block;
}

.sync-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.sync-info{
  font-size:16px;
}

.pending-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:30px;
  padding:0 9px;
  border-radius:20px;
  background:#2563eb;
  color:#fff;
  margin-left:5px;
}

.sync-button{
  border:none;
  border-radius:10px;
  padding:10px 14px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.sync-button:disabled{
  opacity:.6;
  cursor:wait;
}

.connection{
  max-width:1100px;
  margin:12px auto 0;
  padding:0 20px;
}

.connection-status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  background:#dcfce7;
  color:#166534;
}

.connection-status.offline{
  background:#fee2e2;
  color:#991b1b;
}

.connection-status.warning{
  background:#fef3c7;
  color:#92400e;
}

.connection-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#16a34a;
}

.connection-status.offline .connection-dot{
  background:#dc2626;
}

.connection-status.warning .connection-dot{
  background:#f59e0b;
}

.businesses{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.nav-btn{
  border:none;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  border:2px solid #ddd;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}

.nav-btn{
  color:#2563eb;
}

.nav-btn.accounts{
  background:#fff7ed;
  border-color:#f59e0b;
  color:#b45309;
}

.nav-btn.clients{
  background:#ecfdf5;
  border-color:#10b981;
  color:#047857;
}

.nav-btn.history{
  background:#f5f3ff;
  border-color:#7c3aed;
  color:#6d28d9;
}

.nav-btn.inventory{
  background:#eff6ff;
  border-color:#2563eb;
  color:#1d4ed8;
}

.layout{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
  font-size:21px;
  margin-bottom:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:2px solid #ddd;
  border-radius:14px;
  padding:18px 14px;
  cursor:pointer;
  background:#fff;
  text-align:left;
}

.product:hover{
  border-color:#2563eb;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:700;
  font-size:17px;
  margin-bottom:9px;
}

.price{
  font-size:23px;
  font-weight:800;
  color:#2563eb;
}

.stock{
  font-size:14px;
  color:#666;
  margin-top:7px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:700;
}

.cart-price{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:7px;
  background:#eee;
  cursor:pointer;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:25px;
  font-weight:800;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #eee;
}

.payment-title,
.customer-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:800;
  font-size:17px;
}

.payments{
  display:grid;
  gap:9px;
}

.payment{
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.customer-box{
  position:relative;
}

.customer-row{
  display:flex;
  gap:8px;
}

.customer-search{
  flex:1;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:15px;
  min-width:0;
  background:#fff;
}

.customer-search:focus{
  outline:none;
  border-color:#2563eb;
}

.add-client{
  border:none;
  background:#2563eb;
  color:#fff;
  padding:0 14px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.customer-results{
  margin-top:8px;
  display:none;
  border:2px solid #ddd;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;
  left:0;
  right:0;
  z-index:100;
}

.customer-result{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid #eee;
  background:#fff;
  padding:13px;
  text-align:left;
  cursor:pointer;
}

.customer-result:hover{
  background:#f3f4f6;
}

.customer-result strong{
  display:block;
  font-size:15px;
}

.customer-result small{
  display:block;
  color:#6b7280;
  margin-top:4px;
}

.selected-customer{
  margin-top:8px;
  padding:12px;
  border-radius:9px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-size:14px;
  font-weight:600;
}

.clear-customer{
  border:none;
  background:none;
  color:#dc2626;
  font-weight:700;
  cursor:pointer;
  margin-left:8px;
}

.general-customer{
  margin-top:8px;
  padding:13px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-weight:700;
  cursor:pointer;
}

.charge,
.account{
  width:100%;
  margin-top:15px;
  padding:16px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.account{
  margin-top:10px;
  background:#f59e0b;
}

.charge:disabled,
.account:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

button{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:950px){

  .navigation{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  .connection{
    padding:0 15px;
  }

  header h1{
    font-size:25px;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .business-btn{
    flex:1;
  }

  .layout{
    gap:15px;
  }

  .card{
    padding:16px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:15px 12px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:20px;
  }

  .customer-row{
    flex-direction:column;
  }

  .add-client{
    padding:12px;
  }

  .sync-row{
    align-items:stretch;
    flex-direction:column;
  }

  .sync-button{
    width:100%;
  }

}

</style>

</head>

<body>

<header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

/* =====================================================
   ESTADO
===================================================== */

let supabaseClient = null;

let currentBusiness =
"BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId =
null;

let selectedCustomerId =
null;

let syncingQueue =
false;

/* =====================================================
   STORAGE
===================================================== */

const CACHE_KEY =
"POS_OFFLINE_CACHE_V3";

const QUEUE_KEY =
"POS_OFFLINE_SALES_QUEUE_V3";

/* =====================================================
   UTILIDADES
===================================================== */

function $(id){

  return document.getElementById(id);

}

function money(value){

  return "$" +
    Number(value || 0)
    .toFixed(2);

}

function escapeHTML(value){

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

function showStatus(
  message,
  type="error"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}

function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}

/* =====================================================
   CONEXIÓN
===================================================== */

function updateConnectionStatus(
  mode="online"
){

  const element =
    $("connectionStatus");

  const text =
    $("connectionText");

  element.classList.remove(
    "offline",
    "warning"
  );

  if(mode === "offline"){

    element.classList.add(
      "offline"
    );

    text.textContent =
      "Sin conexión a Internet";

    return;

  }

  if(mode === "warning"){

    element.classList.add(
      "warning"
    );

    text.textContent =
      "Internet disponible · Supabase no responde";

    return;

  }

  text.textContent =
    "Internet disponible";

}

/* =====================================================
   CACHE
===================================================== */

function saveOfflineCache(){

  try{

    const data = {

      products:
        products,

      payments:
        payments,

      customers:
        customers,

      currentBusiness:
        currentBusiness,

      savedAt:
        new Date().toISOString()

    };

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(data)
    );

  }
  catch(error){

    console.warn(
      "No se pudo guardar cache:",
      error
    );

  }

}

function loadOfflineCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if(!raw){

      return false;

    }

    const data =
      JSON.parse(raw);

    if(!data){

      return false;

    }

    products =
      Array.isArray(
        data.products
      )
      ? data.products
      : [];

    payments =
      Array.isArray(
        data.payments
      )
      ? data.payments
      : [];

    customers =
      Array.isArray(
        data.customers
      )
      ? data.customers
      : [];

    return true;

  }
  catch(error){

    console.warn(
      "Cache inválido:",
      error
    );

    return false;

  }

}

/* =====================================================
   COLA DE VENTAS
===================================================== */

function getOfflineQueue(){

  try{

    const raw =
      localStorage.getItem(
        QUEUE_KEY
      );

    if(!raw){

      return [];

    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }
  catch(error){

    console.warn(
      "Cola offline inválida:",
      error
    );

    return [];

  }

}

function saveOfflineQueue(
  queue
){

  try{

    localStorage.setItem(
      QUEUE_KEY,
      JSON.stringify(queue)
    );

    renderPendingCount();

  }
  catch(error){

    console.error(
      "No se pudo guardar la cola:",
      error
    );

    showStatus(
      "No se pudo guardar la venta localmente. Revisa el almacenamiento del dispositivo.",
      "error"
    );

  }

}

function addToOfflineQueue(
  operation
){

  const queue =
    getOfflineQueue();

  queue.push({

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : (
          Date.now() +
          "-" +
          Math.random()
        ),

    createdAt:
      new Date().toISOString(),

    attempts:0,

    ...operation

  });

  saveOfflineQueue(
    queue
  );

}

function renderPendingCount(){

  const queue =
    getOfflineQueue();

  const count =
    queue.length;

  $("pendingCount")
    .textContent =
    count;

  const box =
    $("syncBox");

  if(count > 0){

    box.classList.add(
      "visible"
    );

  }
  else{

    box.classList.remove(
      "visible"
    );

  }

}

/* =====================================================
   SUPABASE
===================================================== */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    throw new Error(
      "No se pudo cargar Supabase."
    );

  }

  supabaseClient =
    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

}

/* =====================================================
   CARGAR DATOS
===================================================== */

async function loadBusinessData(){

  $("products").innerHTML =
    '<div class="empty">' +
    "Cargando productos..." +
    "</div>";

  $("payments").innerHTML =
    '<div class="empty">' +
    "Cargando métodos de pago..." +
    "</div>";

  const businessId =
    BUSINESS_IDS[
      currentBusiness
    ];

  try{

    if(!navigator.onLine){

      throw new Error(
        "OFFLINE"
      );

    }

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order(
          "name"
        ),

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order(
          "name"
        ),

      supabaseClient

        .from("customers")

        .select(
          "id,name,phone,notes"
        )

        .order(
          "name"
        )

    ]);

    if(productsResult.error){

      throw productsResult.error;

    }

    if(paymentsResult.error){

      throw paymentsResult.error;

    }

    if(customersResult.error){

      throw customersResult.error;

    }

    products =
      productsResult.data ||
      [];

    payments =
      paymentsResult.data ||
      [];

    customers =
      customersResult.data ||
      [];

    saveOfflineCache();

    if(
      !payments.some(
        p =>
          p.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }

    if(
      !customers.some(
        c =>
          c.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

    updateConnectionStatus(
      "online"
    );

    return true;

  }
  catch(error){

    console.warn(
      "No se pudieron cargar los datos:",
      error
    );

    if(
      loadOfflineCache()
    ){

      if(
        !payments.some(
          p =>
            p.id ===
            selectedPaymentId
        )
      ){

        selectedPaymentId =
          payments[0]?.id ||
          null;

      }

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      if(
        navigator.onLine
      ){

        updateConnectionStatus(
          "warning"
        );

      }
      else{

        updateConnectionStatus(
          "offline"
        );

      }

      return false;

    }

    products = [];

    payments = [];

    customers = [];

    $("products").innerHTML =
      '<div class="empty">' +
      "No hay datos guardados para trabajar offline." +
      "</div>";

    $("payments").innerHTML =
      '<div class="empty">' +
      "No hay métodos de pago guardados." +
      "</div>";

    if(
      navigator.onLine
    ){

      updateConnectionStatus(
        "warning"
      );

    }
    else{

      updateConnectionStatus(
        "offline"
      );

    }

    return false;

  }

}

/* =====================================================
   SINCRONIZAR VENTAS
===================================================== */

async function syncOfflineSales(){

  if(syncingQueue){

    return;

  }

  const initialQueue =
    getOfflineQueue();

  if(!initialQueue.length){

    renderPendingCount();

    return;

  }

  if(!navigator.onLine){

    updateConnectionStatus(
      "offline"
    );

    return;

  }

  if(!supabaseClient){

    return;

  }

  syncingQueue =
    true;

  $("syncButton").disabled =
    true;

  $("syncButton").textContent =
    "Sincronizando...";

  let queue =
    getOfflineQueue();

  let synced =
    0;

  let failed =
    0;

  try{

    for(
      const operation of queue
    ){

      try{

        const result =
          await supabaseClient.rpc(
            "register_sale",
            {

              p_business_id:
                operation.businessId,

              p_customer_id:
                operation.customerId ||
                null,

              p_payment_method_id:
                operation.isPending
                ? null
                : (
                    operation.paymentMethodId ||
                    null
                  ),

              p_items:
                operation.items,

              p_is_pending:
                Boolean(
                  operation.isPending
                )

            }
          );

        if(result.error){

          throw result.error;

        }

        queue =
          queue.filter(
            item =>
              item.id !==
              operation.id
          );

        saveOfflineQueue(
          queue
        );

        synced++;

      }
      catch(error){

        console.error(
          "Error sincronizando venta:",
          error
        );

        failed++;

        const index =
          queue.findIndex(
            item =>
              item.id ===
              operation.id
          );

        if(index >= 0){

          queue[index].attempts =
            Number(
              queue[index].attempts || 0
            ) + 1;

          queue[index].lastError =
            error?.message ||
            String(error);

          queue[index].lastAttemptAt =
            new Date().toISOString();

          saveOfflineQueue(
            queue
          );

        }

        /*
          No detenemos las demás ventas.
          Si una falla, intentamos las siguientes.
        */

      }

    }

    renderPendingCount();

    if(
      queue.length === 0
    ){

      updateConnectionStatus(
        "online"
      );

      showStatus(
        synced > 0
        ? (
            "✅ Se sincronizaron " +
            synced +
            (
              synced === 1
              ? " venta pendiente."
              : " ventas pendientes."
            )
          )
        : "No había ventas pendientes.",
        "ok"
      );

      await loadBusinessData();

    }
    else{

      updateConnectionStatus(
        "warning"
      );

      showStatus(

        "Internet está disponible, pero Supabase todavía no acepta " +
        "todas las operaciones.\n\n" +

        "Pendientes restantes: " +
        queue.length,

        "offline"

      );

    }

  }
  finally{

    syncingQueue =
      false;

    $("syncButton").disabled =
      false;

    $("syncButton").textContent =
      "🔄 Sincronizar ahora";

    renderPendingCount();

  }

}

function addToCart(
  product
){

  const stock =
    Number(
      product.stock || 0
    );

  if(stock <= 0){

    showStatus(
      "Este producto está agotado.",
      "error"
    );

    return;

  }

  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );

  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }
    else{

      showStatus(
        "No puedes agregar más unidades que la existencia.",
        "error"
      );

    }

  }
  else{

    cart.push({

      ...product,

      quantity:1

    });

  }

  renderCart();

}

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id === id
    );

  if(!item){

    return;

  }

  const product =
    products.find(
      p =>
        p.id === id
    );

  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  const newQuantity =
    item.quantity +
    amount;

  if(newQuantity > max){

    showStatus(
      "No hay suficiente existencia disponible.",
      "error"
    );

    return;

  }

  item.quantity =
    newQuantity;

  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !== id
      );

  }

  renderCart();

}

function getCartTotal(){

  return cart.reduce(

    (
      sum,
      item
    ) =>

      sum +

      Number(
        item.price
      ) *

      Number(
        item.quantity
      ),

    0

  );

}

function renderCart(){

  const container =
    $("cart");

  container.innerHTML =
    "";

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      "El carrito está vacío" +
      "</div>";

    $("total").textContent =
      "$0.00";

    return;

  }

  cart.forEach(
    item => {

      const subtotal =

        Number(
          item.price
        ) *

        Number(
          item.quantity
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cart-item";

      const info =
        document.createElement(
          "div"
        );

      info.innerHTML =

        '<div class="cart-name">' +

        escapeHTML(
          item.name
        ) +

        "</div>" +

        '<div class="cart-price">' +

        money(
          item.price
        ) +

        " c/u</div>";

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "quantity";

      const minus =
        document.createElement(
          "button"
        );

      minus.type =
        "button";

      minus.textContent =
        "−";

      minus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            -1
          )
      );

      const quantity =
        document.createElement(
          "span"
        );

      quantity.textContent =
        item.quantity;

      const plus =
        document.createElement(
          "button"
        );

      plus.type =
        "button";

      plus.textContent =
        "+";

      plus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            1
          )
      );

      controls.append(
        minus,
        quantity,
        plus
      );

      info.appendChild(
        controls
      );

      const subtotalElement =
        document.createElement(
          "strong"
        );

      subtotalElement.textContent =
        money(
          subtotal
        );

      row.append(
        info,
        subtotalElement
      );

      container.appendChild(
        row
      );

    }
  );

  $("total").textContent =
    money(
      getCartTotal()
    );

}

===================================================== */

function buildSaleOperation(
  isPending
){

  const items =
    cart.map(
      item => ({

        product_id:
          item.id,

        description:
          item.name,

        quantity:
          Number(
            item.quantity
          ),

        unit_price:
          Number(
            item.price
          ),

        subtotal:
          Number(
            item.price
          ) *
          Number(
            item.quantity
          )

      })
    );

  return {

    businessId:
      BUSINESS_IDS[
        currentBusiness
      ],

    customerId:
      selectedCustomerId ||
      null,

    paymentMethodId:
      isPending
      ? null
      : selectedPaymentId,

    items:
      items,

    isPending:
      Boolean(
        isPending
      )

  };

}

/* =====================================================
   REGISTRAR VENTA EN SUPABASE
===================================================== */

async function sendSaleToSupabase(
  operation
){

  if(!supabaseClient){

    throw new Error(
      "Supabase no está inicializado."
    );

  }

  if(!navigator.onLine){

    throw new Error(
      "Sin conexión a Internet."
    );

  }

  const result =
    await supabaseClient.rpc(
      "register_sale",
      {

        p_business_id:
          operation.businessId,

        p_customer_id:
          operation.customerId ||
          null,

        p_payment_method_id:
          operation.isPending
          ? null
          : (
              operation.paymentMethodId ||
              null
            ),

        p_items:
          operation.items,

        p_is_pending:
          Boolean(
            operation.isPending
          )

      }
    );

  if(result.error){

    throw result.error;

  }

  return result.data;

}

/* =====================================================
   REGISTRAR VENTA
===================================================== */

async function registerSale(
  isPending
){

  clearStatus();

  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "error"
    );

    return;

  }

  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago.",
      "error"
    );

    return;

  }

  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente.",
      "error"
    );

    return;

  }

  const operation =
    buildSaleOperation(
      isPending
    );

  const total =
    getCartTotal();

  const customer =
    customers.find(
      c =>
        c.id ===
        selectedCustomerId
    );

  const paymentName =
    payments.find(
      p =>
        p.id ===
        selectedPaymentId
    )?.name ||
    "Pago";

  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";

  try{

    /*
      PRIMERO intentamos enviar directamente.

      No usamos navigator.onLine como única prueba,
      porque tener Internet no significa que Supabase
      esté respondiendo correctamente.
    */

    await sendSaleToSupabase(
      operation
    );

    alert(

      (
        isPending
        ? "Cuenta registrada"
        : "Venta registrada"
      ) +

      "\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(
        total
      ) +

      (
        isPending
        ? ""
        : "\nPago: " +
          paymentName
      )

    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    await loadBusinessData();

    /*
      Si había ventas pendientes, aprovechamos
      la conexión recuperada para sincronizarlas.
    */

    await syncOfflineSales();

    showStatus(

      isPending
      ? "Cuenta guardada correctamente."
      : "Venta guardada correctamente.",

      "ok"

    );

  }
  catch(error){

    console.error(
      "No se pudo enviar la operación:",
      error
    );

    /*
      MUY IMPORTANTE:

      Si hay Internet pero Supabase falla,
      NO decimos que el teléfono está offline.

      Guardamos la operación en la cola local.
    */

    addToOfflineQueue(
      operation
    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    if(
      navigator.onLine
    ){

      updateConnectionStatus(
        "warning"
      );

      showStatus(

        "⚠️ No fue posible enviar la operación a Supabase.\n\n" +

        "La venta quedó guardada localmente y se intentará sincronizar automáticamente.\n\n" +

        "Motivo: " +

        (
          error?.message ||
          String(error)
        ),

        "offline"

      );

    }
    else{

      updateConnectionStatus(
        "offline"
      );

      showStatus(

        "📴 Sin Internet.\n\n" +

        "La venta quedó guardada localmente y se sincronizará automáticamente al recuperar la conexión.",

        "offline"

      );

    }

    alert(

      "⚠️ Venta guardada localmente.\n\n" +

      (
        navigator.onLine
        ? "Hay Internet, pero Supabase no aceptó la operación."
        : "No hay conexión a Internet."
      ) +

      "\n\n" +

      "La venta NO se perdió.\n\n" +

      "Pendientes por sincronizar: " +

      getOfflineQueue().length

    );

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      originalText;

    renderPendingCount();

  }

}

async function startApp(){

  try{

    initializeSupabase();

  }
  catch(error){

    console.error(
      "Supabase:",
      error
    );

  }

  renderPendingCount();

  /*
    Cargamos cache inmediatamente.

    Esto permite que el POS muestre los productos
    aunque Supabase todavía esté tardando.
  */

  if(
    loadOfflineCache()
  ){

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

  }

  /*
    Intentamos actualizar desde Supabase.
  */

  await loadBusinessData();

  /*
    Si hay Internet y existen ventas pendientes,
    intentamos sincronizarlas automáticamente.
  */

  if(
    navigator.onLine
  ){

    await syncOfflineSales();

  }

  renderPendingCount();

}

startApp();

</script>
