<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
}

html{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:#f5f6f8;
  color:#171717;
}

header{
  background:#111827;
  color:white;
  padding-top:calc(25px + env(safe-area-inset-top));
  padding-right:20px;
  padding-bottom:25px;
  padding-left:20px;
  position:relative;
  z-index:2;
}

header h1{
  margin:0;
  font-size:30px;
  line-height:1.15;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}

.status{
  display:none;
  padding:13px 15px;
  border-radius:12px;
  margin-bottom:20px;
  font-weight:700;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.warn{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.business-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.control-panel{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  min-height:48px;
  border-radius:12px;
  transition:.15s ease;
}

button:active{
  transform:scale(.98);
}

.business-btn{
  background:#fff;
  color:#2680eb;
  border:2px solid #ddd;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
}

.accounts{
  background:#f59e0b;
  color:white;
}

.customers{
  background:#10b981;
  color:white;
}

.history{
  background:#7c3aed;
  color:white;
}

.inventory-btn{
  background:#0891b2;
  color:white;
}

.dashboard-btn{
  background:#fff;
  color:#2563eb;
  border:2px solid #ddd;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.metric-card{
  position:relative;
  overflow:hidden;
  min-width:0;
}

.metric-icon{
  font-size:27px;
  margin-bottom:12px;
}

.metric-title{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
  line-height:1.25;
  overflow-wrap:anywhere;
}

.metric{
  font-size:30px;
  font-weight:800;
  line-height:1.1;
}

.green{
  color:#16a34a;
}

.blue{
  color:#2563eb;
}

.red{
  color:#dc2626;
}

.main-grid{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:20px;
}

.section-title{
  font-size:21px;
  font-weight:800;
  margin:0 0 18px;
}

.sales-list{
  display:grid;
  gap:10px;
}

.sale-row{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  background:#fff;
}

.sale-main{
  display:grid;
  grid-template-columns:1.4fr .8fr .7fr;
  gap:12px;
  align-items:center;
}

.sale-customer{
  min-width:0;
}

.customer-link{
  color:#2563eb;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  word-break:break-word;
}

.customer-link:hover{
  text-decoration:underline;
}

.customer-general{
  color:#222;
  font-weight:700;
  word-break:break-word;
}

.sale-date{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
  line-height:1.35;
}

.sale-total{
  font-weight:800;
  font-size:17px;
}

.sale-status{
  text-align:right;
}

.status-pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.open{
  background:#fef3c7;
  color:#92400e;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.inventory-list{
  display:grid;
  gap:9px;
}

.stock-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border:1px solid #eee;
  border-radius:12px;
  background:#fafafa;
}

.stock-name{
  font-weight:700;
  min-width:0;
  word-break:break-word;
}

.stock-number{
  font-weight:800;
  white-space:nowrap;
}

.low{
  color:#dc2626;
}

.stock-warning{
  font-size:11px;
  margin-left:6px;
  color:#dc2626;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

@media(max-width:900px){

  .action-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .main-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding-top:calc(22px + env(safe-area-inset-top));
    padding-right:17px;
    padding-bottom:22px;
    padding-left:17px;
  }

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
  }

  .container{
    width:100%;
    padding:15px;
  }

  .control-panel{
    padding:13px;
    border-radius:17px;
  }

  .business-selector{
    grid-template-columns:1fr 1fr;
  }

  .action-grid{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    min-height:46px;
    font-size:13px;
    padding:8px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
    border-radius:16px;
    min-width:0;
  }

  .metric-card{
    min-height:150px;
  }

  .metric-icon{
    font-size:22px;
    margin-bottom:10px;
  }

  .metric-title{
    font-size:12px;
    line-height:1.25;
  }

  .metric{
    font-size:23px;
  }

  .section-title{
    font-size:19px;
  }

  .sale-main{
    grid-template-columns:1fr;
    gap:7px;
  }

  .sale-status{
    text-align:left;
  }

  .sale-total{
    font-size:20px;
  }

  .sale-row{
    padding:16px;
  }

  .sale-date{
    font-size:14px;
  }

}

@media(max-width:390px){

  .action-grid{
    grid-template-columns:1fr 1fr;
  }

  .metric{
    font-size:21px;
  }

  .metric-title{
    font-size:11px;
  }

  .business-btn{
    font-size:13px;
  }

  .metric-card{
    min-height:145px;
  }

}

@supports (-webkit-touch-callout:none){

  header{
    padding-top:calc(22px + env(safe-area-inset-top));
  }

}

</style>

</head>

<body>

<header>

  <h1>🧾 Sistema de Ventas POS</h1>

  <p>
    Administración de negocios y ventas
  </p>

</header>

<div class="container">

  <div id="status" class="status"></div>

  <div class="control-panel">

    <div class="business-selector">

      <button
        type="button"
        class="business-btn active"
        data-business="BakeQuiri">

        🧁 BakeQuiri

      </button>

      <button
        type="button"
        class="business-btn"
        data-business="SpicyRoll">

        🍣 SpicyRoll

      </button>

    </div>

    <div class="action-grid">

      <button
        type="button"
        id="refresh"
        class="refresh">

        🔄 Actualizar

      </button>

      <button
        type="button"
        id="accounts"
        class="accounts">

        💰 Cuentas

      </button>

      <button
        type="button"
        id="customers"
        class="customers">

        👥 Clientes

      </button>

      <button
        type="button"
        id="history"
        class="history">

        🧾 Historial

      </button>

      <button
        type="button"
        id="inventory"
        class="inventory-btn">

        📦 Inventario

      </button>

      <button
        type="button"
        id="dashboard"
        class="dashboard-btn">

        📊 Dashboard

      </button>

    </div>

  </div>

  <div class="cards">

    <div class="card metric-card">

      <div class="metric-icon">💰</div>

      <div class="metric-title">
        VENTAS DE HOY
      </div>

      <div
        id="todaySales"
        class="metric green">

        $0.00

      </div>

    </div>

    <div class="card metric-card">

      <div class="metric-icon">🧾</div>

      <div class="metric-title">
        NÚMERO DE VENTAS
      </div>

      <div
        id="salesCount"
        class="metric blue">

        0

      </div>

    </div>

    <div class="card metric-card">

      <div class="metric-icon">📦</div>

      <div class="metric-title">
        PRODUCTOS ACTIVOS
      </div>

      <div
        id="productCount"
        class="metric">

        0

      </div>

    </div>

    <div class="card metric-card">

      <div class="metric-icon">⚠️</div>

      <div class="metric-title">
        STOCK BAJO
      </div>

      <div
        id="lowStock"
        class="metric red">

        0

      </div>

    </div>

  </div>

  <div class="main-grid">

    <div class="card">

      <h2 class="section-title">
        🧾 Ventas de hoy
      </h2>

      <div id="salesContainer">

        <div class="loading">
          Cargando ventas...
        </div>

      </div>

    </div>

    <div class="card">

      <h2 class="section-title">
        📦 Inventario
      </h2>

      <div id="inventoryContainer">

        <div class="loading">
          Cargando inventario...
        </div>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   NEGOCIOS
========================================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

let currentBusiness =
"BakeQuiri";


/* =========================================================
   HELPERS
========================================================= */

const $ =
id =>
document.getElementById(id);

const money =
value =>
"$" +
Number(value || 0).toFixed(2);


/* =========================================================
   FECHA
========================================================= */

function formatSaleDateTime(
  createdAt
){

  if(!createdAt){
    return "";
  }

  const date =
  new Date(createdAt);

  if(isNaN(date.getTime())){
    return "";
  }

  const dateText =
  date.toLocaleDateString(
    "es-MX",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

  const timeText =
  date.toLocaleTimeString(
    "es-MX",
    {
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  );

  return (
    dateText +
    " · " +
    timeText
  );

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = "error"
){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


/* =========================================================
   DASHBOARD / DATOS
========================================================= */

async function loadDashboard(){

  $("salesContainer").innerHTML =
  '<div class="loading">Cargando ventas...</div>';

  $("inventoryContainer").innerHTML =
  '<div class="loading">Cargando inventario...</div>';

  $("status").className =
  "status";

  const businessId =
  BUSINESS_IDS[currentBusiness];

  if(!businessId){

    showStatus(
      "No se encontró el negocio seleccionado.",
      "error"
    );

    return;

  }


  /* =======================================================
     PRODUCTOS
  ======================================================= */

  let products = [];

  try{

    const productsResult =
    await supabaseClient
      .from("products")
      .select(
        "id,name,price,stock,active"
      )
      .eq(
        "business_id",
        businessId
      )
      .eq(
        "active",
        true
      )
      .order("name");

    if(productsResult.error){
      throw productsResult.error;
    }

    products =
    productsResult.data || [];

    $("productCount").textContent =
    products.length;

    $("lowStock").textContent =
    products.filter(
      product =>
      Number(product.stock || 0) <= 5
    ).length;

    renderInventory(products);

  }

  catch(error){

    console.error(
      "Error cargando productos:",
      error
    );

    $("productCount").textContent =
    "0";

    $("lowStock").textContent =
    "0";

    $("inventoryContainer").innerHTML =
    '<div class="empty">' +
    "No se pudieron cargar los productos." +
    "</div>";

  }


  /* =======================================================
     VENTAS
  ======================================================= */

  let sales = [];

  try{

    const start =
    new Date();

    start.setHours(
      0,
      0,
      0,
      0
    );

    const salesResult =
    await supabaseClient
      .from("sales")
      .select(
        "id,total,balance,status,created_at,customer_id,sale_date"
      )
      .eq(
        "business_id",
        businessId
      )
      .gte(
        "created_at",
        start.toISOString()
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(salesResult.error){
      throw salesResult.error;
    }

    sales =
    salesResult.data || [];


    const total =
    sales.reduce(
      (sum,sale) => {

        if(
          sale.status ===
          "cancelled"
        ){
          return sum;
        }

        return (
          sum +
          Number(
            sale.total || 0
          )
        );

      },
      0
    );

    $("todaySales").textContent =
    money(total);

    $("salesCount").textContent =
    sales.filter(
      sale =>
      sale.status !==
      "cancelled"
    ).length;


    await renderSales(
      sales
    );

  }

  catch(error){

    console.error(
      "Error cargando ventas:",
      error
    );

    $("todaySales").textContent =
    "$0.00";

    $("salesCount").textContent =
    "0";

    $("salesContainer").innerHTML =
    '<div class="empty">' +
    "No se pudieron cargar las ventas." +
    "</div>";

  }


  showStatus(
    currentBusiness +
    " actualizado correctamente.",
    "ok"
  );

}


/* =========================================================
   INVENTARIO
========================================================= */

function renderInventory(
  products
){

  const container =
  $("inventoryContainer");

  if(!products.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay productos activos." +
    "</div>";

    return;

  }

  container.innerHTML =
  "";

  const sortedProducts =
  [...products].sort(
    (a,b) =>
    Number(a.stock || 0) -
    Number(b.stock || 0)
  );

  sortedProducts.forEach(
    product => {

      const row =
      document.createElement("div");

      row.className =
      "stock-row";

      const name =
      document.createElement("div");

      name.className =
      "stock-name";

      name.textContent =
      product.name;

      const stock =
      document.createElement("div");

      stock.className =
      "stock-number";

      const stockValue =
      Number(
        product.stock || 0
      );

      if(stockValue <= 5){

        stock.classList.add(
          "low"
        );

      }

      stock.textContent =
      stockValue +
      " uds";

      if(stockValue <= 5){

        const warning =
        document.createElement("span");

        warning.className =
        "stock-warning";

        warning.textContent =
        "⚠️";

        stock.appendChild(
          warning
        );

      }

      row.append(
        name,
        stock
      );

      container.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   VENTAS
========================================================= */

async function renderSales(
  sales
){

  const container =
  $("salesContainer");

  if(!sales.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay ventas registradas hoy." +
    "</div>";

    return;

  }


  const customerIds =
  [
    ...new Set(
      sales
        .map(
          sale =>
          sale.customer_id
        )
        .filter(Boolean)
    )
  ];


  const customerMap =
  new Map();


  /*
   * IMPORTANTE:
   *
   * NO usamos business_id aquí.
   *
   * La tabla customers de tu base de datos
   * no tiene esa columna.
   */

  if(customerIds.length){

    try{

      const customersResult =
      await supabaseClient
        .from("customers")
        .select(
          "id,name,phone"
        )
        .in(
          "id",
          customerIds
        );


      /*
       * Si la consulta de clientes falla,
       * NO detenemos el Dashboard.
       */

      if(customersResult.error){

        console.warn(
          "No se pudieron cargar los clientes:",
          customersResult.error
        );

      }

      else{

        (
          customersResult.data || []
        ).forEach(
          customer => {

            customerMap.set(
              customer.id,
              customer
            );

          }
        );

      }

    }

    catch(error){

      console.warn(
        "Error opcional cargando clientes:",
        error
      );

    }

  }


  container.innerHTML =
  "";

  const list =
  document.createElement("div");

  list.className =
  "sales-list";


  sales
    .slice(0,20)
    .forEach(
      sale => {

        const customer =
        customerMap.get(
          sale.customer_id
        );

        const customerName =
        customer?.name ||
        "Consumidor general";


        const row =
        document.createElement("div");

        row.className =
        "sale-row";


        const customerDiv =
        document.createElement("div");

        customerDiv.className =
        "sale-customer";


        if(
          sale.customer_id &&
          customer
        ){

          const link =
          document.createElement("a");

          link.className =
          "customer-link";

          link.href =
          "historial.html" +
          "?customer_id=" +
          encodeURIComponent(
            sale.customer_id
          ) +
          "&business=" +
          encodeURIComponent(
            currentBusiness
          );

          link.textContent =
          customerName;

          link.title =
          "Ver historial de " +
          customerName;

          customerDiv.appendChild(
            link
          );

        }

        else{

          const general =
          document.createElement("span");

          general.className =
          "customer-general";

          general.textContent =
          customerName;

          customerDiv.appendChild(
            general
          );

        }


        const dateDiv =
        document.createElement("div");

        dateDiv.className =
        "sale-date";

        dateDiv.textContent =
        formatSaleDateTime(
          sale.created_at
        );

        customerDiv.appendChild(
          dateDiv
        );


        const totalDiv =
        document.createElement("div");

        totalDiv.className =
        "sale-total";

        totalDiv.textContent =
        money(
          sale.total
        );


        const statusDiv =
        document.createElement("div");

        statusDiv.className =
        "sale-status";


        const paid =
        sale.status ===
        "paid";

        const cancelled =
        sale.status ===
        "cancelled";


        const statusPill =
        document.createElement("span");

        statusPill.className =
        "status-pill " +
        (
          paid
          ? "paid"
          : cancelled
          ? "cancelled"
          : "open"
        );


        if(paid){

          statusPill.textContent =
          "✓ Pagada";

        }

        else if(cancelled){

          statusPill.textContent =
          "Cancelada";

        }

        else{

          statusPill.textContent =
          "🔴 Debe " +
          money(
            sale.balance || 0
          );

        }


        statusDiv.appendChild(
          statusPill
        );


        const main =
        document.createElement("div");

        main.className =
        "sale-main";

        main.append(
          customerDiv,
          totalDiv,
          statusDiv
        );

        row.appendChild(
          main
        );

        list.appendChild(
          row
        );

      }
    );


  container.appendChild(
    list
  );

}


/* =========================================================
   CAMBIO DE NEGOCIO
========================================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;

        if(
          business ===
          currentBusiness
        ){
          return;
        }

        currentBusiness =
        business;

        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          b =>
          b.classList.remove(
            "active"
          )
        );

        button.classList.add(
          "active"
        );

        await loadDashboard();

      }
    );

  }
);
