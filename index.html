<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 20px;
}

header h1{
  font-size:28px;
}

header p{
  font-size:15px;
  opacity:.75;
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:13px 15px;
  border-radius:10px;
  font-size:14px;
  display:none;
  font-weight:600;
  white-space:pre-line;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.offline{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.pending-sync{
  margin:0 0 20px;
  padding:18px;
  border-radius:16px;
  background:#eff6ff;
  border:3px solid #bfdbfe;
  color:#1d4ed8;
  font-size:18px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.pending-sync.show{
  display:flex;
}

.pending-count{
  min-width:55px;
  height:55px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.businesses{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.nav-btn{
  border:none;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  border:2px solid #ddd;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}

.nav-btn{
  color:#2563eb;
}

.nav-btn.accounts{
  background:#fff7ed;
  border-color:#f59e0b;
  color:#b45309;
}

.nav-btn.clients{
  background:#ecfdf5;
  border-color:#10b981;
  color:#047857;
}

.nav-btn.history{
  background:#f5f3ff;
  border-color:#7c3aed;
  color:#6d28d9;
}

.nav-btn.inventory{
  background:#eff6ff;
  border-color:#2563eb;
  color:#1d4ed8;
}

.layout{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
  font-size:21px;
  margin-bottom:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:2px solid #ddd;
  border-radius:14px;
  padding:18px 14px;
  cursor:pointer;
  background:#fff;
  text-align:left;
}

.product:hover{
  border-color:#2563eb;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:700;
  font-size:17px;
  margin-bottom:9px;
}

.price{
  font-size:23px;
  font-weight:800;
  color:#2563eb;
}

.stock{
  font-size:14px;
  color:#666;
  margin-top:7px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:700;
}

.cart-price{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:7px;
  background:#eee;
  cursor:pointer;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:25px;
  font-weight:800;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #eee;
}

.payment-title,
.customer-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:800;
  font-size:17px;
}

.payments{
  display:grid;
  gap:9px;
}

.payment{
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.customer-box{
  position:relative;
}

.customer-row{
  display:flex;
  gap:8px;
}

.customer-search{
  flex:1;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:15px;
  min-width:0;
  background:#fff;
}

.customer-search:focus{
  outline:none;
  border-color:#2563eb;
}

.add-client{
  border:none;
  background:#2563eb;
  color:#fff;
  padding:0 14px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.customer-results{
  margin-top:8px;
  display:none;
  border:2px solid #ddd;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;
  left:0;
  right:0;
  z-index:100;
}

.customer-result{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid #eee;
  background:#fff;
  padding:13px;
  text-align:left;
  cursor:pointer;
}

.customer-result:hover{
  background:#f3f4f6;
}

.customer-result strong{
  display:block;
  font-size:15px;
}

.customer-result small{
  display:block;
  color:#6b7280;
  margin-top:4px;
}

.selected-customer{
  margin-top:8px;
  padding:12px;
  border-radius:9px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-size:14px;
  font-weight:600;
}

.clear-customer{
  border:none;
  background:none;
  color:#dc2626;
  font-weight:700;
  cursor:pointer;
  margin-left:8px;
}

.general-customer{
  margin-top:8px;
  padding:13px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-weight:700;
  cursor:pointer;
}

.charge,
.account{
  width:100%;
  margin-top:15px;
  padding:16px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.account{
  margin-top:10px;
  background:#f59e0b;
}

.charge:disabled,
.account:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

button{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:950px){

  .navigation{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  header h1{
    font-size:25px;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .business-btn{
    flex:1;
  }

  .layout{
    gap:15px;
  }

  .card{
    padding:16px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:15px 12px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:20px;
  }

  .customer-row{
    flex-direction:column;
  }

  .add-client{
    padding:12px;
  }

  .pending-sync{
    font-size:15px;
  }

}

</style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

/* =====================================================
   CLAVES DE ALMACENAMIENTO OFFLINE
===================================================== */

const BUSINESS_CACHE_KEY =
"POS_BUSINESS_CACHE_V3";

const PENDING_SALES_KEY =
"POS_PENDING_SALES_V3";

const LAST_BUSINESS_KEY =
"POS_LAST_BUSINESS_V3";

/* =====================================================
   ESTADO
===================================================== */

let supabaseClient = null;

let currentBusiness =
localStorage.getItem(
  LAST_BUSINESS_KEY
) || "BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId =
null;

let selectedCustomerId =
null;

let isLoadingBusiness =
false;

let isSyncing =
false;

/* =====================================================
   UTILIDADES
===================================================== */

function $(id){

  return document.getElementById(id);

}

function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);

}

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function generateLocalId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
    "function"
  ){

    return window.crypto.randomUUID();

  }

  return(
    "offline-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function showStatus(
  message,
  type="error"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}

function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}

/* =====================================================
   NEGOCIO ACTUAL
===================================================== */

function saveCurrentBusiness(){

  localStorage.setItem(
    LAST_BUSINESS_KEY,
    currentBusiness
  );

}

function updateBusinessButtons(){

  document
    .querySelectorAll(
      ".business-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.business ===
          currentBusiness
        );

      }
    );

}

/* =====================================================
   CACHE POR NEGOCIO
===================================================== */

function getBusinessCaches(){

  try{

    const raw =
      localStorage.getItem(
        BUSINESS_CACHE_KEY
      );

    if(!raw){

      return {};

    }

    const data =
      JSON.parse(raw);

    if(
      !data ||
      typeof data !== "object"
    ){

      return {};

    }

    return data;

  }

  catch(error){

    console.warn(
      "Error leyendo cache:",
      error
    );

    return {};

  }

}

function saveBusinessCache(
  businessName,
  businessProducts,
  businessPayments,
  businessCustomers
){

  try{

    const caches =
      getBusinessCaches();

    caches[businessName] = {

      products:
        Array.isArray(
          businessProducts
        )
        ? businessProducts
        : [],

      payments:
        Array.isArray(
          businessPayments
        )
        ? businessPayments
        : [],

      customers:
        Array.isArray(
          businessCustomers
        )
        ? businessCustomers
        : [],

      savedAt:
        new Date().toISOString()

    };

    localStorage.setItem(
      BUSINESS_CACHE_KEY,
      JSON.stringify(caches)
    );

  }

  catch(error){

    console.warn(
      "No se pudo guardar cache:",
      error
    );

  }

}

function loadBusinessCache(
  businessName
){

  try{

    const caches =
      getBusinessCaches();

    const cache =
      caches[businessName];

    if(!cache){

      return false;

    }

    products =
      Array.isArray(cache.products)
      ? cache.products
      : [];

    payments =
      Array.isArray(cache.payments)
      ? cache.payments
      : [];

    customers =
      Array.isArray(cache.customers)
      ? cache.customers
      : [];

    return true;

  }

  catch(error){

    console.warn(
      "No se pudo cargar cache:",
      error
    );

    return false;

  }

}

/* =====================================================
   COLA DE VENTAS OFFLINE
===================================================== */

function getPendingSales(){

  try{

    const raw =
      localStorage.getItem(
        PENDING_SALES_KEY
      );

    if(!raw){

      return [];

    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch(error){

    console.warn(
      "Cola offline inválida:",
      error
    );

    return [];

  }

}

function savePendingSales(
  sales
){

  try{

    localStorage.setItem(
      PENDING_SALES_KEY,
      JSON.stringify(
        Array.isArray(sales)
        ? sales
        : []
      )
    );

    renderPendingSales();

  }

  catch(error){

    console.error(
      "No se pudo guardar la cola:",
      error
    );

    showStatus(
      "No se pudo guardar la venta en este dispositivo.",
      "error"
    );

  }

}

function renderPendingSales(){

  const count =
    getPendingSales().length;

  $("pendingCount")
    .textContent =
    count;

  $("pendingSync")
    .classList.toggle(
      "show",
      count > 0
    );

}

/* =====================================================
   SUPABASE
===================================================== */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    throw new Error(
      "No se pudo cargar Supabase."
    );

  }

  supabaseClient =
    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

}

/* =====================================================
   ESTADO OFFLINE
===================================================== */

function showOfflineStatus(){

  showStatus(

    "📴 Modo offline\n\n" +

    "El POS está usando los datos guardados en este dispositivo. " +

    "Las ventas nuevas se guardarán localmente y se sincronizarán cuando sea posible.",

    "offline"

  );

}

function showOnlineStatus(){

  clearStatus();

}

/* =====================================================
   CARGAR DATOS DEL NEGOCIO
===================================================== */

async function loadBusinessData(){

  if(isLoadingBusiness){

    return;

  }

  isLoadingBusiness =
    true;

  const businessToLoad =
    currentBusiness;

  $("products").innerHTML =
    '<div class="empty">Cargando productos...</div>';

  $("payments").innerHTML =
    '<div class="empty">Cargando métodos de pago...</div>';

  try{

    /*
      IMPORTANTE:

      Nunca utilizamos el cache de otro negocio.

      BakeQuiri y SpicyRoll tienen caches
      completamente independientes.
    */

    if(!navigator.onLine){

      const loaded =
        loadBusinessCache(
          businessToLoad
        );

      if(!loaded){

        products = [];
        payments = [];
        customers = [];

        $("products").innerHTML =
          '<div class="empty">' +
          'No hay productos guardados offline para ' +
          escapeHTML(
            businessToLoad
          ) +
          '.' +
          '</div>';

        $("payments").innerHTML =
          '<div class="empty">' +
          'No hay métodos de pago guardados offline para este negocio.' +
          '</div>';

      }

      else{

        if(
          !payments.some(
            p =>
              p.id ===
              selectedPaymentId
          )
        ){

          selectedPaymentId =
            payments[0]?.id ||
            null;

        }

        if(
          !customers.some(
            c =>
              c.id ===
              selectedCustomerId
          )
        ){

          selectedCustomerId =
            null;

        }

        renderProducts();

        renderPayments();

        renderCart();

        renderSelectedCustomer();

      }

      showOfflineStatus();

      return;

    }

    const businessId =
      BUSINESS_IDS[
        businessToLoad
      ];

    if(!businessId){

      throw new Error(
        "No existe el ID configurado para " +
        businessToLoad
      );

    }

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("customers")

        .select(
          "id,name,phone,notes"
        )

        .order("name")

    ]);

    if(productsResult.error){

      throw productsResult.error;

    }

    if(paymentsResult.error){

      throw paymentsResult.error;

    }

    if(customersResult.error){

      throw customersResult.error;

    }

    /*
      Protección adicional:

      Solamente aceptamos productos pertenecientes
      al negocio que estamos cargando.
    */

    products =
      (productsResult.data || [])
      .filter(
        product =>
          product.business_id ===
          businessId
      );

    payments =
      (paymentsResult.data || [])
      .filter(
        payment =>
          payment.business_id ===
          businessId
      );

    customers =
      customersResult.data || [];

    /*
      Guardamos el cache usando el nombre del negocio
      como llave independiente.
    */

    saveBusinessCache(

      businessToLoad,

      products,

      payments,

      customers

    );

    if(
      !payments.some(
        p =>
          p.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }

    if(
      !customers.some(
        c =>
          c.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

    /*
      Solo quitamos el mensaje offline si seguimos
      en el mismo negocio y realmente cargamos datos.
    */

    if(
      currentBusiness ===
      businessToLoad
    ){

      showOnlineStatus();

    }

  }

  catch(error){

    console.warn(
      "No se pudo cargar Supabase:",
      error
    );

    /*
      Si falla Internet/Supabase:

      Cargamos EXCLUSIVAMENTE el cache
      del negocio actual.
    */

    const loaded =
      loadBusinessCache(
        businessToLoad
      );

    if(loaded){

      if(
        !payments.some(
          p =>
            p.id ===
            selectedPaymentId
        )
      ){

        selectedPaymentId =
          payments[0]?.id ||
          null;

      }

      if(
        !customers.some(
          c =>
            c.id ===
            selectedCustomerId
        )
      ){

        selectedCustomerId =
          null;

      }

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      showOfflineStatus();

    }

    else{

      /*
        MUY IMPORTANTE:

        No mostramos productos de BakeQuiri
        cuando estamos en SpicyRoll.

        Si SpicyRoll no tiene cache, mostramos
        que no existe información offline.
      */

      products = [];

      payments = [];

      customers = [];

      $("products").innerHTML =
        '<div class="empty">' +

        'No hay datos guardados offline para ' +

        escapeHTML(
          businessToLoad
        ) +

        '. Conecta Internet una vez para descargar sus productos.' +

        '</div>';

      $("payments").innerHTML =
        '<div class="empty">' +

        'No hay métodos de pago guardados offline para ' +

        escapeHTML(
          businessToLoad
        ) +

        '.' +

        '</div>';

      showOfflineStatus();

    }

  }

  finally{

    isLoadingBusiness =
      false;

  }

}

===================================================== */

function addToCart(product){

  const stock =
    Number(
      product.stock || 0
    );

  if(stock <= 0){

    showStatus(
      "Este producto está agotado.",
      "error"
    );

    return;

  }

  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );

  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia.",
        "error"
      );

    }

  }

  else{

    cart.push({

      ...product,

      quantity:1

    });

  }

  renderCart();

}

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id === id
    );

  if(!item){

    return;

  }

  const product =
    products.find(
      p =>
        p.id === id
    );

  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  const newQuantity =
    item.quantity +
    amount;

  if(newQuantity > max){

    showStatus(
      "No hay suficiente existencia disponible.",
      "error"
    );

    return;

  }

  item.quantity =
    newQuantity;

  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !== id
      );

  }

  renderCart();

}

function getCartTotal(){

  return cart.reduce(

    (sum,item) =>

      sum +

      Number(
        item.price
      ) *

      Number(
        item.quantity
      ),

    0

  );

}

function renderCart(){

  const container =
    $("cart");

  container.innerHTML =
    "";

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      'El carrito está vacío' +
      '</div>';

    $("total").textContent =
      "$0.00";

    return;

  }

  cart.forEach(
    item => {

      const subtotal =

        Number(
          item.price
        ) *

        Number(
          item.quantity
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cart-item";

      const info =
        document.createElement(
          "div"
        );

      info.innerHTML =

        '<div class="cart-name">' +

        escapeHTML(
          item.name
        ) +

        '</div>' +

        '<div class="cart-price">' +

        money(
          item.price
        ) +

        ' c/u</div>';

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "quantity";

      const minus =
        document.createElement(
          "button"
        );

      minus.type =
        "button";

      minus.textContent =
        "−";

      minus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            -1
          )
      );

      const quantity =
        document.createElement(
          "span"
        );

      quantity.textContent =
        item.quantity;

      const plus =
        document.createElement(
          "button"
        );

      plus.type =
        "button";

      plus.textContent =
        "+";

      plus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            1
          )
      );

      controls.append(
        minus,
        quantity,
        plus
      );

      info.appendChild(
        controls
      );

      const subtotalElement =
        document.createElement(
          "strong"
        );

      subtotalElement.textContent =
        money(
          subtotal
        );

      row.append(
        info,
        subtotalElement
      );

      container.appendChild(
        row
      );

    }
  );

  $("total").textContent =
    money(
      getCartTotal()
    );

}

/* =====================================================
   CONSTRUIR VENTA
===================================================== */

function buildSaleItems(){

  return cart.map(
    item => ({

      product_id:
        item.id,

      description:
        item.name,

      quantity:
        Number(
          item.quantity
        ),

      unit_price:
        Number(
          item.price
        ),

      subtotal:
        Number(
          item.price
        ) *
        Number(
          item.quantity
        )

    })
  );

}

/* =====================================================
   ACTUALIZAR STOCK LOCAL
===================================================== */

function applyLocalStockReduction(
  saleItems
){

  saleItems.forEach(
    saleItem => {

      const product =
        products.find(
          p =>
            p.id ===
            saleItem.product_id
        );

      if(!product){

        return;

      }

      const currentStock =
        Number(
          product.stock || 0
        );

      const quantity =
        Number(
          saleItem.quantity || 0
        );

      product.stock =
        Math.max(
          0,
          currentStock -
          quantity
        );

    }
  );

  saveBusinessCache(

    currentBusiness,

    products,

    payments,

    customers

  );

  renderProducts();

}

/* =====================================================
   GUARDAR VENTA OFFLINE
===================================================== */

function saveSaleOffline(
  isPending
){

  const total =
    getCartTotal();

  const items =
    buildSaleItems();

  const customer =
    customers.find(
      c =>
        c.id ===
        selectedCustomerId
    );

  const payment =
    payments.find(
      p =>
        p.id ===
        selectedPaymentId
    );

  const sale = {

    local_id:
      generateLocalId(),

    created_at:
      new Date().toISOString(),

    business_name:
      currentBusiness,

    business_id:
      BUSINESS_IDS[
        currentBusiness
      ],

    customer_id:
      selectedCustomerId ||
      null,

    customer_name:
      customer?.name ||
      "Consumidor general",

    payment_method_id:
      isPending
      ? null
      : selectedPaymentId,

    payment_method_name:
      isPending
      ? "Cuenta pendiente"
      : (
          payment?.name ||
          "Pago"
        ),

    is_pending:
      isPending,

    total:
      total,

    items:
      items

  };

  const pending =
    getPendingSales();

  pending.push(
    sale
  );

  savePendingSales(
    pending
  );

  /*
    Descontamos inmediatamente el stock local.
    Así el POS funciona como un POS real aun sin Internet.
  */

  applyLocalStockReduction(
    items
  );

  cart = [];

  selectedCustomerId =
    null;

  $("customerSearch").value =
    "";

  $("customerResults").innerHTML =
    "";

  $("customerResults").style.display =
    "none";

  renderSelectedCustomer();

  renderCart();

  alert(

    "📴 Venta guardada en este dispositivo.\n\n" +

    "Total: " +
    money(total) +

    "\n\n" +

    "Se sincronizará automáticamente cuando vuelva Internet."

  );

  showOfflineStatus();

}

/* =====================================================
   SINCRONIZAR VENTAS
===================================================== */

async function syncPendingSales(){

  if(isSyncing){

    return;

  }

  if(!navigator.onLine){

    return;

  }

  if(
    !supabaseClient
  ){

    return;

  }

  let pending =
    getPendingSales();

  if(!pending.length){

    renderPendingSales();

    return;

  }

  isSyncing =
    true;

  try{

    let changed =
      false;

    for(
      let index = 0;
      index < pending.length;
      index++
    ){

      const sale =
        pending[index];

      try{

        const result =
          await supabaseClient.rpc(
            "register_sale",
            {

              p_business_id:
                sale.business_id,

              p_customer_id:
                sale.customer_id ||
                null,

              p_payment_method_id:
                sale.is_pending
                ? null
                : sale.payment_method_id,

              p_items:
                sale.items,

              p_is_pending:
                sale.is_pending

            }
          );

        if(result.error){

          throw result.error;

        }

        /*
          Venta sincronizada correctamente.
        */

        pending.splice(
          index,
          1
        );

        index--;

        changed =
          true;

        renderPendingSales();

      }

      catch(error){

        console.warn(
          "No se pudo sincronizar venta offline:",
          error
        );

        /*
          Dejamos las ventas que no pudieron
          sincronizarse en la cola.

          Si el problema fue temporal,
          se volverán a intentar.
        */

        continue;

      }

    }

    if(changed){

      savePendingSales(
        pending
      );

    }

    renderPendingSales();

  }

  finally{

    isSyncing =
      false;

  }

}

/* =====================================================
   REGISTRAR VENTA
===================================================== */

async function registerSale(
  isPending
){

  clearStatus();

  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "error"
    );

    return;

  }

  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago.",
      "error"
    );

    return;

  }

  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente.",
      "error"
    );

    return;

  }

  /*
    OFFLINE:

    Guardamos la venta localmente.
  */

  if(!navigator.onLine){

    saveSaleOffline(
      isPending
    );

    return;

  }

  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";

  try{

    const items =
      buildSaleItems();

    const businessId =
      BUSINESS_IDS[
        currentBusiness
      ];

    const result =
      await supabaseClient.rpc(
        "register_sale",
        {

          p_business_id:
            businessId,

          p_customer_id:
            selectedCustomerId ||
            null,

          p_payment_method_id:
            isPending
            ? null
            : selectedPaymentId,

          p_items:
            items,

          p_is_pending:
            isPending

        }
      );

    if(result.error){

      throw result.error;

    }

    const total =
      getCartTotal();

    const customer =
      customers.find(
        c =>
          c.id ===
          selectedCustomerId
      );

    const paymentName =
      payments.find(
        p =>
          p.id ===
          selectedPaymentId
      )?.name ||
      "Pago";

    alert(

      (

        isPending
        ? "Cuenta registrada"
        : "Venta registrada"

      ) +

      "\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(
        total
      ) +

      (

        isPending
        ? ""
        : "\nPago: " +
          paymentName

      )

    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    await loadBusinessData();

    await syncPendingSales();

    showStatus(

      isPending

      ? "Cuenta guardada correctamente."

      : "Venta guardada correctamente.",

      "ok"

    );

  }

  catch(error){

    console.error(
      "registerSale:",
      error
    );

    /*
      Si Internet falló justo al intentar registrar,
      guardamos la venta localmente.

      Esto evita perder la venta por una mala señal.
    */

    if(
      !navigator.onLine ||
      /network|fetch|failed|timeout|offline/i.test(
        error?.message ||
        ""
      )
    ){

      saveSaleOffline(
        isPending
      );

      showStatus(

        "⚠️ No fue posible enviar la operación a Supabase.\n\n" +

        "La venta quedó guardada localmente y se intentará sincronizar automáticamente.",

        "offline"

      );

    }

    else{

      showStatus(

        "No se pudo registrar la operación:\n" +

        (
          error?.message ||
          String(error)
        ),

        "error"

      );

    }

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      originalText;

  }

}

    button => {

      button.addEventListener(
        "click",
        () => {

          changeBusiness(
            button.dataset.business,
            button
          );

        }
      );

    }
  );

/* =====================================================
   INTERNET
===================================================== */

window.addEventListener(
  "offline",
  () => {

    showOfflineStatus();

    renderPendingSales();

  }
);

window.addEventListener(
  "online",
  async () => {

    showStatus(
      "🌐 Internet recuperado.\n\nSincronizando ventas pendientes y actualizando " +
      currentBusiness +
      "...",
      "ok"
    );

    /*
      Primero sincronizamos las ventas offline.
      Después descargamos nuevamente el stock real
      de Supabase.
    */

    await syncPendingSales();

    await loadBusinessData();

    renderPendingSales();

  }
);

/* =====================================================
   INICIO
===================================================== */

async function startApp(){

  try{

    initializeSupabase();

  }

  catch(error){

    console.error(
      "Supabase:",
      error
    );

  }

  updateBusinessButtons();

  renderPendingSales();

  /*
    Si hay Internet:

    1. sincronizamos ventas pendientes
    2. cargamos exclusivamente el negocio actual
  */

  if(navigator.onLine){

    await syncPendingSales();

    await loadBusinessData();

  }

  else{

    /*
      Sin Internet:

      cargamos exclusivamente el cache
      del negocio actual.
    */

    const loaded =
      loadBusinessCache(
        currentBusiness
      );

    if(loaded){

      selectedPaymentId =
        payments[0]?.id ||
        null;

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      showOfflineStatus();

    }

    else{

      products = [];

      payments = [];

      customers = [];

      $("products").innerHTML =
        '<div class="empty">' +

        'No hay datos guardados offline para ' +

        escapeHTML(
          currentBusiness
        ) +

        '. Conecta Internet una vez para descargar los productos.' +

        '</div>';

      $("payments").innerHTML =
        '<div class="empty">' +

        'No hay métodos de pago guardados offline.' +

        '</div>';

      showOfflineStatus();

    }

  }

  renderPendingSales();

}

startApp();

</script>
