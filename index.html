<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

.status{
  display:none;
  margin-bottom:18px;
  padding:15px;
  border-radius:12px;
  font-weight:600;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

/* =========================================
   BOTONES SUPERIORES
========================================= */

.businesses{
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn{
  border:2px solid #ddd;
  padding:15px 28px;
  border-radius:14px;
  background:#fff;
  color:#2680eb;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.accounts-btn{
  border:2px solid #f59e0b;
  padding:15px 22px;
  border-radius:14px;
  background:#fff7ed;
  color:#b45309;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.accounts-btn:active{
  transform:scale(.98);
}

.history-btn{
  border:2px solid #2563eb;
  padding:15px 22px;
  border-radius:14px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.history-btn:active{
  transform:scale(.98);
}

/* =========================================
   LAYOUT
========================================= */

.layout{
  display:grid;
  grid-template-columns:1fr 400px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  font-size:25px;
  margin-bottom:20px;
}

/* =========================================
   PRODUCTOS
========================================= */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.product{
  border:2px solid #ddd;
  border-radius:16px;
  padding:22px 15px;
  cursor:pointer;
  background:#fff;
  text-align:center;
  transition:.15s;
}

.product:active{
  transform:scale(.98);
}

.product.disabled{
  opacity:.45;
  cursor:not-allowed;
}

.product-name{
  color:#2680eb;
  font-weight:700;
  font-size:18px;
  margin-bottom:12px;
}

.price{
  color:#2680eb;
  font-size:27px;
  font-weight:800;
}

.stock{
  color:#666;
  font-size:17px;
  margin-top:10px;
}

/* =========================================
   CARRITO
========================================= */

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee;
  gap:15px;
}

.cart-name{
  font-weight:700;
  font-size:18px;
}

.cart-price{
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.quantity button{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:#eee;
  color:#2680eb;
  cursor:pointer;
  font-size:24px;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-size:19px;
  font-weight:600;
}

.subtotal{
  font-size:19px;
  font-weight:700;
  white-space:nowrap;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:28px;
  font-weight:800;
  margin-top:25px;
  padding-top:20px;
  border-top:3px solid #eee;
}

/* =========================================
   CLIENTE
========================================= */

.customer-box{
  margin-top:20px;
  padding-top:20px;
  border-top:2px solid #eee;
}

.customer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.customer-title{
  font-size:20px;
  font-weight:700;
}

.manage-customers{
  border:none;
  background:#2680eb;
  color:#fff;
  border-radius:9px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
}

.customer-search{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  margin-bottom:10px;
  outline:none;
}

.customer-search:focus{
  border-color:#2680eb;
}

.customer-select{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  font-size:16px;
  color:#222;
}

.customer-info{
  margin-top:10px;
  padding:10px 12px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-size:14px;
}

/* =========================================
   PAGO
========================================= */

.payment-title{
  margin-top:25px;
  margin-bottom:12px;
  font-size:20px;
  font-weight:700;
}

.payments{
  display:grid;
  gap:10px;
}

.payment{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#2680eb;
  cursor:pointer;
  text-align:left;
  font-size:17px;
  font-weight:600;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* =========================================
   BOTONES DE VENTA
========================================= */

.charge-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.charge,
.pending{
  width:100%;
  padding:18px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.pending{
  background:#f59e0b;
}

.charge:disabled,
.pending:disabled{
  opacity:.6;
  cursor:wait;
}

/* =========================================
   MENSAJES
========================================= */

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.loading{
  opacity:.65;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .business-btn,
  .accounts-btn,
  .history-btn{
    flex:1;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:20px;
  }

  .product{
    padding:18px 10px;
  }

  .product-name{
    font-size:16px;
  }

  .price{
    font-size:23px;
  }

  .charge-buttons{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

<h1>🧾 Sistema de Ventas POS</h1>

<p>
Administración de negocios y ventas
</p>

</header>


<div class="container">

<div id="status" class="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";


/* =========================================
   ESTADO
========================================= */

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId = null;

let selectedCustomerId = null;


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


const money =
value =>
"$" +
Number(value || 0).toFixed(2);


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showStatus(
message,
type="error"
){

  const element =
  $("status");

  element.textContent =
  message;

  element.className =
  "status " + type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================
   CARGAR DATOS DEL NEGOCIO
========================================= */

async function loadBusinessData(){

  clearStatus();


  $("products").innerHTML =
  '<div class="empty">Cargando productos...</div>';


  $("payments").innerHTML =
  '<div class="empty">Cargando métodos de pago...</div>';


  $("customerSelect").innerHTML =
  '<option value="">Cargando clientes...</option>';


  const businessId =
  BUSINESS_IDS[currentBusiness];


  try{

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([


      /* PRODUCTOS */

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),


      /* MÉTODOS DE PAGO */

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),


      /* =====================================
         CLIENTES COMPARTIDOS
         
         IMPORTANTE:
         Los clientes ahora se cargan desde
         TODOS los negocios del sistema.

         Esto permite que un cliente creado
         en BakeQuiri también aparezca cuando
         estamos trabajando en SpicyRoll,
         y viceversa.
      ===================================== */

      supabaseClient

        .from("customers")

        .select(
          "id,business_id,name,phone,notes,created_at"
        )

        .in(
          "business_id",
          Object.values(BUSINESS_IDS)
        )

        .order(
          "name",
          {
            ascending:true
          }
        )

    ]);


    if(productsResult.error){

      throw new Error(
        "No pude cargar los productos: " +
        productsResult.error.message
      );

    }


    if(paymentsResult.error){

      throw new Error(
        "No pude cargar los métodos de pago: " +
        paymentsResult.error.message
      );

    }


    if(customersResult.error){

      throw new Error(
        "No pude cargar los clientes: " +
        customersResult.error.message
      );

    }


    products =
    productsResult.data || [];


    payments =
    paymentsResult.data || [];


    customers =
    customersResult.data || [];


    if(
      !payments.some(
        payment =>
        payment.id ===
        selectedPaymentId
      )
    ){

      selectedPaymentId =
      payments[0]?.id || null;

    }


    selectedCustomerId =
    null;


    renderProducts();

    renderPayments();

    renderCustomers();

    renderCart();

  }


  catch(error){

    console.error(error);


    $("products").innerHTML =
    "";


    $("payments").innerHTML =
    "";


    $("customerSelect").innerHTML =
    '<option value="">Consumidor general</option>';


    showStatus(
      error.message ||
      "No se pudo conectar con Supabase."
    );

  }

}


/* =========================================
   PRODUCTOS
========================================= */

function renderProducts(){

  const container =
  $("products");


  container.innerHTML =
  "";


  if(!products.length){

    container.innerHTML =
    '<div class="empty">' +
    'No hay productos activos para este negocio.' +
    '</div>';

    return;

  }


  products.forEach(
    product => {

      const stock =
      Number(product.stock || 0);


      const button =
      document.createElement("button");


      button.type =
      "button";


      button.className =
      "product" +
      (
        stock <= 0
        ? " disabled"
        : ""
      );


      button.disabled =
      stock <= 0;


      button.innerHTML =

      '<div class="product-name">' +
      esc(product.name) +
      '</div>' +

      '<div class="price">' +
      money(product.price) +
      '</div>' +

      '<div class="stock">' +
      'Existencia: ' +
      stock +
      '</div>';


      button.addEventListener(
        "click",
        () =>
        addToCart(product)
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================
   CLIENTES
========================================= */

function renderCustomers(){

  const select =
  $("customerSelect");


  const search =
  $("customerSearch");


  const searchText =
  search.value
    .trim()
    .toLowerCase();


  const filtered =
  customers.filter(
    customer => {

      if(!searchText){

        return true;

      }


      return (

        String(
          customer.name || ""
        )
        .toLowerCase()
        .includes(searchText)

        ||

        String(
          customer.phone || ""
        )
        .toLowerCase()
        .includes(searchText)

      );

    }
  );


  select.innerHTML =
  "";


  const general =
  document.createElement(
    "option"
  );


  general.value =
  "";


  general.textContent =
  "Consumidor general";


  select.appendChild(
    general
  );


  filtered.forEach(
    customer => {

      const option =
      document.createElement(
        "option"
      );


      option.value =
      customer.id;


      option.textContent =
      customer.phone

      ? customer.name +
        " — " +
        customer.phone

      : customer.name;


      select.appendChild(
        option
      );

    }
  );


  select.value =
  selectedCustomerId || "";


  updateCustomerInfo();

}


/* =========================================
   INFORMACIÓN DEL CLIENTE
========================================= */

function updateCustomerInfo(){

  const info =
  $("customerInfo");


  if(!selectedCustomerId){

    info.textContent =
    "Consumidor general";

    return;

  }


  const customer =
  customers.find(
    item =>
    item.id ===
    selectedCustomerId
  );


  if(!customer){

    info.textContent =
    "Consumidor general";

    return;

  }


  const parts = [];


  if(customer.phone){

    parts.push(
      "📱 " +
      customer.phone
    );

  }


  if(customer.notes){

    parts.push(
      "📝 " +
      customer.notes
    );

  }


  info.textContent =
  customer.name +

  (

    parts.length

    ? " · " +
      parts.join(" · ")

    : ""

  );

}


/* =========================================
   MÉTODOS DE PAGO
========================================= */

function renderPayments(){

  const container =
  $("payments");


  container.innerHTML =
  "";


  if(!payments.length){

    container.innerHTML =
    '<div class="empty">' +
    'No hay métodos de pago activos.' +
    '</div>';

    return;

  }


  payments.forEach(
    payment => {

      const button =
      document.createElement(
        "button"
      );


      button.type =
      "button";


      button.className =
      "payment" +

      (

        payment.id ===
        selectedPaymentId

        ? " active"

        : ""

      );


      button.textContent =
      payment.name;


      button.addEventListener(
        "click",
        () => {

          selectedPaymentId =
          payment.id;


          renderPayments();

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================
   CARRITO
========================================= */

function addToCart(product){

  clearStatus();


  const stock =
  Number(product.stock || 0);


  const item =
  cart.find(
    item =>
    item.id ===
    product.id
  );


  if(item){

    if(
      item.quantity < stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia disponible."
      );

    }

  }


  else if(stock > 0){

    cart.push({

      ...product,

      quantity:1

    });

  }


  renderCart();

}


function changeQuantity(
id,
amount
){

  const item =
  cart.find(
    item =>
    item.id === id
  );


  if(!item){

    return;

  }


  const product =
  products.find(
    product =>
    product.id === id
  );


  const max =
  Number(
    product?.stock ??
    item.stock ??
    0
  );


  item.quantity +=
  amount;


  if(
    item.quantity > max
  ){

    item.quantity =
    max;

  }


  if(
    item.quantity <= 0
  ){

    cart =
    cart.filter(
      item =>
      item.id !== id
    );

  }


  renderCart();

}


function renderCart(){

  const container =
  $("cart");


  container.innerHTML =
  "";


  if(!cart.length){

    container.innerHTML =
    '<div class="empty">' +
    'El carrito está vacío' +
    '</div>';


    $("total").textContent =
    "$0.00";


    return;

  }


  let total =
  0;


  cart.forEach(
    item => {

      const subtotal =
      Number(item.price) *
      Number(item.quantity);


      total +=
      subtotal;


      const row =
      document.createElement(
        "div"
      );


      row.className =
      "cart-item";


      const info =
      document.createElement(
        "div"
      );


      info.innerHTML =

      '<div class="cart-name">' +
      esc(item.name) +
      '</div>' +

      '<div class="cart-price">' +
      money(item.price) +
      ' c/u</div>';


      const controls =
      document.createElement(
        "div"
      );


      controls.innerHTML =

      '<div class="quantity">' +

      '<button type="button">−</button>' +

      '<span>' +
      item.quantity +
      '</span>' +

      '<button type="button">+</button>' +

      '</div>' +

      '<div class="subtotal">' +
      money(subtotal) +
      '</div>';


      const buttons =
      controls.querySelectorAll(
        "button"
      );


      buttons[0].addEventListener(
        "click",
        () =>
        changeQuantity(
          item.id,
          -1
        )
      );


      buttons[1].addEventListener(
        "click",
        () =>
        changeQuantity(
          item.id,
          1
        )
      );


      row.append(
        info,
        controls
      );


      container.appendChild(
        row
      );

    }
  );


  $("total").textContent =
  money(total);

}


/* =========================================
   CAMBIAR NEGOCIO
========================================= */

async function changeBusiness(
name,
button
){

  if(
    name === currentBusiness
  ){

    return;

  }


  currentBusiness =
  name;


  cart =
  [];


  selectedCustomerId =
  null;


  document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    item =>
    item.classList.remove(
      "active"
    )
  );


  button.classList.add(
    "active"
  );


  $("customerSearch").value =
  "";


  await loadBusinessData();

}


/* =========================================
   REGISTRAR VENTA
========================================= */

async function registerSale(
isPending
){

  clearStatus();


  if(!cart.length){

    showStatus(
      "Agrega al menos un producto."
    );

    return;

  }


  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago."
    );

    return;

  }


  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente."
    );

    return;

  }


  const chargeButton =
  $("chargeButton");


  const pendingButton =
  $("pendingButton");


  chargeButton.disabled =
  true;


  pendingButton.disabled =
  true;


  if(isPending){

    pendingButton.textContent =
    "GUARDANDO...";

  }

  else{

    chargeButton.textContent =
    "REGISTRANDO...";

  }


  try{

    const items =
    cart.map(
      item => ({

        product_id:
        item.id,

        description:
        item.name,

        quantity:
        Number(item.quantity),

        unit_price:
        Number(item.price),

        subtotal:
        Number(item.price) *
        Number(item.quantity)

      })
    );


    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "register_sale",
      {

        p_business_id:
        BUSINESS_IDS[
          currentBusiness
        ],

        p_customer_id:
        selectedCustomerId || null,

        p_payment_method_id:
        isPending
        ? null
        : selectedPaymentId,

        p_items:
        items,

        p_is_pending:
        isPending

      }
    );


    if(error){

      throw error;

    }


    const paymentName =
    payments.find(
      payment =>
      payment.id ===
      selectedPaymentId
    )?.name ||
    "Pago";


    const customerName =
    customers.find(
      customer =>
      customer.id ===
      selectedCustomerId
    )?.name ||
    "Consumidor general";


    const total =
    items.reduce(
      (
        sum,
        item
      ) =>
      sum +
      item.subtotal,
      0
    );


    if(isPending){

      alert(

        "Cuenta registrada correctamente\n\n" +

        currentBusiness +

        "\nCliente: " +

        customerName +

        "\nTotal pendiente: " +

        money(total)

      );

    }

    else{

      alert(

        "Venta registrada\n\n" +

        currentBusiness +

        "\nCliente: " +

        customerName +

        "\nTotal: " +

        money(total) +

        "\nPago: " +

        paymentName

      );

    }


    cart =
    [];


    selectedCustomerId =
    null;


    $("customerSearch").value =
    "";


    await loadBusinessData();


    showStatus(

      isPending

      ? "Cuenta pendiente guardada correctamente en Supabase."

      : "Venta pagada guardada correctamente en Supabase.",

      "ok"

    );


    console.log(
      "register_sale response:",
      data
    );

  }


  catch(error){

    console.error(error);


    showStatus(

      (

        isPending

        ? "No se pudo registrar la cuenta: "

        : "No se pudo registrar la venta: "

      ) +

      (

        error.message ||
        error

      )

    );

  }


  finally{

    chargeButton.disabled =
    false;


    pendingButton.disabled =
    false;


    chargeButton.textContent =
    "💵 COBRAR";


    pendingButton.textContent =
    "🟠 DEJAR A CUENTA";

  }

}


/* =========================================
   EVENTOS
========================================= */


/* NEGOCIOS */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      () =>
      changeBusiness(
        button.dataset.business,
        button
      )
    );

  }
);


/* CLIENTE */

$("customerSelect")
.addEventListener(
  "change",
  event => {

    selectedCustomerId =
    event.target.value ||
    null;


    updateCustomerInfo();

  }
);


/* BUSCADOR CLIENTES */

$("customerSearch")
.addEventListener(
  "input",
  () => {

    renderCustomers();

  }
);


/* =========================================
   ADMINISTRAR CLIENTES
========================================= */

$("manageCustomers")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "clientes.html";

  }
);


/* =========================================
   CUENTAS PENDIENTES
========================================= */

$("accountsButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "cuentas.html";

  }
);


/* =========================================
   HISTORIAL DE VENTAS
========================================= */

$("historyButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "historial.html";

  }
);


/* =========================================
   COBRAR
========================================= */

$("chargeButton")
.addEventListener(
  "click",
  () =>
  registerSale(false)
);


/* =========================================
   DEJAR A CUENTA
========================================= */

$("pendingButton")
.addEventListener(
  "click",
  () =>
  registerSale(true)
);


/* =========================================
   INICIO
========================================= */

loadBusinessData();

</script>
