<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema POS">
<title>Sistema de Ventas POS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{width:100%;min-height:100%}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f5f5;
color:#222;
min-height:100vh
}

header{
background:#111827;
color:#fff;
padding-top:calc(22px + env(safe-area-inset-top));
padding-right:20px;
padding-bottom:22px;
padding-left:20px
}

header h1{font-size:28px;line-height:1.15}
header p{font-size:15px;opacity:.75;margin-top:8px}

.container{
width:100%;
max-width:1100px;
margin:auto;
padding:20px
}

.status{
margin:0 0 15px;
padding:14px 16px;
border-radius:12px;
font-size:14px;
display:none;
font-weight:700;
white-space:pre-line
}

.status.error{display:block;background:#fee2e2;color:#991b1b}
.status.ok{display:block;background:#dcfce7;color:#166534}
.status.warn{display:block;background:#fef3c7;color:#92400e}

.businesses{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap
}

.business-btn,.nav-btn{
border:none;
padding:13px 20px;
border-radius:12px;
background:#fff;
border:2px solid #ddd;
font-weight:700;
cursor:pointer;
font-size:16px
}

.business-btn{flex:1}

.business-btn.active{
background:#111827;
color:#fff;
border-color:#111827
}

.navigation{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-bottom:20px
}

.nav-btn{color:#2563eb}

.nav-btn.accounts{background:#fff7ed;border-color:#f59e0b;color:#b45309}
.nav-btn.clients{background:#ecfdf5;border-color:#10b981;color:#047857}
.nav-btn.history{background:#f5f3ff;border-color:#7c3aed;color:#6d28d9}
.nav-btn.inventory{background:#eff6ff;border-color:#2563eb;color:#1d4ed8}

.layout{
display:grid;
grid-template-columns:1fr 390px;
gap:20px
}

.card{
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 3px 14px rgba(0,0,0,.06)
}

.card h2{
font-size:21px;
margin-bottom:16px
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.product{
border:2px solid #ddd;
border-radius:14px;
padding:18px 14px;
cursor:pointer;
background:#fff;
text-align:left;
transition:.15s
}

.product:hover{border-color:#2563eb}
.product:active{transform:scale(.98)}
.product.disabled{opacity:.5;cursor:not-allowed}

.product-name{
font-weight:700;
font-size:17px;
margin-bottom:9px
}

.price{
font-size:23px;
font-weight:800;
color:#2563eb
}

.stock{
font-size:14px;
color:#666;
margin-top:7px
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px 0;
border-bottom:1px solid #eee;
gap:12px
}

.cart-name{font-weight:700}

.cart-price{
font-size:13px;
color:#666;
margin-top:4px
}

.quantity{
display:flex;
align-items:center;
gap:8px;
margin-top:8px
}

.quantity button{
width:32px;
height:32px;
border:none;
border-radius:7px;
background:#eee;
cursor:pointer;
font-size:18px
}

.total{
display:flex;
justify-content:space-between;
font-size:25px;
font-weight:800;
margin-top:20px;
padding-top:18px;
border-top:2px solid #eee
}

.payment-title,.customer-title{
margin-top:20px;
margin-bottom:10px;
font-weight:800;
font-size:17px
}

.payments{
display:grid;
gap:9px
}

.payment{
padding:14px;
border:2px solid #ddd;
border-radius:11px;
background:#fff;
cursor:pointer;
text-align:left;
font-size:16px;
font-weight:700
}

.payment.active{
background:#111827;
color:#fff;
border-color:#111827
}

.customer-box{position:relative}

.customer-row{
display:flex;
gap:8px
}

.customer-search{
flex:1;
padding:13px;
border:2px solid #ddd;
border-radius:11px;
font-size:15px;
min-width:0;
background:#fff
}

.customer-search:focus{
outline:none;
border-color:#2563eb
}

.add-client{
border:none;
background:#2563eb;
color:#fff;
padding:0 14px;
border-radius:11px;
font-weight:800;
cursor:pointer;
white-space:nowrap
}

.customer-results{
margin-top:8px;
display:none;
border:2px solid #ddd;
border-radius:11px;
overflow:hidden;
background:#fff;
box-shadow:0 8px 25px rgba(0,0,0,.12);
position:absolute;
left:0;
right:0;
z-index:100
}

.customer-result{
display:block;
width:100%;
border:none;
border-bottom:1px solid #eee;
background:#fff;
padding:13px;
text-align:left;
cursor:pointer
}

.customer-result:hover{background:#f3f4f6}

.customer-result strong{
display:block;
font-size:15px
}

.customer-result small{
display:block;
color:#6b7280;
margin-top:4px
}

.selected-customer{
margin-top:8px;
padding:12px;
border-radius:9px;
background:#eff6ff;
border:2px solid #bfdbfe;
color:#1d4ed8;
font-size:14px;
font-weight:600
}

.clear-customer{
border:none;
background:none;
color:#dc2626;
font-weight:700;
cursor:pointer;
margin-left:8px
}

.general-customer{
margin-top:8px;
padding:13px;
border-radius:9px;
background:#f3f4f6;
color:#555;
font-weight:700;
cursor:pointer
}

.charge,.account{
width:100%;
margin-top:15px;
padding:16px;
border:none;
border-radius:12px;
color:#fff;
font-size:18px;
font-weight:800;
cursor:pointer
}

.charge{background:#16a34a}
.account{margin-top:10px;background:#f59e0b}

.charge:disabled,.account:disabled{
opacity:.6;
cursor:wait
}

.empty{
color:#777;
text-align:center;
padding:30px 10px
}

.offline-badge{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:20px;
background:#fef3c7;
color:#92400e;
font-size:12px;
font-weight:800
}

/* =========================================================
   MODAL AGREGAR CLIENTE
========================================================= */

.client-modal{
position:fixed;
inset:0;
background:rgba(17,24,39,.62);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
backdrop-filter:blur(4px);
-webkit-backdrop-filter:blur(4px)
}

.client-modal.show{
display:flex
}

.client-modal-card{
width:100%;
max-width:430px;
background:#fff;
border-radius:22px;
padding:22px;
box-shadow:0 20px 60px rgba(0,0,0,.28);
animation:modalIn .18s ease-out
}

@keyframes modalIn{
from{
opacity:0;
transform:translateY(12px) scale(.98)
}
to{
opacity:1;
transform:translateY(0) scale(1)
}
}

.client-modal-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:20px
}

.client-modal-header h2{
font-size:22px;
color:#111827
}

.client-modal-close{
width:38px;
height:38px;
border:none;
border-radius:50%;
background:#f3f4f6;
color:#374151;
font-size:22px;
cursor:pointer;
font-weight:700
}

.client-modal-subtitle{
font-size:14px;
color:#6b7280;
margin-top:-10px;
margin-bottom:18px
}

.client-field{
margin-bottom:14px
}

.client-field label{
display:block;
font-size:14px;
font-weight:800;
color:#374151;
margin-bottom:7px
}

.client-field input,
.client-field textarea{
width:100%;
border:2px solid #e5e7eb;
border-radius:11px;
padding:13px;
font-size:16px;
font-family:inherit;
background:#fff
}

.client-field input:focus,
.client-field textarea:focus{
outline:none;
border-color:#2563eb
}

.client-field textarea{
resize:vertical;
min-height:75px
}

.client-modal-actions{
display:grid;
grid-template-columns:1fr 1.4fr;
gap:10px;
margin-top:18px
}

.client-modal-actions button{
border:none;
border-radius:11px;
padding:14px;
font-size:16px;
font-weight:800;
cursor:pointer
}

.client-cancel{
background:#f3f4f6;
color:#374151
}

.client-save{
background:#2563eb;
color:#fff
}

.client-save:disabled{
opacity:.6;
cursor:wait
}

.client-modal-error{
display:none;
background:#fee2e2;
color:#991b1b;
padding:11px 13px;
border-radius:10px;
font-size:13px;
font-weight:700;
margin-bottom:14px;
white-space:pre-line
}

.client-modal-error.show{
display:block
}

@media(max-width:950px){
.navigation{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:850px){
.layout{grid-template-columns:1fr}
.navigation{grid-template-columns:1fr 1fr}
}

@media(max-width:500px){
.container{padding:15px}
header h1{font-size:25px}
header p{font-size:14px}
.navigation{grid-template-columns:1fr 1fr}
.card{padding:16px}
.products{grid-template-columns:1fr 1fr}
.product{padding:15px 12px}
.product-name{font-size:15px}
.price{font-size:20px}
.customer-row{flex-direction:column}
.add-client{padding:12px}

.client-modal{
padding:12px;
align-items:flex-end
}

.client-modal-card{
border-radius:22px 22px 18px 18px;
padding:19px;
max-height:90vh;
overflow-y:auto
}

.client-modal-actions{
grid-template-columns:1fr 1fr
}
}

@supports (-webkit-touch-callout:none){
header{
padding-top:calc(22px + env(safe-area-inset-top))
}
}
</style>
</head>

<body>

<header>
<h1>🧾 Sistema de Ventas POS</h1>

<div id="offlineBadge"></div>
</header>

<div class="container">

<div id="status" class="status"></div>

<!-- =======================================================
     MODAL NUEVO CLIENTE
======================================================== -->

<div
id="clientModal"

>

<div

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {
BakeQuiri:"c435ee25-6a2b-4134-b3f8-90b38d6bde0c",
SpicyRoll:"ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"
};

let supabaseClient=null;

let currentBusiness="BakeQuiri";

let products=[];
let payments=[];
let customers=[];
let cart=[];

let selectedPaymentId=null;
let selectedCustomerId=null;


/* =========================================================
   INDEXED DB
========================================================= */

const DB_NAME="SistemaPOSOffline";
const DB_VERSION=1;
const STORE_NAME="data";

let dbPromise=null;

function openOfflineDB(){

if(dbPromise){
return dbPromise;
}

dbPromise=new Promise((resolve,reject)=>{

const request=
indexedDB.open(
DB_NAME,
DB_VERSION
);

request.onupgradeneeded=event=>{

const db=event.target.result;

if(!db.objectStoreNames.contains(STORE_NAME)){

db.createObjectStore(
STORE_NAME,
{keyPath:"key"}
);

}

};

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

return dbPromise;

}


async function saveOfflineData(
business,
data
){

try{

const db=
await openOfflineDB();

return new Promise(
(resolve,reject)=>{

const transaction=
db.transaction(
STORE_NAME,
"readwrite"
);

const store=
transaction.objectStore(
STORE_NAME
);

store.put({

key:
"business_"+business,

business,

savedAt:
Date.now(),

...data

});

transaction.oncomplete=()=>{
resolve(true);
};

transaction.onerror=()=>{
reject(transaction.error);
};

});

}

catch(error){

console.error(
"Error guardando datos offline:",
error
);

return false;

}

}


async function getOfflineData(
business
){

try{

const db=
await openOfflineDB();

return new Promise(
(resolve,reject)=>{

const transaction=
db.transaction(
STORE_NAME,
"readonly"
);

const store=
transaction.objectStore(
STORE_NAME
);

const request=
store.get(
"business_"+business
);

request.onsuccess=()=>{
resolve(
request.result || null
);
};

request.onerror=()=>{
reject(request.error);
};

});

}

catch(error){

console.error(
"Error leyendo datos offline:",
error
);

return null;

}

}


/* =========================================================
   SUPABASE
========================================================= */

function initializeSupabase(){

if(
!window.supabase ||
typeof window.supabase.createClient!=="function"
){

throw new Error(
"No se pudo cargar Supabase."
);

}

supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){
return document.getElementById(id);
}


function money(value){

return "$"+
Number(value||0).toFixed(2);

}


function escapeHTML(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showStatus(
message,
type="error"
){

$("status").textContent=
message;

$("status").className=
"status "+type;

}


function clearStatus(){

$("status").textContent="";
$("status").className="status";

}


/* =========================================================
   MODAL CLIENTE
========================================================= */

function openClientModal(){

$("clientModal").classList.add("show");

$("clientModal").setAttribute(
"aria-hidden",
"false"
);

$("clientModalError").classList.remove("show");

$("clientModalError").textContent="";

$("clientForm").reset();

setTimeout(()=>{

$("newClientName").focus();

},100);

}


function closeClientModal(){

$("clientModal").classList.remove("show");

$("clientModal").setAttribute(
"aria-hidden",
"true"
);

$("clientModalError").classList.remove("show");

$("clientModalError").textContent="";

}


function showClientModalError(message){

$("clientModalError").textContent=
message;

$("clientModalError").classList.add("show");

}


async function createClientFromPOS(){

const name=
$("newClientName").value.trim();

const phone=
$("newClientPhone").value.trim();

const notes=
$("newClientNotes").value.trim();

if(!name){

showClientModalError(
"Escribe el nombre del cliente."
);

$("newClientName").focus();

return;

}


const saveButton=
$("saveClientButton");

const originalText=
saveButton.textContent;

saveButton.disabled=true;

saveButton.textContent=
"Guardando...";


try{

/*
 * Si estamos sin Internet:
 * creamos un registro local para que el cliente
 * pueda utilizarse inmediatamente en el POS.
 */

if(!navigator.onLine){

const localId=
"offline-"+Date.now()+"-"+Math.random()
.toString(36)
.substring(2,9);

const newCustomer={
id:localId,
name,
phone:phone||null,
notes:notes||null,
offline:true
};

customers=[
...customers,
newCustomer
];

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);

selectedCustomerId=
localId;

$("customerSearch").value=
name;

renderCustomerResults("");

renderSelectedCustomer();

closeClientModal();

showStatus(
"Cliente agregado al POS OFFLINE.\n"+
"Quedó seleccionado para esta venta.",
"ok"
);

return;

}


/*
 * INTERNET DISPONIBLE:
 *
 * Registramos directamente en la tabla customers.
 */

if(!supabaseClient){

initializeSupabase();

}


const insertData={
name:name,
phone:phone||null,
notes:notes||null
};


const result=
await supabaseClient
.from("customers")
.insert(insertData)
.select("id,name,phone,notes")
.single();


if(result.error){

throw result.error;

}


const newCustomer=
result.data;


if(!newCustomer){

throw new Error(
"Supabase no devolvió el cliente creado."
);

}


/*
 * Lo agregamos inmediatamente a la memoria
 * del POS para no tener que recargar la página.
 */

customers=[
...customers,
newCustomer
].sort(
(a,b)=>
String(a.name||"")
.localeCompare(
String(b.name||""),
"es",
{
sensitivity:"base"
}
)
;


/*
 * Actualizamos el almacenamiento offline
 * para que el nuevo cliente quede disponible
 * aunque posteriormente se pierda Internet.
 */

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);


/*
 * Seleccionarlo automáticamente.
 */

selectedCustomerId=
newCustomer.id;

$("customerSearch").value=
newCustomer.name||name;

renderCustomerResults("");

renderSelectedCustomer();

closeClientModal();

showStatus(
"Cliente agregado correctamente.\n"+
"Quedó seleccionado para esta venta.",
"ok"
);

}
catch(error){

console.error(
"[POS] Error creando cliente:",
error
);

showClientModalError(
"No se pudo guardar el cliente.\n\n"+
(error?.message||String(error))
);

}
finally{

saveButton.disabled=false;

saveButton.textContent=
originalText;

}

}


$("addClientButton").addEventListener(
"click",
openClientModal
);


$("closeClientModal").addEventListener(
"click",
closeClientModal
);


$("cancelClientButton").addEventListener(
"click",
closeClientModal
);


$("clientForm").addEventListener(
"submit",
event=>{

event.preventDefault();

createClientFromPOS();

}
);


$("clientModal").addEventListener(
"click",
event=>{

if(event.target===$("clientModal")){

closeClientModal();

}

}
);


document.addEventListener(
"keydown",
event=>{

if(
event.key==="Escape" &&
$("clientModal").classList.contains("show")
){

closeClientModal();

}

}
);


/* =========================================================
   SERVICE WORKER
========================================================= */

async function registerServiceWorker(){

if(!("serviceWorker" in navigator)){
return;
}

try{

const registration=
await navigator.serviceWorker.register(
"./sw.js",
{
scope:"./",
updateViaCache:"none"
}
);

console.log(
"[POS] SW:",
registration.scope
);

try{
await registration.update();
}catch(e){
console.warn("SW update:",e);
}

if(registration.waiting){

registration.waiting.postMessage(
"SKIP_WAITING"
);

}

}catch(error){

console.warn(
"[POS] Service Worker:",
error
);

}

}


/* =========================================================
   CARGAR DATOS ONLINE
========================================================= */

async function loadOnlineData(){

const businessId=
BUSINESS_IDS[currentBusiness];


/* PRODUCTOS */

const productsResult=
await supabaseClient
.from("products")
.select(
"id,name,price,cost,stock,active,business_id"
)
.eq(
"business_id",
businessId
)
.eq(
"active",
true
)
.order("name");


if(productsResult.error){
throw productsResult.error;
}


/* MÉTODOS DE PAGO */

const paymentsResult=
await supabaseClient
.from("payment_methods")
.select(
"id,name,provider,active,business_id"
)
.eq(
"business_id",
businessId
)
.eq(
"active",
true
)
.order("name");


if(paymentsResult.error){
throw paymentsResult.error;
}


/* CLIENTES */

const customersResult=
await supabaseClient
.from("customers")
.select(
"id,name,phone,notes"
)
.order("name");


if(customersResult.error){
throw customersResult.error;
}


products=
productsResult.data||[];

payments=
paymentsResult.data||[];

customers=
customersResult.data||[];


/*
 * GUARDAR TODO LOCALMENTE
 */

await saveOfflineData(
currentBusiness,
{
products,
payments,
customers
}
);


console.log(
"[POS] Datos guardados offline:",
currentBusiness,
{
products:products.length,
payments:payments.length,
customers:customers.length
}
);

}


/* =========================================================
   CARGAR DATOS OFFLINE
========================================================= */

async function loadOfflineData(){

const cached=
await getOfflineData(
currentBusiness
);


if(!cached){

products=[];
payments=[];
customers=[];

renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();

showStatus(
"Este negocio todavía no tiene datos guardados en este dispositivo. Conéctate a Internet una vez para descargar productos, clientes y métodos de pago.",
"warn"
);

return false;

}


products=
Array.isArray(
cached.products
)
?cached.products
:[];

payments=
Array.isArray(
cached.payments
)
?cached.payments
:[];

customers=
Array.isArray(
cached.customers
)
?cached.customers
:[];


console.log(
"[POS] Datos cargados desde IndexedDB:",
{
business:currentBusiness,
products:products.length,
payments:payments.length,
customers:customers.length,
savedAt:new Date(
cached.savedAt
).toLocaleString()
}
);


renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();


showStatus(
"Modo OFFLINE activo.\n"+
"Productos: "+products.length+
" · Métodos de pago: "+payments.length+
" · Clientes: "+customers.length,
"warn"
);

return true;

}


/* =========================================================
   CARGADOR PRINCIPAL
========================================================= */

async function loadBusinessData(){

clearStatus();

$("products").innerHTML=
'<div class="empty">Cargando productos...</div>';

$("payments").innerHTML=
'<div class="empty">Cargando métodos de pago...</div>';


if(!navigator.onLine){

await loadOfflineData();

return;

}


try{

await loadOnlineData();

renderProducts();
renderPayments();
renderCart();
renderSelectedCustomer();

showStatus(
currentBusiness+
" actualizado correctamente.\n"+
"Datos guardados para uso OFFLINE.",
"ok"
);

}

catch(error){

console.warn(
"[POS] No se pudieron obtener datos online. Intentando caché local...",
error
);

const loaded=
await loadOfflineData();


if(!loaded){

showStatus(
"No se pudieron cargar los datos desde Supabase ni desde el almacenamiento OFFLINE.\n\n"+
"Conéctate a Internet y vuelve a abrir este negocio para guardar sus datos en el dispositivo.",
"error"
);

}

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

const container=$("products");

container.innerHTML="";

if(!products.length){

container.innerHTML=
'<div class="empty">'+
"No hay productos disponibles."+
"</div>";

return;

}


products.forEach(product=>{

const stock=
Number(product.stock||0);

const button=
document.createElement("button");

button.type="button";

button.className=
"product"+
(stock<=0?" disabled":"");

button.disabled=
stock<=0;

button.innerHTML=
'<div class="product-name">'+
escapeHTML(product.name)+
'</div>'+
'<div class="price">'+
money(product.price)+
'</div>'+
'<div class="stock">'+
(
stock>0
?"Existencia: "+stock
:"Agotado"
)+
'</div>';

button.addEventListener(
"click",
()=>addToCart(product)
);

container.appendChild(button);

});

}


/* =========================================================
   MÉTODOS DE PAGO
========================================================= */

function renderPayments(){

const container=$("payments");

container.innerHTML="";

if(!payments.length){

container.innerHTML=
'<div class="empty">'+
"No hay métodos de pago disponibles."+
"</div>";

return;

}


if(
!payments.some(
p=>p.id===selectedPaymentId
)
){

selectedPaymentId=
payments[0]?.id||null;

}


payments.forEach(payment=>{

const button=
document.createElement("button");

button.type="button";

button.className=
"payment"+
(
payment.id===selectedPaymentId
?" active"
:""
);

button.textContent=
payment.name;

button.addEventListener(
"click",
()=>{

selectedPaymentId=
payment.id;

renderPayments();

});

container.appendChild(button);

});

}


/* =========================================================
   CARRITO
========================================================= */

function addToCart(product){

const stock=
Number(product.stock||0);

if(stock<=0){

showStatus(
"Este producto está agotado."
);

return;

}

const item=
cart.find(
i=>i.id===product.id
);

if(item){

if(item.quantity<stock){

item.quantity++;

}else{

showStatus(
"No puedes agregar más unidades que la existencia disponible."
);

return;

}

}else{

cart.push({
...product,
quantity:1
});

}

renderCart();

}


function changeQuantity(
id,
amount
){

const item=
cart.find(
i=>i.id===id
);

if(!item)return;

const product=
products.find(
p=>p.id===id
);

const max=
Number(
product?.stock??
item.stock??
0
);

const newQuantity=
item.quantity+amount;

if(newQuantity>max){

showStatus(
"No hay suficiente existencia disponible."
);

return;

}

item.quantity=
newQuantity;

if(item.quantity<=0){

cart=
cart.filter(
i=>i.id!==id
);

}

renderCart();

}


function getCartTotal(){

return cart.reduce(
(sum,item)=>
sum+
Number(item.price)*
Number(item.quantity),
0
);

}


function renderCart(){

const container=
$("cart");

container.innerHTML="";

if(!cart.length){

container.innerHTML=
'<div class="empty">El carrito está vacío</div>';

$("total").textContent="$0.00";

return;

}


cart.forEach(item=>{

const row=
document.createElement("div");

row.className="cart-item";

const info=
document.createElement("div");

info.innerHTML=
'<div class="cart-name">'+
escapeHTML(item.name)+
'</div>'+
'<div class="cart-price">'+
money(item.price)+
" c/u</div>";

const controls=
document.createElement("div");

controls.className="quantity";

const minus=
document.createElement("button");

minus.type="button";
minus.textContent="−";

minus.addEventListener(
"click",
()=>changeQuantity(item.id,-1)
);

const quantity=
document.createElement("span");

quantity.textContent=
item.quantity;

const plus=
document.createElement("button");

plus.type="button";
plus.textContent="+";

plus.addEventListener(
"click",
()=>changeQuantity(item.id,1)
);

controls.append(
minus,
quantity,
plus
);

info.appendChild(controls);

const subtotal=
document.createElement("strong");

subtotal.textContent=
money(
Number(item.price)*
Number(item.quantity)
);

row.append(
info,
subtotal
);

container.appendChild(row);

});


$("total").textContent=
money(getCartTotal());

}


/* =========================================================
   CLIENTES
========================================================= */

function renderSelectedCustomer(){

const selected=
customers.find(
c=>c.id===selectedCustomerId
);

const selectedElement=
$("selectedCustomer");

const general=
$("generalCustomer");


if(!selected){

selectedCustomerId=null;

selectedElement.style.display="none";
selectedElement.innerHTML="";

general.style.display="block";

return;

}


general.style.display="none";

selectedElement.style.display="block";

selectedElement.innerHTML=
"👤 <strong>"+
escapeHTML(
selected.name||"Cliente"
)+
"</strong>"+
(
selected.phone
?" · 📱 "+escapeHTML(selected.phone)
:""
)+
'<button type="button" class="clear-customer" id="clearCustomer">Quitar</button>';

$("clearCustomer").addEventListener(
"click",
clearSelectedCustomer
);

}


function clearSelectedCustomer(){

selectedCustomerId=null;

$("customerSearch").value="";

$("customerResults").innerHTML="";

$("customerResults").style.display="none";

renderSelectedCustomer();

}


function renderCustomerResults(query){

const container=
$("customerResults");

const search=
String(query||"")
.trim()
.toLowerCase();

if(!search){

container.innerHTML="";
container.style.display="none";
return;

}


const filtered=
customers.filter(customer=>{

const name=
String(customer.name||"").toLowerCase();

const phone=
String(customer.phone||"").toLowerCase();

const notes=
String(customer.notes||"").toLowerCase();

return(
name.includes(search)||
phone.includes(search)||
notes.includes(search)
);

});


container.innerHTML="";


if(!filtered.length){

const empty=
document.createElement("div");

empty.className="empty";

empty.textContent=
"No encontramos ese cliente.";

container.appendChild(empty);

container.style.display="block";

return;

}


filtered.slice(0,20).forEach(customer=>{

const button=
document.createElement("button");

button.type="button";

button.className=
"customer-result";

button.innerHTML=
"<strong>"+
escapeHTML(
customer.name||
"Cliente sin nombre"
)+
"</strong>"+
(
customer.phone
?"<small>📱 "+
escapeHTML(customer.phone)+
"</small>"
:""
);

button.addEventListener(
"click",
()=>{

selectedCustomerId=
customer.id;

$("customerSearch").value=
customer.name||"";

container.innerHTML="";
container.style.display="none";

renderSelectedCustomer();

}
);

container.appendChild(button);

});

container.style.display="block";

}


$("customerSearch").addEventListener(
"input",
event=>{
renderCustomerResults(
event.target.value
);
}
);


$("customerSearch").addEventListener(
"focus",
event=>{
if(event.target.value.trim()){
renderCustomerResults(
event.target.value
);
}
}
);


$("generalCustomer").addEventListener(
"click",
clearSelectedCustomer
);


document.addEventListener(
"click",
event=>{

const box=
document.querySelector(".customer-box");

if(
box &&
!box.contains(event.target)
){

$("customerResults").style.display=
"none";

}

}
);

   CAMBIO DE NEGOCIO
========================================================= */

async function changeBusiness(
name,
button
){

if(name===currentBusiness){
return;
}

currentBusiness=name;

cart=[];

selectedPaymentId=null;

selectedCustomerId=null;

$("customerSearch").value="";

$("customerResults").innerHTML="";

$("customerResults").style.display="none";

document
.querySelectorAll(".business-btn")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");

await loadBusinessData();

}


/* =========================================================
   REGISTRAR VENTA
========================================================= */

async function registerSale(isPending){

clearStatus();

if(!cart.length){

showStatus(
"Agrega al menos un producto."
);

return;

}

if(!isPending&&!selectedPaymentId){

showStatus(
"Selecciona un método de pago."
);

return;

}

if(isPending&&!selectedCustomerId){

showStatus(
"Para dejar una venta a cuenta debes seleccionar un cliente."
);

return;

}


if(!navigator.onLine){

showStatus(
"Estás OFFLINE.\n\n"+
"Los productos, clientes y métodos de pago están disponibles porque fueron guardados en el dispositivo.\n\n"+
"El registro de la venta offline se habilitará en la siguiente etapa.",
"warn"
);

return;

}


const button=
isPending
?$("accountButton")
:$("chargeButton");

const originalText=
button.textContent;

button.disabled=true;

button.textContent=
isPending
?"GUARDANDO..."
:"REGISTRANDO...";


try{

const items=
cart.map(item=>({

product_id:item.id,

description:item.name,

quantity:Number(item.quantity),

unit_price:Number(item.price),

subtotal:
Number(item.price)*
Number(item.quantity)

}));

const businessId=
BUSINESS_IDS[currentBusiness];

const result=
await supabaseClient.rpc(
"register_sale",
{
p_business_id:businessId,
p_customer_id:selectedCustomerId||null,
p_payment_method_id:
isPending
?null
:selectedPaymentId,
p_items:items,
p_is_pending:isPending
}
);

if(result.error){
throw result.error;
}

alert(
isPending
?"Cuenta registrada correctamente."
:"Venta registrada correctamente."
);

cart=[];

selectedCustomerId=null;

$("customerSearch").value="";

$("customerResults").innerHTML="";

$("customerResults").style.display="none";

renderSelectedCustomer();

await loadBusinessData();

showStatus(
isPending
?"Cuenta guardada correctamente."
:"Venta guardada correctamente.",
"ok"
);

}
catch(error){

console.error(
"registerSale:",
error
);

showStatus(
"No se pudo registrar la operación:\n"+
(error?.message||String(error))
);

}
finally{

button.disabled=false;
button.textContent=originalText;

}

}
