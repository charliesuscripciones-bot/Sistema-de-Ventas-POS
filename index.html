<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:22px 20px;
}

header h1{
  font-size:28px;
}

header p{
  font-size:15px;
  opacity:.75;
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:13px 15px;
  border-radius:10px;
  font-size:14px;
  display:none;
  font-weight:600;
  white-space:pre-line;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.offline{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.status.sync{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.businesses{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.nav-btn{
  border:none;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  border:2px solid #ddd;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:20px;
}

.nav-btn{
  color:#2563eb;
}

.nav-btn.accounts{
  background:#fff7ed;
  border-color:#f59e0b;
  color:#b45309;
}

.nav-btn.clients{
  background:#ecfdf5;
  border-color:#10b981;
  color:#047857;
}

.nav-btn.history{
  background:#f5f3ff;
  border-color:#7c3aed;
  color:#6d28d9;
}

.nav-btn.inventory{
  background:#eff6ff;
  border-color:#2563eb;
  color:#1d4ed8;
}

.layout{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
  font-size:21px;
  margin-bottom:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  border:2px solid #ddd;
  border-radius:14px;
  padding:18px 14px;
  cursor:pointer;
  background:#fff;
  text-align:left;
}

.product:hover{
  border-color:#2563eb;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:700;
  font-size:17px;
  margin-bottom:9px;
}

.price{
  font-size:23px;
  font-weight:800;
  color:#2563eb;
}

.stock{
  font-size:14px;
  color:#666;
  margin-top:7px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:700;
}

.cart-price{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.quantity button{
  width:32px;
  height:32px;
  border:none;
  border-radius:7px;
  background:#eee;
  cursor:pointer;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:25px;
  font-weight:800;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #eee;
}

.payment-title,
.customer-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:800;
  font-size:17px;
}

.payments{
  display:grid;
  gap:9px;
}

.payment{
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:16px;
  font-weight:700;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.customer-box{
  position:relative;
}

.customer-row{
  display:flex;
  gap:8px;
}

.customer-search{
  flex:1;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:15px;
  min-width:0;
  background:#fff;
}

.customer-search:focus{
  outline:none;
  border-color:#2563eb;
}

.add-client{
  border:none;
  background:#2563eb;
  color:#fff;
  padding:0 14px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.customer-results{
  margin-top:8px;
  display:none;
  border:2px solid #ddd;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;
  left:0;
  right:0;
  z-index:100;
}

.customer-result{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid #eee;
  background:#fff;
  padding:13px;
  text-align:left;
  cursor:pointer;
}

.customer-result:hover{
  background:#f3f4f6;
}

.customer-result strong{
  display:block;
  font-size:15px;
}

.customer-result small{
  display:block;
  color:#6b7280;
  margin-top:4px;
}

.selected-customer{
  margin-top:8px;
  padding:12px;
  border-radius:9px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-size:14px;
  font-weight:600;
}

.clear-customer{
  border:none;
  background:none;
  color:#dc2626;
  font-weight:700;
  cursor:pointer;
  margin-left:8px;
}

.general-customer{
  margin-top:8px;
  padding:13px;
  border-radius:9px;
  background:#f3f4f6;
  color:#555;
  font-weight:700;
  cursor:pointer;
}

.charge,
.account{
  width:100%;
  margin-top:15px;
  padding:16px;
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.account{
  margin-top:10px;
  background:#f59e0b;
}

.charge:disabled,
.account:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px 10px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

.offline-mode{
  border:2px solid #f59e0b;
}

.pending-badge{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#fff7ed;
  border:2px solid #fed7aa;
  color:#9a3412;
  font-size:14px;
  font-weight:700;
  display:none;
}

.pending-badge.visible{
  display:block;
}

.sync-button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:950px){

  .navigation{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  header h1{
    font-size:25px;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .business-btn{
    flex:1;
  }

  .layout{
    gap:15px;
  }

  .card{
    padding:16px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:15px 12px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:20px;
  }

  .customer-row{
    flex-direction:column;
  }

  .add-client{
    padding:12px;
  }

}

</style>

</head>

<body>

<h1>🧾 Sistema de Ventas POS</h1>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

/* =====================================================
   ESTADO
===================================================== */

let supabaseClient = null;

let currentBusiness =
"BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId =
null;

let selectedCustomerId =
null;

let isSyncing =
false;

/* =====================================================
   CACHE OFFLINE
===================================================== */

const CACHE_KEY =
"POS_OFFLINE_CACHE_V2";

const QUEUE_KEY =
"POS_OFFLINE_QUEUE_V1";

/* =====================================================
   CACHE POR NEGOCIO
===================================================== */

function getOfflineCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if(!raw){

      return {

        businesses:{},

        customers:[]

      };

    }

    const data =
      JSON.parse(raw);

    return {

      businesses:
        data.businesses || {},

      customers:
        Array.isArray(
          data.customers
        )
        ? data.customers
        : []

    };

  }

  catch(error){

    console.warn(
      "Cache offline inválido:",
      error
    );

    return {

      businesses:{},

      customers:[]

    };

  }

}

function saveOfflineCache(){

  try{

    const cache =
      getOfflineCache();

    cache.businesses[
      currentBusiness
    ] = {

      products,
      payments,
      savedAt:
        new Date().toISOString()

    };

    cache.customers =
      customers;

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(cache)
    );

  }

  catch(error){

    console.warn(
      "No se pudo guardar cache:",
      error
    );

  }

}

function loadOfflineCache(){

  try{

    const cache =
      getOfflineCache();

    const businessData =
      cache.businesses[
        currentBusiness
      ];

    if(!businessData){

      customers =
        cache.customers || [];

      return false;

    }

    products =
      Array.isArray(
        businessData.products
      )
      ? businessData.products
      : [];

    payments =
      Array.isArray(
        businessData.payments
      )
      ? businessData.payments
      : [];

    customers =
      Array.isArray(
        cache.customers
      )
      ? cache.customers
      : [];

    return(
      products.length > 0 ||
      payments.length > 0 ||
      customers.length > 0
    );

  }

  catch(error){

    console.warn(
      "No se pudo cargar cache:",
      error
    );

    return false;

  }

}

/* =====================================================
   COLA DE OPERACIONES OFFLINE
===================================================== */

function getOfflineQueue(){

  try{

    const raw =
      localStorage.getItem(
        QUEUE_KEY
      );

    if(!raw){

      return [];

    }

    const queue =
      JSON.parse(raw);

    return Array.isArray(queue)
      ? queue
      : [];

  }

  catch(error){

    console.warn(
      "Cola offline inválida:",
      error
    );

    return [];

  }

}

function saveOfflineQueue(
  queue
){

  try{

    localStorage.setItem(
      QUEUE_KEY,
      JSON.stringify(queue)
    );

  }

  catch(error){

    console.error(
      "No se pudo guardar la cola offline:",
      error
    );

    throw new Error(
      "No hay suficiente espacio disponible en el dispositivo."
    );

  }

}

function addToOfflineQueue(
  operation
){

  const queue =
    getOfflineQueue();

  queue.push(
    operation
  );

  saveOfflineQueue(
    queue
  );

  updatePendingBadge();

}

function updatePendingBadge(){

  const queue =
    getOfflineQueue();

  const badge =
    $("pendingBadge");

  const count =
    $("pendingCount");

  count.textContent =
    queue.length;

  if(queue.length > 0){

    badge.classList.add(
      "visible"
    );

  }

  else{

    badge.classList.remove(
      "visible"
    );

  }

}

/* =====================================================
   UTILIDADES
===================================================== */

function $(id){

  return document.getElementById(id);

}

function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);

}

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}

function showStatus(
  message,
  type="error"
){

  const element =
    $("status");

  element.textContent =
    message;

  element.className =
    "status " + type;

}

function clearStatus(){

  $("status").textContent =
    "";

  $("status").className =
    "status";

}

/* =====================================================
   ESTADO DE CONEXIÓN
===================================================== */

function showOfflineStatus(){

  const pending =
    getOfflineQueue().length;

  showStatus(

    "📴 MODO OFFLINE\n" +

    "Las ventas se guardarán en este dispositivo y se sincronizarán automáticamente cuando regrese Internet." +

    (

      pending > 0

      ? "\n\nOperaciones pendientes: " +
        pending

      : ""

    ),

    "offline"

  );

}

function showOnlineStatus(){

  clearStatus();

}

/* =====================================================
   SUPABASE
===================================================== */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    throw new Error(
      "No se pudo cargar Supabase."
    );

  }

  supabaseClient =
    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

}

/* =====================================================
   CARGAR DATOS
===================================================== */

async function loadBusinessData(){

  $("products").innerHTML =
    '<div class="empty">' +
    'Cargando productos...' +
    '</div>';

  $("payments").innerHTML =
    '<div class="empty">' +
    'Cargando métodos de pago...' +
    '</div>';

  const businessId =
    BUSINESS_IDS[
      currentBusiness
    ];

  try{

    if(!navigator.onLine){

      throw new Error(
        "OFFLINE"
      );

    }

    const [

      productsResult,

      paymentsResult,

      customersResult

    ] = await Promise.all([

      supabaseClient

        .from("products")

        .select(
          "id,name,price,cost,stock,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("payment_methods")

        .select(
          "id,name,provider,active,business_id"
        )

        .eq(
          "business_id",
          businessId
        )

        .eq(
          "active",
          true
        )

        .order("name"),

      supabaseClient

        .from("customers")

        .select(
          "id,name,phone,notes"
        )

        .order("name")

    ]);

    if(productsResult.error){

      throw productsResult.error;

    }

    if(paymentsResult.error){

      throw paymentsResult.error;

    }

    if(customersResult.error){

      throw customersResult.error;

    }

    products =
      productsResult.data || [];

    payments =
      paymentsResult.data || [];

    customers =
      customersResult.data || [];

    saveOfflineCache();

    if(
      !payments.some(
        p =>
          p.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }

    if(
      !customers.some(
        c =>
          c.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }

    renderProducts();

    renderPayments();

    renderCart();

    renderSelectedCustomer();

    showOnlineStatus();

    updatePendingBadge();

  }

  catch(error){

    console.warn(
      "No se pudo cargar Supabase:",
      error
    );

    if(
      loadOfflineCache()
    ){

      if(
        !payments.some(
          p =>
            p.id ===
            selectedPaymentId
        )
      ){

        selectedPaymentId =
          payments[0]?.id ||
          null;

      }

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      showOfflineStatus();

      updatePendingBadge();

    }

    else{

      products = [];

      payments = [];

      customers = [];

      $("products").innerHTML =
        '<div class="empty">' +
        'No hay datos guardados para trabajar offline.' +
        '</div>';

      $("payments").innerHTML =
        '<div class="empty">' +
        'No hay métodos de pago guardados.' +
        '</div>';

      showStatus(

        "No se pudo conectar y todavía no existe información guardada offline.",

        "error"

      );

      updatePendingBadge();

    }

  }

}

/* =====================================================
   PRODUCTOS
===================================================== */

function renderProducts(){

  const container =
    $("products");

  container.innerHTML =
    "";

  if(!products.length){

    container.innerHTML =
      '<div class="empty">' +
      'No hay productos disponibles.' +
      '</div>';

    return;

  }

  products.forEach(
    product => {

      const stock =
        Number(
          product.stock || 0
        );

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "product" +
        (
          stock <= 0
          ? " disabled"
          : ""
        );

      button.disabled =
        stock <= 0;

      button.innerHTML =

        '<div class="product-name">' +

        escapeHTML(
          product.name
        ) +

        '</div>' +

        '<div class="price">' +

        money(
          product.price
        ) +

        '</div>' +

        '<div class="stock">' +

        (
          stock > 0
          ? "Existencia: " + stock
          : "Agotado"
        ) +

        '</div>';

      button.addEventListener(
        "click",
        () =>
          addToCart(product)
      );

      container.appendChild(
        button
      );

    }
  );

}

/* =====================================================
   PAGOS
===================================================== */

function renderPayments(){

  const container =
    $("payments");

  container.innerHTML =
    "";

  if(!payments.length){

    container.innerHTML =
      '<div class="empty">' +
      'No hay métodos de pago disponibles.' +
      '</div>';

    return;

  }

  payments.forEach(
    payment => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "payment" +

        (
          payment.id ===
          selectedPaymentId
          ? " active"
          : ""
        );

      button.textContent =
        payment.name;

      button.addEventListener(
        "click",
        () => {

          selectedPaymentId =
            payment.id;

          renderPayments();

        }
      );

      container.appendChild(
        button
      );

    }
  );

}

/* =====================================================
   CARRITO
===================================================== */

function addToCart(product){

  const stock =
    Number(
      product.stock || 0
    );

  if(stock <= 0){

    showStatus(
      "Este producto está agotado.",
      "error"
    );

    return;

  }

  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );

  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }

    else{

      showStatus(
        "No puedes agregar más unidades que la existencia.",
        "error"
      );

    }

  }

  else{

    cart.push({

      ...product,

      quantity:1

    });

  }

  renderCart();

}

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id === id
    );

  if(!item){

    return;

  }

  const product =
    products.find(
      p =>
        p.id === id
    );

  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  const newQuantity =
    item.quantity +
    amount;

  if(newQuantity > max){

    showStatus(
      "No hay suficiente existencia disponible.",
      "error"
    );

    return;

  }

  item.quantity =
    newQuantity;

  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !== id
      );

  }

  renderCart();

}

function getCartTotal(){

  return cart.reduce(

    (sum,item) =>

      sum +

      Number(
        item.price
      ) *

      Number(
        item.quantity
      ),

    0

  );

}

function renderCart(){

  const container =
    $("cart");

  container.innerHTML =
    "";

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      'El carrito está vacío' +
      '</div>';

    $("total").textContent =
      "$0.00";

    return;

  }

  cart.forEach(
    item => {

      const subtotal =

        Number(
          item.price
        ) *

        Number(
          item.quantity
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "cart-item";

      const info =
        document.createElement(
          "div"
        );

      info.innerHTML =

        '<div class="cart-name">' +

        escapeHTML(
          item.name
        ) +

        '</div>' +

        '<div class="cart-price">' +

        money(
          item.price
        ) +

        ' c/u</div>';

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "quantity";

      const minus =
        document.createElement(
          "button"
        );

      minus.type =
        "button";

      minus.textContent =
        "−";

      minus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            -1
          )
      );

      const quantity =
        document.createElement(
          "span"
        );

      quantity.textContent =
        item.quantity;

      const plus =
        document.createElement(
          "button"
        );

      plus.type =
        "button";

      plus.textContent =
        "+";

      plus.addEventListener(
        "click",
        () =>
          changeQuantity(
            item.id,
            1
          )
      );

      controls.append(
        minus,
        quantity,
        plus
      );

      info.appendChild(
        controls
      );

      const subtotalElement =
        document.createElement(
          "strong"
        );

      subtotalElement.textContent =
        money(
          subtotal
        );

      row.append(
        info,
        subtotalElement
      );

      container.appendChild(
        row
      );

    }
  );

  $("total").textContent =
    money(
      getCartTotal()
    );

}

    element.style.display =

function renderCustomerResults(
  query
){

  const container =
    $("customerResults");

  const search =
    String(
      query || ""
    )
    .trim()
    .toLowerCase();

  if(!search){

    container.innerHTML =
      "";

    container.style.display =
      "none";

    return;

  }

  const filtered =
    customers.filter(
      customer => {

        const name =
          String(
            customer.name || ""
          )
          .toLowerCase();

        const phone =
          String(
            customer.phone || ""
          )
          .toLowerCase();

        const notes =
          String(
            customer.notes || ""
          )
          .toLowerCase();

        return(

          name.includes(
            search
          ) ||

          phone.includes(
            search
          ) ||

          notes.includes(
            search
          )

        );

      }
    );

  container.innerHTML =
    "";

  if(!filtered.length){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      "No encontramos ese cliente.";

    container.appendChild(
      empty
    );

    container.style.display =
      "block";

    return;

  }

  filtered
    .slice(0,10)
    .forEach(
      customer => {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "customer-result";

        button.innerHTML =

          "<strong>" +

          escapeHTML(
            customer.name ||
            "Cliente sin nombre"
          ) +

          "</strong>" +

          (
            customer.phone

            ? "<small>📱 " +
              escapeHTML(
                customer.phone
              ) +
              "</small>"

            : ""
          );

        button.addEventListener(
          "click",
          () => {

            selectedCustomerId =
              customer.id;

            $("customerSearch").value =
              customer.name || "";

            container.innerHTML =
              "";

            container.style.display =
              "none";

            renderSelectedCustomer();

          }
        );

        container.appendChild(
          button
        );

      }
    );

  container.style.display =
    "block";

}

  name,
  button
){

  if(
    name ===
    currentBusiness
  ){

    return;

  }

  currentBusiness =
    name;

  cart = [];

  selectedPaymentId =
    null;

  selectedCustomerId =
    null;

  $("customerSearch").value =
    "";

  $("customerResults").innerHTML =
    "";

  $("customerResults").style.display =
    "none";

  document
    .querySelectorAll(
      ".business-btn"
    )
    .forEach(
      b =>

          "active"
        )
    );

  button.classList.add(
    "active"
  );

  await loadBusinessData();

}

/* =====================================================
   CREAR OBJETO DE VENTA
===================================================== */

function buildSaleOperation(
  isPending
){

  const items =
    cart.map(
      item => ({

        product_id:
          item.id,

        description:
          item.name,

        quantity:
          Number(
            item.quantity
          ),

        unit_price:
          Number(
            item.price
          ),

        subtotal:
          Number(
            item.price
          ) *
          Number(
            item.quantity
          )

      })
    );

  return {

    local_id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : (
        Date.now() +
        "-" +
        Math.random()
      ),

    created_at:
      new Date().toISOString(),

    business_name:
      currentBusiness,

    business_id:
      BUSINESS_IDS[
        currentBusiness
      ],

    customer_id:
      selectedCustomerId ||
      null,

    payment_method_id:
      isPending
      ? null
      : selectedPaymentId,

    items,

    is_pending:
      isPending

  };

}

/* =====================================================
   DESCONTAR INVENTARIO LOCAL
===================================================== */

function decreaseLocalStock(
  items
){

  items.forEach(
    saleItem => {

      const product =
        products.find(
          p =>
            p.id ===
            saleItem.product_id
        );

      if(!product){

        return;

      }

      const currentStock =
        Number(
          product.stock || 0
        );

      product.stock =
        Math.max(
          0,
          currentStock -
          Number(
            saleItem.quantity || 0
          )
        );

    }
  );

  saveOfflineCache();

  renderProducts();

}

/* =====================================================
   ENVIAR UNA OPERACIÓN A SUPABASE
===================================================== */

async function sendOperationToSupabase(
  operation
){

  if(!supabaseClient){

    throw new Error(
      "Supabase no está inicializado."
    );

  }

  const result =
    await supabaseClient.rpc(
      "register_sale",
      {

        p_business_id:
          operation.business_id,

        p_customer_id:
          operation.customer_id,

        p_payment_method_id:
          operation.payment_method_id,

        p_items:
          operation.items,

        p_is_pending:
          operation.is_pending

      }
    );

  if(result.error){

    throw result.error;

  }

  return result.data;

}

/* =====================================================
   SINCRONIZAR COLA OFFLINE
===================================================== */

async function syncOfflineQueue(){

  if(isSyncing){

    return;

  }

  if(!navigator.onLine){

    return;

  }

  const queue =
    getOfflineQueue();

  if(!queue.length){

    updatePendingBadge();

    return;

  }

  if(!supabaseClient){

    return;

  }

  isSyncing =
    true;

  showStatus(

    "🔄 SINCRONIZANDO...\n" +

    "Enviando " +
    queue.length +
    " operación(es) pendiente(s).",

    "sync"

  );

  let remaining =
    [...queue];

  let synced =
    0;

  try{

    while(remaining.length){

      if(!navigator.onLine){

        throw new Error(
          "La conexión se perdió durante la sincronización."
        );

      }

      const operation =
        remaining[0];

      try{

        await sendOperationToSupabase(
          operation
        );

        remaining.shift();

        saveOfflineQueue(
          remaining
        );

        synced++;

        updatePendingBadge();

      }

      catch(error){

        console.error(
          "No se pudo sincronizar operación:",
          operation,
          error
        );

        /*
          Detenemos aquí.

          Es importante NO eliminar la operación
          si Supabase la rechazó.

          Así no perdemos la venta.
        */

        throw new Error(

          "No se pudo sincronizar una operación.\n\n" +

          (
            error?.message ||
            String(error)
          )

        );

      }

    }

    showStatus(

      "✅ Sincronización completada.\n" +

      "Se enviaron " +
      synced +
      " operación(es) al servidor.",

      "ok"

    );

    await loadBusinessData();

  }

  catch(error){

    console.error(
      "syncOfflineQueue:",
      error
    );

    showStatus(

      "⚠️ Sincronización incompleta.\n" +

      "Se enviaron " +
      synced +
      " operación(es).\n" +

      "Las restantes permanecen guardadas en el dispositivo.\n\n" +

      (
        error?.message ||
        String(error)
      ),

      "offline"

    );

    updatePendingBadge();

  }

  finally{

    isSyncing =
      false;

  }

}

/* =====================================================
   REGISTRAR VENTA
===================================================== */

async function registerSale(
  isPending
){

  clearStatus();

  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "error"
    );

    return;

  }

  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago.",
      "error"
    );

    return;

  }

  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(

      "Para dejar una venta a cuenta debes seleccionar un cliente.",

      "error"

    );

    return;

  }

  /*
    Construimos la operación ANTES de enviarla.

    Esto permite usar exactamente la misma venta
    tanto online como offline.
  */

  const operation =
    buildSaleOperation(
      isPending
    );

  const total =
    getCartTotal();

  const customer =
    customers.find(
      c =>
        c.id ===
        selectedCustomerId
    );

  const paymentName =
    payments.find(
      p =>
        p.id ===
        selectedPaymentId
    )?.name ||
    "Pago";

  /* =================================================
     MODO OFFLINE
  ================================================= */

  if(!navigator.onLine){

    try{

      addToOfflineQueue(
        operation
      );

      decreaseLocalStock(
        operation.items
      );

      cart = [];

      selectedCustomerId =
        null;

      $("customerSearch").value =
        "";

      $("customerResults").innerHTML =
        "";

      $("customerResults").style.display =
        "none";

      renderSelectedCustomer();

      renderCart();

      showStatus(

        (

          isPending
          ? "📴 CUENTA GUARDADA OFFLINE"
          : "📴 VENTA GUARDADA OFFLINE"

        ) +

        "\n\n" +

        currentBusiness +

        "\nCliente: " +

        (
          customer?.name ||
          "Consumidor general"
        ) +

        "\nTotal: " +

        money(
          total
        ) +

        "\n\n" +

        "Se sincronizará automáticamente cuando regrese Internet.",

        "offline"

      );

      alert(

        (

          isPending
          ? "📴 Cuenta guardada"
          : "📴 Venta guardada"

        ) +

        "\n\n" +

        "No tienes Internet, pero la operación quedó guardada en este dispositivo.\n\n" +

        "No necesitas volver a capturarla."

      );

    }

    catch(error){

      console.error(
        "Error guardando offline:",
        error
      );

      showStatus(

        "No se pudo guardar la operación offline:\n" +

        (
          error?.message ||
          String(error)
        ),

        "error"

      );

    }

    return;

  }

  /* =================================================
     MODO ONLINE
  ================================================= */

  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";

  try{

    await sendOperationToSupabase(
      operation
    );

    alert(

      (

        isPending
        ? "Cuenta registrada"
        : "Venta registrada"

      ) +

      "\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(
        total
      ) +

      (

        isPending
        ? ""
        : "\nPago: " +
          paymentName

      )

    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    await loadBusinessData();

    showStatus(

      isPending

      ? "Cuenta guardada correctamente."

      : "Venta guardada correctamente.",

      "ok"

    );

    /*
      Si había ventas offline pendientes,
      aprovechamos la conexión para sincronizarlas.
    */

    if(
      getOfflineQueue().length
    ){

      await syncOfflineQueue();

    }

  }

  catch(error){

    console.error(
      "registerSale online:",
      error
    );

    /*
      Si perdimos Internet justo cuando
      intentábamos registrar la venta,
      la guardamos automáticamente offline.

      Esto evita perder una venta por una
      caída de señal en el momento del cobro.
    */

    if(
      !navigator.onLine
    ){

      try{

        addToOfflineQueue(
          operation
        );

        decreaseLocalStock(
          operation.items
        );

        cart = [];

        selectedCustomerId =
          null;

        $("customerSearch").value =
          "";

        $("customerResults").innerHTML =
          "";

        $("customerResults").style.display =
          "none";

        renderSelectedCustomer();

        renderCart();

        showStatus(

          "📴 La conexión se perdió durante la venta.\n\n" +

          "La operación fue guardada automáticamente en el dispositivo y se sincronizará después.",

          "offline"

        );

        alert(

          "📴 Se perdió Internet.\n\n" +

          "No se perdió la venta.\n\n" +

          "Quedó guardada en el dispositivo para sincronizarse después."

        );

      }

      catch(offlineError){

        showStatus(

          "ERROR CRÍTICO: no se pudo guardar la operación offline.\n\n" +

          (
            offlineError?.message ||
            String(offlineError)
          ),

          "error"

        );

      }

    }

    else{

      showStatus(

        "No se pudo registrar la operación:\n\n" +

        (
          error?.message ||
          String(error)
        ),

        "error"

      );

    }

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      originalText;

    updatePendingBadge();

  }

}

/* =====================================================
   SERVICE WORKER
===================================================== */

async function registerServiceWorker(){

  if(
    !("serviceWorker" in navigator)
  ){

    return;

  }

  try{

    await navigator.serviceWorker.register(
      "./sw.js"
    );

    console.log(
      "Service Worker registrado correctamente."
    );

  }

  catch(error){

    console.warn(
      "No se pudo registrar Service Worker:",
      error
    );

  }

}

/* =====================================================
   INICIO
===================================================== */

async function startApp(){

  try{

    initializeSupabase();

    /*
      Registramos el Service Worker inmediatamente.
    */

    registerServiceWorker();

    /*
      Si tenemos Internet:
      1. Intentamos sincronizar operaciones anteriores.
      2. Actualizamos datos.
    */

    if(navigator.onLine){

      await syncOfflineQueue();

      await loadBusinessData();

    }

    else{

      /*
        Sin Internet:
        utilizamos directamente el cache.
      */

      if(
        loadOfflineCache()
      ){

        renderProducts();

        renderPayments();

        renderCart();

        renderSelectedCustomer();

        showOfflineStatus();

      }

      else{

        showStatus(

          "📴 No hay Internet y todavía no existe información guardada en este dispositivo.\n\n" +

          "Conéctate una vez a Internet para descargar productos, clientes y métodos de pago.",

          "offline"

        );

      }

    }

    updatePendingBadge();

  }

  catch(error){

    console.error(
      "startApp:",
      error
    );

    if(
      loadOfflineCache()
    ){

      renderProducts();

      renderPayments();

      renderCart();

      renderSelectedCustomer();

      showOfflineStatus();

    }

    else{

      showStatus(

        error?.message ||
        "No se pudo iniciar el sistema.",

        "error"

      );

    }

    updatePendingBadge();

  }

}

startApp();

</script>

</body>

</html>
