<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Sistema de Ventas POS"
>

<title>Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:28px 20px;
}

header h1{
  font-size:30px;
  line-height:1.2;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  margin:0 0 15px;
  padding:18px;
  border-radius:16px;
  font-size:17px;
  display:none;
  font-weight:700;
  white-space:pre-line;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.offline{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.pending-sync{
  margin:0 0 20px;
  padding:18px;
  border-radius:16px;
  background:#eff6ff;
  border:3px solid #bfdbfe;
  color:#1d4ed8;
  font-size:18px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.pending-sync.show{
  display:flex;
}

.pending-count{
  min-width:55px;
  height:55px;
  border-radius:50%;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.businesses{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:20px;
}

.business-btn{
  border:3px solid #ddd;
  padding:18px 15px;
  border-radius:18px;
  background:#fff;
  font-weight:800;
  cursor:pointer;
  font-size:22px;
  color:#1683e8;
  min-height:80px;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:25px;
}

.nav-btn{
  border:3px solid #ddd;
  padding:18px 12px;
  border-radius:18px;
  background:#fff;
  font-weight:800;
  cursor:pointer;
  font-size:20px;
  min-height:80px;
  color:#2563eb;
}

.nav-btn.accounts{
  background:#fff7ed;
  border-color:#f59e0b;
  color:#b45309;
}

.nav-btn.clients{
  background:#ecfdf5;
  border-color:#10b981;
  color:#047857;
}

.nav-btn.history{
  background:#f5f3ff;
  border-color:#7c3aed;
  color:#6d28d9;
}

.nav-btn.inventory{
  background:#eff6ff;
  border-color:#2563eb;
  color:#1d4ed8;
}

.layout{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card h2{
  font-size:28px;
  margin-bottom:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.product{
  border:3px solid #ddd;
  border-radius:18px;
  padding:20px 15px;
  cursor:pointer;
  background:#fff;
  text-align:left;
  min-height:150px;
}

.product:hover{
  border-color:#2563eb;
}

.product.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.product-name{
  font-weight:800;
  font-size:20px;
  line-height:1.25;
  margin-bottom:14px;
  color:#1683e8;
}

.price{
  font-size:26px;
  font-weight:900;
  color:#2563eb;
}

.stock{
  font-size:17px;
  color:#666;
  margin-top:10px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee;
  gap:12px;
}

.cart-name{
  font-weight:800;
  font-size:17px;
}

.cart-price{
  font-size:14px;
  color:#666;
  margin-top:5px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.quantity button{
  width:38px;
  height:38px;
  border:none;
  border-radius:9px;
  background:#eee;
  cursor:pointer;
  font-size:21px;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-weight:800;
  font-size:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:29px;
  font-weight:900;
  margin-top:20px;
  padding-top:20px;
  border-top:2px solid #eee;
}

.payment-title,
.customer-title{
  margin-top:22px;
  margin-bottom:12px;
  font-weight:900;
  font-size:19px;
}

.payments{
  display:grid;
  gap:10px;
}

.payment{
  padding:16px;
  border:3px solid #ddd;
  border-radius:13px;
  background:#fff;
  cursor:pointer;
  text-align:left;
  font-size:17px;
  font-weight:800;
}

.payment.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.customer-box{
  position:relative;
}

.customer-row{
  display:flex;
  gap:8px;
}

.customer-search{
  flex:1;
  padding:15px;
  border:3px solid #ddd;
  border-radius:13px;
  font-size:16px;
  min-width:0;
  background:#fff;
}

.customer-search:focus{
  outline:none;
  border-color:#2563eb;
}

.add-client{
  border:none;
  background:#2563eb;
  color:#fff;
  padding:0 16px;
  border-radius:13px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}

.customer-results{
  margin-top:8px;
  display:none;
  border:2px solid #ddd;
  border-radius:13px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  position:absolute;
  left:0;
  right:0;
  z-index:100;
}

.customer-result{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid #eee;
  background:#fff;
  padding:15px;
  text-align:left;
  cursor:pointer;
}

.customer-result:hover{
  background:#f3f4f6;
}

.customer-result strong{
  display:block;
  font-size:16px;
}

.customer-result small{
  display:block;
  color:#6b7280;
  margin-top:5px;
}

.selected-customer{
  margin-top:9px;
  padding:14px;
  border-radius:11px;
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1d4ed8;
  font-size:15px;
  font-weight:700;
}

.clear-customer{
  border:none;
  background:none;
  color:#dc2626;
  font-weight:800;
  cursor:pointer;
  margin-left:8px;
}

.general-customer{
  margin-top:9px;
  padding:14px;
  border-radius:11px;
  background:#f3f4f6;
  color:#555;
  font-weight:800;
  cursor:pointer;
}

.charge,
.account{
  width:100%;
  margin-top:17px;
  padding:18px;
  border:none;
  border-radius:14px;
  color:#fff;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.charge{
  background:#16a34a;
}

.account{
  margin-top:11px;
  background:#f59e0b;
}

.charge:disabled,
.account:disabled{
  opacity:.6;
  cursor:wait;
}

.empty{
  color:#777;
  text-align:center;
  padding:35px 10px;
  font-size:17px;
}

.loading{
  opacity:.65;
  pointer-events:none;
}

button{
  -webkit-tap-highlight-color:transparent;
}

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  header{
    padding:25px 18px;
  }

  header h1{
    font-size:27px;
  }

  header p{
    font-size:17px;
  }

  .container{
    padding:15px;
  }

  .businesses{
    grid-template-columns:1fr 1fr;
  }

  .business-btn{
    font-size:19px;
    min-height:75px;
    padding:14px 8px;
  }

  .navigation{
    grid-template-columns:1fr 1fr;
  }

  .nav-btn{
    font-size:17px;
    min-height:75px;
    padding:13px 8px;
  }

  .card{
    padding:17px;
  }

  .card h2{
    font-size:27px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:17px 12px;
    min-height:150px;
  }

  .product-name{
    font-size:17px;
  }

  .price{
    font-size:22px;
  }

  .stock{
    font-size:15px;
  }

  .customer-row{
    flex-direction:column;
  }

  .add-client{
    padding:14px;
  }

  .pending-sync{
    font-size:15px;
  }

}

</style>

</head>

<script

<script>

"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

const BUSINESS_CACHE_KEY =
"POS_BUSINESS_CACHE_V4";

const PENDING_SALES_KEY =
"POS_PENDING_SALES_V4";

const LAST_BUSINESS_KEY =
"POS_LAST_BUSINESS_V4";

/* =====================================================
   ESTADO
===================================================== */

let supabaseClient = null;

let currentBusiness =
localStorage.getItem(
  LAST_BUSINESS_KEY
) || "BakeQuiri";

let products = [];

let payments = [];

let customers = [];

let cart = [];

let selectedPaymentId = null;

let selectedCustomerId = null;

let isLoadingBusiness = false;

let isSyncing = false;

/* =====================================================
   UTILIDADES
===================================================== */

function $(id){

  return document.getElementById(id);

}

function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);

}

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function generateLocalId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
    "function"
  ){

    return window.crypto.randomUUID();

  }

  return(
    "offline-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function showStatus(
  message,
  type="error"
){

  const element =
    $("status");

  if(!element){
    return;
  }

  element.textContent =
    message;

  element.className =
    "status " + type;

}

function clearStatus(){

  const element =
    $("status");

  if(!element){
    return;
  }

  element.textContent =
    "";

  element.className =
    "status";

}

/* =====================================================
   NEGOCIO
===================================================== */

function saveCurrentBusiness(){

  localStorage.setItem(
    LAST_BUSINESS_KEY,
    currentBusiness
  );

}

function updateBusinessButtons(){

  document
    .querySelectorAll(".business-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.business ===
        currentBusiness
      );

    });

}

/* =====================================================
   CACHE
===================================================== */

function getBusinessCaches(){

  try{

    const raw =
      localStorage.getItem(
        BUSINESS_CACHE_KEY
      );

    if(!raw){
      return {};
    }

    const data =
      JSON.parse(raw);

    return(
      data &&
      typeof data === "object"
    )
    ? data
    : {};

  }

  catch(error){

    console.warn(
      "Error leyendo cache:",
      error
    );

    return {};

  }

}

function saveBusinessCache(
  businessName,
  businessProducts,
  businessPayments,
  businessCustomers
){

  try{

    const caches =
      getBusinessCaches();

    caches[businessName] = {

      products:
        Array.isArray(
          businessProducts
        )
        ? businessProducts
        : [],

      payments:
        Array.isArray(
          businessPayments
        )
        ? businessPayments
        : [],

      customers:
        Array.isArray(
          businessCustomers
        )
        ? businessCustomers
        : [],

      savedAt:
        new Date().toISOString()

    };

    localStorage.setItem(
      BUSINESS_CACHE_KEY,
      JSON.stringify(caches)
    );

  }

  catch(error){

    console.warn(
      "No se pudo guardar cache:",
      error
    );

  }

}

function loadBusinessCache(
  businessName
){

  try{

    const caches =
      getBusinessCaches();

    const cache =
      caches[businessName];

    if(!cache){
      return false;
    }

    products =
      Array.isArray(cache.products)
      ? cache.products
      : [];

    payments =
      Array.isArray(cache.payments)
      ? cache.payments
      : [];

    customers =
      Array.isArray(cache.customers)
      ? cache.customers
      : [];

    return true;

  }

  catch(error){

    console.warn(
      "No se pudo cargar cache:",
      error
    );

    return false;

  }

}

/* =====================================================
   VENTAS PENDIENTES
===================================================== */

function getPendingSales(){

  try{

    const raw =
      localStorage.getItem(
        PENDING_SALES_KEY
      );

    if(!raw){
      return [];
    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch(error){

    console.warn(
      "Cola offline inválida:",
      error
    );

    return [];

  }

}

function savePendingSales(
  sales
){

  try{

    localStorage.setItem(
      PENDING_SALES_KEY,
      JSON.stringify(
        Array.isArray(sales)
        ? sales
        : []
      )
    );

    renderPendingSales();

  }

  catch(error){

    console.error(
      "No se pudo guardar la cola:",
      error
    );

    showStatus(
      "No se pudo guardar la venta en este dispositivo.",
      "error"
    );

  }

}

function renderPendingSales(){

  const element =
    $("pendingCount");

  const banner =
    $("pendingSync");

  if(!element || !banner){
    return;
  }

  const count =
    getPendingSales().length;

  element.textContent =
    count;

  banner.classList.toggle(
    "show",
    count > 0
  );

}

/* =====================================================
   SUPABASE
===================================================== */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    throw new Error(
      "No se pudo cargar la librería de Supabase."
    );

  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}

/* =====================================================
   ESTADO DE CONEXIÓN
===================================================== */

function showOfflineStatus(){

  showStatus(

    "📴 Modo offline\n\n" +

    "El POS está usando los datos guardados en este dispositivo. " +

    "Las ventas nuevas se guardarán localmente y se sincronizarán cuando sea posible.",

    "offline"

  );

}

function showOnlineStatus(){

  clearStatus();

}

/* =====================================================
   PRODUCTOS
===================================================== */

function renderProducts(){

  const container =
    $("products");

  if(!container){
    return;
  }

  container.innerHTML =
    "";

  const expectedBusinessId =
    BUSINESS_IDS[currentBusiness];

  const validProducts =
    products.filter(product => {

      if(
        !product ||
        product.active === false
      ){
        return false;
      }

      if(
        product.business_id &&
        product.business_id !==
        expectedBusinessId
      ){
        return false;
      }

      return true;

    });

  if(!validProducts.length){

    container.innerHTML =
      '<div class="empty">' +
      "No hay productos disponibles para " +
      escapeHTML(currentBusiness) +
      "." +
      "</div>";

    return;

  }

  validProducts.forEach(product => {

    const stock =
      Number(
        product.stock || 0
      );

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "product" +
      (
        stock <= 0
        ? " disabled"
        : ""
      );

    button.disabled =
      stock <= 0;

    button.innerHTML =

      '<div class="product-name">' +
      escapeHTML(product.name) +
      "</div>" +

      '<div class="price">' +
      money(product.price) +
      "</div>" +

      '<div class="stock">' +

      (
        stock > 0
        ? "Existencia: " + stock
        : "Agotado"
      ) +

      "</div>";

    button.addEventListener(
      "click",
      () => addToCart(product)
    );

    container.appendChild(
      button
    );

  });

}

/* =====================================================
   PAGOS
===================================================== */

function renderPayments(){

  const container =
    $("payments");

  if(!container){
    return;
  }

  container.innerHTML =
    "";

  const expectedBusinessId =
    BUSINESS_IDS[currentBusiness];

  const validPayments =
    payments.filter(payment => {

      if(
        payment.active === false
      ){
        return false;
      }

      if(
        payment.business_id &&
        payment.business_id !==
        expectedBusinessId
      ){
        return false;
      }

      return true;

    });

  if(!validPayments.length){

    container.innerHTML =
      '<div class="empty">' +
      "No hay métodos de pago disponibles para " +
      escapeHTML(currentBusiness) +
      "." +
      "</div>";

    return;

  }

  validPayments.forEach(payment => {

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "payment" +
      (
        payment.id ===
        selectedPaymentId
        ? " active"
        : ""
      );

/* =====================================================
   CARGAR NEGOCIO DESDE SUPABASE
===================================================== */

async function loadBusinessData(){

  if(isLoadingBusiness){
    return;
  }

  isLoadingBusiness =
    true;

  const businessToLoad =
    currentBusiness;

  $("products").innerHTML =
    '<div class="empty">Cargando productos...</div>';

  $("payments").innerHTML =
    '<div class="empty">Cargando métodos de pago...</div>';

  try{

    /*
      OFFLINE
    */

    if(!navigator.onLine){

      const loaded =
        loadBusinessCache(
          businessToLoad
        );

      if(loaded){

        selectedPaymentId =
          payments.some(
            p =>
              p.id ===
              selectedPaymentId
          )
          ? selectedPaymentId
          : (
              payments[0]?.id ||
              null
            );

        selectedCustomerId =
          customers.some(
            c =>
              c.id ===
              selectedCustomerId
          )
          ? selectedCustomerId
          : null;

        renderProducts();
        renderPayments();
        renderCart();
        renderSelectedCustomer();

      }
      else{

        products = [];
        payments = [];
        customers = [];

        $("products").innerHTML =
          '<div class="empty">' +
          "No hay productos guardados offline para " +
          escapeHTML(businessToLoad) +
          "." +
          "</div>";

        $("payments").innerHTML =
          '<div class="empty">' +
          "No hay métodos de pago guardados offline para este negocio." +
          "</div>";

      }

      showOfflineStatus();

      return;

    }

    /*
      ONLINE
    */

    if(!supabaseClient){

      initializeSupabase();

    }

    const businessId =
      BUSINESS_IDS[
        businessToLoad
      ];

    if(!businessId){

      throw new Error(
        "No existe el ID configurado para " +
        businessToLoad
      );

    }

    /*
      IMPORTANTE:

      Las consultas de productos y pagos están
      filtradas por business_id.

      Los clientes NO se filtran por negocio,
      porque son globales/compartidos.
    */

    const [

      productsResult,
      paymentsResult,
      customersResult

    ] = await Promise.all([

      supabaseClient
        .from("products")
        .select(
          "id,name,price,cost,stock,active,business_id"
        )
        .eq(
          "business_id",
          businessId
        )
        .eq(
          "active",
          true
        )
        .order(
          "name"
        ),

      supabaseClient
        .from("payment_methods")
        .select(
          "id,name,provider,active,business_id"
        )
        .eq(
          "business_id",
          businessId
        )
        .eq(
          "active",
          true
        )
        .order(
          "name"
        ),

      supabaseClient
        .from("customers")
        .select(
          "id,name,phone,notes"
        )
        .order(
          "name"
        )

    ]);

    if(productsResult.error){
      throw productsResult.error;
    }

    if(paymentsResult.error){
      throw paymentsResult.error;
    }

    if(customersResult.error){
      throw customersResult.error;
    }

    /*
      Solo aceptamos productos del negocio actual.
    */

    products =
      (productsResult.data || [])
      .filter(
        product =>
          product.business_id ===
          businessId
      );

    /*
      Solo aceptamos métodos de pago del negocio actual.
    */

    payments =
      (paymentsResult.data || [])
      .filter(
        payment =>
          payment.business_id ===
          businessId
      );

    /*
      CLIENTES GLOBALES.
    */

    customers =
      customersResult.data || [];

    /*
      Guardamos una copia independiente por negocio.
    */

    saveBusinessCache(
      businessToLoad,
      products,
      payments,
      customers
    );

    /*
      Verificamos selección de pago.
    */

    if(
      !payments.some(
        p =>
          p.id ===
          selectedPaymentId
      )
    ){

      selectedPaymentId =
        payments[0]?.id ||
        null;

    }

    /*
      Verificamos cliente.
    */

    if(
      !customers.some(
        c =>
          c.id ===
          selectedCustomerId
      )
    ){

      selectedCustomerId =
        null;

    }

    /*
      SOLO actualizamos la interfaz si el negocio
      sigue siendo el mismo que se solicitó.
    */

    if(
      currentBusiness !==
      businessToLoad
    ){

      return;

    }

    renderProducts();
    renderPayments();
    renderCart();
    renderSelectedCustomer();

    showOnlineStatus();

  }

  catch(error){

    console.warn(
      "No se pudo cargar Supabase:",
      error
    );

    /*
      Si falla Internet/Supabase,
      usamos la copia local.
    */

    const loaded =
      loadBusinessCache(
        businessToLoad
      );

    if(
      loaded &&
      currentBusiness ===
      businessToLoad
    ){

      selectedPaymentId =
        payments.some(
          p =>
            p.id ===
            selectedPaymentId
        )
        ? selectedPaymentId
        : (
            payments[0]?.id ||
            null
          );

      selectedCustomerId =
        customers.some(
          c =>
            c.id ===
            selectedCustomerId
        )
        ? selectedCustomerId
        : null;

      renderProducts();
      renderPayments();
      renderCart();
      renderSelectedCustomer();

      showOfflineStatus();

    }

    else if(
      currentBusiness ===
      businessToLoad
    ){

      products = [];
      payments = [];
      customers = [];

      $("products").innerHTML =
        '<div class="empty">' +
        "No fue posible cargar los productos de " +
        escapeHTML(businessToLoad) +
        "." +
        "<br><br>" +
        "Conecta Internet para descargar los datos de este negocio." +
        "</div>";

      $("payments").innerHTML =
        '<div class="empty">' +
        "No fue posible cargar los métodos de pago." +
        "</div>";

      showStatus(
        "⚠️ No fue posible conectar con Supabase.\n\n" +
        "El POS no encontró una copia local de " +
        businessToLoad +
        ".",
        "offline"
      );

    }

  }

  finally{

    isLoadingBusiness =
      false;

  }

}

/* =====================================================
   CARRITO
===================================================== */

function addToCart(product){

  const stock =
    Number(
      product.stock || 0
    );

  if(stock <= 0){

    showStatus(
      "Este producto está agotado.",
      "error"
    );

    return;

  }

  const item =
    cart.find(
      i =>
        i.id ===
        product.id
    );

  if(item){

    if(
      item.quantity <
      stock
    ){

      item.quantity++;

    }
    else{

      showStatus(
        "No puedes agregar más unidades que la existencia.",
        "error"
      );

    }

  }
  else{

    cart.push({
      ...product,
      quantity:1
    });

  }

  renderCart();

}

function changeQuantity(
  id,
  amount
){

  const item =
    cart.find(
      i =>
        i.id === id
    );

  if(!item){
    return;
  }

  const product =
    products.find(
      p =>
        p.id === id
    );

  const max =
    Number(
      product?.stock ??
      item.stock ??
      0
    );

  const newQuantity =
    item.quantity +
    amount;

  if(newQuantity > max){

    showStatus(
      "No hay suficiente existencia disponible.",
      "error"
    );

    return;

  }

  item.quantity =
    newQuantity;

  if(
    item.quantity <= 0
  ){

    cart =
      cart.filter(
        i =>
          i.id !== id
      );

  }

  renderCart();

}

function getCartTotal(){

  return cart.reduce(
    (sum,item) =>
      sum +
      Number(item.price) *
      Number(item.quantity),
    0
  );

}

function renderCart(){

  const container =
    $("cart");

  if(!container){
    return;
  }

  container.innerHTML =
    "";

  if(!cart.length){

    container.innerHTML =
      '<div class="empty">' +
      "El carrito está vacío" +
      "</div>";

    $("total").textContent =
      "$0.00";

    return;

  }

  cart.forEach(item => {

    const subtotal =
      Number(item.price) *
      Number(item.quantity);

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "cart-item";

    const info =
      document.createElement(
        "div"
      );

    info.innerHTML =

      '<div class="cart-name">' +
      escapeHTML(item.name) +
      "</div>" +

      '<div class="cart-price">' +
      money(item.price) +
      " c/u</div>";

    const controls =
      document.createElement(
        "div"
      );

    controls.className =
      "quantity";

    const minus =
      document.createElement(
        "button"
      );

    minus.type =
      "button";

    minus.textContent =
      "−";

    minus.addEventListener(
      "click",
      () =>
        changeQuantity(
          item.id,
          -1
        )
    );

    const quantity =
      document.createElement(
        "span"
      );

    quantity.textContent =
      item.quantity;

    const plus =
      document.createElement(
        "button"
      );

    plus.type =
      "button";

    plus.textContent =
      "+";

    plus.addEventListener(
      "click",
      () =>
        changeQuantity(
          item.id,
          1
        )
    );

    controls.append(
      minus,
      quantity,
      plus
    );

    info.appendChild(
      controls
    );

    const subtotalElement =
      document.createElement(
        "strong"
      );

    subtotalElement.textContent =
      money(subtotal);

    row.append(
      info,
      subtotalElement
    );

    container.appendChild(
      row
    );

  });

  $("total").textContent =
    money(
      getCartTotal()
    );

}

async function changeBusiness(
  name
){

  if(
    name ===
    currentBusiness
  ){

    return;

  }

  /*
    Cambiamos inmediatamente el negocio.
  */

  currentBusiness =
    name;

  saveCurrentBusiness();

  /*
    Limpiamos solamente el carrito actual.
  */

  cart = [];

  selectedPaymentId =
    null;

  selectedCustomerId =
    null;

  /*
    Limpiamos datos de pantalla para evitar
    mostrar productos del negocio anterior.
  */

  products = [];

  payments = [];

  customers = [];

  $("products").innerHTML =
    '<div class="empty">Cargando ' +
    escapeHTML(currentBusiness) +
    "...</div>";

  $("payments").innerHTML =
    '<div class="empty">Cargando métodos de pago...</div>';

  $("customerSearch").value =
    "";

  $("customerResults").innerHTML =
    "";

  $("customerResults").style.display =
    "none";

  renderSelectedCustomer();
  renderCart();
  updateBusinessButtons();

  /*
    PRIMERO intentamos mostrar inmediatamente
    el cache del negocio seleccionado.

    Esto hace que el cambio entre BakeQuiri
    y SpicyRoll sea instantáneo.
  */

  const cached =

    );

  if(cached){

      payments[0]?.id ||

    renderPayments();
    renderCart();
    renderSelectedCustomer();

  /*

    si tenemos Internet.
  */

  if(navigator.onLine){

    await loadBusinessData();

  }
  else{

    showOfflineStatus();

  }

}

/* =====================================================
   CONSTRUIR VENTA
===================================================== */

function buildSaleItems(){

  return cart.map(
    item => ({

      product_id:
        item.id,

      description:
        item.name,

      quantity:
        Number(
          item.quantity
        ),

      unit_price:
        Number(
          item.price
        ),

      subtotal:
        Number(
          item.price
        ) *
        Number(
          item.quantity
        )

    })
  );

}

/* =====================================================
   STOCK LOCAL
===================================================== */

function applyLocalStockReduction(
  saleItems
){

  saleItems.forEach(
    saleItem => {

      const product =
        products.find(
          p =>
            p.id ===
            saleItem.product_id
        );

      if(!product){
        return;
      }

      product.stock =
        Math.max(
          0,
          Number(product.stock || 0) -
          Number(saleItem.quantity || 0)
        );

    }
  );

  saveBusinessCache(
    currentBusiness,
    products,
    payments,
    customers
  );

  renderProducts();

}

/* =====================================================
   GUARDAR VENTA OFFLINE
===================================================== */

function saveSaleOffline(
  isPending
){

  const total =
    getCartTotal();

  const items =
    buildSaleItems();

  const customer =
    customers.find(
      c =>
        c.id ===
        selectedCustomerId
    );

  const payment =
    payments.find(
      p =>
        p.id ===
        selectedPaymentId
    );

  const sale = {

    local_id:
      generateLocalId(),

    created_at:
      new Date().toISOString(),

    business_name:
      currentBusiness,

    business_id:
      BUSINESS_IDS[
        currentBusiness
      ],

    customer_id:
      selectedCustomerId ||
      null,

    customer_name:
      customer?.name ||
      "Consumidor general",

    payment_method_id:
      isPending
      ? null
      : selectedPaymentId,

    payment_method_name:
      isPending
      ? "Cuenta pendiente"
      : (
          payment?.name ||
          "Pago"
        ),

    is_pending:
      isPending,

    total:
      total,

    items:
      items

  };

  const pending =
    getPendingSales();

  pending.push(
    sale
  );

  savePendingSales(
    pending
  );

  applyLocalStockReduction(
    items
  );

  cart = [];

  selectedCustomerId =
    null;

  $("customerSearch").value =
    "";

  $("customerResults").innerHTML =
    "";

  $("customerResults").style.display =
    "none";

  renderSelectedCustomer();
  renderCart();

  alert(

    "📴 Venta guardada en este dispositivo.\n\n" +

    "Total: " +
    money(total) +

    "\n\n" +

    "Se sincronizará automáticamente cuando vuelva Internet."

  );

  showOfflineStatus();

}

/* =====================================================
   SINCRONIZAR VENTAS
===================================================== */

async function syncPendingSales(){

  if(isSyncing){
    return;
  }

  if(!navigator.onLine){
    return;
  }

  if(!supabaseClient){

    try{
      initializeSupabase();
    }
    catch(error){
      return;
    }

  }

  let pending =
    getPendingSales();

  if(!pending.length){

    renderPendingSales();

    return;

  }

  isSyncing =
    true;

  try{

    for(
      let index = 0;
      index < pending.length;
      index++
    ){

      const sale =
        pending[index];

      try{

        const result =
          await supabaseClient.rpc(
            "register_sale",
            {

              p_business_id:
                sale.business_id,

              p_customer_id:
                sale.customer_id ||
                null,

              p_payment_method_id:
                sale.is_pending
                ? null
                : sale.payment_method_id,

              p_items:
                sale.items,

              p_is_pending:
                sale.is_pending

            }
          );

        if(result.error){

          throw result.error;

        }

        pending.splice(
          index,
          1
        );

        index--;

        savePendingSales(
          pending
        );

      }

      catch(error){

        console.warn(
          "No se pudo sincronizar venta offline:",
          error
        );

      }

    }

    renderPendingSales();

  }

  finally{

    isSyncing =
      false;

  }

}

/* =====================================================
   REGISTRAR VENTA
===================================================== */

async function registerSale(
  isPending
){

  clearStatus();

  if(!cart.length){

    showStatus(
      "Agrega al menos un producto.",
      "error"
    );

    return;

  }

  if(
    !isPending &&
    !selectedPaymentId
  ){

    showStatus(
      "Selecciona un método de pago.",
      "error"
    );

    return;

  }

  if(
    isPending &&
    !selectedCustomerId
  ){

    showStatus(
      "Para dejar una venta a cuenta debes seleccionar un cliente.",
      "error"
    );

    return;

  }

  if(!navigator.onLine){

    saveSaleOffline(
      isPending
    );

    return;

  }

  const button =
    isPending
    ? $("accountButton")
    : $("chargeButton");

  const originalText =
    button.textContent;

  button.disabled =
    true;

  button.textContent =
    isPending
    ? "GUARDANDO..."
    : "REGISTRANDO...";

  try{

    if(!supabaseClient){

      initializeSupabase();

    }

    const items =
      buildSaleItems();

    const businessId =
      BUSINESS_IDS[
        currentBusiness
      ];

    const result =
      await supabaseClient.rpc(
        "register_sale",
        {

          p_business_id:
            businessId,

          p_customer_id:
            selectedCustomerId ||
            null,

          p_payment_method_id:
            isPending
            ? null
            : selectedPaymentId,

          p_items:
            items,

          p_is_pending:
            isPending

        }
      );

    if(result.error){

      throw result.error;

    }

    const total =
      getCartTotal();

    const customer =
      customers.find(
        c =>
          c.id ===
          selectedCustomerId
      );

    const paymentName =
      payments.find(
        p =>
          p.id ===
          selectedPaymentId
      )?.name ||
      "Pago";

    alert(

      (
        isPending
        ? "Cuenta registrada"
        : "Venta registrada"
      ) +

      "\n" +

      currentBusiness +

      "\nCliente: " +

      (
        customer?.name ||
        "Consumidor general"
      ) +

      "\nTotal: " +

      money(total) +

      (
        isPending
        ? ""
        : "\nPago: " +
          paymentName
      )

    );

    cart = [];

    selectedCustomerId =
      null;

    $("customerSearch").value =
      "";

    $("customerResults").innerHTML =
      "";

    $("customerResults").style.display =
      "none";

    renderSelectedCustomer();

    /*
      Recargamos productos para que el stock
      quede actualizado desde Supabase.
    */

    await loadBusinessData();

    await syncPendingSales();

    showStatus(

      isPending
      ? "Cuenta guardada correctamente."
      : "Venta guardada correctamente.",

      "ok"

    );

  }

  catch(error){

    console.error(
      "registerSale:",
      error
    );

    if(
      !navigator.onLine ||
      /network|fetch|failed|timeout|offline|load failed/i.test(
        error?.message ||
        ""
      )
    ){

      saveSaleOffline(
        isPending
      );

      showStatus(

        "⚠️ No fue posible enviar la operación a Supabase.\n\n" +

        "La venta quedó guardada localmente y se intentará sincronizar automáticamente.",

        "offline"

      );

    }

    else{

      showStatus(

        "No se pudo registrar la operación:\n" +

        (
          error?.message ||
          String(error)
        ),

        "error"

      );

    }

  }

  finally{

    button.disabled =
      false;

    button.textContent =
      originalText;

  }

}

$("historyButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "historial.html?business=" +
      encodeURIComponent(
        currentBusiness
      );

  }
);

$("inventoryButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "inventario.html?business=" +
      encodeURIComponent(
        currentBusiness
      );

  }
);

$("dashboardButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "dashboard.html?business=" +
      encodeURIComponent(
        currentBusiness
      );

  }
);

/* =====================================================
   CLIENTES
===================================================== */

$("customerSearch")
.addEventListener(
  "input",
  event =>
    renderCustomerResults(
      event.target.value
    )
);

$("customerSearch")
.addEventListener(
  "focus",
  event => {

    const value =
      event.target.value.trim();

    if(value){

      renderCustomerResults(
        value
      );

    }

  }
);

$("generalCustomer")
.addEventListener(
  "click",
  clearSelectedCustomer
);

$("addClientButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
      "clientes.html?business=" +
      encodeURIComponent(
        currentBusiness
      );

  }
);

document.addEventListener(
  "click",
  event => {

    const box =
      document.querySelector(
        ".customer-box"
      );

    if(
      box &&
      !box.contains(
        event.target
      )
    ){

      $("customerResults")
        .style.display =
        "none";

    }

  }
);

/* =====================================================
   NEGOCIOS
===================================================== */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        await changeBusiness(
          button.dataset.business
        );

      }
    );

  });

/* =====================================================
   INTERNET
===================================================== */

window.addEventListener(
  "offline",
  () => {

    showOfflineStatus();

    renderPendingSales();

  }
);

window.addEventListener(
  "online",
  async () => {

    showStatus(

      "🌐 Internet recuperado.\n\n" +

      "Sincronizando ventas pendientes y actualizando " +

      currentBusiness +

      "...",

      "ok"

    );

    await syncPendingSales();

    await loadBusinessData();

    renderPendingSales();

  }
);

/* =====================================================
   SERVICE WORKER
===================================================== */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register(
      "./sw.js",
      {
        scope:"./"
      }
    )
    .then(
      registration => {

        console.log(
          "Service Worker registrado:",
          registration.scope
        );

        registration.update();

      }
    )
    .catch(
      error => {

        console.warn(
          "No se pudo registrar Service Worker:",
          error
        );

      }
    );

}

/* =====================================================
   INICIO
===================================================== */

async function startApp(){

  try{

    initializeSupabase();

  }

  catch(error){

    console.error(
      "Supabase:",
      error
    );

  }

  updateBusinessButtons();

  renderPendingSales();

  /*
    Mostramos inmediatamente el cache del negocio
    actual si existe.
  */

  const cached =
    loadBusinessCache(
      currentBusiness
    );

  if(cached){

    selectedPaymentId =
      payments[0]?.id ||
      null;

    renderProducts();
    renderPayments();
    renderCart();
    renderSelectedCustomer();

  }

  /*
    Si hay Internet, actualizamos desde Supabase.
  */

  if(navigator.onLine){

    await syncPendingSales();

    await loadBusinessData();

  }
  else{

    if(cached){

      showOfflineStatus();

    }
    else{

      $("products").innerHTML =
        '<div class="empty">' +
        "No hay datos guardados offline para " +
        escapeHTML(currentBusiness) +
        "." +
        "<br><br>" +
        "Conecta Internet una vez para descargar los productos." +
        "</div>";

      $("payments").innerHTML =
        '<div class="empty">' +
        "No hay métodos de pago guardados offline." +
        "</div>";

      showOfflineStatus();

    }

  }

  renderPendingSales();

}

startApp();

</script>

</html>
