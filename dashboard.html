<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Dashboard POS"

<title>Dashboard | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
}

html{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:#f5f6f8;
  color:#171717;
}

header{
  background:#111827;
  color:white;

  padding-top:
    calc(25px + env(safe-area-inset-top));

  padding-right:20px;
  padding-bottom:25px;
  padding-left:20px;

  position:relative;
  z-index:2;
}

header h1{
  margin:0;
  font-size:30px;
  line-height:1.15;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}

.status{
  display:none;
  padding:14px 15px;
  border-radius:13px;
  margin-bottom:20px;
  font-weight:700;
  white-space:pre-line;
  line-height:1.4;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.warn{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.control-panel{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.business-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  min-height:48px;
  border-radius:12px;
  transition:.15s ease;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

.business-btn{
  background:#fff;
  color:#2680eb;
  border:2px solid #ddd;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
}

.accounts{
  background:#f59e0b;
  color:white;
}

.customers{
  background:#10b981;
  color:white;
}

.history{
  background:#7c3aed;
  color:white;
}

.inventory-btn{
  background:#0891b2;
  color:white;
}

.back{
  background:#fff;
  color:#111827;
  border:2px solid #ddd;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.metric-card{
  position:relative;
  overflow:hidden;
  min-width:0;
}

.metric-icon{
  font-size:27px;
  margin-bottom:12px;
}

.metric-title{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
  line-height:1.25;
  overflow-wrap:anywhere;
}

.metric{
  font-size:30px;
  font-weight:800;
  line-height:1.1;
}

.green{
  color:#16a34a;
}

.blue{
  color:#2563eb;
}

.red{
  color:#dc2626;
}

.orange{
  color:#d97706;
}

.main-grid{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:20px;
}

.section-title{
  font-size:21px;
  font-weight:800;
  margin:0 0 18px;
}

.sales-list{
  display:grid;
  gap:10px;
}

.sale-row{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  background:#fff;
}

.sale-main{
  display:grid;
  grid-template-columns:1.4fr .8fr .7fr;
  gap:12px;
  align-items:center;
}

.sale-customer{
  min-width:0;
}

.customer-link{
  color:#2563eb;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  word-break:break-word;
}

.customer-link:hover{
  text-decoration:underline;
}

.customer-general{
  color:#222;
  font-weight:700;
  word-break:break-word;
}

.sale-date{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
  line-height:1.35;
}

.sale-total{
  font-weight:800;
  font-size:17px;
}

.sale-status{
  text-align:right;
}

.status-pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.open{
  background:#fef3c7;
  color:#92400e;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.inventory-list{
  display:grid;
  gap:9px;
}

.stock-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border:1px solid #eee;
  border-radius:12px;
  background:#fafafa;
}

.stock-name{
  font-weight:700;
  min-width:0;
  word-break:break-word;
}

.stock-number{
  font-weight:800;
  white-space:nowrap;
}

.low{
  color:#dc2626;
}

.stock-warning{
  font-size:11px;
  margin-left:6px;
  color:#dc2626;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.offline-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  padding:6px 10px;
  border-radius:20px;
  background:#fef3c7;
  color:#92400e;
  font-size:12px;
  font-weight:800;
}

.online-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  padding:6px 10px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:12px;
  font-weight:800;
}

@media(max-width:900px){

  .action-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .main-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding-top:
      calc(22px + env(safe-area-inset-top));

    padding-right:17px;
    padding-bottom:22px;
    padding-left:17px;
  }

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
  }

  .container{
    width:100%;
    padding:15px;
  }

  .control-panel{
    padding:13px;
    border-radius:17px;
  }

  .business-selector{
    grid-template-columns:1fr 1fr;
  }

  .action-grid{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    min-height:46px;
    font-size:13px;
    padding:8px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
    border-radius:16px;
    min-width:0;
  }

  .metric-card{
    min-height:150px;
  }

  .metric-icon{
    font-size:22px;
    margin-bottom:10px;
  }

  .metric-title{
    font-size:12px;
    line-height:1.25;
  }

  .metric{
    font-size:23px;
  }

  .section-title{
    font-size:19px;
  }

  .sale-main{
    grid-template-columns:1fr;
    gap:7px;
  }

  .sale-status{
    text-align:left;
  }

  .sale-total{
    font-size:20px;
  }

  .sale-row{
    padding:16px;
  }

  .sale-date{
    font-size:14px;
  }

}

@media(max-width:390px){

  .action-grid{
    grid-template-columns:1fr 1fr;
  }

  .metric{
    font-size:21px;
  }

  .metric-title{
    font-size:11px;
  }

  .business-btn{
    font-size:13px;
  }

  .metric-card{
    min-height:145px;
  }

}

@supports (-webkit-touch-callout:none){

  header{
    padding-top:
      calc(22px + env(safe-area-inset-top));
  }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   CACHE
========================================================= */

const DASHBOARD_CACHE_KEY =
"POS_DASHBOARD_CACHE_V2";

const LAST_BUSINESS_KEY =
"POS_LAST_BUSINESS_V4";

const BUSINESS_CACHE_KEY =
"POS_BUSINESS_CACHE_V4";

const PENDING_SALES_KEY =
"POS_PENDING_SALES_V4";


/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;


/* =========================================================
   ESTADO
========================================================= */

let currentBusiness =
localStorage.getItem(
  LAST_BUSINESS_KEY
) || "BakeQuiri";

let currentData = {

  products: [],

  sales: [],

  customers: []

};

let isLoading = false;


/* =========================================================
   HELPERS
========================================================= */

function $(id){

  return document.getElementById(id);

}


function money(value){

  return "$" +
    Number(value || 0)
      .toFixed(2);

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================================
   SUPABASE
========================================================= */

function initializeSupabase(){

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
    "function"
  ){

    return false;

  }

  if(!supabaseClient){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

  }

  return true;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type="error"
){

  $("status").textContent =
    message;

  $("status").className =
    "status " + type;

}


/* =========================================================
   CACHE DEL DASHBOARD
========================================================= */

function getDashboardCache(){

  try{

    const raw =
      localStorage.getItem(
        DASHBOARD_CACHE_KEY
      );

    if(!raw){

      return {};

    }

    const parsed =
      JSON.parse(raw);

    if(
      !parsed ||
      typeof parsed !== "object"
    ){

      return {};

    }

    return parsed;

  }

  catch(error){

    console.warn(
      "Error leyendo cache Dashboard:",
      error
    );

    return {};

  }

}


function saveDashboardCache(
  businessName,
  data
){

  try{

    const cache =
      getDashboardCache();

    cache[businessName] = {

      products:
        Array.isArray(
          data.products
        )
        ? data.products
        : [],

      sales:
        Array.isArray(
          data.sales
        )
        ? data.sales
        : [],

      customers:
        Array.isArray(
          data.customers
        )
        ? data.customers
        : [],

      savedAt:
        new Date().toISOString()

    };

    localStorage.setItem(
      DASHBOARD_CACHE_KEY,
      JSON.stringify(cache)
    );

  }

  catch(error){

    console.warn(
      "No se pudo guardar cache Dashboard:",
      error
    );

  }

}


function loadDashboardCache(
  businessName
){

  try{

    const cache =
      getDashboardCache();

    const data =
      cache[businessName];

    if(!data){

      return false;

    }

    currentData = {

      products:
        Array.isArray(data.products)
        ? data.products
        : [],

      sales:
        Array.isArray(data.sales)
        ? data.sales
        : [],

      customers:
        Array.isArray(data.customers)
        ? data.customers
        : []

    };

    return true;

  }

  catch(error){

    console.warn(
      "No se pudo cargar cache Dashboard:",
      error
    );

    return false;

  }

}


/* =========================================================
   CACHE DE PRODUCTOS DEL POS
========================================================= */

function loadProductsFromPOSCache(
  businessName
){

  try{

    const raw =
      localStorage.getItem(
        BUSINESS_CACHE_KEY
      );

    if(!raw){

      return [];

    }

    const cache =
      JSON.parse(raw);

    const business =
      cache?.[businessName];

    if(!business){

      return [];

    }

    return Array.isArray(
      business.products
    )
    ? business.products
    : [];

  }

  catch(error){

    console.warn(
      "Error leyendo productos POS:",
      error
    );

    return [];

  }

}


/* =========================================================
   VENTAS OFFLINE PENDIENTES
========================================================= */

function getPendingSales(){

  try{

    const raw =
      localStorage.getItem(
        PENDING_SALES_KEY
      );

    if(!raw){

      return [];

    }

    const data =
      JSON.parse(raw);

    return Array.isArray(data)
      ? data
      : [];

  }

  catch(error){

    return [];

  }

}


/* =========================================================
   FECHA
========================================================= */

function formatSaleDateTime(
  createdAt
){

  if(!createdAt){

    return "";

  }

  const date =
    new Date(createdAt);

  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const dateText =
    date.toLocaleDateString(
      "es-MX",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );

  const timeText =
    date.toLocaleTimeString(
      "es-MX",
      {
        hour:"numeric",
        minute:"2-digit",
        hour12:true
      }
    );

  return (
    dateText +
    " · " +
    timeText
  );

}


/* =========================================================
   ES HOY
========================================================= */

function isToday(
  value
){

  if(!value){

    return false;

  }

  const date =
    new Date(value);

  if(
    isNaN(
      date.getTime()
    )
  ){

    return false;

  }

  const today =
    new Date();

  return(
    date.getFullYear() ===
    today.getFullYear() &&

    date.getMonth() ===
    today.getMonth() &&

    date.getDate() ===
    today.getDate()
  );

}


/* =========================================================
   ACTUALIZAR BOTONES
========================================================= */

function updateBusinessButtons(){

  document
    .querySelectorAll(
      ".business-btn"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.business ===
          currentBusiness
        );

      }
    );

  localStorage.setItem(
    LAST_BUSINESS_KEY,
    currentBusiness
  );

}


/* =========================================================
   DATOS OFFLINE
========================================================= */

function mergePendingSalesIntoDashboard(){

  const pending =
    getPendingSales()
      .filter(
        sale =>
          sale.business_name ===
          currentBusiness
      );

  if(!pending.length){

    return;

  }

  const cachedSales =
    Array.isArray(
      currentData.sales
    )
    ? currentData.sales
    : [];

  const existingLocalIds =
    new Set(
      cachedSales
        .map(
          sale =>
            sale.local_id
        )
        .filter(Boolean)
    );

  pending.forEach(
    sale => {

      if(
        sale.local_id &&
        existingLocalIds.has(
          sale.local_id
        )
      ){

        return;

      }

      cachedSales.unshift({

        id:
          sale.local_id,

        local_id:
          sale.local_id,

        total:
          sale.total,

        balance:
          sale.is_pending
          ? sale.total
          : 0,

        status:
          sale.is_pending
          ? "pending"
          : "paid",

        created_at:
          sale.created_at,

        customer_id:
          sale.customer_id,

        customer_name:
          sale.customer_name ||
          "Consumidor general",

        payment_method_name:
          sale.payment_method_name,

        offline:
          true

      });

    }
  );

  currentData.sales =
    cachedSales;

}


/* =========================================================
   MOSTRAR MÉTRICAS
========================================================= */

function renderMetrics(){

  const products =
    Array.isArray(
      currentData.products
    )
    ? currentData.products
    : [];

  const sales =
    Array.isArray(
      currentData.sales
    )
    ? currentData.sales
    : [];

  const todaySales =
    sales.filter(
      sale =>
        isToday(
          sale.created_at ||
          sale.sale_date
        )
    );

  const validTodaySales =
    todaySales.filter(
      sale =>
        sale.status !==
        "cancelled"
    );

  const total =
    validTodaySales.reduce(
      (
        sum,
        sale
      ) =>
        sum +
        Number(
          sale.total || 0
        ),
      0
    );

  $("todaySales").textContent =
    money(total);

  $("salesCount").textContent =
    validTodaySales.length;

  const activeProducts =
    products.filter(
      product =>
        product.active !== false
    );

  $("productCount").textContent =
    activeProducts.length;

  $("lowStock").textContent =
    activeProducts.filter(
      product =>
        Number(
          product.stock || 0
        ) <= 5
    ).length;

}


/* =========================================================
   INVENTARIO
========================================================= */

function renderInventory(
  products
){

  const container =
    $("inventoryContainer");

  const activeProducts =
    (
      Array.isArray(products)
      ? products
      : []
    )
    .filter(
      product =>
        product.active !== false
    );

  if(!activeProducts.length){

    container.innerHTML =
      '<div class="empty">' +
      "No hay productos activos guardados." +
      "</div>";

    return;

  }

  container.innerHTML =
    "";

  const sortedProducts =
    [...activeProducts].sort(
      (
        a,
        b
      ) =>
        Number(
          a.stock || 0
        ) -
        Number(
          b.stock || 0
        )
    );

  const list =
    document.createElement(
      "div"
    );

  list.className =
    "inventory-list";

  sortedProducts.forEach(
    product => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "stock-row";

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "stock-name";

      name.textContent =
        product.name;

      const stock =
        document.createElement(
          "div"
        );

      stock.className =
        "stock-number";

      const stockValue =
        Number(
          product.stock || 0
        );

      if(
        stockValue <= 5
      ){

        stock.classList.add(
          "low"
        );

      }

      stock.textContent =
        stockValue +
        " uds";

      if(
        stockValue <= 5
      ){

        const warning =
          document.createElement(
            "span"
          );

        warning.className =
          "stock-warning";

        warning.textContent =
          "⚠️";

        stock.appendChild(
          warning
        );

      }

      row.append(
        name,
        stock
      );

      list.appendChild(
        row
      );

    }
  );

  container.appendChild(
    list
  );

}


/* =========================================================
   CLIENTE
========================================================= */

function findCustomer(
  sale
){

  if(
    sale.customer_name
  ){

    return sale.customer_name;

  }

  if(
    !sale.customer_id
  ){

    return "Consumidor general";

  }

  const customer =
    currentData.customers.find(
      item =>
        item.id ===
        sale.customer_id
    );

  return(
    customer?.name ||
    "Cliente"
  );

}


/* =========================================================
   VENTAS
========================================================= */

function renderSales(){

  const container =
    $("salesContainer");

  const sales =
    (
      Array.isArray(
        currentData.sales
      )
      ? currentData.sales
      : []
    )
    .filter(
      sale =>
        isToday(
          sale.created_at ||
          sale.sale_date
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        new Date(
          b.created_at ||
          b.sale_date ||
          0
        ) -
        new Date(
          a.created_at ||
          a.sale_date ||
          0
        )
    );

  if(!sales.length){

    container.innerHTML =
      '<div class="empty">' +
      "No hay ventas de hoy guardadas en este dispositivo." +
      "</div>";

    return;

  }

  container.innerHTML =
    "";

  const list =
    document.createElement(
      "div"
    );

  list.className =
    "sales-list";

  sales
    .slice(
      0,
      20
    )
    .forEach(
      sale => {

        const customerName =
          findCustomer(
            sale
          );

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "sale-row";

        const main =
          document.createElement(
            "div"
          );

        main.className =
          "sale-main";

        const customerDiv =
          document.createElement(
            "div"
          );

        customerDiv.className =
          "sale-customer";

        if(
          sale.customer_id
        ){

          const link =
            document.createElement(
              "a"
            );

          link.className =
            "customer-link";

          link.href =
            "historial.html" +
            "?customer_id=" +
            encodeURIComponent(
              sale.customer_id
            ) +
            "&business=" +
            encodeURIComponent(
              currentBusiness
            );

          link.textContent =
            customerName;

          customerDiv.appendChild(
            link
          );

        }
        else{

          const general =
            document.createElement(
              "span"
            );

          general.className =
            "customer-general";

          general.textContent =
            customerName;

          customerDiv.appendChild(
            general
          );

        }

        const dateDiv =
          document.createElement(
            "div"
          );

        dateDiv.className =
          "sale-date";

        dateDiv.textContent =
          formatSaleDateTime(
            sale.created_at ||
            sale.sale_date
          );

        if(
          sale.offline
        ){

          const badge =
            document.createElement(
              "span"
            );

          badge.className =
            "offline-badge";

          badge.textContent =
            "📴 Pendiente de sincronizar";

          customerDiv.appendChild(
            dateDiv
          );

          customerDiv.appendChild(
            badge
          );

        }
        else{

          customerDiv.appendChild(
            dateDiv
          );

        }

        const totalDiv =
          document.createElement(
            "div"
          );

        totalDiv.className =
          "sale-total";

        totalDiv.textContent =
          money(
            sale.total
          );

        const statusDiv =
          document.createElement(
            "div"
          );

        statusDiv.className =
          "sale-status";

        const statusPill =
          document.createElement(
            "span"
          );

        statusPill.className =
          "status-pill";

        if(
          sale.status ===
          "cancelled"
        ){

          statusPill.classList.add(
            "cancelled"
          );

          statusPill.textContent =
            "Cancelada";

        }
        else if(
          sale.status ===
          "paid"
        ){

          statusPill.classList.add(
            "paid"
          );

          statusPill.textContent =
            "✓ Pagada";

        }
        else{

          statusPill.classList.add(
            "open"
          );

          statusPill.textContent =
            "🔴 Debe " +
            money(
              sale.balance ||
              sale.total ||
              0
            );

        }

        statusDiv.appendChild(
          statusPill
        );

        main.append(
          customerDiv,
          totalDiv,
          statusDiv
        );

        row.appendChild(
          main
        );

        list.appendChild(
          row
        );

      }
    );

  container.appendChild(
    list
  );

}

/* =========================================================
   CARGAR CACHE
========================================================= */

function loadCachedDashboard(){

  const loaded =
    loadDashboardCache(
      currentBusiness
    );

  /*
    Si todavía no existe cache del Dashboard,
    utilizamos los productos que ya descargó
    el POS.
  */

  if(!loaded){

    const posProducts =
      loadProductsFromPOSCache(
        currentBusiness
      );

    currentData = {

      products:
        posProducts,

      sales: [],

      customers: []

    };

  }

  renderDashboard();

  return loaded;

}


/* =========================================================
   CARGAR DESDE SUPABASE
========================================================= */

async function loadFromSupabase(){

  if(!navigator.onLine){

    return false;

  }

  if(
    !initializeSupabase()
  ){

    return false;

  }

  const businessId =
    BUSINESS_IDS[
      currentBusiness
    ];

  if(!businessId){

    throw new Error(
      "No se encontró el negocio seleccionado."
    );

  }

  /*
    PRODUCTOS
  */

  const productsResult =
    await supabaseClient

      .from("products")

      .select(
        "id,name,price,cost,stock,active,business_id"
      )

      .eq(
        "business_id",
        businessId
      )

      .eq(
        "active",
        true
      )

      .order(
        "name"
      );

  if(
    productsResult.error
  ){

    throw productsResult.error;

  }

  /*
    VENTAS
  */

  const start =
    new Date();

  start.setHours(
    0,
    0,
    0,
    0
  );

  const salesResult =
    await supabaseClient

      .from("sales")

      .select(
        "id,total,balance,status,created_at,customer_id,sale_date"
      )

      .eq(
        "business_id",
        businessId
      )

      .gte(
        "created_at",
        start.toISOString()
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(
    salesResult.error
  ){

    throw salesResult.error;

  }

  /*
    CLIENTES
  */

  const customerIds =
    [
      ...new Set(
        (
          salesResult.data ||
          []
        )
        .map(
          sale =>
            sale.customer_id
        )
        .filter(Boolean)
      )
    ];

  let customers = [];

  if(
    customerIds.length
  ){

    const customersResult =
      await supabaseClient

        .from("customers")

        .select(
          "id,name,phone"
        )

        .in(
          "id",
          customerIds
        );

    if(
      customersResult.error
    ){

      console.warn(
        "No se pudieron cargar clientes:",
        customersResult.error
      );

    }
    else{

      customers =
        customersResult.data ||
        [];

    }

  }

  /*
    GUARDAMOS LOS DATOS COMPLETOS.
  */

  currentData = {

    products:
      productsResult.data ||
      [],

    sales:
      salesResult.data ||
      [],

    customers:
      customers

  };

  /*
    Guardamos una copia independiente
    para cada negocio.
  */

  saveDashboardCache(
    currentBusiness,
    currentData
  );

  /*
    Renderizamos inmediatamente.
  */

  renderDashboard();

  return true;

}


/* =========================================================
   CARGA PRINCIPAL
========================================================= */

async function loadDashboard(){

  if(isLoading){

    return;

  }

  isLoading =
    true;

  updateBusinessButtons();

  /*
    PRIMERO:

    Mostramos inmediatamente el cache.

    Así el Dashboard abre aunque Internet
    no exista o esté lento.
  */

  loadCachedDashboard();

  /*
    OFFLINE
  */

  if(!navigator.onLine){

    showStatus(

      "📴 Modo offline\n\n" +

      "Mostrando la última información guardada de " +

      currentBusiness +

      ".",

      "warn"

    );

    isLoading =
      false;

    return;

  }

  /*
    ONLINE

    Intentamos actualizar desde Supabase.
  */

  try{

    await loadFromSupabase();

    showStatus(

      "🌐 " +
      currentBusiness +
      " actualizado correctamente.",

      "ok"

    );

  }

  catch(error){

    console.warn(
      "No se pudo actualizar Dashboard:",
      error
    );

    /*
      El cache ya fue mostrado antes.
    */

    const hasProducts =
      currentData.products.length > 0;

    const hasSales =
      currentData.sales.length > 0;

    if(
      hasProducts ||
      hasSales
    ){

      showStatus(

        "⚠️ No se pudo actualizar desde Internet.\n\n" +

        "Se está mostrando la última información guardada de " +

        currentBusiness +

        ".",

        "warn"

      );

    }
    else{

      showStatus(

        "⚠️ No fue posible cargar información de " +

        currentBusiness +

        ".\n\n" +

        "Conecta Internet para realizar la primera descarga.",

        "error"

      );

    }

  }

  finally{

    isLoading =
      false;

  }

}


/* =========================================================
   CAMBIO DE NEGOCIO
========================================================= */

document
  .querySelectorAll(
    ".business-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        async () => {

          const business =
            button.dataset.business;

          if(
            business ===
            currentBusiness
          ){

            return;

          }

          currentBusiness =
            business;

          localStorage.setItem(
            LAST_BUSINESS_KEY,
            currentBusiness
          );

          updateBusinessButtons();

          /*
            Limpiamos la pantalla
            antes de cargar el otro negocio.
          */

          currentData = {

            products: [],

            sales: [],

            customers: []

          };

          /*
            Primero cache.
          */

          loadCachedDashboard();

          /*
            Después Internet si existe.
          */

          if(
            navigator.onLine
          ){

            await loadDashboard();

          }
          else{

            showStatus(

              "📴 Modo offline\n\n" +

              "Mostrando los datos guardados de " +

              currentBusiness +

              ".",

              "warn"

            );

          }

        }
      );

    }
  );


/* =========================================================
   ACTUALIZAR
========================================================= */

$("refresh")
  .addEventListener(
    "click",
    async () => {

      if(
        !navigator.onLine
      ){

        showStatus(

          "📴 No hay Internet.\n\n" +

          "El Dashboard está funcionando con los datos guardados.",

          "warn"

        );

        loadCachedDashboard();

        return;

      }

      await loadDashboard();

    }
  );
