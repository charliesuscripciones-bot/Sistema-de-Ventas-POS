<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Sistema de Ventas POS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f6f8;
  color:#171717;
}

header{
  background:#111827;
  color:white;
  padding:25px 20px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* ================================
   MENSAJES
================================ */

.status{
  display:none;
  padding:13px 15px;
  border-radius:12px;
  margin-bottom:20px;
  font-weight:700;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

/* ================================
   PANEL DE CONTROLES
================================ */

.control-panel{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.business-selector{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  min-height:48px;
  border-radius:12px;
  transition:.15s ease;
}

button:active{
  transform:scale(.98);
}

.business-btn{
  background:#fff;
  color:#2680eb;
  border:2px solid #ddd;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh{
  background:#2563eb;
  color:white;
}

.accounts{
  background:#f59e0b;
  color:white;
}

.customers{
  background:#10b981;
  color:white;
}

.history{
  background:#7c3aed;
  color:white;
}

.back{
  background:#fff;
  color:#111827;
  border:2px solid #ddd;
}

/* ================================
   MÉTRICAS
================================ */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.metric-card{
  position:relative;
  overflow:hidden;
}

.metric-icon{
  font-size:27px;
  margin-bottom:12px;
}

.metric-title{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

.metric{
  font-size:30px;
  font-weight:800;
}

.green{
  color:#16a34a;
}

.blue{
  color:#2563eb;
}

.red{
  color:#dc2626;
}

.orange{
  color:#d97706;
}

/* ================================
   SECCIONES PRINCIPALES
================================ */

.main-grid{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:20px;
}

.section-title{
  font-size:21px;
  font-weight:800;
  margin:0 0 18px;
}

/* ================================
   TABLA DE VENTAS
================================ */

.sales-list{
  display:grid;
  gap:10px;
}

.sale-row{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  background:#fff;
}

.sale-main{
  display:grid;
  grid-template-columns:1.4fr .8fr .7fr;
  gap:12px;
  align-items:center;
}

.sale-customer{
  min-width:0;
}

.customer-link{
  color:#2563eb;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
}

.customer-link:hover{
  text-decoration:underline;
}

.customer-general{
  color:#222;
  font-weight:700;
}

.sale-date{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.sale-total{
  font-weight:800;
  font-size:17px;
}

.sale-status{
  text-align:right;
}

/* ================================
   ESTADOS
================================ */

.status-pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.paid{
  background:#dcfce7;
  color:#166534;
}

.open{
  background:#fef3c7;
  color:#92400e;
}

.cancelled{
  background:#fee2e2;
  color:#991b1b;
}

/* ================================
   INVENTARIO
================================ */

.inventory-list{
  display:grid;
  gap:9px;
}

.stock-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  border:1px solid #eee;
  border-radius:12px;
  background:#fafafa;
}

.stock-name{
  font-weight:700;
}

.stock-number{
  font-weight:800;
  white-space:nowrap;
}

.low{
  color:#dc2626;
}

.stock-warning{
  font-size:11px;
  margin-left:6px;
  color:#dc2626;
}

/* ================================
   VACÍO / CARGANDO
================================ */

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

/* ================================
   RESPONSIVE TABLET
================================ */

@media(max-width:900px){

  .action-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .main-grid{
    grid-template-columns:1fr;
  }

}

/* ================================
   RESPONSIVE CELULAR
================================ */

@media(max-width:600px){

  header{
    padding:22px 17px;
  }

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
  }

  .container{
    padding:15px;
  }

  .control-panel{
    padding:13px;
    border-radius:17px;
  }

  .business-selector{
    grid-template-columns:1fr 1fr;
  }

  .action-grid{
    grid-template-columns:repeat(2,1fr);
  }

  button{
    min-height:46px;
    font-size:13px;
    padding:8px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
    border-radius:16px;
  }

  .metric-icon{
    font-size:22px;
  }

  .metric-title{
    font-size:12px;
  }

  .metric{
    font-size:23px;
  }

  .section-title{
    font-size:19px;
  }

  .sale-main{
    grid-template-columns:1fr;
    gap:7px;
  }

  .sale-status{
    text-align:left;
  }

}

/* ================================
   CELULAR MUY PEQUEÑO
================================ */

@media(max-width:390px){

  .action-grid{
    grid-template-columns:1fr 1fr;
  }

  .metric{
    font-size:21px;
  }

  .business-btn{
    font-size:13px;
  }

}
</style>
</head>

<body>

<header>
  <h1>📊 Dashboard</h1>
  <p>Sistema de Ventas POS · Administración</p>
</header>

<div class="container">

  <div id="status" class="status"></div>

  <!-- ============================
       CONTROLES
  ============================= -->

  <div class="control-panel">

    <div class="business-selector">

      <button
        type="button"
        class="business-btn active"
        data-business="BakeQuiri">
        🧁 BakeQuiri
      </button>

      <button
        type="button"
        class="business-btn"
        data-business="SpicyRoll">
        🍣 SpicyRoll
      </button>

    </div>

    <div class="action-grid">

      <button
        type="button"
        id="refresh"
        class="refresh">
        🔄 Actualizar
      </button>

      <button
        type="button"
        id="accounts"
        class="accounts">
        💰 Cuentas
      </button>

      <button
        type="button"
        id="customers"
        class="customers">
        👥 Clientes
      </button>

      <button
        type="button"
        id="history"
        class="history">
        🧾 Historial
      </button>

      <button
        type="button"
        id="back"
        class="back">
        ← POS
      </button>

    </div>

  </div>


  <!-- ============================
       MÉTRICAS
  ============================= -->

  <div class="cards">

    <div class="card metric-card">

      <div class="metric-icon">
        💰
      </div>

      <div class="metric-title">
        VENTAS DE HOY
      </div>

      <div
        id="todaySales"
        class="metric green">
        $0.00
      </div>

    </div>


    <div class="card metric-card">

      <div class="metric-icon">
        🧾
      </div>

      <div class="metric-title">
        NÚMERO DE VENTAS
      </div>

      <div
        id="salesCount"
        class="metric blue">
        0
      </div>

    </div>


    <div class="card metric-card">

      <div class="metric-icon">
        📦
      </div>

      <div class="metric-title">
        PRODUCTOS ACTIVOS
      </div>

      <div
        id="productCount"
        class="metric">
        0
      </div>

    </div>


    <div class="card metric-card">

      <div class="metric-icon">
        ⚠️
      </div>

      <div class="metric-title">
        STOCK BAJO
      </div>

      <div
        id="lowStock"
        class="metric red">
        0
      </div>

    </div>

  </div>


  <!-- ============================
       VENTAS + INVENTARIO
  ============================= -->

  <div class="main-grid">

    <div class="card">

      <h2 class="section-title">
        🧾 Ventas de hoy
      </h2>

      <div id="salesContainer">
        <div class="loading">
          Cargando ventas...
        </div>
      </div>

    </div>


    <div class="card">

      <h2 class="section-title">
        📦 Inventario
      </h2>

      <div id="inventoryContainer">
        <div class="loading">
          Cargando inventario...
        </div>
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


const money =
value =>
"$" +
Number(value || 0).toFixed(2);


/* =========================================
   MENSAJES
========================================= */

function showStatus(
  message,
  type = "error"
){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


/* =========================================
   CARGAR DASHBOARD
========================================= */

async function loadDashboard(){

  $("salesContainer").innerHTML =
  '<div class="loading">Cargando ventas...</div>';

  $("inventoryContainer").innerHTML =
  '<div class="loading">Cargando inventario...</div>';

  $("status").className =
  "status";


  try{

    const businessId =
    BUSINESS_IDS[currentBusiness];


    /* =====================================
       PRODUCTOS
    ===================================== */

    const productsResult =
    await supabaseClient

      .from("products")

      .select(
        "id,name,price,stock,active"
      )

      .eq(
        "business_id",
        businessId
      )

      .eq(
        "active",
        true
      )

      .order(
        "name"
      );


    if(productsResult.error){

      throw productsResult.error;

    }


    const products =
    productsResult.data || [];


    $("productCount").textContent =
    products.length;


    $("lowStock").textContent =
    products.filter(
      product =>
      Number(product.stock || 0) <= 5
    ).length;


    renderInventory(
      products
    );


    /* =====================================
       VENTAS DEL DÍA
    ===================================== */

    const start =
    new Date();

    start.setHours(
      0,
      0,
      0,
      0
    );


    const salesResult =
    await supabaseClient

      .from("sales")

      .select(
        "id,total,balance,status,created_at,customer_id,sale_date"
      )

      .eq(
        "business_id",
        businessId
      )

      .gte(
        "created_at",
        start.toISOString()
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(salesResult.error){

      throw salesResult.error;

    }


    const sales =
    salesResult.data || [];


    const total =
    sales.reduce(
      (
        sum,
        sale
      ) =>
      sum +
      Number(
        sale.total || 0
      ),
      0
    );


    $("todaySales").textContent =
    money(total);


    $("salesCount").textContent =
    sales.length;


    await renderSales(
      sales
    );


    showStatus(
      currentBusiness +
      " actualizado correctamente.",
      "ok"
    );

  }

  catch(error){

    console.error(
      "Error Dashboard:",
      error
    );


    showStatus(
      "No se pudo cargar el Dashboard: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   INVENTARIO
========================================= */

function renderInventory(
  products
){

  const container =
  $("inventoryContainer");


  if(!products.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay productos activos." +
    "</div>";

    return;

  }


  container.innerHTML =
  "";


  const sortedProducts =
  [...products].sort(
    (a,b) =>
    Number(a.stock || 0) -
    Number(b.stock || 0)
  );


  sortedProducts.forEach(
    product => {

      const row =
      document.createElement(
        "div"
      );


      row.className =
      "stock-row";


      const name =
      document.createElement(
        "div"
      );


      name.className =
      "stock-name";


      name.textContent =
      product.name;


      const stock =
      document.createElement(
        "div"
      );


      stock.className =
      "stock-number";


      const stockValue =
      Number(
        product.stock || 0
      );


      if(stockValue <= 5){

        stock.classList.add(
          "low"
        );

      }


      stock.textContent =
      stockValue +
      " uds";


      if(stockValue <= 5){

        const warning =
        document.createElement(
          "span"
        );


        warning.className =
        "stock-warning";


        warning.textContent =
        "⚠️";


        stock.appendChild(
          warning
        );

      }


      row.append(
        name,
        stock
      );


      container.appendChild(
        row
      );

    }
  );

}


/* =========================================
   VENTAS DE HOY
========================================= */

async function renderSales(
  sales
){

  const container =
  $("salesContainer");


  if(!sales.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay ventas registradas hoy." +
    "</div>";

    return;

  }


  /* =======================================
     OBTENER CLIENTES
  ======================================= */

  const customerIds =
  [
    ...new Set(
      sales
        .map(
          sale =>
          sale.customer_id
        )
        .filter(Boolean)
    )
  ];


  const customerMap =
  new Map();


  if(customerIds.length){

    const customersResult =
    await supabaseClient

      .from("customers")

      .select(
        "id,name,phone"
      )

      .in(
        "id",
        customerIds
      );


    if(customersResult.error){

      throw customersResult.error;

    }


    (
      customersResult.data || []
    ).forEach(
      customer => {

        customerMap.set(
          customer.id,
          customer
        );

      }
    );

  }


  /* =======================================
     LISTA
  ======================================= */

  container.innerHTML =
  "";


  const list =
  document.createElement(
    "div"
  );


  list.className =
  "sales-list";


  sales
    .slice(0,20)
    .forEach(
      sale => {

        const customer =
        customerMap.get(
          sale.customer_id
        );


        const customerName =
        customer?.name ||
        "Consumidor general";


        const row =
        document.createElement(
          "div"
        );


        row.className =
        "sale-row";


        /* =================================
           CLIENTE
        ================================= */

        const customerDiv =
        document.createElement(
          "div"
        );


        customerDiv.className =
        "sale-customer";


        if(
          sale.customer_id &&
          customer
        ){

          const link =
          document.createElement(
            "a"
          );


          link.className =
          "customer-link";


          /*
            IMPORTANTE:

            Ahora mandamos también
            el negocio actual al historial.
          */

          link.href =
          "historial.html" +
          "?customer_id=" +
          encodeURIComponent(
            sale.customer_id
          ) +
          "&business=" +
          encodeURIComponent(
            currentBusiness
          );


          link.textContent =
          customerName;


          link.title =
          "Ver historial de " +
          customerName;


          customerDiv.appendChild(
            link
          );

        }
        else{

          const general =
          document.createElement(
            "span"
          );


          general.className =
          "customer-general";


          general.textContent =
          customerName;


          customerDiv.appendChild(
            general
          );

        }


        const date =
        new Date(
          sale.sale_date ||
          sale.created_at
        );


        const formattedDate =
        date.toLocaleDateString(
          "es-MX",
          {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
          }
        );


        const dateDiv =
        document.createElement(
          "div"
        );


        dateDiv.className =
        "sale-date";


        dateDiv.textContent =
        formattedDate;


        customerDiv.appendChild(
          dateDiv
        );


        /* =================================
           TOTAL
        ================================= */

        const totalDiv =
        document.createElement(
          "div"
        );


        totalDiv.className =
        "sale-total";


        totalDiv.textContent =
        money(
          sale.total
        );


        /* =================================
           ESTADO
        ================================= */

        const statusDiv =
        document.createElement(
          "div"
        );


        statusDiv.className =
        "sale-status";


        const paid =
        sale.status ===
        "paid";


        const cancelled =
        sale.status ===
        "cancelled";


        const statusPill =
        document.createElement(
          "span"
        );


        statusPill.className =
        "status-pill " +
        (
          paid
          ? "paid"
          : cancelled
          ? "cancelled"
          : "open"
        );


        if(paid){

          statusPill.textContent =
          "✓ Pagada";

        }
        else if(cancelled){

          statusPill.textContent =
          "Cancelada";

        }
        else{

          statusPill.textContent =
          "🔴 Debe " +
          money(
            sale.balance || 0
          );

        }


        statusDiv.appendChild(
          statusPill
        );


        /* =================================
           CONTENEDOR
        ================================= */

        const main =
        document.createElement(
          "div"
        );


        main.className =
        "sale-main";


        main.append(
          customerDiv,
          totalDiv,
          statusDiv
        );


        row.appendChild(
          main
        );


        list.appendChild(
          row
        );

      }
    );


  container.appendChild(
    list
  );

}


/* =========================================
   CAMBIAR NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;


        if(
          business ===
          currentBusiness
        ){

          return;

        }


        currentBusiness =
        business;


        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          b =>
          b.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        await loadDashboard();

      }
    );

  }
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refresh")
.addEventListener(
  "click",
  loadDashboard
);


/* =========================================
   CUENTAS PENDIENTES
========================================= */

$("accounts")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "cuentas.html" +
    "?business=" +
    encodeURIComponent(
      currentBusiness
    );

  }
);


/* =========================================
   CLIENTES
========================================= */

$("customers")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "clientes.html" +
    "?business=" +
    encodeURIComponent(
      currentBusiness
    );

  }
);


/* =========================================
   HISTORIAL GENERAL
========================================= */

$("history")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "historial.html" +
    "?business=" +
    encodeURIComponent(
      currentBusiness
    );

  }
);


/* =========================================
   VOLVER AL POS
========================================= */

$("back")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "index.html";

  }
);


/* =========================================
   INICIAR
========================================= */

loadDashboard();

</script>

</body>
</html>
