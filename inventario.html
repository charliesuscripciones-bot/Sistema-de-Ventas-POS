<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario | Charlie Shop</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
  min-height:100vh;
}

/* =========================================
   HEADER
========================================= */

header{
  background:#111827;
  color:#fff;
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-right:20px;
  padding-bottom:20px;
  padding-left:20px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:54px;
  height:54px;
  flex-shrink:0;
}

.brand-logo svg{
  width:100%;
  height:100%;
}

.brand-text h1{
  font-size:25px;
  line-height:1.1;
  font-weight:800;
}

.brand-text p{
  font-size:13px;
  opacity:.72;
  margin-top:4px;
  letter-spacing:.3px;
}

.page-title{
  margin-top:18px;
}

.page-title h2{
  font-size:25px;
}

.page-title p{
  font-size:14px;
  opacity:.72;
  margin-top:5px;
}

/* =========================================
   CONTAINER
========================================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 20px 50px;
}

/* =========================================
   STATUS
========================================= */

.status{
  display:none;
  margin-bottom:18px;
  padding:14px 16px;
  border-radius:12px;
  font-weight:700;
  line-height:1.4;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.warning{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

/* =========================================
   CONTROLES
========================================= */

.controls{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.businesses{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.business-btn,
.refresh-btn,
.dashboard-btn{
  border:2px solid #ddd;
  padding:12px 16px;
  border-radius:11px;
  background:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  min-height:48px;
}

.business-btn{
  color:#2680eb;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh-btn{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.dashboard-btn{
  color:#111827;
}

/* =========================================
   SUMMARY
========================================= */

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:18px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-label{
  color:#6b7280;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
  letter-spacing:.3px;
}

.summary-value{
  font-size:28px;
  font-weight:800;
}

.products-value{
  color:#2563eb;
}

.low-value{
  color:#dc2626;
}

.units-value{
  color:#16a34a;
}

/* =========================================
   ACTIONS
========================================= */

.main-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.main-action{
  border:none;
  border-radius:14px;
  padding:15px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  min-height:52px;
}

.entry-action{
  background:#16a34a;
  color:#fff;
}

.history-action{
  background:#eef2ff;
  color:#3730a3;
}

/* =========================================
   CARD
========================================= */

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:18px;
}

.card h2{
  font-size:21px;
  margin-bottom:15px;
}

/* =========================================
   SEARCH
========================================= */

.search{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  outline:none;
  margin-bottom:16px;
}

.search:focus{
  border-color:#2563eb;
}

/* =========================================
   PRODUCTS
========================================= */

.products{
  display:grid;
  gap:12px;
}

.product{
  border:2px solid #eee;
  border-radius:15px;
  padding:17px;
  background:#fff;
}

.product.low-stock{
  border-color:#fecaca;
  background:#fffafa;
}

.product-name{
  font-size:18px;
  font-weight:800;
}

.product-price{
  color:#6b7280;
  margin-top:5px;
  font-size:14px;
}

.stock-display{
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.stock-number{
  font-size:25px;
  font-weight:900;
}

.stock-caption{
  font-size:13px;
  color:#6b7280;
  font-weight:700;
}

.stock-badge{
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.stock-badge.ok{
  background:#dcfce7;
  color:#166534;
}

.stock-badge.low{
  background:#fee2e2;
  color:#991b1b;
}

.stock-area{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  margin-top:14px;
}

.stock-label{
  font-weight:800;
}

.stock-input{
  width:100%;
  padding:11px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:17px;
  font-weight:800;
  text-align:center;
}

.stock-input:focus{
  outline:none;
  border-color:#2563eb;
}

.save-button{
  border:none;
  background:#111827;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  min-height:44px;
}

.save-button:disabled{
  opacity:.6;
  cursor:wait;
}

.product-actions{
  margin-top:12px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.quick-button{
  border:none;
  background:#eef2ff;
  color:#3730a3;
  padding:10px 12px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  min-height:42px;
}

.quick-button:hover{
  background:#e0e7ff;
}

.product-entry-button{
  margin-top:10px;
  width:100%;
  border:2px solid #bbf7d0;
  background:#f0fdf4;
  color:#166534;
  padding:10px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  min-height:44px;
}

.product-entry-button:hover{
  background:#dcfce7;
}

.stock-status{
  grid-column:1 / -1;
  font-size:13px;
  font-weight:700;
}

.stock-status.low{
  color:#dc2626;
}

.stock-status.ok{
  color:#16a34a;
}

/* =========================================
   HISTORY
========================================= */

.history-section{
  scroll-margin-top:20px;
}

.history-filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.filter{
  width:100%;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:14px;
  background:#fff;
  outline:none;
}

.filter:focus{
  border-color:#2563eb;
}

.history-list{
  display:grid;
  gap:9px;
}

.movement{
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:14px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:center;
}

.movement-icon{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
}

.movement-icon.in{
  background:#dcfce7;
  color:#166534;
}

.movement-icon.out{
  background:#fee2e2;
  color:#991b1b;
}

.movement-icon.adjustment{
  background:#e0e7ff;
  color:#3730a3;
}

.movement-product{
  font-weight:800;
  font-size:15px;
}

.movement-meta{
  margin-top:4px;
  color:#6b7280;
  font-size:12px;
}

.movement-quantity{
  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}

.movement-quantity.in{
  color:#16a34a;
}

.movement-quantity.out{
  color:#dc2626;
}

.movement-quantity.adjustment{
  color:#3730a3;
}

/* =========================================
   MODAL
========================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
  max-height:90vh;
  overflow:auto;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.modal-header h3{
  font-size:21px;
}

.close-button{
  border:none;
  background:#f3f4f6;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.modal-product{
  background:#f9fafb;
  border-radius:12px;
  padding:13px;
  margin-bottom:16px;
}

.modal-product-name{
  font-weight:800;
}

.modal-product-stock{
  color:#6b7280;
  font-size:13px;
  margin-top:3px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-input{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.form-input:focus{
  border-color:#2563eb;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.cancel-button,
.confirm-button{
  border:none;
  padding:13px;
  border-radius:11px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  min-height:48px;
}

.cancel-button{
  background:#f3f4f6;
  color:#111827;
}

.confirm-button{
  background:#16a34a;
  color:#fff;
}

.confirm-button:disabled{
  opacity:.6;
}

/* =========================================
   EMPTY / LOADING
========================================= */

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:800px){

  .summary{
    grid-template-columns:1fr;
  }

  .history-filters{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding-right:17px;
    padding-left:17px;
  }

  .container{
    padding:15px 14px 40px;
  }

  .controls{
    padding:13px;
  }

  .businesses{
    grid-template-columns:1fr 1fr;
  }

  .business-btn,
  .refresh-btn,
  .dashboard-btn{
    width:100%;
    padding:11px 8px;
    font-size:13px;
  }

  .main-actions{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

  .stock-area{
    grid-template-columns:1fr;
  }

  .stock-input{
    width:100%;
  }

  .save-button{
    width:100%;
  }

  .stock-status{
    grid-column:auto;
  }

  .movement{
    grid-template-columns:auto 1fr;
  }

  .movement-quantity{
    grid-column:2;
    justify-self:start;
  }

  .modal{
    padding:0;
  }

  .modal-box{
    border-radius:22px 22px 0 0;
    max-height:94vh;
  }

}

/* =========================================
   REDUCED MOTION
========================================= */

@media(prefers-reduced-motion:reduce){

  *{
    scroll-behavior:auto !important;
  }

}

</style>

</head>

const params =

params.get("business");


if(

function money(value){

  return "$" +
  Number(value || 0).toFixed(2);

}


function pad(value){

  return String(value)
    .padStart(2,"0");

}


function localDateInput(){

  const date =
  new Date();

  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate())
  );

}


function localTimeInput(){

  const date =
  new Date();

  return (
    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes())
  );

}


function formatDateTime(value){

  if(!value){

    return "Sin fecha";

  }


  const date =
  new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "Fecha inválida";

  }


  return (
    pad(date.getDate()) +
    "/" +
    pad(date.getMonth()+1) +
    "/" +
    date.getFullYear() +
    " · " +
    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes())
  );

}


function formatDateForInput(value){

  const date =
  new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate())
  );

}

/* =========================================
   RESUMEN
========================================= */

function updateSummary(){

  const totalProducts =
  products.length;


  const totalUnits =
  products.reduce(
    (
      sum,
      product
    ) =>
      sum +
      Number(
        product.stock || 0
      ),
    0
  );


  const lowProducts =
  products.filter(
    product =>
    Number(
      product.stock || 0
    ) <= 5
  ).length;


  $("productCount").textContent =
  totalProducts;


  $("unitCount").textContent =
  totalUnits;


  $("lowStockCount").textContent =
  lowProducts;

}

function renderProducts(){

  $("products");


  const query =
  $("search")

  .toLowerCase();

  products;

  container.innerHTML =
  "";


  visibleProducts.forEach(

          product

      );

    }
  );

}

/* =========================================
   GUARDAR STOCK MANUAL
========================================= */

async function saveStock(
  product,
  input,
  button,
  statusElement
){

  const newStock =
  Number(
    input.value
  );


  const oldStock =
  Number(
    product.stock || 0
  );


  if(
    !Number.isInteger(
      newStock
    ) ||
    newStock < 0
  ){

    showStatus(
      "❌ El stock debe ser un número entero mayor o igual a 0.",
      "error"
    );

    input.focus();

    return;

  }


  if(
    newStock ===
    oldStock
  ){

    showStatus(
      "ℹ️ El stock de " +
      product.name +
      " ya está en " +
      newStock +
      " unidades.",
      "warning"
    );

    return;

  }


  const businessId =
  BUSINESS_IDS[currentBusiness];


  button.disabled =
  true;

  button.textContent =
  "Guardando...";


  clearStatus();


  try{

    /* =====================================
       PASO 1
       ACTUALIZAR PRODUCTO
    ===================================== */

    const updateResult =
    await supabaseClient

      .from("products")

      .update({
        stock:newStock
      })

      .eq(
        "id",
        product.id
      )

      .eq(
        "business_id",
        businessId
      );


    if(updateResult.error){

      throw updateResult.error;

    }


    /* =====================================
       PASO 2
       VERIFICAR
    ===================================== */

    const verifyResult =
    await supabaseClient

      .from("products")

      .select(
        "id,business_id,name,price,stock,active"
      )

      .eq(
        "id",
        product.id
      )

      .eq(
        "business_id",
        businessId
      )

      .limit(1);


    if(verifyResult.error){

      throw verifyResult.error;

    }


    const rows =
    verifyResult.data || [];


    if(!rows.length){

      throw new Error(
        "Supabase no encontró el producto después de guardarlo."
      );

    }


    const savedProduct =
    rows[0];


    const savedStock =
    Number(
      savedProduct.stock || 0
    );


    if(
      savedStock !==
      newStock
    ){

      throw new Error(
        "El cambio no fue confirmado por Supabase. El stock sigue en " +
        savedStock +
        " unidades."
      );

    }


    /* =====================================
       PASO 3
       REGISTRAR DIFERENCIA
    ===================================== */

    const difference =
    newStock -
    oldStock;


    const movementResult =
    await supabaseClient

      .from("inventory_movements")

      .insert({

        business_id:
        businessId,

        product_id:
        product.id,

        quantity:
        Math.abs(difference),

        movement_type:
        "adjustment",

        reference_id:
        null

      });


    /* =====================================
       IMPORTANTE:
       EL STOCK YA SE GUARDÓ.

       SI RLS BLOQUEA EL INSERT,
       NO REVERSAMOS EL STOCK.
    ===================================== */

    const index =
    products.findIndex(
      item =>
      item.id ===
      product.id
    );


    if(index !== -1){

      products[index] =
      savedProduct;

    }


    updateSummary();


    statusElement.className =
    "stock-status " +
    (
      savedStock <= 5
      ? "low"
      : "ok"
    );


    statusElement.textContent =
    savedStock <= 5
    ? "⚠️ Stock bajo"
    : "✓ Stock normal";


    if(
      movementResult.error
    ){

      console.error(
        "Stock actualizado pero movimiento no registrado:",
        movementResult.error
      );


      showStatus(
        "⚠️ El stock de " +
        savedProduct.name +
        " se actualizó a " +
        savedStock +
        ", pero no se pudo registrar el movimiento histórico. Revisa las políticas RLS de inventory_movements.",
        "warning"
      );


      await loadMovements();

      return;

    }


    showStatus(
      "✅ Stock de " +
      savedProduct.name +
      " actualizado a " +
      savedStock +
      " unidades y movimiento registrado.",
      "ok"
    );


    await loadMovements();

  }

  catch(error){

    console.error(
      "ERROR GUARDANDO STOCK:",
      error
    );


    showStatus(
      "❌ No se pudo guardar el stock de " +
      (
        product.name ||
        "producto"
      ) +
      ": " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

  finally{

    button.disabled =
    false;

    button.textContent =
    "💾 Guardar";

  }

}

========================================= */

async function loadMovements(){

  const businessId =
  BUSINESS_IDS[currentBusiness];


  $("historyList").innerHTML =
  '<div class="loading">' +
  "Cargando movimientos..." +
  "</div>";


  try{

    const result =
    await supabaseClient

      .from("inventory_movements")

      .select(
        "id,business_id,product_id,quantity,movement_type,reference_id,created_at"
      )

      .eq(
        "business_id",
        businessId
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(result.error){

      throw result.error;

    }


    movements =
    result.data || [];


    renderHistory();

  }

  catch(error){

    console.error(
      "Error cargando movimientos:",
      error
    );


    movements =
    [];


    $("historyList").innerHTML =
    '<div class="empty">' +
    "No se pudo cargar el historial de movimientos." +
    "</div>";

  }

}


/* =========================================
   RENDER HISTORIAL
========================================= */

function renderHistory(){

  const container =
  $("historyList");


  const productFilter =
  $("historyProduct").value;


  const typeFilter =
  $("historyType").value;


  const days =
  Number(
    $("historyDays").value || 0
  );


  let visible =
  [...movements];


  if(productFilter){

    visible =
    visible.filter(
      movement =>
      movement.product_id ===
      productFilter
    );

  }


  if(typeFilter){

    visible =
    visible.filter(
      movement =>
      movement.movement_type ===
      typeFilter
    );

  }


  if(days > 0){

    const limit =
    Date.now() -
    (
      days *
      24 *
      60 *
      60 *
      1000
    );


    visible =
    visible.filter(
      movement => {

        const timestamp =
        new Date(
          movement.created_at
        ).getTime();

        return timestamp >= limit;

      }
    );

  }


  if(!visible.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay movimientos para los filtros seleccionados." +
    "</div>";

    return;

  }


  container.innerHTML =
  "";


  visible.forEach(
    movement => {

      const product =
      products.find(
        item =>
        item.id ===
        movement.product_id
      );


      const productName =
      product
      ? product.name
      : "Producto eliminado";


      const type =
      normalizeMovementType(
        movement.movement_type
      );


      const item =
      document.createElement(
        "div"
      );

      item.className =
      "movement";


      const icon =
      document.createElement(
        "div"
      );

      icon.className =
      "movement-icon " +
      type.className;

      icon.textContent =
      type.icon;


      const info =
      document.createElement(
        "div"
      );


      const name =
      document.createElement(
        "div"
      );

      name.className =
      "movement-product";

      name.textContent =
      productName;


      const meta =
      document.createElement(
        "div"
      );

      meta.className =
      "movement-meta";

      meta.textContent =
      type.label +
      " · " +
      formatDateTime(
        movement.created_at
      );


      if(
        movement.reference_id
      ){

        meta.textContent +=
        " · Ref: " +
        String(
          movement.reference_id
        )
        .substring(
          0,
          8
        );

      }


      info.append(
        name,
        meta
      );


      const quantity =
      document.createElement(
        "div"
      );

      quantity.className =
      "movement-quantity " +
      type.className;


      if(
        type.className ===
        "in"
      ){

        quantity.textContent =
        "+" +
        Number(
          movement.quantity || 0
        );

      }
      else if(
        type.className ===
        "out"
      ){

        quantity.textContent =
        "-" +
        Number(
          movement.quantity || 0
        );

      }
      else{

        quantity.textContent =
        "±" +
        Number(
          movement.quantity || 0
        );

      }


      item.append(
        icon,
        info,
        quantity
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   NORMALIZAR TIPO
========================================= */

function normalizeMovementType(
  movementType
){

  const type =
  String(
    movementType ||
    ""
  )
  .toLowerCase();


  if(
    type === "in" ||
    type === "entrada" ||
    type === "entry"
  ){

    return {
      className:"in",
      icon:"↑",
      label:"Entrada"
    };

  }


  if(
    type === "out" ||
    type === "salida" ||
    type === "exit"
  ){

    return {
      className:"out",
      icon:"↓",
      label:"Salida"
    };

  }


  return {
    className:"adjustment",
    icon:"↕",
    label:"Ajuste"
  };

}

        "id,business_id,name,price,stock,active"
      )

      .eq(
        "id",
        product.id
      )

      .eq(
        "business_id",
        businessId
      )

      .limit(1);


    if(verifyResult.error){

      throw verifyResult.error;

    }


    const rows =
    verifyResult.data || [];


    if(!rows.length){

      throw new Error(
        "No se pudo verificar el producto después de actualizarlo."
      );

    }


    const savedProduct =
    rows[0];


    const savedStock =
    Number(
      savedProduct.stock || 0
    );


    if(
      savedStock !==
      newStock
    ){

      throw new Error(
        "El stock no coincide después de actualizarlo. Supabase reporta " +
        savedStock +
        " unidades."
      );

    }


    /* =====================================
       PASO 3
       REGISTRAR MOVIMIENTO
    ===================================== */

    const movementResult =
    await supabaseClient

      .from("inventory_movements")

      .insert({

        business_id:
        businessId,

        product_id:
        product.id,

        quantity:
        quantity,

        movement_type:
        "in",

        reference_id:
        null,

        created_at:
        createdAt.toISOString()

      });


    /* =====================================
       ACTUALIZAR MEMORIA
    ===================================== */

    const index =
    products.findIndex(
      item =>
      item.id ===
      product.id
    );


    if(index !== -1){

      products[index] =
      savedProduct;

    }


    updateSummary();

    renderProducts();


    if(
      movementResult.error
    ){

      console.error(
        "Stock actualizado pero entrada no registrada:",
        movementResult.error
      );


      closeEntryModal();


      showStatus(
        "⚠️ El stock de " +
        product.name +
        " aumentó a " +
        savedStock +
        ", pero la entrada histórica no pudo registrarse. Revisa las políticas RLS de inventory_movements.",
        "warning"
      );


      return;

    }


    closeEntryModal();


    showStatus(
      "✅ Entrada registrada: +" +
      quantity +
      " unidades de " +
      product.name +
      ". Nuevo stock: " +
      savedStock +
      ".",
      "ok"
    );


    await loadMovements();


    $("historySection")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

  catch(error){

    console.error(
      "ERROR REGISTRANDO ENTRADA:",
      error
    );


    showStatus(
      "❌ No se pudo registrar la entrada: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

  finally{

    button.disabled =
    false;

    button.textContent =
    "Registrar entrada";

  }

}

/* =========================================
   CAMBIO DE NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;


        if(
          business ===
          currentBusiness
        ){

          return;

        }


        currentBusiness =
        business;


        const newUrl =
        "inventario.html?business=" +
        encodeURIComponent(
          currentBusiness
        );


        window.history.replaceState(
          null,
          "",
          newUrl
        );


        updateBusinessButtons();


        $("search").value =
        "";


        await loadInventory();

      }
    );

  }
);
