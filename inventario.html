<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:16px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 20px 40px;
}

/* =========================
   STATUS
========================= */

.status{
  display:none;
  margin-bottom:18px;
  padding:14px 16px;
  border-radius:12px;
  font-weight:700;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

/* =========================
   CONTROLES
========================= */

.controls{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.businesses{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.business-btn,
.refresh-btn,
.dashboard-btn{
  border:2px solid #ddd;
  padding:12px 18px;
  border-radius:11px;
  background:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.business-btn{
  color:#2680eb;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh-btn{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

.dashboard-btn{
  color:#111827;
}

/* =========================
   RESUMEN
========================= */

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-label{
  color:#6b7280;
  font-size:14px;
  font-weight:800;
  margin-bottom:7px;
}

.summary-value{
  font-size:29px;
  font-weight:800;
}

.products-value{
  color:#2563eb;
}

.low-value{
  color:#dc2626;
}

.units-value{
  color:#16a34a;
}

/* =========================
   CARD
========================= */

.card{
  background:#fff;
  border-radius:20px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  font-size:23px;
  margin-bottom:17px;
}

/* =========================
   BUSCADOR
========================= */

.search{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.search:focus{
  border-color:#2563eb;
}

/* =========================
   PRODUCTOS
========================= */

.products{
  display:grid;
  gap:12px;
}

.product{
  border:2px solid #eee;
  border-radius:15px;
  padding:17px;
  background:#fff;
}

.product.low-stock{
  border-color:#fecaca;
  background:#fffafa;
}

.product-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.product-name{
  font-size:18px;
  font-weight:800;
}

.product-price{
  color:#6b7280;
  margin-top:5px;
  font-size:14px;
}

.stock-area{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.stock-label{
  font-weight:800;
}

.stock-input{
  width:110px;
  padding:11px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:17px;
  font-weight:800;
  text-align:center;
}

.stock-input:focus{
  outline:none;
  border-color:#2563eb;
}

.save-button{
  border:none;
  background:#16a34a;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

.save-button:disabled{
  opacity:.6;
  cursor:wait;
}

.stock-status{
  font-size:13px;
  font-weight:700;
}

.stock-status.low{
  color:#dc2626;
}

.stock-status.ok{
  color:#16a34a;
}

.product-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.quick-button{
  border:none;
  background:#eef2ff;
  color:#3730a3;
  padding:9px 12px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.quick-button:hover{
  background:#e0e7ff;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

  .summary{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:22px 17px;
  }

  header h1{
    font-size:25px;
  }

  .container{
    padding:16px 14px 35px;
  }

  .controls{
    padding:14px;
  }

  .businesses{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .business-btn,
  .refresh-btn,
  .dashboard-btn{
    width:100%;
    padding:11px 8px;
    font-size:13px;
  }

  .card{
    padding:17px;
  }

  .product-top{
    flex-direction:column;
  }

  .stock-area{
    align-items:flex-start;
    flex-direction:column;
  }

  .stock-input{
    width:100%;
  }

  .save-button{
    width:100%;
  }

  .quick-button{
    flex:1;
  }

}

</style>

</head>


<body>


<header>

<h1>📦 Inventario</h1>

<p>
Control y actualización de existencias
</p>

</header>


<div class="container">


<div
id="status"
class="status">
</div>


<!-- =========================
     CONTROLES
========================= -->

<div class="controls">

<div class="businesses">


<button
type="button"
class="business-btn active"
data-business="BakeQuiri">

🧁 BakeQuiri

</button>


<button
type="button"
class="business-btn"
data-business="SpicyRoll">

🍣 SpicyRoll

</button>


<button
type="button"
class="refresh-btn"
id="refreshButton">

🔄 Actualizar

</button>


<button
type="button"
class="dashboard-btn"
id="dashboardButton">

← Dashboard

</button>


</div>

</div>


<!-- =========================
     RESUMEN
========================= -->

<div class="summary">


<div class="summary-card">

<div class="summary-label">
PRODUCTOS ACTIVOS
</div>

<div
id="productCount"
class="summary-value products-value">

0

</div>

</div>


<div class="summary-card">

<div class="summary-label">
UNIDADES EN INVENTARIO
</div>

<div
id="unitCount"
class="summary-value units-value">

0

</div>

</div>


<div class="summary-card">

<div class="summary-label">
PRODUCTOS CON STOCK BAJO
</div>

<div
id="lowStockCount"
class="summary-value low-value">

0

</div>

</div>


</div>


<!-- =========================
     PRODUCTOS
========================= -->

<div class="card">


<h2>
📋 Productos
</h2>


<input
id="search"
class="search"
type="search"
placeholder="🔎 Buscar producto..."
autocomplete="off"
>


<div
id="products"
class="products">

<div class="loading">
Cargando inventario...
</div>

</div>


</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";


let products =
[];


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


function money(value){

  return "$" +
  Number(value || 0).toFixed(2);

}


function showStatus(
  message,
  type="ok"
){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================
   CARGAR INVENTARIO
========================================= */

async function loadInventory(){

  clearStatus();


  $("products").innerHTML =
  '<div class="loading">' +
  "Cargando inventario..." +
  "</div>";


  try{

    const businessId =
    BUSINESS_IDS[currentBusiness];


    /*
      IMPORTANTE:

      El inventario se obtiene directamente
      desde products usando el business_id.

      Esto evita mezclar productos de
      BakeQuiri con SpicyRoll.
    */

    const result =
    await supabaseClient

      .from("products")

      .select(
        "id,business_id,name,price,stock,active"
      )

      .eq(
        "business_id",
        businessId
      )

      .eq(
        "active",
        true
      )

      .order(
        "name",
        {
          ascending:true
        }
      );


    if(result.error){

      throw result.error;

    }


    products =
    result.data || [];


    updateSummary();


    renderProducts();


  }

  catch(error){

    console.error(
      "Error cargando inventario:",
      error
    );


    $("products").innerHTML =
    '<div class="empty">' +
    "No se pudo cargar el inventario." +
    "</div>";


    showStatus(
      "❌ Error al cargar inventario: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   RESUMEN
========================================= */

function updateSummary(){

  const totalProducts =
  products.length;


  const totalUnits =
  products.reduce(
    (sum,product) =>
    sum +
    Number(
      product.stock || 0
    ),
    0
  );


  const lowProducts =
  products.filter(
    product =>
    Number(
      product.stock || 0
    ) <= 5
  ).length;


  $("productCount").textContent =
  totalProducts;


  $("unitCount").textContent =
  totalUnits;


  $("lowStockCount").textContent =
  lowProducts;

}


/* =========================================
   RENDERIZAR PRODUCTOS
========================================= */

function renderProducts(){

  const container =
  $("products");


  const query =
  $("search")
  .value
  .trim()
  .toLowerCase();


  let visibleProducts =
  products;


  if(query){

    visibleProducts =
    products.filter(
      product =>
      String(
        product.name || ""
      )
      .toLowerCase()
      .includes(query)
    );

  }


  if(!visibleProducts.length){

    container.innerHTML =
    '<div class="empty">' +
    "No se encontraron productos." +
    "</div>";

    return;

  }


  container.innerHTML =
  "";


  visibleProducts.forEach(
    product => {

      container.appendChild(
        createProductElement(
          product
        )
      );

    }
  );

}


/* =========================================
   CREAR PRODUCTO
========================================= */

function createProductElement(
  product
){

  const element =
  document.createElement(
    "div"
  );


  const currentStock =
  Number(
    product.stock || 0
  );


  element.className =
  "product" +
  (
    currentStock <= 5
    ? " low-stock"
    : ""
  );


  /* ================================
     PARTE SUPERIOR
  ================================= */

  const top =
  document.createElement(
    "div"
  );


  top.className =
  "product-top";


  const info =
  document.createElement(
    "div"
  );


  const name =
  document.createElement(
    "div"
  );


  name.className =
  "product-name";


  name.textContent =
  product.name ||
  "Producto sin nombre";


  const price =
  document.createElement(
    "div"
  );


  price.className =
  "product-price";


  price.textContent =
  "Precio: " +
  money(product.price);


  info.append(
    name,
    price
  );


  top.appendChild(
    info
  );


  element.appendChild(
    top
  );


  /* ================================
     STOCK
  ================================= */

  const stockArea =
  document.createElement(
    "div"
  );


  stockArea.className =
  "stock-area";


  const label =
  document.createElement(
    "span"
  );


  label.className =
  "stock-label";


  label.textContent =
  "Stock:";


  const input =
  document.createElement(
    "input"
  );


  input.type =
  "number";

  input.min =
  "0";

  input.step =
  "1";

  input.inputMode =
  "numeric";

  input.className =
  "stock-input";

  input.value =
  currentStock;


  const save =
  document.createElement(
    "button"
  );


  save.type =
  "button";

  save.className =
  "save-button";

  save.textContent =
  "💾 Guardar";


  const status =
  document.createElement(
    "span"
  );


  status.className =
  "stock-status " +
  (
    currentStock <= 5
    ? "low"
    : "ok"
  );


  status.textContent =
  currentStock <= 5
  ? "⚠️ Stock bajo"
  : "✓ Stock normal";


  save.addEventListener(
    "click",
    async event => {

      event.stopPropagation();


      await saveStock(
        product,
        input,
        save,
        status
      );

    }
  );


  input.addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        save.click();

      }

    }
  );


  stockArea.append(
    label,
    input,
    save,
    status
  );


  element.appendChild(
    stockArea
  );


  /* ================================
     BOTONES RÁPIDOS
  ================================= */

  const actions =
  document.createElement(
    "div"
  );


  actions.className =
  "product-actions";


  const minus =
  document.createElement(
    "button"
  );


  minus.type =
  "button";

  minus.className =
  "quick-button";

  minus.textContent =
  "−1";


  minus.addEventListener(
    "click",
    () => {

      const value =
      Math.max(
        Number(input.value || 0) - 1,
        0
      );

      input.value =
      value;

    }
  );


  const plus =
  document.createElement(
    "button"
  );


  plus.type =
  "button";

  plus.className =
  "quick-button";

  plus.textContent =
  "+1";


  plus.addEventListener(
    "click",
    () => {

      const value =
      Number(input.value || 0) + 1;

      input.value =
      value;

    }
  );


  const plusFive =
  document.createElement(
    "button"
  );


  plusFive.type =
  "button";

  plusFive.className =
  "quick-button";

  plusFive.textContent =
  "+5";


  plusFive.addEventListener(
    "click",
    () => {

      const value =
      Number(input.value || 0) + 5;

      input.value =
      value;

    }
  );


  actions.append(
    minus,
    plus,
    plusFive
  );


  element.appendChild(
    actions
  );


  return element;

}


/* =========================================
   GUARDAR STOCK
========================================= */

async function saveStock(
  product,
  input,
  button,
  statusElement
){

  const newStock =
  Number(
    input.value
  );


  /* ================================
     VALIDACIÓN
  ================================= */

  if(
    !Number.isInteger(
      newStock
    ) ||
    newStock < 0
  ){

    showStatus(
      "❌ El stock debe ser un número entero mayor o igual a 0.",
      "error"
    );

    input.focus();

    return;

  }


  button.disabled =
  true;


  button.textContent =
  "Guardando...";


  clearStatus();


  try{

    /*
      ========================================
      ACTUALIZACIÓN DIRECTA EN SUPABASE
      ========================================

      Se actualiza:
      products.stock

      PERO además verificamos que:
      - el producto pertenezca al negocio actual
      - Supabase realmente haya guardado el valor
    */

    const result =
    await supabaseClient

      .from("products")

      .update({
        stock:
        newStock
      })

      .eq(
        "id",
        product.id
      )

      .eq(
        "business_id",
        BUSINESS_IDS[currentBusiness]
      )

      .select(
        "id,business_id,name,price,stock,active"
      )
      .single();


    if(result.error){

      throw result.error;

    }


    if(!result.data){

      throw new Error(
        "No se encontró el producto o no tienes permiso para modificarlo."
      );

    }


    const savedStock =
    Number(
      result.data.stock || 0
    );


    /*
      ========================================
      VERIFICACIÓN REAL
      ========================================
    */

    if(
      savedStock !==
      newStock
    ){

      throw new Error(
        "Supabase no confirmó el nuevo stock."
      );

    }


    /*
      Actualizamos el objeto local.
    */

    const index =
    products.findIndex(
      item =>
      item.id ===
      product.id
    );


    if(index !== -1){

      products[index] =
      result.data;

    }


    updateSummary();


    /*
      Actualizamos indicador.
    */

    statusElement.className =
    "stock-status " +
    (
      savedStock <= 5
      ? "low"
      : "ok"
    );


    statusElement.textContent =
    savedStock <= 5
    ? "⚠️ Stock bajo"
    : "✓ Stock normal";


    showStatus(
      "✅ Stock de " +
      result.data.name +
      " actualizado a " +
      savedStock +
      " unidades.",
      "ok"
    );


    /*
      ========================================
      IMPORTANTE

      NO recargamos toda la página.
      Así el cambio se ve inmediatamente.
      ========================================
    */


  }

  catch(error){

    console.error(
      "Error guardando stock:",
      error
    );


    showStatus(
      "❌ No se pudo guardar el stock de " +
      (
        product.name ||
        "producto"
      ) +
      ": " +
      (
        error.message ||
        error
      ),
      "error"
    );


  }

  finally{

    button.disabled =
    false;


    button.textContent =
    "💾 Guardar";

  }

}


/* =========================================
   BUSCADOR
========================================= */

$("search")
.addEventListener(
  "input",
  renderProducts
);


/* =========================================
   CAMBIO DE NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;


        if(
          business ===
          currentBusiness
        ){

          return;

        }


        currentBusiness =
        business;


        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          item =>
          item.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        $("search").value =
        "";


        await loadInventory();

      }
    );

  }
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refreshButton")
.addEventListener(
  "click",
  loadInventory
);


/* =========================================
   DASHBOARD
========================================= */

$("dashboardButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "dashboard.html";

  }
);


/* =========================================
   INICIO
========================================= */

loadInventory();

</script>

</body>
</html>
