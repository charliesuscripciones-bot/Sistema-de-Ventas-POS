<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inventario | Charlie Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

body{
  min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
  background:#111827;
  color:#fff;
  padding:calc(18px + env(safe-area-inset-top)) 20px 20px;
}

.header-inner{
  width:min(1100px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  flex:0 0 48px;
}

.brand-name{
  font-size:21px;
  font-weight:800;
  line-height:1.1;
}

.brand-subtitle{
  font-size:12px;
  opacity:.7;
  margin-top:3px;
}

.business-selector{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.business-btn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:10px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.business-btn.active{
  background:#fff;
  color:#111827;
}

/* =========================
   NAVIGATION
========================= */

.page-nav{
  width:min(1100px,calc(100% - 28px));
  margin:14px auto 0;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 0 3px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.page-nav::-webkit-scrollbar{
  display:none;
}

.page-nav button{
  flex:0 0 auto;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#111827;
  border-radius:12px;
  padding:10px 14px;
  font-weight:750;
  font-size:13px;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:.15s ease;
}

.page-nav button:hover{
  transform:translateY(-1px);
}

.page-nav button.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* =========================
   MAIN
========================= */

main{
  width:min(1100px,calc(100% - 28px));
  margin:18px auto 40px;
}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:16px;
}

.page-title h1{
  margin:0;
  font-size:28px;
  line-height:1;
}

.page-title p{
  margin:7px 0 0;
  color:#6b7280;
  font-size:14px;
}

/* =========================
   SUMMARY
========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}

.summary-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:15px;
  box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.summary-label{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.summary-value{
  margin-top:5px;
  font-size:25px;
  font-weight:850;
  color:#111827;
}

/* =========================
   CARDS
========================= */

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:17px;
  box-shadow:0 2px 7px rgba(0,0,0,.04);
  margin-bottom:16px;
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin:0 0 14px;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

button{
  font-family:inherit;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  font-size:13px;
  font-weight:750;
  cursor:pointer;
}

.btn-primary{
  background:#111827;
  color:#fff;
}

.btn-secondary{
  background:#f3f4f6;
  color:#111827;
}

.btn-success{
  background:#15803d;
  color:#fff;
}

.btn-danger{
  background:#b91c1c;
  color:#fff;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:relative;
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  outline:none;
}

.search-box input:focus{
  border-color:#111827;
}

/* =========================
   PRODUCTS
========================= */

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.product-card{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:14px;
  background:#fff;
}

.product-name{
  font-weight:800;
  font-size:15px;
  margin-bottom:8px;
}

.product-price{
  color:#6b7280;
  font-size:12px;
  margin-bottom:11px;
}

.stock-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stock{
  font-size:22px;
  font-weight:850;
}

.stock.low{
  color:#b91c1c;
}

.stock.ok{
  color:#15803d;
}

.stock-actions{
  display:flex;
  gap:5px;
}

.stock-actions button{
  border:1px solid #e5e7eb;
  background:#f9fafb;
  border-radius:8px;
  min-width:32px;
  height:32px;
  font-weight:800;
  cursor:pointer;
}

.stock-actions button:hover{
  background:#f3f4f6;
}

.manual-row{
  display:flex;
  gap:7px;
  margin-top:11px;
}

.manual-row input{
  width:75px;
  border:1px solid #e5e7eb;
  border-radius:9px;
  padding:8px;
  text-align:center;
  font-weight:700;
}

.manual-row button{
  flex:1;
}

/* =========================
   FILTERS
========================= */

.filters{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr 1fr;
  gap:9px;
}

.filters select,
.filters input{
  width:100%;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px;
  background:#fff;
  font-family:inherit;
  font-size:13px;
  outline:none;
}

/* =========================
   MOVEMENT HISTORY
========================= */

.movement-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.movement{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px 13px;
  background:#fff;
}

.movement-main{
  min-width:0;
}

.movement-product{
  font-weight:800;
  font-size:14px;
}

.movement-meta{
  color:#6b7280;
  font-size:12px;
  margin-top:4px;
}

.movement-right{
  text-align:right;
}

.movement-qty{
  font-size:17px;
  font-weight:850;
}

.movement-type{
  display:inline-block;
  margin-top:4px;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  padding:4px 7px;
  border-radius:7px;
  background:#f3f4f6;
  color:#374151;
}

.movement-type.in{
  background:#dcfce7;
  color:#166534;
}

.movement-type.sale{
  background:#fee2e2;
  color:#991b1b;
}

.movement-type.adjustment{
  background:#fef3c7;
  color:#92400e;
}

.movement-type.return{
  background:#dbeafe;
  color:#1e40af;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:30px 10px;
  font-size:14px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.modal-header h2{
  margin:0;
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#f3f4f6;
  font-size:20px;
  cursor:pointer;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
  color:#374151;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:11px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.form-group textarea{
  resize:vertical;
  min-height:75px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  background:#111827;
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
  z-index:2000;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.error{
  background:#b91c1c;
}

.toast.success{
  background:#166534;
}

/* =========================
   LOADING
========================= */

.loading{
  opacity:.55;
  pointer-events:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

  .summary-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:560px){

  header{
    padding-left:14px;
    padding-right:14px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .business-selector{
    justify-content:flex-end;
  }

  .brand-name{
    font-size:18px;
  }

  .brand-subtitle{
    font-size:10px;
  }

  .logo{
    width:42px;
    height:42px;
    flex-basis:42px;
  }

  .business-btn{
    font-size:11px;
    padding:7px 8px;
  }

  .page-nav{
    width:100%;
    margin-top:10px;
    padding-left:14px;
    padding-right:14px;
  }

  .page-nav button{
    padding:9px 11px;
    font-size:12px;
  }

  main{
    width:calc(100% - 20px);
    margin-top:15px;
  }

  .page-title{
    display:block;
  }

  .page-title h1{
    font-size:25px;
  }

  .summary-grid{
    gap:8px;
  }

  .summary-card{
    padding:12px;
  }

  .summary-value{
    font-size:22px;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .movement{
    grid-template-columns:1fr auto;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

/* =========================================================

/* =========================================================
   UTILIDADES
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showToast(
  message,
  type="success"
){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.className =
    `toast show ${type}`;

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{

      toast.className =
        "toast";

    },3000);

}


function localDateTime(){

  const now = new Date();

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"America/Hermosillo"
      }
    ).format(now);

  const time =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"America/Hermosillo",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    ).format(now);

  return {
    date,
    time
  };

}


function formatDateTime(value){

  if(!value) return "Sin fecha";

  const date =
    new Date(value);

  return date.toLocaleString(
    "es-MX",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function movementKey(type){

  const value =
    String(type || "")
      .trim()
      .toLowerCase();

  if([
    "in",
    "entrada",
    "entry"
  ].includes(value)){
    return "in";
  }

  if([
    "out",
    "sale",
    "salida",
    "venta"
  ].includes(value)){
    return "sale";
  }

  if([
    "adjustment",
    "ajuste"
  ].includes(value)){
    return "adjustment";
  }

  if([
    "return",
    "devolucion",
    "devolución"
  ].includes(value)){
    return "return";
  }

  return value;
}


function movementLabel(type){

  const key =
    movementKey(type);

  if(key === "in")
    return "Entrada";

  if(key === "sale")
    return "Salida";

  if(key === "adjustment")
    return "Ajuste";

  if(key === "return")
    return "Devolución";

  return type || "Movimiento";

}


function movementClass(type){

  return movementKey(type);

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function goTo(page){

  window.location.href =
    `${page}?business=${encodeURIComponent(currentBusiness)}`;

}


document
  .querySelectorAll(".page-nav button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>goTo(button.dataset.page)
    );

  });


/* =========================================================
   CAMBIO DE NEGOCIO
========================================================= */

function setBusinessButtons(){

  document
    .getElementById("btnBakeQuiri")
    .classList.toggle(
      "active",
      currentBusiness === "BakeQuiri"
    );

  document
    .getElementById("btnSpicyRoll")
    .classList.toggle(
      "active",
      currentBusiness === "SpicyRoll"
    );

}


async function changeBusiness(
  businessName
){

  if(!BUSINESSES[businessName])
    return;

  currentBusiness =
    businessName;

  currentBusinessId =
    BUSINESSES[businessName].id;

  localStorage.setItem(
    "charlie_shop_business",
    currentBusiness
  );

  window.history.replaceState(
    {},
    "",
    `${window.location.pathname}?business=${encodeURIComponent(currentBusiness)}`
  );

  setBusinessButtons();

  await loadData();

}


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function loadProducts(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select(
      "id,business_id,name,price,stock,active"
    )
    .eq(
      "business_id",
      currentBusinessId
    )
    .eq(
      "active",
      true
    )
    .order(
      "name",
      {ascending:true}
    );

  if(error){

    console.error(error);

    throw error;

  }

  products =
    data || [];

}


/* =========================================================
   CARGAR MOVIMIENTOS
========================================================= */

async function loadMovements(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("inventory_movements")
    .select(`
      id,
      business_id,
      product_id,
      quantity,
      movement_type,
      reference_id,
      created_at
    `)
    .eq(
      "business_id",
      currentBusinessId
    )
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(1000);

  if(error){

    console.error(error);

    throw error;

  }

  movements =
    data || [];

}


/* =========================================================
   CARGAR TODO
========================================================= */

async function loadData(){

  document.body.classList.add("loading");

  try{

    await Promise.all([
      loadProducts(),
      loadMovements()
    ]);

    businessLabel.textContent =
      `${currentBusiness} · Control de inventario`;

    renderSummary();

    renderProducts();

    populateHistoryProducts();

    renderMovements();

    populateEntryProducts();

  }catch(error){

    console.error(error);

    showToast(
      "No se pudo cargar el inventario.",
      "error"
    );

  }finally{

    document.body.classList.remove("loading");

  }

}


/* =========================================================
   RESUMEN
========================================================= */

function renderSummary(){

  const totalProducts =
    products.length;

  const totalUnits =
    products.reduce(
      (sum,p)=>
        sum + Number(p.stock || 0),
      0
    );

  const totalEntries =
    movements
      .filter(m=>
        movementKey(m.movement_type) === "in"
      )
      .reduce(
        (sum,m)=>
          sum + Math.abs(Number(m.quantity || 0)),
        0
      );

  document.getElementById(
    "summaryProducts"
  ).textContent =
    totalProducts;

  document.getElementById(
    "summaryUnits"
  ).textContent =
    totalUnits;

  document.getElementById(
    "summaryEntries"
  ).textContent =
    totalEntries;

  document.getElementById(
    "summaryMovements"
  ).textContent =
    movements.length;

}


/* =========================================================
   PRODUCTOS
========================================================= */

function renderProducts(){

  const search =
    productSearch.value
      .trim()
      .toLowerCase();

  const filtered =
    products.filter(product=>
      product.name
        .toLowerCase()
        .includes(search)
    );

  if(!filtered.length){

    productsGrid.innerHTML =
      `<div class="empty">
        No se encontraron productos.
      </div>`;

    return;

  }


  productsGrid.innerHTML =
    filtered.map(product=>{

      const stock =
        Number(product.stock || 0);

      const stockClass =
        stock <= 5
          ? "low"
          : "ok";

      return `

        <div
          class="product-card"
          data-product-id="${product.id}">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-price">
            $${Number(product.price || 0).toFixed(2)}
          </div>

          <div class="stock-row">

            <div class="stock ${stockClass}">
              ${stock}
            </div>

            <div class="stock-actions">

              <button
                title="Disminuir"
                onclick="changeManualStock('${product.id}',-1)">
                −
              </button>

              <button
                title="Aumentar"
                onclick="changeManualStock('${product.id}',1)">
                +
              </button>

              <button
                title="Aumentar 5"
                onclick="changeManualStock('${product.id}',5)">
                +5
              </button>

            </div>

          </div>


          <div class="manual-row">

            <input
              type="number"
              min="0"
              step="1"
              value="${stock}"
              id="manual-${product.id}">

            <button
              class="btn btn-secondary"
              onclick="saveManualStock('${product.id}')">
              Guardar
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   CAMBIOS MANUALES DE EXISTENCIA
========================================================= */

function changeManualStock(
  productId,
  amount
){

  const product =
    products.find(
      p=>p.id === productId
    );

  if(!product)
    return;

  const input =
    document.getElementById(
      `manual-${productId}`
    );

  if(!input)
    return;

  let value =
    Number(input.value || 0);

  value += Number(amount);

  if(value < 0)
    value = 0;

  input.value =
    value;

}


async function saveManualStock(
  productId
){

  const product =
    products.find(
      p=>p.id === productId
    );

  if(!product)
    return;

  const input =
    document.getElementById(
      `manual-${productId}`
    );

  const newStock =
    Number(input.value);

  if(
    !Number.isFinite(newStock) ||
    newStock < 0
  ){

    showToast(
      "La existencia no es válida.",
      "error"
    );

    return;

  }


  const oldStock =
    Number(product.stock || 0);

  const difference =
    newStock - oldStock;


  if(difference === 0){

    showToast(
      "La existencia no cambió."
    );

    return;

  }


  document.body.classList.add(
    "loading"
  );


  try{

    /*
      IMPORTANTE:

      Un cambio manual de existencia
      se registra como "adjustment".

      Ejemplo:

      5 → 8 = +3
      8 → 5 = -3
    */

    const {
      error:updateError
    } =
    await supabaseClient
      .from("products")
      .update({
        stock:newStock
      })
      .eq(
        "id",
        productId
      )
      .eq(
        "business_id",
        currentBusinessId
      );


    if(updateError)
      throw updateError;


    const {
      error:movementError
    } =
    await supabaseClient
      .from("inventory_movements")
      .insert({

        business_id:
          currentBusinessId,

        product_id:
          productId,

        quantity:
          difference,

        movement_type:
          "adjustment",

        reference_id:
          null

      });


    if(movementError)
      throw movementError;


    showToast(
      "Existencia actualizada."
    );

    await loadData();


  }catch(error){

    console.error(error);

    showToast(
      "No se pudo actualizar la existencia.",
      "error"
    );

  }finally{

    document.body.classList.remove(
      "loading"
    );

  }

}


/* =========================================================
   FILTRO PRODUCTOS
========================================================= */

productSearch.addEventListener(
  "input",
  renderProducts
);


/* =========================================================
   PRODUCTOS DEL HISTORIAL
========================================================= */

function populateHistoryProducts(){

  const current =
    historyProduct.value;

  historyProduct.innerHTML =
    `<option value="">
      Todos los productos
    </option>`;


  products.forEach(product=>{

    const option =
      document.createElement("option");

    option.value =
      product.id;

    option.textContent =
      product.name;

    historyProduct.appendChild(
      option
    );

  });


  if(
    products.some(
      p=>p.id === current
    )
  ){

    historyProduct.value =
      current;

  }

}


/* =========================================================
   PRODUCTOS MODAL
========================================================= */

function populateEntryProducts(){

  const current =
    entryProduct.value;

  entryProduct.innerHTML =
    `<option value="">
      Selecciona un producto
    </option>`;


  products.forEach(product=>{

    const option =
      document.createElement("option");

    option.value =
      product.id;

    option.textContent =
      `${product.name} · stock ${Number(product.stock || 0)}`;

    entryProduct.appendChild(
      option
    );

  });


  if(
    products.some(
      p=>p.id === current
    )
  ){

    entryProduct.value =
      current;

  }

}


/* =========================================================
   HISTORIAL
========================================================= */

function renderMovements(){

  let filtered =
    [...movements];


  const productId =
    historyProduct.value;

  const type =
    historyType.value;

  const date =
    historyDate.value;


  if(productId){

    filtered =
      filtered.filter(
        m=>m.product_id === productId
      );

  }


  if(type){

    filtered =
      filtered.filter(
        m=>
          movementKey(
            m.movement_type
          ) === type
      );

  }


  if(date){

    filtered =
      filtered.filter(m=>{

        const movementDate =
          new Date(
            m.created_at
          ).toLocaleDateString(
            "en-CA",
            {
              timeZone:
                "America/Hermosillo"
            }
          );

        return movementDate === date;

      });

  }


  if(!filtered.length){

    movementList.innerHTML =
      `<div class="empty">
        No hay movimientos con estos filtros.
      </div>`;

    return;

  }


  movementList.innerHTML =
    filtered.map(movement=>{

      const product =
        products.find(
          p=>p.id === movement.product_id
        );


      const quantity =
        Number(
          movement.quantity || 0
        );


      const key =
        movementKey(
          movement.movement_type
        );


      /*
        Para entradas y devoluciones
        mostramos +.

        Para ventas o ajustes negativos
        conservamos el signo.
      */

      let displayQuantity;

      if(
        key === "in" ||
        key === "return"
      ){

        displayQuantity =
          `+${Math.abs(quantity)}`;

      }else{

        displayQuantity =
          quantity > 0
            ? `+${quantity}`
            : `${quantity}`;

      }


      return `

        <div class="movement">

          <div class="movement-main">

            <div class="movement-product">
              ${escapeHtml(
                product
                  ? product.name
                  : "Producto"
              )}
            </div>

            <div class="movement-meta">
              ${formatDateTime(
                movement.created_at
              )}
            </div>

          </div>


          <div class="movement-right">

            <div class="movement-qty">
              ${displayQuantity}
            </div>

            <span
              class="movement-type ${movementClass(key)}">
              ${movementLabel(key)}
            </span>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   FILTROS

historyProduct.addEventListener(

/* =========================================================
   REGISTRAR ENTRADA
========================================================= */

document
  .getElementById("saveEntry")
  .addEventListener(
    "click",
    saveInventoryEntry
  );


async function saveInventoryEntry(){

  const productId =
    entryProduct.value;

  const quantity =
    Number(
      entryQuantity.value
    );

  const date =
    entryDate.value;

  const time =
    entryTime.value;


  if(!productId){

    showToast(
      "Selecciona un producto.",
      "error"
    );

    return;

  }


  if(
    !Number.isFinite(quantity) ||
    quantity <= 0
  ){

    showToast(
      "La cantidad debe ser mayor a 0.",
      "error"
    );

    return;

  }


  if(!date || !time){

    showToast(
      "Selecciona fecha y hora.",
      "error"
    );

    return;

  }


  /*
    La fecha/hora elegida por el usuario
    corresponde a Hermosillo.

    Se convierte a un ISO válido para
    timestamptz.
  */

  const createdAt =
    hermosilloDateTimeToISO(
      date,
      time
    );


  document.body.classList.add(
    "loading"
  );


  try{

    /*
      1. Registrar movimiento
    */

    const {
      error:movementError
    } =
    await supabaseClient
      .from("inventory_movements")
      .insert({

        business_id:
          currentBusinessId,

        product_id:
          productId,

        quantity:
          quantity,

        movement_type:
          "in",

        reference_id:
          null,

        created_at:
          createdAt

      });


    if(movementError)
      throw movementError;


    /*
      2. Actualizar stock actual
    */

    const product =
      products.find(
        p=>p.id === productId
      );


    const oldStock =
      Number(
        product?.stock || 0
      );


    const newStock =
      oldStock + quantity;


    const {
      error:stockError
    } =
    await supabaseClient
      .from("products")
      .update({
        stock:newStock
      })
      .eq(
        "id",
        productId
      )
      .eq(
        "business_id",
        currentBusinessId
      );


    if(stockError)
      throw stockError;


    closeEntry();

    showToast(
      `Entrada registrada: +${quantity} unidades.`
    );


    await loadData();


  }catch(error){

    console.error(error);

    showToast(
      "No se pudo registrar la entrada.",
      "error"
    );

  }finally{

    document.body.classList.remove(
      "loading"
    );

  }

}


/* =========================================================
   CONVERSIÓN FECHA/HORA HERMOSILLO
========================================================= */

function hermosilloDateTimeToISO(
  date,
  time
){

  /*
    Hermosillo usa UTC-7.

    Ejemplo:
    2026-10-04 23:00
    →
    2026-10-05T06:00:00.000Z
  */

  return `${date}T${time}:00-07:00`;

}

   INICIALIZACIÓN
========================================================= */

function initializeBusiness(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const businessParam =
    params.get("business");


  if(
    businessParam &&
    BUSINESSES[businessParam]
  ){

    currentBusiness =
      businessParam;

  }else{

    const saved =
      localStorage.getItem(
        "charlie_shop_business"
      );

    if(
      saved &&
      BUSINESSES[saved]
    ){

      currentBusiness =
        saved;

    }

  }


  currentBusinessId =
    BUSINESSES[
      currentBusiness
    ].id;


  setBusinessButtons();

}

   ARRANCAR
