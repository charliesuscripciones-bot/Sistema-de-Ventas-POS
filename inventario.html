<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario | Sistema de Ventas POS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f6f8;
  color:#171717;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.status{
  display:none;
  padding:13px 15px;
  border-radius:12px;
  margin-bottom:18px;
  font-weight:700;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.controls{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.businesses{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

button{
  border:0;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  min-height:46px;
  border-radius:12px;
  padding:10px 15px;
}

button:active{
  transform:scale(.98);
}

.business-btn{
  background:#fff;
  color:#2680eb;
  border:2px solid #ddd;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.add{
  background:#16a34a;
  color:#fff;
}

.refresh{
  background:#2563eb;
  color:#fff;
}

.back{
  background:#fff;
  color:#111827;
  border:2px solid #ddd;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.summary-title{
  color:#6b7280;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

.summary-value{
  font-size:29px;
  font-weight:800;
}

.products{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.products-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.products-header h2{
  margin:0;
  font-size:22px;
}

.search{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  margin-bottom:15px;
  outline:none;
}

.search:focus{
  border-color:#2563eb;
}

.product-list{
  display:grid;
  gap:12px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px;
  background:#fff;
}

.product.inactive{
  opacity:.55;
}

.product-main{
  display:grid;
  grid-template-columns:1.5fr .8fr .8fr;
  gap:15px;
  align-items:center;
}

.product-name{
  font-weight:800;
  font-size:17px;
}

.product-status{
  font-size:12px;
  margin-top:5px;
  font-weight:700;
}

.active-text{
  color:#16a34a;
}

.inactive-text{
  color:#dc2626;
}

.product-price{
  font-weight:800;
}

.stock{
  text-align:center;
  font-weight:800;
}

.stock-number{
  font-size:20px;
}

.stock-label{
  font-size:11px;
  color:#6b7280;
}

.stock-low{
  color:#dc2626;
}

.stock-ok{
  color:#16a34a;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.edit{
  background:#f59e0b;
  color:#fff;
}

.adjust{
  background:#7c3aed;
  color:#fff;
}

.toggle{
  background:#e5e7eb;
  color:#111827;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:450px;
  background:#fff;
  border-radius:20px;
  padding:23px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-card h2{
  margin:0 0 7px;
}

.modal-subtitle{
  color:#6b7280;
  margin-bottom:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  background:#fff;
}

.field input:focus,
.field select:focus{
  outline:none;
  border-color:#2563eb;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
}

.cancel{
  background:#e5e7eb;
  color:#111827;
}

.confirm{
  background:#16a34a;
  color:#fff;
}

.confirm:disabled{
  opacity:.6;
  cursor:wait;
}

.adjust-info{
  background:#f3f4f6;
  padding:13px;
  border-radius:12px;
  margin-bottom:16px;
  line-height:1.5;
}

@media(max-width:800px){

  .summary{
    grid-template-columns:1fr;
  }

  .product-main{
    grid-template-columns:1fr 1fr;
  }

  .product-name{
    grid-column:1 / -1;
  }

}

@media(max-width:600px){

  .container{
    padding:15px;
  }

  header{
    padding:22px 17px;
  }

  header h1{
    font-size:25px;
  }

  .actions{
    grid-template-columns:1fr 1fr;
  }

  .actions .back{
    grid-column:1 / -1;
  }

  .products{
    padding:15px;
  }

  .product-main{
    grid-template-columns:1fr 1fr;
  }

  .modal-buttons{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<header>
  <h1>📦 Inventario</h1>
  <p>Administración de productos y existencias</p>
</header>

<div class="container">

  <div id="status" class="status"></div>

  <div class="controls">

    <div class="businesses">

      <button
        type="button"
        class="business-btn active"
        data-business="BakeQuiri">
        🧁 BakeQuiri
      </button>

      <button
        type="button"
        class="business-btn"
        data-business="SpicyRoll">
        🍣 SpicyRoll
      </button>

    </div>

    <div class="actions">

      <button
        type="button"
        class="add"
        id="addProduct">
        ➕ Nuevo producto
      </button>

      <button
        type="button"
        class="refresh"
        id="refresh">
        🔄 Actualizar
      </button>

      <button
        type="button"
        class="back"
        id="back">
        ← Dashboard
      </button>

    </div>

  </div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-title">
        PRODUCTOS ACTIVOS
      </div>

      <div
        id="activeCount"
        class="summary-value">
        0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-title">
        UNIDADES EN INVENTARIO
      </div>

      <div
        id="totalStock"
        class="summary-value">
        0
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-title">
        STOCK BAJO
      </div>

      <div
        id="lowCount"
        class="summary-value">
        0
      </div>
    </div>

  </div>

  <div class="products">

    <div class="products-header">
      <h2 id="productsTitle">
        📋 Productos · BakeQuiri
      </h2>
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Buscar producto..."
      autocomplete="off"
    >

    <div id="productList">

      <div class="loading">
        Cargando productos...
      </div>

    </div>

  </div>

</div>


<!-- MODAL PRODUCTO -->

<div
  id="productModal"
  class="modal">

  <div class="modal-card">

    <h2 id="productModalTitle">
      ➕ Nuevo producto
    </h2>

    <div
      id="productModalSubtitle"
      class="modal-subtitle">
      Agrega un producto al inventario.
    </div>

    <div class="field">

      <label for="productName">
        Nombre del producto
      </label>

      <input
        id="productName"
        type="text"
        placeholder="Ej. Panquecito de Elote"
      >

    </div>

    <div class="field">

      <label for="productPrice">
        Precio
      </label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="25.00"
      >

    </div>

    <div class="field">

      <label for="productStock">
        Existencia inicial
      </label>

      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
        inputmode="numeric"
        placeholder="0"
      >

    </div>

    <div class="modal-buttons">

      <button
        type="button"
        class="cancel"
        id="cancelProduct">
        Cancelar
      </button>

      <button
        type="button"
        class="confirm"
        id="saveProduct">
        Guardar producto
      </button>

    </div>

  </div>

</div>


<!-- MODAL AJUSTE -->

<div
  id="adjustModal"
  class="modal">

  <div class="modal-card">

    <h2>
      📦 Ajustar inventario
    </h2>

    <div
      id="adjustSubtitle"
      class="modal-subtitle">
    </div>

    <div class="adjust-info">

      Existencia actual:

      <strong id="currentStock">
        0
      </strong>

      unidades

    </div>

    <div class="field">

      <label for="adjustType">
        Tipo de movimiento
      </label>

      <select id="adjustType">

        <option value="entrada">
          ➕ Entrada
        </option>

        <option value="salida">
          ➖ Salida
        </option>

        <option value="ajuste">
          🔄 Ajustar a cantidad exacta
        </option>

      </select>

    </div>

    <div class="field">

      <label for="adjustAmount">
        Cantidad
      </label>

      <input
        id="adjustAmount"
        type="number"
        min="0"
        step="1"
        inputmode="numeric"
        placeholder="0"
      >

    </div>

    <div class="modal-buttons">

      <button
        type="button"
        class="cancel"
        id="cancelAdjust">
        Cancelar
      </button>

      <button
        type="button"
        class="confirm"
        id="saveAdjust">
        Guardar movimiento
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";

let products = [];

let editingProduct = null;

let adjustingProduct = null;


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


function money(value){

  return "$" +
  Number(value || 0).toFixed(2);

}


function showStatus(
  message,
  type="ok"
){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================
   CARGAR INVENTARIO
========================================= */

async function loadInventory(){

  clearStatus();

  $("productList").innerHTML =
  '<div class="loading">Cargando productos...</div>';

  $("productsTitle").textContent =
  "📋 Productos · " +
  currentBusiness;

  try{

    const businessId =
    BUSINESS_IDS[currentBusiness];


    const result =
    await supabaseClient
    .from("products")
    .select(
      "id,business_id,name,price,stock,active"
    )
    .eq(
      "business_id",
      businessId
    )
    .order(
      "name",
      {
        ascending:true
      }
    );


    if(result.error){

      throw result.error;

    }


    products =
    result.data || [];


    updateSummary();

    renderProducts();

  }
  catch(error){

    console.error(
      "Error inventario:",
      error
    );

    $("productList").innerHTML =
    '<div class="empty">' +
    "No se pudo cargar el inventario." +
    "</div>";

    showStatus(
      "❌ Error al cargar inventario: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   RESUMEN
========================================= */

function updateSummary(){

  const active =
  products.filter(
    product =>
    product.active === true
  );

  const totalStock =
  active.reduce(
    (sum,product) =>
    sum +
    Number(product.stock || 0),
    0
  );

  const low =
  active.filter(
    product =>
    Number(product.stock || 0) <= 5
  );


  $("activeCount").textContent =
  active.length;

  $("totalStock").textContent =
  totalStock;

  $("lowCount").textContent =
  low.length;

}


/* =========================================
   RENDER PRODUCTOS
========================================= */

function renderProducts(){

  const container =
  $("productList");


  const query =
  $("search")
  .value
  .trim()
  .toLowerCase();


  let visible =
  products;


  if(query){

    visible =
    products.filter(
      product =>
      String(
        product.name || ""
      )
      .toLowerCase()
      .includes(query)
    );

  }


  if(!visible.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay productos que mostrar." +
    "</div>";

    return;

  }


  container.innerHTML =
  "";


  visible.forEach(
    product => {

      const element =
      document.createElement(
        "div"
      );

      element.className =
      "product" +
      (
        product.active
        ? ""
        : " inactive"
      );


      const main =
      document.createElement(
        "div"
      );

      main.className =
      "product-main";


      /* NOMBRE */

      const nameDiv =
      document.createElement(
        "div"
      );

      const name =
      document.createElement(
        "div"
      );

      name.className =
      "product-name";

      name.textContent =
      product.name ||
      "Sin nombre";


      const status =
      document.createElement(
        "div"
      );

      status.className =
      "product-status " +
      (
        product.active
        ? "active-text"
        : "inactive-text"
      );

      status.textContent =
      product.active
      ? "● Producto activo"
      : "● Producto inactivo";


      nameDiv.append(
        name,
        status
      );


      /* PRECIO */

      const price =
      document.createElement(
        "div"
      );

      price.className =
      "product-price";

      price.textContent =
      money(product.price);


      /* STOCK */

      const stock =
      document.createElement(
        "div"
      );

      stock.className =
      "stock";


      const stockNumber =
      document.createElement(
        "div"
      );

      stockNumber.className =
      "stock-number";


      const stockValue =
      Number(
        product.stock || 0
      );


      stockNumber.textContent =
      stockValue;


      if(stockValue <= 5){

        stockNumber.classList.add(
          "stock-low"
        );

      }
      else{

        stockNumber.classList.add(
          "stock-ok"
        );

      }


      const stockLabel =
      document.createElement(
        "div"
      );

      stockLabel.className =
      "stock-label";

      stockLabel.textContent =
      "UNIDADES";


      stock.append(
        stockNumber,
        stockLabel
      );


      main.append(
        nameDiv,
        price,
        stock
      );


      /* ACCIONES */

      const actions =
      document.createElement(
        "div"
      );

      actions.className =
      "product-actions";


      const edit =
      document.createElement(
        "button"
      );

      edit.type =
      "button";

      edit.className =
      "edit";

      edit.textContent =
      "✏️ Editar";

      edit.addEventListener(
        "click",
        () =>
        openProductModal(
          product
        )
      );


      const adjust =
      document.createElement(
        "button"
      );

      adjust.type =
      "button";

      adjust.className =
      "adjust";

      adjust.textContent =
      "📦 Ajustar stock";

      adjust.addEventListener(
        "click",
        () =>
        openAdjustModal(
          product
        )
      );


      const toggle =
      document.createElement(
        "button"
      );

      toggle.type =
      "button";

      toggle.className =
      "toggle";

      toggle.textContent =
      product.active
      ? "⏸️ Desactivar"
      : "▶️ Activar";


      toggle.addEventListener(
        "click",
        () =>
        toggleProduct(
          product
        )
      );


      actions.append(
        edit,
        adjust,
        toggle
      );


      element.append(
        main,
        actions
      );


      container.appendChild(
        element
      );

    }
  );

}


/* =========================================
   NUEVO / EDITAR PRODUCTO
========================================= */

function openProductModal(
  product=null
){

  editingProduct =
  product;


  $("productModalTitle").textContent =
  product
  ? "✏️ Editar producto"
  : "➕ Nuevo producto";


  $("productModalSubtitle").textContent =
  product
  ? "Modifica los datos del producto."
  : "Agrega un producto a " +
    currentBusiness +
    ".";


  $("productName").value =
  product?.name || "";


  $("productPrice").value =
  product
  ? Number(product.price || 0)
  : "";


  $("productStock").value =
  product
  ? Number(product.stock || 0)
  : "";


  $("productModal")
  .classList
  .add("open");


  setTimeout(
    () =>
    $("productName").focus(),
    100
  );

}


function closeProductModal(){

  editingProduct =
  null;

  $("productModal")
  .classList
  .remove("open");

}


/* =========================================
   GUARDAR PRODUCTO
========================================= */

async function saveProduct(){

  const name =
  $("productName")
  .value
  .trim();


  const price =
  Number(
    $("productPrice").value
  );


  const stock =
  Number(
    $("productStock").value
  );


  if(!name){

    showStatus(
      "❌ Escribe el nombre del producto.",
      "error"
    );

    return;

  }


  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    showStatus(
      "❌ Ingresa un precio válido.",
      "error"
    );

    return;

  }


  if(
    !Number.isInteger(stock) ||
    stock < 0
  ){

    showStatus(
      "❌ La existencia debe ser un número entero igual o mayor a 0.",
      "error"
    );

    return;

  }


  const button =
  $("saveProduct");

  button.disabled =
  true;


  try{

    const businessId =
    BUSINESS_IDS[currentBusiness];


    if(editingProduct){

      const result =
      await supabaseClient
      .from("products")
      .update({
        name:name,
        price:price,
        stock:stock
      })
      .eq(
        "id",
        editingProduct.id
      )
      .eq(
        "business_id",
        businessId
      );


      if(result.error){

        throw result.error;

      }


      closeProductModal();


      showStatus(
        "✅ Producto actualizado correctamente.",
        "ok"
      );

    }
    else{

      const result =
      await supabaseClient
      .from("products")
      .insert({
        business_id:businessId,
        name:name,
        price:price,
        stock:stock,
        active:true
      });


      if(result.error){

        throw result.error;

      }


      closeProductModal();


      showStatus(
        "✅ Producto creado correctamente en " +
        currentBusiness +
        ".",
        "ok"
      );

    }


    await loadInventory();

  }
  catch(error){

    console.error(
      "Error guardando producto:",
      error
    );


    showStatus(
      "❌ No se pudo guardar el producto: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    button.disabled =
    false;

  }

}


/* =========================================
   ACTIVAR / DESACTIVAR
========================================= */

async function toggleProduct(
  product
){

  const action =
  product.active
  ? "desactivar"
  : "activar";


  const confirmed =
  confirm(
    "¿Quieres " +
    action +
    ' el producto "' +
    product.name +
    '"?'
  );


  if(!confirmed){

    return;

  }


  try{

    const result =
    await supabaseClient
    .from("products")
    .update({
      active:
      !product.active
    })
    .eq(
      "id",
      product.id
    )
    .eq(
      "business_id",
      BUSINESS_IDS[currentBusiness]
    );


    if(result.error){

      throw result.error;

    }


    showStatus(
      product.active
      ? "⏸️ Producto desactivado."
      : "▶️ Producto activado.",
      "ok"
    );


    await loadInventory();

  }
  catch(error){

    console.error(
      "Error cambiando estado:",
      error
    );


    showStatus(
      "❌ No se pudo cambiar el estado: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   AJUSTAR STOCK
========================================= */

function openAdjustModal(
  product
){

  adjustingProduct =
  product;


  $("adjustSubtitle").textContent =
  product.name +
  " · " +
  currentBusiness;


  $("currentStock").textContent =
  Number(
    product.stock || 0
  );


  $("adjustType").value =
  "entrada";


  $("adjustAmount").value =
  "";


  $("adjustModal")
  .classList
  .add("open");


  setTimeout(
    () =>
    $("adjustAmount").focus(),
    100
  );

}


function closeAdjustModal(){

  adjustingProduct =
  null;

  $("adjustModal")
  .classList
  .remove("open");

}


/* =========================================
   GUARDAR AJUSTE
========================================= */

async function saveAdjust(){

  if(!adjustingProduct){

    return;

  }


  const type =
  $("adjustType").value;


  const amount =
  Number(
    $("adjustAmount").value
  );


  const currentStock =
  Number(
    adjustingProduct.stock || 0
  );


  if(
    !Number.isInteger(amount) ||
    amount < 0
  ){

    showStatus(
      "❌ La cantidad debe ser un número entero igual o mayor a 0.",
      "error"
    );

    return;

  }


  let newStock;


  if(type === "entrada"){

    if(amount <= 0){

      showStatus(
        "❌ La entrada debe ser mayor a 0.",
        "error"
      );

      return;

    }

    newStock =
    currentStock +
    amount;

  }
  else if(type === "salida"){

    if(amount <= 0){

      showStatus(
        "❌ La salida debe ser mayor a 0.",
        "error"
      );

      return;

    }

    newStock =
    currentStock -
    amount;


    if(newStock < 0){

      showStatus(
        "❌ No puedes sacar más unidades de las existentes.",
        "error"
      );

      return;

    }

  }
  else{

    newStock =
    amount;

  }


  const button =
  $("saveAdjust");

  button.disabled =
  true;


  try{

    const result =
    await supabaseClient
    .from("products")
    .update({
      stock:newStock
    })
    .eq(
      "id",
      adjustingProduct.id
    )
    .eq(
      "business_id",
      BUSINESS_IDS[currentBusiness]
    );


    if(result.error){

      throw result.error;

    }


    closeAdjustModal();


    showStatus(
      "✅ Inventario actualizado. " +
      adjustingProduct.name +
      ": " +
      newStock +
      " unidades.",
      "ok"
    );


    await loadInventory();

  }
  catch(error){

    console.error(
      "Error ajustando inventario:",
      error
    );


    showStatus(
      "❌ No se pudo actualizar el inventario: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }
  finally{

    button.disabled =
    false;

  }

}


/* =========================================
   BUSCADOR
========================================= */

$("search")
.addEventListener(
  "input",
  renderProducts
);


/* =========================================
   NUEVO PRODUCTO
========================================= */

$("addProduct")
.addEventListener(
  "click",
  () =>
  openProductModal()
);


/* =========================================
   GUARDAR PRODUCTO
========================================= */

$("saveProduct")
.addEventListener(
  "click",
  saveProduct
);


/* =========================================
   CANCELAR PRODUCTO
========================================= */

$("cancelProduct")
.addEventListener(
  "click",
  closeProductModal
);


/* =========================================
   AJUSTAR STOCK
========================================= */

$("saveAdjust")
.addEventListener(
  "click",
  saveAdjust
);


/* =========================================
   CANCELAR AJUSTE
========================================= */

$("cancelAdjust")
.addEventListener(
  "click",
  closeAdjustModal
);


/* =========================================
   CERRAR MODALES
========================================= */

$("productModal")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("productModal")
    ){

      closeProductModal();

    }

  }
);


$("adjustModal")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("adjustModal")
    ){

      closeAdjustModal();

    }

  }
);


/* =========================================
   ESC
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeProductModal();

      closeAdjustModal();

    }

  }
);


/* =========================================
   CAMBIO DE NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;


        if(
          business ===
          currentBusiness
        ){

          return;

        }


        currentBusiness =
        business;


        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          item =>
          item.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        $("search").value =
        "";


        await loadInventory();

      }
    );

  }
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refresh")
.addEventListener(
  "click",
  loadInventory
);


/* =========================================
   DASHBOARD
========================================= */

$("back")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "dashboard.html";

  }
);


/* =========================================
   INICIO
========================================= */

loadInventory();

</script>

</html>
