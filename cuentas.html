<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuentas pendientes</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .header {
      background: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .page-title {
      cursor: pointer;
      transition: opacity .15s ease, transform .15s ease;
      user-select: none;
    }

    .page-title:hover {
      opacity: .75;
    }

    .page-title:active {
      transform: scale(.99);
    }

    .header p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .business-switch {
      display: flex;
      gap: 8px;
    }

    .business-switch button {
      border: 0;
      padding: 9px 14px;
      border-radius: 10px;
      background: #e5e7eb;
      color: #374151;
      font-weight: 800;
      cursor: pointer;
    }

    .business-switch button.active {
      background: #111827;
      color: white;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .filters {
      background: white;
      padding: 15px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: 1fr 180px 180px;
      gap: 10px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #111827;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .summary-card .label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .summary-card .value {
      font-size: 24px;
      font-weight: 900;
    }

    .products-box {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .products-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .product-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .product-pill {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      color: #374151;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .product-quantity {
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
      color: #111827;
    }

    .sales-list {
      display: grid;
      gap: 12px;
    }

    .sale-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .sale-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .customer-name {
      font-size: 18px;
      font-weight: 900;
    }

    .sale-date {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    .sale-status {
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      background: #fef3c7;
      color: #92400e;
      white-space: nowrap;
    }

    .sale-info {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .info-box {
      background: #f9fafb;
      padding: 10px;
      border-radius: 10px;
    }

    .info-label {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 900;
    }

    .balance {
      color: #dc2626;
    }

    .paid {
      color: #059669;
    }

    .sale-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .sale-actions button {
      border: 0;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-detail {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-abono {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .btn-liquidar {
      background: #dcfce7;
      color: #166534;
    }

    .btn-whatsapp {
      background: #dcfce7;
      color: #15803d;
    }

    .btn-cancel {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 14px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      width: min(500px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.2);
    }

    .modal h2 {
      margin: 0 0 15px;
      font-size: 20px;
    }

    .modal label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 14px;
    }

    .modal textarea {
      resize: vertical;
      min-height: 90px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .modal-actions button {
      border: 0;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-close {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-confirm {
      background: #111827;
      color: white;
    }

    .payment-summary {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .payment-summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .payment-summary-row:last-child {
      margin-bottom: 0;
    }

    .payment-summary-row strong {
      font-size: 15px;
    }

    .history-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-item .history-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .history-item .history-amount {
      font-weight: 900;
    }

    .history-item .history-date {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }

    .product-detail {
      background: #f9fafb;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .product-detail-name {
      font-weight: 700;
    }

    .product-detail-qty {
      font-weight: 900;
      font-size: 16px;
    }

    @media (max-width: 800px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .business-switch {
        width: 100%;
      }

      .business-switch button {
        flex: 1;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .sale-info {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .header {
        padding: 15px;
      }

      .header h1 {
        font-size: 20px;
      }

      .sale-top {
        flex-direction: column;
      }

      .sale-info {
        grid-template-columns: 1fr 1fr;
      }

      .sale-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <h1
        class="page-title"
        onclick="goToPOS()"
        title="Regresar al POS">
        💳 Cuentas pendientes
      </h1>

      <p>
        Consulta, abona y liquida las cuentas de tus clientes.
      </p>
    </div>

    <div class="business-switch">
      <button
        id="businessBakeQuiri"
        onclick="changeBusiness('BakeQuiri')">
        BakeQuiri
      </button>

      <button
        id="businessSpicyRoll"
        onclick="changeBusiness('SpicyRoll')">
        SpicyRoll
      </button>
    </div>
  </div>

  <div class="container">

    <div class="filters">
      <input
        id="searchInput"
        type="text"
        placeholder="Buscar cliente..."
        oninput="renderSales()" />

      <input
        id="dateInput"
        type="date"
        onchange="renderSales()" />

      <select
        id="statusFilter"
        onchange="renderSales()">
        <option value="pending">Pendientes</option>
        <option value="paid">Liquidadas</option>
        <option value="all">Todas</option>
      </select>
    </div>

    <div class="summary">

      <div class="summary-card">
        <div class="label">Cuentas pendientes</div>
        <div
          id="pendingCount"
          class="value">
          0
        </div>
      </div>

      <div class="summary-card">
        <div class="label">Saldo pendiente</div>
        <div
          id="pendingBalance"
          class="value balance">
          $0.00
        </div>
      </div>

      <div class="summary-card">
        <div class="label">Total de cuentas</div>
        <div
          id="totalCount"
          class="value">
          0
        </div>
      </div>

    </div>

    <div class="products-box">

      <div class="products-title">
        Productos vendidos a crédito
      </div>

      <div
        id="productList"
        class="product-list">
      </div>

    </div>

    <div
      id="salesList"
      class="sales-list">

      <div class="loading">
        Cargando cuentas...
      </div>

    </div>

  </div>

  <!-- MODAL DETALLES -->

  <div
    id="detailModal"
    class="modal-overlay">

    <div class="modal">

      <h2>
        Detalle de cuenta
      </h2>

      <div id="detailContent"></div>

      <div class="modal-actions">

        <button
          class="btn-close"
          onclick="closeModal('detailModal')">
          Cerrar
        </button>

      </div>

    </div>

  </div>

  <!-- MODAL PAGO -->

  <div
    id="paymentModal"
    class="modal-overlay">

    <div class="modal">

      <h2>
        Registrar pago
      </h2>

      <div
        id="paymentSummary"
        class="payment-summary">
      </div>

      <label>
        Monto
      </label>

      <input
        id="paymentAmount"
        type="number"
        min="0"
        step="0.01"
        placeholder="0.00" />

      <label>
        Método de pago
      </label>

      <select id="paymentMethod">
      </select>

      <div class="modal-actions">

        <button
          class="btn-close"
          onclick="closeModal('paymentModal')">
          Cancelar
        </button>

        <button
          class="btn-confirm"
          onclick="confirmPayment()">
          Registrar pago
        </button>

      </div>

    </div>

  </div>

  <!-- MODAL CANCELACIÓN -->

  <div
    id="cancelModal"
    class="modal-overlay">

    <div class="modal">

      <h2>
        Cancelar venta
      </h2>

      <p
        id="cancelSaleInfo"
        style="font-size:13px;color:#6b7280;">
      </p>

      <label>
        Motivo de cancelación
      </label>

      <textarea
        id="cancelReason"
        placeholder="Escribe el motivo de la cancelación...">
      </textarea>

      <div class="modal-actions">

        <button
          class="btn-close"
          onclick="closeModal('cancelModal')">
          Regresar
        </button>

        <button
          class="btn-confirm"
          style="background:#dc2626;"
          onclick="confirmCancel()">
          Cancelar venta
        </button>

      </div>

    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {
  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"
};

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentBusiness = "BakeQuiri";
let sales = [];
let currentPaymentSale = null;
let currentCancelSale = null;


/* =========================
   REGRESAR AL POS
========================= */

function goToPOS() {
  window.location.href = "/";
}


/* =========================
   UTILIDADES
========================= */

function money(value) {

  return Number(value || 0).toLocaleString(
    "es-MX",
    {
      style: "currency",
      currency: "MXN"
    }
  );

}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatDate(value) {

  if (!value) return "Sin fecha";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Sin fecha";
  }

  return date.toLocaleString(
    "es-MX",
    {
      day: "2-digit",
      month: "2-digit",
      year: "2-digit",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }
  )
  .replace("a. m.", "a.m.")
  .replace("p. m.", "p.m.");

}


/* =========================
   CAMBIAR NEGOCIO
========================= */

function changeBusiness(business) {

  currentBusiness = business;

  document
    .getElementById("businessBakeQuiri")
    .classList.toggle(
      "active",
      business === "BakeQuiri"
    );

  document
    .getElementById("businessSpicyRoll")
    .classList.toggle(
      "active",
      business === "SpicyRoll"
    );

  loadSales();

}


/* =========================
   CARGAR VENTAS
========================= */

async function loadSales() {

  const salesList =
    document.getElementById("salesList");

  salesList.innerHTML =
    `<div class="loading">Cargando cuentas...</div>`;

  const businessId =
    BUSINESS_IDS[currentBusiness];


  const {
    data,
    error
  } = await supabaseClient

    .from("sales")

    .select(`
      *,
      customers (
        id,
        name,
        phone
      ),
      sale_items (
        id,
        quantity,
        unit_price,
        products (
          id,
          name
        )
      )
    `)

    .eq("business_id", businessId)

    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    salesList.innerHTML =
      `<div class="empty">
        No se pudieron cargar las cuentas.
      </div>`;

    return;
  }


  sales = data || [];

  renderSales();

}


/* =========================
   FILTRAR / MOSTRAR VENTAS
========================= */

function renderSales() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const selectedDate =
    document
      .getElementById("dateInput")
      .value;

  const status =
    document
      .getElementById("statusFilter")
      .value;


  let filtered =
    sales.filter(sale => {

      const customer =
        sale.customers?.name || "Cliente";

      const matchesSearch =
        !search ||
        customer
          .toLowerCase()
          .includes(search);


      let matchesDate = true;

      if (selectedDate) {

        const date =
          new Date(
            sale.created_at ||
            sale.sale_date
          );

        const localDate =
          date
            .toLocaleDateString(
              "en-CA"
            );

        matchesDate =
          localDate === selectedDate;

      }


      const balance =
        Number(sale.balance ?? 0);

      const isPaid =
        balance <= 0;


      let matchesStatus = true;

      if (status === "pending") {
        matchesStatus = !isPaid;
      }

      if (status === "paid") {
        matchesStatus = isPaid;
      }


      return (
        matchesSearch &&
        matchesDate &&
        matchesStatus
      );

    });


  renderSummary(filtered);

  renderProductSummary(filtered);

  renderSaleCards(filtered);

}


/* =========================
   RESUMEN
========================= */

function renderSummary(list) {

  const pending =
    list.filter(
      sale =>
        Number(sale.balance ?? 0) > 0
    );


  const pendingBalance =
    pending.reduce(
      (sum, sale) =>
        sum +
        Number(
          sale.balance ?? 0
        ),
      0
    );


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending.length;


  document.getElementById(
    "pendingBalance"
  ).textContent =
    money(pendingBalance);


  document.getElementById(
    "totalCount"
  ).textContent =
    list.length;

}


/* =========================
   PRODUCTOS A CRÉDITO
========================= */

function renderProductSummary(list) {

  const container =
    document.getElementById(
      "productList"
    );


  const quantities = {};


  list.forEach(sale => {

    const balance =
      Number(sale.balance ?? 0);

    if (balance <= 0) return;


    (sale.sale_items || [])
      .forEach(item => {

        const name =
          item.products?.name ||
          "Producto";

        const quantity =
          Number(item.quantity || 0);


        quantities[name] =
          (quantities[name] || 0) +
          quantity;

      });

  });


  const entries =
    Object.entries(
      quantities
    )
    .sort(
      (a,b) =>
        b[1] - a[1]
    );


  if (!entries.length) {

    container.innerHTML =
      `<span
        style="color:#9ca3af;font-size:13px;">
        No hay productos pendientes a crédito.
      </span>`;

    return;

  }


  container.innerHTML =
    entries
      .map(
        ([name, quantity]) =>

          `<span class="product-pill">
            <span>
              ${escapeHtml(name)}
            </span>

            <span class="product-quantity">
              × ${quantity}
            </span>
          </span>`

      )
      .join("");

}


/* =========================
   TARJETAS DE VENTA
========================= */

function renderSaleCards(list) {

  const container =
    document.getElementById(
      "salesList"
    );


  if (!list.length) {

    container.innerHTML =
      `<div class="empty">
        No hay cuentas para mostrar.
      </div>`;

    return;

  }


  container.innerHTML =
    list
      .map(
        sale => {

          const customer =
            sale.customers?.name ||
            "Cliente";

          const phone =
            sale.customers?.phone ||
            "";

          const total =
            Number(
              sale.total_amount ??
              sale.total ??
              0
            );

          const balance =
            Number(
              sale.balance ?? 0
            );

          const paid =
            Math.max(
              total - balance,
              0
            );

          const isPaid =
            balance <= 0;


          return `

            <div class="sale-card">

              <div class="sale-top">

                <div>

                  <div class="customer-name">
                    ${escapeHtml(customer)}
                  </div>

                  <div class="sale-date">
                    ${formatDate(
                      sale.created_at ||
                      sale.sale_date
                    )}
                  </div>

                </div>

                <div
                  class="sale-status"
                  style="
                    ${
                      isPaid
                        ? "background:#dcfce7;color:#166534;"
                        : ""
                    }
                  "
                >
                  ${
                    isPaid
                      ? "LIQUIDADA"
                      : "PENDIENTE"
                  }
                </div>

              </div>


              <div class="sale-info">

                <div class="info-box">

                  <div class="info-label">
                    Total
                  </div>

                  <div class="info-value">
                    ${money(total)}
                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Pagado
                  </div>

                  <div class="info-value paid">
                    ${money(paid)}
                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Saldo
                  </div>

                  <div
                    class="info-value ${
                      isPaid
                        ? "paid"
                        : "balance"
                    }"
                  >
                    ${money(balance)}
                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Productos
                  </div>

                  <div class="info-value">
                    ${(sale.sale_items || [])
                      .reduce(
                        (sum, item) =>
                          sum +
                          Number(
                            item.quantity || 0
                          ),
                        0
                      )}
                  </div>

                </div>

              </div>


              <div class="sale-actions">

                <button
                  class="btn-detail"
                  onclick="showDetails('${sale.id}')">
                  Ver detalle
                </button>


                ${
                  !isPaid
                    ? `
                      <button
                        class="btn-abono"
                        onclick="openPayment('${sale.id}', false)">
                        Abono
                      </button>

                      <button
                        class="btn-liquidar"
                        onclick="openPayment('${sale.id}', true)">
                        Liquidar
                      </button>
                    `
                    : ""
                }


                <button
                  class="btn-whatsapp"
                  onclick="sendWhatsApp('${sale.id}')">
                  WhatsApp
                </button>


                ${
                  !isPaid
                    ? `
                      <button
                        class="btn-cancel"
                        onclick="openCancel('${sale.id}')">
                        Cancelar
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   DETALLES
========================= */

function showDetails(id) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!sale) return;


  const customer =
    sale.customers?.name ||
    "Cliente";


  const items =
    sale.sale_items || [];


  let html = `

    <div class="payment-summary">

      <div class="payment-summary-row">
        <span>Cliente</span>
        <strong>
          ${escapeHtml(customer)}
        </strong>
      </div>

      <div class="payment-summary-row">
        <span>Total</span>
        <strong>
          ${money(
            sale.total_amount ??
            sale.total ??
            0
          )}
        </strong>
      </div>

      <div class="payment-summary-row">
        <span>Saldo</span>
        <strong>
          ${money(
            sale.balance ?? 0
          )}
        </strong>
      </div>

    </div>

    <h3 style="font-size:15px;margin:0 0 10px;">
      Productos
    </h3>
  `;


  if (!items.length) {

    html +=
      `<p style="color:#6b7280;font-size:13px;">
        No hay productos registrados.
      </p>`;

  } else {

    html +=
      items
        .map(item => {

          const name =
            item.products?.name ||
            "Producto";

          return `
            <div class="product-detail">

              <div class="product-detail-name">
                ${escapeHtml(name)}
              </div>

              <div class="product-detail-qty">
                × ${Number(
                  item.quantity || 0
                )}
              </div>

            </div>
          `;

        })
        .join("");

  }


  document.getElementById(
    "detailContent"
  ).innerHTML = html;


  openModal("detailModal");

}


/* =========================
   MODAL PAGO
========================= */

async function openPayment(id, liquidate) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!sale) return;


  currentPaymentSale =
    sale;


  const balance =
    Number(
      sale.balance ?? 0
    );


  document.getElementById(
    "paymentSummary"
  ).innerHTML = `

    <div class="payment-summary-row">
      <span>Cliente</span>
      <strong>
        ${escapeHtml(
          sale.customers?.name ||
          "Cliente"
        )}
      </strong>
    </div>

    <div class="payment-summary-row">
      <span>Saldo pendiente</span>
      <strong class="balance">
        ${money(balance)}
      </strong>
    </div>

  `;


  const amountInput =
    document.getElementById(
      "paymentAmount"
    );


  amountInput.value =
    liquidate
      ? balance.toFixed(2)
      : "";


  amountInput.max =
    balance.toFixed(2);


  await loadPaymentMethods();

  openModal("paymentModal");

}


/* =========================
   MÉTODOS DE PAGO
========================= */

async function loadPaymentMethods() {

  const select =
    document.getElementById(
      "paymentMethod"
    );


  select.innerHTML =
    `<option value="">
      Cargando...
    </option>`;


  const {
    data,
    error
  } = await supabaseClient

    .from("payment_methods")

    .select("*")

    .eq(
      "business_id",
      BUSINESS_IDS[currentBusiness]
    )

    .order(
      "name",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    select.innerHTML =
      `<option value="">
        Error al cargar métodos
      </option>`;

    return;

  }


  select.innerHTML =
    (data || [])
      .map(
        method => `

          <option
            value="${method.id}">
            ${escapeHtml(
              method.name
            )}
          </option>

        `
      )
      .join("");

}


/* =========================
   CONFIRMAR PAGO
========================= */

async function confirmPayment() {

  if (!currentPaymentSale) return;


  const amount =
    Number(
      document.getElementById(
        "paymentAmount"
      ).value
    );


  const paymentMethodId =
    document.getElementById(
      "paymentMethod"
    ).value;


  const currentBalance =
    Number(
      currentPaymentSale.balance ?? 0
    );


  if (!amount || amount <= 0) {

    alert(
      "Ingresa un monto válido."
    );

    return;

  }


  if (!paymentMethodId) {

    alert(
      "Selecciona un método de pago."
    );

    return;

  }


  if (amount > currentBalance + 0.01) {

    alert(
      "El pago no puede ser mayor al saldo pendiente."
    );

    return;

  }


  const {
    error
  } = await supabaseClient.rpc(
    "register_payment",
    {
      p_business_id:
        BUSINESS_IDS[currentBusiness],

      p_sale_id:
        currentPaymentSale.id,

      p_payment_method_id:
        paymentMethodId,

      p_amount:
        Number(
          amount.toFixed(2)
        )
    }
  );


  if (error) {

    console.error(error);

    alert(
      "No se pudo registrar el pago: " +
      error.message
    );

    return;

  }


  closeModal("paymentModal");

  await loadSales();

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(id) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!sale) return;


  const customer =
    sale.customers?.name ||
    "Cliente";


  const phone =
    sale.customers?.phone ||
    "";


  const balance =
    Number(
      sale.balance ?? 0
    );


  /*
    CUENTA LIQUIDADA
    ----------------
    CharlieShop se utiliza
    independientemente del negocio.
  */

  if (balance <= 0) {

    const total =
      Number(
        sale.total_amount ??
        sale.total ??
        0
      );


    const paymentDate =
      formatDate(
        sale.paid_at ||
        sale.payment_date ||
        sale.updated_at ||
        new Date()
      );


    const message =
`Hola ${customer} 👋

¡Gracias por tu pago! 💰

Te confirmamos que tu cuenta pendiente por ${money(total)} ha quedado LIQUIDADA correctamente. ✅

📅 Fecha de pago: ${paymentDate}

CharlieShop agradece mucho tu preferencia. 🙏
¡Esperamos atenderte nuevamente pronto! 😊`;


    openWhatsApp(
      phone,
      message
    );

    return;

  }


  /*
    CUENTA PENDIENTE
  */

  const saleDate =
    sale.created_at ||
    sale.sale_date;


  const formattedDate =
    formatDate(
      saleDate
    );


  const message =
`Hola ${customer} 👋

Te recordamos que tienes un saldo pendiente de ${money(balance)} correspondiente a tu cuenta del ${formattedDate}.

Cuando tengas oportunidad, ¿nos apoyas con tu pago? 💰
👤 Carlos Iván Rojas Márquez
🏦 Banco Clip
🪪 730969300008248726
*¡Muchas gracias!*🙏`;


  openWhatsApp(
    phone,
    message
  );

}


/* =========================
   ABRIR WHATSAPP
========================= */

function openWhatsApp(
  phone,
  message
) {

  let cleanPhone =
    String(phone || "")
      .replace(/\D/g, "");


  if (
    cleanPhone.length === 10
  ) {

    cleanPhone =
      "52" +
      cleanPhone;

  }


  if (!cleanPhone) {

    alert(
      "El cliente no tiene un número de teléfono registrado."
    );

    return;

  }


  const url =
    "https://wa.me/" +
    cleanPhone +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

}


/* =========================
   CANCELACIÓN
========================= */

function openCancel(id) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!sale) return;


  currentCancelSale =
    sale;


  document.getElementById(
    "cancelSaleInfo"
  ).textContent =

    `Cliente: ${
      sale.customers?.name ||
      "Cliente"
    } · Total: ${
      money(
        sale.total_amount ??
        sale.total ??
        0
      )
    }`;


  document.getElementById(
    "cancelReason"
  ).value = "";


  openModal("cancelModal");

}


/* =========================
   CONFIRMAR CANCELACIÓN
========================= */

async function confirmCancel() {

  if (!currentCancelSale) return;


  const reason =
    document.getElementById(
      "cancelReason"
    ).value.trim();


  if (!reason) {

    alert(
      "Escribe el motivo de la cancelación."
    );

    return;

  }


  const {
    error
  } = await supabaseClient.rpc(
    "cancel_sale_and_restore_inventory",
    {
      p_sale_id:
        currentCancelSale.id,

      p_cancel_reason:
        reason
    }
  );


  if (error) {

    console.error(error);

    alert(
      "No se pudo cancelar la venta: " +
      error.message
    );

    return;

  }


  closeModal("cancelModal");

  currentCancelSale = null;

  await loadSales();

}


/* =========================
   MODALES
========================= */

function openModal(id) {

  document
    .getElementById(id)
    .classList.add("show");

}


function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================
   ESCAPE
========================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Escape"
    ) {

      return;

    }


    [
      "detailModal",
      "paymentModal",
      "cancelModal"
    ]
    .forEach(
      closeModal
    );

  }
);


/* =========================
   INICIO
========================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    changeBusiness(
      "BakeQuiri"
    );

  }
);

</script>
