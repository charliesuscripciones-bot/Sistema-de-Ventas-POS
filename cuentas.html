<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuentas pendientes</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f7fa;
      color:#1f2937;
    }

    header{
      background:#111827;
      color:white;
      padding:18px;
    }

    header h1{
      margin:0;
      font-size:22px;
    }

    header p{
      margin:6px 0 0;
      opacity:.75;
      font-size:14px;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
    }

    .business-selector{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:600;
    }

    .business-button{
      background:#e5e7eb;
      color:#111827;
    }

    .business-button.active{
      background:#111827;
      color:white;
    }

    .refresh-button{
      background:#2563eb;
      color:white;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:20px;
    }

    .summary-card{
      background:white;
      border-radius:14px;
      padding:18px;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }

    .summary-card small{
      display:block;
      color:#6b7280;
      margin-bottom:6px;
    }

    .summary-card strong{
      font-size:24px;
    }

    .status{
      display:none;
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:15px;
      white-space:pre-line;
    }

    .status.show{
      display:block;
    }

    .status.ok{
      background:#dcfce7;
      color:#166534;
    }

    .status.error{
      background:#fee2e2;
      color:#991b1b;
    }

    .status.info{
      background:#dbeafe;
      color:#1e40af;
    }

    .table-wrapper{
      background:white;
      border-radius:14px;
      overflow:auto;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:750px;
    }

    th,
    td{
      padding:14px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
    }

    th{
      background:#f9fafb;
      font-size:13px;
      color:#6b7280;
    }

    td{
      font-size:14px;
    }

    .balance{
      font-weight:700;
      color:#dc2626;
    }

    .actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .pay-button{
      background:#16a34a;
      color:white;
    }

    .cancel-button{
      background:#dc2626;
      color:white;
    }

    .whatsapp-button{
      background:#25d366;
      color:white;
    }

    .empty{
      padding:35px;
      text-align:center;
      color:#6b7280;
    }

    .loading{
      padding:35px;
      text-align:center;
      color:#6b7280;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .modal.show{
      display:flex;
    }

    .modal-content{
      width:100%;
      max-width:480px;
      background:white;
      border-radius:16px;
      padding:22px;
      max-height:90vh;
      overflow:auto;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .modal-header h2{
      margin:0;
      font-size:20px;
    }

    .close{
      background:#e5e7eb;
      color:#111827;
      padding:7px 10px;
    }

    .customer-info{
      background:#f3f4f6;
      border-radius:10px;
      padding:12px;
      margin-bottom:15px;
    }

    .customer-info strong{
      display:block;
      margin-bottom:4px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:600;
      margin-bottom:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:9px;
      font-size:15px;
      margin-bottom:14px;
    }

    textarea{
      resize:vertical;
      min-height:100px;
    }

    .payment-methods{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:14px;
    }

    .payment-method{
      background:#f3f4f6;
      color:#111827;
      border:2px solid transparent;
    }

    .payment-method.selected{
      border-color:#2563eb;
      background:#dbeafe;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:5px;
    }

    .modal-actions .cancel-modal{
      background:#e5e7eb;
      color:#111827;
    }

    .modal-actions .confirm{
      background:#16a34a;
      color:white;
    }

    .modal-actions .confirm.cancel{
      background:#dc2626;
    }

    .payment-error{
      display:none;
      background:#fee2e2;
      color:#991b1b;
      padding:12px;
      border-radius:9px;
      margin-bottom:14px;
      white-space:pre-line;
      font-size:13px;
    }

    .payment-error.show{
      display:block;
    }

    @media(max-width:700px){

      .summary{
        grid-template-columns:1fr;
      }

      .topbar{
        align-items:stretch;
      }

      .business-selector{
        width:100%;
      }

      .business-button{
        flex:1;
      }

      .refresh-button{
        width:100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Cuentas pendientes</h1>
  <p>Consulta, abona, liquida o cancela cuentas.</p>
</header>

<div class="container">

  <div class="topbar">

    <div class="business-selector">

      <button
        class="business-button active"
        id="businessBakeQuiri"
        onclick="changeBusiness('BakeQuiri')">
        BakeQuiri
      </button>

      <button
        class="business-button"
        id="businessSpicyRoll"
        onclick="changeBusiness('SpicyRoll')">
        SpicyRoll
      </button>

    </div>

    <button
      class="refresh-button"
      onclick="loadSales()">
      ↻ Actualizar
    </button>

  </div>

  <div id="statusMessage" class="status"></div>

  <div class="summary">

    <div class="summary-card">
      <small>Cuentas pendientes</small>
      <strong id="pendingCount">0</strong>
    </div>

    <div class="summary-card">
      <small>Total pendiente</small>
      <strong id="pendingTotal">$0.00</strong>
    </div>

    <div class="summary-card">
      <small>Negocio</small>
      <strong id="currentBusinessLabel">BakeQuiri</strong>
    </div>

  </div>

  <div class="table-wrapper">

    <div id="loading" class="loading">
      Cargando cuentas...
    </div>

    <div id="empty" class="empty" style="display:none;">
      No hay cuentas pendientes.
    </div>

    <table id="accountsTable" style="display:none;">

      <thead>
        <tr>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Total</th>
          <th>Pagado</th>
          <th>Saldo</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="accountsBody"></tbody>

    </table>

  </div>

</div>


<!-- MODAL ABONO -->

<div
  id="paymentModal"
  class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>Registrar abono</h2>

      <button
        class="close"
        onclick="closeModal('paymentModal')">
        ✕
      </button>

    </div>

    <div
      id="paymentCustomerInfo"
      class="customer-info">
    </div>

    <div
      id="paymentError"
      class="payment-error">
    </div>

    <label for="paymentAmount">
      Cantidad a abonar
    </label>

    <input
      id="paymentAmount"
      type="number"
      step="0.01"
      min="0.01"
      placeholder="0.00">

    <label>
      Método de pago
    </label>

    <div
      id="paymentMethods"
      class="payment-methods">
    </div>

    <div class="modal-actions">

      <button
        class="cancel-modal"
        onclick="closeModal('paymentModal')">
        Cancelar
      </button>

      <button
        id="confirmPaymentButton"
        class="confirm"
        onclick="confirmPayment()">
        Abonar
      </button>

    </div>

  </div>

</div>


<!-- MODAL CANCELAR -->

<div
  id="cancelModal"
  class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>Cancelar cuenta</h2>

      <button
        class="close"
        onclick="closeModal('cancelModal')">
        ✕
      </button>

    </div>

    <div
      id="cancelCustomerInfo"
      class="customer-info">
    </div>

    <label for="cancelReason">
      Motivo de cancelación
    </label>

    <textarea
      id="cancelReason"
      placeholder="Escribe el motivo..."></textarea>

    <div class="modal-actions">

      <button
        class="cancel-modal"
        onclick="closeModal('cancelModal')">
        Regresar
      </button>

      <button
        id="confirmCancelButton"
        class="confirm cancel"
        onclick="confirmCancel()">
        Cancelar cuenta
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";


const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentBusiness = "BakeQuiri";

let sales = [];

let selectedSale = null;

let selectedPaymentMethod = null;

let selectedCancelSale = null;


/* =========================
   UTILIDADES
========================= */

function $(id){

  return document.getElementById(id);

}


function money(value){

  const number =
    Number(value) || 0;

  return number.toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showStatus(message,type="info"){

  const element =
    $("statusMessage");

  element.textContent =
    message;

  element.className =
    "status show "+type;

}


function closeModal(id){

  $(id).classList.remove("show");

}


function getSaleBalance(sale){

  const balance =
    Number(sale.balance);

  if(Number.isFinite(balance)){
    return Math.max(0,balance);
  }

  const total =
    Number(sale.total) || 0;

  const paid =
    Number(sale.paid) || 0;

  return Math.max(
    0,
    total-paid
  );

}


function getCustomerName(sale){

  if(sale.customer){

    return (
      sale.customer.name ||
      sale.customer.full_name ||
      sale.customer.fullName ||
      "Cliente"
    );

  }

  return (
    sale.customer_name ||
    sale.customerName ||
    "Cliente"
  );

}


function formatDate(date){

  if(!date){
    return "-";
  }

  try{

    return new Date(date)
      .toLocaleDateString(
        "es-MX",
        {
          day:"2-digit",
          month:"2-digit",
          year:"numeric"
        }
      );

  }catch{

    return "-";

  }

}


/* =========================
   CAMBIAR NEGOCIO
========================= */

function changeBusiness(business){

  currentBusiness =
    business;

  $("currentBusinessLabel")
    .textContent =
    business;

  $("businessBakeQuiri")
    .classList.toggle(
      "active",
      business === "BakeQuiri"
    );

  $("businessSpicyRoll")
    .classList.toggle(
      "active",
      business === "SpicyRoll"
    );

  loadSales();

}


/* =========================
   MÉTODOS DE PAGO
========================= */

async function loadPaymentMethods(){

  const businessId =
    BUSINESS_IDS[currentBusiness];

  const container =
    $("paymentMethods");

  container.innerHTML =
    "Cargando...";

  selectedPaymentMethod =
    null;

  const result =
    await supabaseClient
      .from("payment_methods")
      .select(
        "id,name,provider,active,business_id"
      )
      .eq(
        "business_id",
        businessId
      )
      .eq(
        "active",
        true
      )
      .order(
        "name",
        {
          ascending:true
        }
      );


  console.log(
    "MÉTODOS DE PAGO:",
    result
  );


  if(result.error){

    container.innerHTML =
      "<div style='color:#dc2626;'>"+
      "No fue posible cargar los métodos de pago."+
      "</div>";

    console.error(
      result.error
    );

    return;
  }


  if(!result.data ||
     result.data.length === 0){

    container.innerHTML =
      "<div style='color:#6b7280;'>"+
      "No hay métodos de pago disponibles."+
      "</div>";

    return;
  }


  container.innerHTML = "";


  result.data.forEach(method => {

    const button =
      document.createElement("button");

    button.type =
      "button";

    button.className =
      "payment-method";

    button.textContent =
      method.name;

    button.onclick =
      () => {

        selectedPaymentMethod =
          method;

        document
          .querySelectorAll(
            ".payment-method"
          )
          .forEach(
            item =>
              item.classList.remove(
                "selected"
              )
          );

        button.classList.add(
          "selected"
        );

      };


    container.appendChild(
      button
    );

  });

}


/* =========================
   CARGAR VENTAS
========================= */

async function loadSales(){

  $("loading")
    .style.display =
    "block";

  $("empty")
    .style.display =
    "none";

  $("accountsTable")
    .style.display =
    "none";


  const businessId =
    BUSINESS_IDS[currentBusiness];


  console.log(
    "CARGANDO VENTAS:",
    {
      currentBusiness,
      businessId
    }
  );


  try{

    const salesResult =
      await supabaseClient
        .from("sales")
        .select("*")
        .eq(
          "business_id",
          businessId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    console.log(
      "RESULTADO SALES:",
      salesResult
    );


    if(salesResult.error){
      throw salesResult.error;
    }


    sales =
      salesResult.data || [];


    /*
      Solo mostramos cuentas
      abiertas con saldo pendiente.
    */

    sales =
      sales.filter(
        sale =>
          sale.status !== "cancelled" &&
          getSaleBalance(sale) > 0.005
      );


    /*
      Cargar items para obtener
      información adicional si existe.
    */

    if(sales.length > 0){

      const saleIds =
        sales.map(
          sale => sale.id
        );


      const itemsResult =
        await supabaseClient
          .from("sale_items")
          .select("*")
          .in(
            "sale_id",
            saleIds
          );


      console.log(
        "RESULTADO SALE ITEMS:",
        itemsResult
      );


      if(!itemsResult.error){

        const items =
          itemsResult.data || [];


        sales =
          sales.map(
            sale => ({
              ...sale,

              items:
                items.filter(
                  item =>
                    item.sale_id === sale.id
                )

            })
          );

      }

    }


    renderSales();


  }catch(error){

    console.error(
      "ERROR CARGANDO CUENTAS:",
      error
    );

    showStatus(
      "No fue posible cargar las cuentas.\n\n"+
      "Código: "+(error.code || "N/D")+"\n"+
      "Mensaje: "+(error.message || error),
      "error"
    );

  }finally{

    $("loading")
      .style.display =
      "none";

  }

}


/* =========================
   RENDER
========================= */

function renderSales(){

  const body =
    $("accountsBody");

  body.innerHTML = "";


  let totalPending =
    0;


  sales.forEach(
    sale => {

      const balance =
        getSaleBalance(sale);

      totalPending +=
        balance;


      const customerName =
        getCustomerName(sale);


      const total =
        Number(sale.total) || 0;


      const paid =
        Math.max(
          0,
          total-balance
        );


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          <strong>
            ${escapeHtml(customerName)}
          </strong>
        </td>

        <td>
          ${formatDate(
            sale.created_at ||
            sale.date ||
            sale.sold_at
          )}
        </td>

        <td>
          ${money(total)}
        </td>

        <td>
          ${money(paid)}
        </td>

        <td class="balance">
          ${money(balance)}
        </td>

        <td>
          ${escapeHtml(
            sale.status || "open"
          )}
        </td>

        <td>

          <div class="actions">

            <button
              class="pay-button"
              onclick="openPaymentModal('${sale.id}')">
              Abonar
            </button>

            <button
              class="cancel-button"
              onclick="openCancelModal('${sale.id}')">
              Cancelar
            </button>

            <button
              class="whatsapp-button"
              onclick="sendWhatsApp('${sale.id}')">
              WhatsApp
            </button>

          </div>

        </td>

      `;


      body.appendChild(
        row
      );

    }
  );


  $("pendingCount")
    .textContent =
    sales.length;


  $("pendingTotal")
    .textContent =
    money(totalPending);


  if(sales.length === 0){

    $("empty")
      .style.display =
      "block";

    $("accountsTable")
      .style.display =
      "none";

  }else{

    $("empty")
      .style.display =
      "none";

    $("accountsTable")
      .style.display =
      "table";

  }

}


/* =========================
   ABRIR MODAL DE PAGO
========================= */

async function openPaymentModal(saleId){

  selectedSale =
    sales.find(
      sale =>
        sale.id === saleId
    );


  if(!selectedSale){
    return;
  }


  const customerName =
    getCustomerName(
      selectedSale
    );


  const balance =
    getSaleBalance(
      selectedSale
    );


  $("paymentCustomerInfo")
    .innerHTML = `

      <strong>
        ${escapeHtml(customerName)}
      </strong>

      <span>
        Saldo pendiente:
        <b>${money(balance)}</b>
      </span>

    `;


  $("paymentAmount")
    .value =
    balance.toFixed(2);


  $("paymentError")
    .textContent =
    "";

  $("paymentError")
    .className =
    "payment-error";


  $("confirmPaymentButton")
    .disabled =
    false;

  $("confirmPaymentButton")
    .textContent =
    "Abonar";


  await loadPaymentMethods();


  $("paymentModal")
    .classList.add("show");

}


/* =========================
   CONFIRMAR PAGO
========================= */

async function confirmPayment(){

  if(!selectedSale){
    return;
  }


  const balance =
    getSaleBalance(
      selectedSale
    );


  const amount =
    Number(
      $("paymentAmount").value
    );


  const errorElement =
    $("paymentError");


  errorElement.className =
    "payment-error";

  errorElement.textContent =
    "";


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    errorElement.textContent =
      "Ingresa una cantidad válida.";

    errorElement.className =
      "payment-error show";

    return;

  }


  if(
    amount >
    balance + 0.005
  ){

    errorElement.textContent =
      "El abono no puede ser mayor al saldo pendiente de "+
      money(balance)+".";

    errorElement.className =
      "payment-error show";

    return;

  }


  if(!selectedPaymentMethod){

    errorElement.textContent =
      "Selecciona un método de pago.";

    errorElement.className =
      "payment-error show";

    return;

  }


  const button =
    $("confirmPaymentButton");


  button.disabled =
    true;

  button.textContent =
    "Registrando...";


  try{

    /*
      ============================================
      DATOS DEL PAGO
      ============================================
    */

    const businessId =
      selectedSale.business_id ||
      BUSINESS_IDS[currentBusiness];


    const saleId =
      selectedSale.id;


    const customerId =
      selectedSale.customer_id ||
      null;


    const paymentMethodId =
      selectedPaymentMethod.id;


    const paymentAmount =
      Number(
        amount.toFixed(2)
      );


    /*
      Verificación de seguridad:
      el método de pago debe pertenecer
      al negocio seleccionado.
    */

    if(
      selectedPaymentMethod.business_id &&
      selectedPaymentMethod.business_id !== businessId
    ){

      throw new Error(
        "El método de pago seleccionado no pertenece al negocio actual."
      );

    }


    console.log(
      "================================"
    );

    console.log(
      "REGISTRANDO PAGO"
    );

    console.log({
      businessId,
      saleId,
      customerId,
      paymentMethodId,
      paymentAmount,
      currentBusiness
    });


    /*
      ============================================
      INSERT PAYMENT
      ============================================

      IMPORTANTE:
      payments.business_id es NOT NULL.

      Por eso se envía explícitamente.

      NO usamos .select() para que el INSERT
      no necesite una lectura posterior
      de la fila.
    */

    const paymentResult =
      await supabaseClient
        .from("payments")
        .insert({

          business_id:
            businessId,

          sale_id:
            saleId,

          customer_id:
            customerId,

          payment_method_id:
            paymentMethodId,

          amount:
            paymentAmount

        });


    console.log(
      "RESULTADO INSERT PAYMENT:",
      paymentResult
    );


    if(paymentResult.error){

      const error =
        paymentResult.error;


      throw new Error(

        "No fue posible registrar el pago.\n\n"+

        "Código: "+
        (error.code || "N/D")+"\n"+

        "Mensaje: "+
        (error.message || "N/D")+"\n"+

        "Detalle: "+
        (error.details || "N/D")+"\n"+

        "Sugerencia: "+
        (error.hint || "N/D")

      );

    }


    /*
      ============================================
      CALCULAR NUEVO SALDO
      ============================================
    */

    const newBalance =
      Math.max(
        0,
        Number(
          (
            balance -
            amount
          ).toFixed(2)
        )
      );


    const newStatus =
      newBalance <= 0.005
        ? "paid"
        : "open";


    console.log(
      "NUEVO SALDO:",
      newBalance
    );

    console.log(
      "NUEVO STATUS:",
      newStatus
    );


    /*
      ============================================
      ACTUALIZAR SALE
      ============================================
    */

    const saleUpdate =
      await supabaseClient
        .from("sales")
        .update({

          balance:
            newBalance,

          status:
            newStatus

        })
        .eq(
          "id",
          saleId
        )
        .eq(
          "business_id",
          businessId
        );


    console.log(
      "RESULTADO UPDATE SALE:",
      saleUpdate
    );


    if(saleUpdate.error){

      throw new Error(

        "El pago SÍ fue registrado en payments, "+
        "pero no fue posible actualizar la venta.\n\n"+

        "NO vuelvas a registrar este abono.\n\n"+

        "Código: "+
        (
          saleUpdate.error.code ||
          "N/D"
        )+"\n"+

        "Mensaje: "+
        (
          saleUpdate.error.message ||
          "N/D"
        )+"\n"+

        "Detalle: "+
        (
          saleUpdate.error.details ||
          "N/D"
        )+"\n"+

        "Sugerencia: "+
        (
          saleUpdate.error.hint ||
          "N/D"
        )

      );

    }


    /*
      ============================================
      TODO CORRECTO
      ============================================
    */

    closeModal(
      "paymentModal"
    );


    showStatus(

      newBalance <= 0.005

        ? "Cuenta liquidada correctamente."

        : "Abono registrado correctamente. Nuevo saldo: "+
          money(newBalance),

      "ok"

    );


    selectedSale =
      null;

    selectedPaymentMethod =
      null;


    await loadSales();


  }catch(error){

    console.error(
      "================================"
    );

    console.error(
      "ERROR COMPLETO REGISTRANDO ABONO:"
    );

    console.error(
      error
    );

    console.error(
      "================================"
    );


    errorElement.textContent =
      error.message ||
      "No fue posible registrar el abono.";


    errorElement.className =
      "payment-error show";


  }finally{

    button.disabled =
      false;

    button.textContent =
      "Abonar";

  }

}


/* =========================
   ABRIR CANCELACIÓN
========================= */

function openCancelModal(saleId){

  selectedCancelSale =
    sales.find(
      sale =>
        sale.id === saleId
    );


  if(!selectedCancelSale){
    return;
  }


  const customerName =
    getCustomerName(
      selectedCancelSale
    );


  const balance =
    getSaleBalance(
      selectedCancelSale
    );


  $("cancelCustomerInfo")
    .innerHTML = `

      <strong>
        ${escapeHtml(customerName)}
      </strong>

      <span>
        Saldo pendiente:
        <b>${money(balance)}</b>
      </span>

    `;


  $("cancelReason")
    .value =
    "";


  $("confirmCancelButton")
    .disabled =
    false;


  $("confirmCancelButton")
    .textContent =
    "Cancelar cuenta";


  $("cancelModal")
    .classList.add("show");

}


/* =========================
   CONFIRMAR CANCELACIÓN
========================= */

async function confirmCancel(){

  if(!selectedCancelSale){
    return;
  }


  const reason =
    $("cancelReason")
      .value
      .trim();


  if(!reason){

    showStatus(
      "Escribe un motivo de cancelación.",
      "error"
    );

    return;

  }


  const button =
    $("confirmCancelButton");


  button.disabled =
    true;

  button.textContent =
    "Cancelando...";


  try{

    const businessId =
      selectedCancelSale.business_id ||
      BUSINESS_IDS[currentBusiness];


    const saleId =
      selectedCancelSale.id;


    console.log(
      "================================"
    );

    console.log(
      "CANCELANDO VENTA"
    );

    console.log({

      saleId,

      businessId,

      currentBusiness,

      reason

    });


    /*
      Actualizamos únicamente la venta
      que pertenece al negocio actual.
    */

    const result =
      await supabaseClient
        .from("sales")
        .update({

          status:
            "cancelled",

          cancellation_reason:
            reason

        })
        .eq(
          "id",
          saleId
        )
        .eq(
          "business_id",
          businessId
        );


    console.log(
      "RESULTADO CANCELACIÓN:",
      result
    );


    if(result.error){

      const error =
        result.error;


      throw new Error(

        "No fue posible cancelar la cuenta.\n\n"+

        "Código: "+
        (error.code || "N/D")+"\n"+

        "Mensaje: "+
        (error.message || "N/D")+"\n"+

        "Detalle: "+
        (error.details || "N/D")+"\n"+

        "Sugerencia: "+
        (error.hint || "N/D")

      );

    }


    /*
      Supabase puede devolver data null
      cuando no usamos .select().
      Por eso aquí solamente verificamos
      si existe error.
    */


    closeModal(
      "cancelModal"
    );


    showStatus(
      "Cuenta cancelada correctamente.",
      "ok"
    );


    selectedCancelSale =
      null;


    await loadSales();


  }catch(error){

    console.error(
      "ERROR CANCELANDO CUENTA:",
      error
    );


    showStatus(

      error.message ||
      "No fue posible cancelar la cuenta.",

      "error"

    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Cancelar cuenta";

  }

}
