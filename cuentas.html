<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas por cobrar | Sistema de Ventas POS</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111827;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  font-size:17px;
  opacity:.75;
  margin-top:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 20px 40px;
}

.status{
  display:none;
  margin-bottom:18px;
  padding:15px;
  border-radius:12px;
  font-weight:700;
}

.status.ok{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.businesses{
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.business-btn,
.dashboard-btn,
.refresh-btn{
  border:2px solid #ddd;
  padding:13px 20px;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.business-btn{
  color:#2680eb;
}

.business-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.refresh-btn{
  background:#2680eb;
  color:#fff;
  border-color:#2680eb;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-label{
  color:#6b7280;
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
}

.summary-value{
  font-size:30px;
  font-weight:800;
}

.summary-card.pending .summary-value{
  color:#dc2626;
}

.summary-card.clients .summary-value{
  color:#2563eb;
}

.summary-card.sales .summary-value{
  color:#d97706;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.card h2{
  font-size:24px;
  margin-bottom:18px;
}

.search{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  margin-bottom:18px;
  outline:none;
}

.search:focus{
  border-color:#2680eb;
}

.customer{
  border:2px solid #eee;
  border-radius:16px;
  margin-bottom:15px;
  overflow:hidden;
}

.customer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  cursor:pointer;
  background:#fff;
}

.customer-header:hover{
  background:#fafafa;
}

.customer-name{
  font-size:19px;
  font-weight:800;
}

.customer-contact{
  color:#6b7280;
  font-size:14px;
  margin-top:5px;
}

.customer-balance{
  font-size:22px;
  font-weight:800;
  color:#dc2626;
  white-space:nowrap;
}

.customer-body{
  display:none;
  border-top:1px solid #eee;
  padding:18px;
  background:#fafafa;
}

.customer.open .customer-body{
  display:block;
}

.sale{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  margin-bottom:12px;
}

.sale:last-child{
  margin-bottom:0;
}

.sale-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.sale-date{
  font-weight:700;
}

.sale-total{
  font-weight:800;
}

.sale-details{
  color:#6b7280;
  font-size:14px;
  margin-top:6px;
}

.sale-balance{
  margin-top:10px;
  font-size:17px;
  font-weight:800;
  color:#dc2626;
}

.sale-paid{
  margin-top:6px;
  font-size:14px;
  color:#16a34a;
  font-weight:700;
}

.sale-actions{
  margin-top:13px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pay-button{
  border:none;
  background:#16a34a;
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

.pay-button:disabled{
  opacity:.6;
  cursor:wait;
}

.history-button{
  border:none;
  background:#e5e7eb;
  color:#111827;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.history{
  display:none;
  margin-top:13px;
  border-top:1px solid #eee;
  padding-top:13px;
}

.history.visible{
  display:block;
}

.history-title{
  font-weight:800;
  margin-bottom:8px;
  color:#111827;
}

.payment-history-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  color:#4b5563;
  font-size:14px;
}

.payment-history-item:last-child{
  border-bottom:none;
}

.payment-history-item strong{
  color:#16a34a;
  white-space:nowrap;
}

.history-total{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  padding-top:10px;
  border-top:2px solid #ddd;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px 10px;
}

.loading{
  text-align:center;
  color:#777;
  padding:25px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-card h2{
  margin-bottom:8px;
}

.modal-subtitle{
  color:#6b7280;
  margin-bottom:20px;
  line-height:1.4;
}

.balance-box{
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  border-radius:12px;
  padding:13px;
  margin-bottom:18px;
  font-weight:700;
}

.balance-box strong{
  display:block;
  font-size:21px;
  margin-top:3px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:11px;
  font-size:16px;
  background:#fff;
}

.field input:focus,
.field select:focus{
  outline:none;
  border-color:#2680eb;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:11px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.confirm-payment{
  background:#16a34a;
  color:#fff;
}

.cancel-payment{
  background:#e5e7eb;
  color:#111827;
}

.confirm-payment:disabled{
  opacity:.6;
  cursor:wait;
}

@media(max-width:800px){

  .summary{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .container{
    padding:18px 15px 35px;
  }

  .customer-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .customer-balance{
    font-size:20px;
  }

  .sale-top{
    flex-direction:column;
  }

  .modal-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   NEGOCIOS
========================================= */

const BUSINESS_IDS = {

  BakeQuiri:
  "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
  "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


let currentBusiness =
"BakeQuiri";

let customers = [];

let sales = [];

let selectedSale = null;

let paymentMethods = [];


/* =========================================
   UTILIDADES
========================================= */

const $ =
id =>
document.getElementById(id);


function money(value){

  return "$" +
  Number(value || 0).toFixed(2);

}


/* =========================================
   FECHAS Y HORAS
   ZONA HORARIA: HERMOSILLO, SONORA
========================================= */

const HERMOSILLO_TIMEZONE =
"America/Hermosillo";


function formatDate(value){

  if(!value){
    return "Sin fecha";
  }

  const date =
  new Date(value);

  if(
    isNaN(
      date.getTime()
    )
  ){

    return "Sin fecha";

  }

  return date
  .toLocaleDateString(
    "es-MX",
    {
      timeZone:HERMOSILLO_TIMEZONE,
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function formatDateTime(value){

  if(!value){
    return "Sin fecha";
  }

  const date =
  new Date(value);

  if(
    isNaN(
      date.getTime()
    )
  ){

    return "Sin fecha";

  }

  return date
  .toLocaleString(
    "es-MX",
    {
      timeZone:HERMOSILLO_TIMEZONE,
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    }
  );

}


function showStatus(
  message,
  type="ok"
){

  $("status").textContent =
  message;

  $("status").className =
  "status " + type;

}


function clearStatus(){

  $("status").textContent =
  "";

  $("status").className =
  "status";

}


/* =========================================
   CARGAR MÉTODOS DE PAGO
========================================= */

async function loadPaymentMethods(){

  const businessId =
  BUSINESS_IDS[currentBusiness];


  const result =
  await supabaseClient
  .from("payment_methods")
  .select(
    "id,name,provider,active,business_id"
  )
  .eq(
    "business_id",
    businessId
  )
  .eq(
    "active",
    true
  )
  .order(
    "name",
    {
      ascending:true
    }
  );


  if(result.error){

    throw result.error;

  }


  paymentMethods =
  result.data || [];


  const select =
  $("paymentMethod");


  select.innerHTML =
  '<option value="">Selecciona un método</option>';


  paymentMethods.forEach(
    method => {

      const option =
      document.createElement(
        "option"
      );

      option.value =
      method.id;

      option.textContent =
      method.name;

      select.appendChild(
        option
      );

    }
  );


  if(!paymentMethods.length){

    console.warn(
      "No existen métodos de pago activos para:",
      currentBusiness
    );

  }

}


/* =========================================
   CARGAR CLIENTES Y VENTAS
========================================= */

async function loadAccounts(){

  clearStatus();


  $("accounts").innerHTML =
  '<div class="loading">Cargando cuentas...</div>';


  try{

    const businessId =
    BUSINESS_IDS[currentBusiness];


    /* =====================================
       VENTAS ABIERTAS CON SALDO
       
       IMPORTANTE:
       Primero obtenemos las ventas.
       El customer_id de cada venta es
       la referencia REAL del cliente.
    ===================================== */

    const salesResult =
    await supabaseClient
    .from("sales")
    .select(
      "id,business_id,customer_id,total,balance,status,created_at,sale_date"
    )
    .eq(
      "business_id",
      businessId
    )
    .eq(
      "status",
      "open"
    )
    .gt(
      "balance",
      0
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


    if(salesResult.error){

      throw salesResult.error;

    }


    sales =
    salesResult.data || [];


    /* =====================================
       CLIENTES

       Ya NO filtramos customers por
       business_id.

       Buscamos exactamente los clientes
       que aparecen en customer_id de las
       ventas pendientes.
    ===================================== */

    const customerIds =
    [
      ...new Set(
        sales
        .map(
          sale =>
          sale.customer_id
        )
        .filter(Boolean)
      )
    ];


    customers = [];


    if(customerIds.length){

      const customersResult =
      await supabaseClient
      .from("customers")
      .select(
        "id,business_id,name,phone"
      )
      .in(
        "id",
        customerIds
      );


      if(customersResult.error){

        throw customersResult.error;

      }


      customers =
      customersResult.data || [];

    }


    await loadPaymentMethods();


    $("totalSales").textContent =
    sales.length;


    $("totalPending").textContent =
    money(
      sales.reduce(
        (sum,sale) =>
        sum +
        Number(
          sale.balance || 0
        ),
        0
      )
    );


    $("totalClients").textContent =
    new Set(
      sales
      .map(
        sale =>
        sale.customer_id
      )
      .filter(Boolean)
    ).size;


    renderAccounts();

  }

  catch(error){

    console.error(
      "Error cargando cuentas:",
      error
    );


    $("accounts").innerHTML =
    '<div class="empty">' +
    "No se pudieron cargar las cuentas." +
    "</div>";


    showStatus(
      "❌ Error al cargar cuentas: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/* =========================================
   RENDERIZAR
========================================= */

function renderAccounts(){

  const container =
  $("accounts");


  const query =
  $("search")
  .value
  .trim()
  .toLowerCase();


  let visibleSales =
  sales;


  if(query){

    visibleSales =
    sales.filter(
      sale => {

        const customer =
        customers.find(
          item =>
          item.id ===
          sale.customer_id
        );


        const text =
        [
          customer?.name,
          customer?.phone
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


        return text.includes(
          query
        );

      }
    );

  }


  if(!visibleSales.length){

    container.innerHTML =
    '<div class="empty">' +
    "No hay cuentas pendientes." +
    "</div>";

    return;

  }


  const grouped =
  new Map();


  visibleSales.forEach(
    sale => {

      const customer =
      customers.find(
        item =>
        item.id ===
        sale.customer_id
      );


      const key =
      sale.customer_id ||
      "sin-cliente-" +
      sale.id;


      if(!grouped.has(key)){

        grouped.set(
          key,
          {
            customer,
            sales:[]
          }
        );

      }


      grouped
      .get(key)
      .sales
      .push(sale);

    }
  );


  container.innerHTML =
  "";


  grouped.forEach(
    group => {

      const customer =
      group.customer;


      const customerTotal =
      group.sales.reduce(
        (sum,sale) =>
        sum +
        Number(
          sale.balance || 0
        ),
        0
      );


      const customerElement =
      document.createElement(
        "div"
      );


      customerElement.className =
      "customer";


      const header =
      document.createElement(
        "div"
      );


      header.className =
      "customer-header";


      const left =
      document.createElement(
        "div"
      );


      const name =
      document.createElement(
        "div"
      );


      name.className =
      "customer-name";


      name.textContent =
      customer?.name ||
      "Cliente sin nombre";


      const contact =
      document.createElement(
        "div"
      );


      contact.className =
      "customer-contact";


      contact.textContent =
      customer?.phone ||
      "Sin teléfono";


      left.append(
        name,
        contact
      );


      const balance =
      document.createElement(
        "div"
      );


      balance.className =
      "customer-balance";


      balance.textContent =
      money(customerTotal);


      header.append(
        left,
        balance
      );


      const body =
      document.createElement(
        "div"
      );


      body.className =
      "customer-body";


      group.sales.forEach(
        sale => {

          body.appendChild(
            createSaleElement(
              sale
            )
          );

        }
      );


      header.addEventListener(
        "click",
        () => {

          customerElement.classList.toggle(
            "open"
          );

        }
      );


      customerElement.append(
        header,
        body
      );


      container.appendChild(
        customerElement
      );

    }
  );

}


/* =========================================
   CREAR VENTA
========================================= */

function createSaleElement(
  sale
){

  const element =
  document.createElement(
    "div"
  );


  element.className =
  "sale";


  const top =
  document.createElement(
    "div"
  );


  top.className =
  "sale-top";


  const date =
  document.createElement(
    "div"
  );


  date.className =
  "sale-date";


  date.textContent =
  "Venta · " +
  formatDate(
    sale.sale_date ||
    sale.created_at
  );


  const total =
  document.createElement(
    "div"
  );


  total.className =
  "sale-total";


  total.textContent =
  "Total " +
  money(sale.total);


  top.append(
    date,
    total
  );


  const details =
  document.createElement(
    "div"
  );


  details.className =
  "sale-details";


  details.textContent =
  "Estado: Pendiente";


  const balance =
  document.createElement(
    "div"
  );


  balance.className =
  "sale-balance";


  balance.textContent =
  "Saldo pendiente: " +
  money(sale.balance);


  const paid =
  document.createElement(
    "div"
  );


  paid.className =
  "sale-paid";


  const paidAmount =
  Math.max(
    Number(sale.total || 0) -
    Number(sale.balance || 0),
    0
  );


  paid.textContent =
  "Total abonado: " +
  money(paidAmount);


  const actions =
  document.createElement(
    "div"
  );


  actions.className =
  "sale-actions";


  const payButton =
  document.createElement(
    "button"
  );


  payButton.type =
  "button";

  payButton.className =
  "pay-button";

  payButton.textContent =
  "💵 Registrar abono";


  payButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      openPaymentModal(
        sale
      );

    }
  );


  const historyButton =
  document.createElement(
    "button"
  );


  historyButton.type =
  "button";

  historyButton.className =
  "history-button";

  historyButton.textContent =
  "📋 Historial de pagos";


  const history =
  document.createElement(
    "div"
  );


  history.className =
  "history";


  historyButton.addEventListener(
    "click",
    async event => {

      event.stopPropagation();


      history.classList.toggle(
        "visible"
      );


      if(
        history.classList.contains(
          "visible"
        )
      ){

        history.innerHTML =
        '<div class="loading">' +
        "Cargando historial..." +
        "</div>";


        await loadPaymentHistory(
          sale.id,
          history
        );

      }

    }
  );


  actions.append(
    payButton,
    historyButton
  );


  element.append(
    top,
    details,
    balance,
    paid,
    actions,
    history
  );


  return element;

}


/* =========================================
   HISTORIAL
========================================= */

async function loadPaymentHistory(
  saleId,
  container
){

  try{

    const result =
    await supabaseClient
    .from("payments")
    .select(
      "id,sale_id,business_id,payment_method_id,amount,paid_at"
    )
    .eq(
      "sale_id",
      saleId
    )
    .order(
      "paid_at",
      {
        ascending:true
      }
    );


    if(result.error){

      throw result.error;

    }


    const paymentRows =
    result.data || [];


    if(!paymentRows.length){

      container.innerHTML =
      '<div class="empty">' +
      "No hay pagos registrados para esta venta." +
      "</div>";

      return;

    }


    const totalPaid =
    paymentRows.reduce(
      (sum,payment) =>
      sum +
      Number(
        payment.amount || 0
      ),
      0
    );


    container.innerHTML =
    "";


    const title =
    document.createElement(
      "div"
    );


    title.className =
    "history-title";


    title.textContent =
    "Todos los abonos registrados";


    container.appendChild(
      title
    );


    paymentRows.forEach(
      payment => {

        const row =
        document.createElement(
          "div"
        );


        row.className =
        "payment-history-item";


        const left =
        document.createElement(
          "span"
        );


        const method =
        paymentMethods.find(
          item =>
          item.id ===
          payment.payment_method_id
        );


        left.textContent =
        formatDateTime(
          payment.paid_at
        ) +
        " · " +
        (
          method?.name ||
          "Pago"
        );


        const right =
        document.createElement(
          "strong"
        );


        right.textContent =
        money(
          payment.amount
        );


        row.append(
          left,
          right
        );


        container.appendChild(
          row
        );

      }
    );


    const totalRow =
    document.createElement(
      "div"
    );


    totalRow.className =
    "history-total";


    const totalLabel =
    document.createElement(
      "span"
    );


    totalLabel.textContent =
    "Total abonado";


    const totalValue =
    document.createElement(
      "span"
    );


    totalValue.textContent =
    money(totalPaid);


    totalRow.append(
      totalLabel,
      totalValue
    );


    container.appendChild(
      totalRow
    );

  }

  catch(error){

    console.error(
      "Error historial:",
      error
    );


    container.innerHTML =
    '<div class="empty">' +
    "No se pudo cargar el historial de pagos." +
    "</div>";

  }

}


/* =========================================
   ABRIR MODAL
========================================= */

function openPaymentModal(
  sale
){

  selectedSale =
  sale;


  const customer =
  customers.find(
    item =>
    item.id ===
    sale.customer_id
  );


  $("paymentSubtitle").textContent =
  (
    customer?.name ||
    "Cliente"
  ) +
  " · Venta de " +
  money(sale.total);


  $("modalBalance").textContent =
  money(sale.balance);


  $("paymentAmount").value =
  "";


  $("paymentAmount").max =
  Number(
    sale.balance
  ).toFixed(2);


  $("paymentMethod").value =
  "";


  $("paymentModal")
  .classList
  .add("open");


  setTimeout(
    () =>
    $("paymentAmount").focus(),
    100
  );

}


/* =========================================
   CERRAR MODAL
========================================= */

function closePaymentModal(){

  selectedSale =
  null;


  $("paymentModal")
  .classList
  .remove("open");

}


/* =========================================
   REGISTRAR ABONO
========================================= */

async function registerPayment(){

  if(!selectedSale){

    return;

  }


  const saleId =
  selectedSale.id;


  const amount =
  Number(
    $("paymentAmount").value
  );


  const paymentMethodId =
  $("paymentMethod").value;


  const currentBalance =
  Number(
    selectedSale.balance || 0
  );


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    showStatus(
      "❌ Ingresa un monto válido.",
      "error"
    );

    return;

  }


  if(
    amount >
    currentBalance + 0.001
  ){

    showStatus(
      "❌ El abono no puede ser mayor al saldo pendiente de " +
      money(currentBalance),
      "error"
    );

    return;

  }


  if(!paymentMethodId){

    showStatus(
      "❌ Selecciona un método de pago.",
      "error"
    );

    return;

  }


  const selectedMethod =
  paymentMethods.find(
    method =>
    method.id ===
    paymentMethodId
  );


  if(!selectedMethod){

    showStatus(
      "❌ El método de pago seleccionado no es válido para " +
      currentBusiness +
      ".",
      "error"
    );

    return;

  }


  const button =
  $("confirmPayment");


  button.disabled =
  true;


  button.textContent =
  "REGISTRANDO...";


  try{

    const rpcResult =
    await supabaseClient.rpc(
      "registrar_abono_venta",
      {
        p_sale_id:
        saleId,

        p_amount:
        amount,

        p_payment_method_id:
        paymentMethodId
      }
    );


    if(rpcResult.error){

      throw rpcResult.error;

    }


    const verifyResult =
    await supabaseClient
    .from("sales")
    .select(
      "id,total,balance,status"
    )
    .eq(
      "id",
      saleId
    )
    .single();


    if(verifyResult.error){

      throw verifyResult.error;

    }


    const updatedSale =
    verifyResult.data;


    const newBalance =
    Number(
      updatedSale.balance || 0
    );


    const expectedBalance =
    Math.max(
      currentBalance - amount,
      0
    );


    if(
      Math.abs(
        newBalance -
        expectedBalance
      ) > 0.01
    ){

      throw new Error(
        "El pago fue registrado, pero el saldo de la venta no se actualizó correctamente. " +
        "Saldo actual en Supabase: " +
        money(newBalance) +
        ". Saldo esperado: " +
        money(expectedBalance) +
        "."
      );

    }


    closePaymentModal();


    if(
      newBalance <= 0.001
    ){

      showStatus(
        "✅ Cuenta liquidada correctamente con " +
        selectedMethod.name +
        ".",
        "ok"
      );

    }
    else{

      showStatus(
        "✅ Abono de " +
        money(amount) +
        " registrado por " +
        selectedMethod.name +
        ". Nuevo saldo: " +
        money(newBalance),
        "ok"
      );

    }


    await loadAccounts();

  }

  catch(error){

    console.error(
      "ERROR COMPLETO AL REGISTRAR ABONO:",
      error
    );


    showStatus(
      "❌ No se pudo registrar el abono: " +
      (
        error.message ||
        "Error desconocido."
      ),
      "error"
    );

  }

  finally{

    button.disabled =
    false;


    button.textContent =
    "Registrar abono";

  }

}


/* =========================================
   BUSCADOR
========================================= */

$("search")
.addEventListener(
  "input",
  renderAccounts
);


/* =========================================
   CAMBIO DE NEGOCIO
========================================= */

document
.querySelectorAll(
  ".business-btn"
)
.forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const business =
        button.dataset.business;


        if(
          business ===
          currentBusiness
        ){

          return;

        }


        currentBusiness =
        business;


        document
        .querySelectorAll(
          ".business-btn"
        )
        .forEach(
          item =>
          item.classList.remove(
            "active"
          )
        );


        button.classList.add(
          "active"
        );


        $("search").value =
        "";


        await loadAccounts();

      }
    );

  }
);


/* =========================================
   ACTUALIZAR
========================================= */

$("refreshButton")
.addEventListener(
  "click",
  loadAccounts
);


/* =========================================
   DASHBOARD
========================================= */

$("dashboardButton")
.addEventListener(
  "click",
  () => {

    window.location.href =
    "dashboard.html";

  }
);


/* =========================================
   CANCELAR
========================================= */

$("cancelPayment")
.addEventListener(
  "click",
  closePaymentModal
);


/* =========================================
   CONFIRMAR
========================================= */

$("confirmPayment")
.addEventListener(
  "click",
  registerPayment
);


/* =========================================
   CERRAR AL TOCAR AFUERA
========================================= */

$("paymentModal")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("paymentModal")
    ){

      closePaymentModal();

    }

  }
);


/* =========================================
   ESC
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closePaymentModal();

    }

  }
);


/* =========================================
   INICIO
========================================= */

loadAccounts();

</script>
