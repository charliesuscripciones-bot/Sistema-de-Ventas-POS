<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">

<title>Cuentas pendientes</title>

<style>
:root{
  --bg:#f2f2f7;
  --card:#ffffff;
  --text:#1c1c1e;
  --secondary:#8e8e93;
  --blue:#007aff;
  --green:#34c759;
  --red:#ff3b30;
  --orange:#ff9500;
  --border:#e5e5ea;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px 16px 40px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.header-title h1{
  margin:0;
  font-size:28px;
  font-weight:700;
  letter-spacing:-.6px;
}

.header-title p{
  margin:4px 0 0;
  color:var(--secondary);
  font-size:14px;
}

.refresh-button{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  color:var(--blue);
  font-size:20px;
}

/* BUSINESS SEGMENT */

.segmented{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#e5e5ea;
  padding:3px;
  border-radius:13px;
  margin-bottom:16px;
}

.segmented button{
  height:38px;
  border:0;
  background:transparent;
  border-radius:10px;
  color:#636366;
  font-weight:600;
}

.segmented button.active{
  background:#fff;
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.summary-card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
  min-width:0;
}

.summary-label{
  color:var(--secondary);
  font-size:12px;
  margin-bottom:7px;
}

.summary-value{
  font-size:23px;
  font-weight:700;
  letter-spacing:-.4px;
}

.summary-value.small{
  font-size:18px;
}

/* TOOLBAR */

.toolbar{
  background:#fff;
  border-radius:18px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.search-box{
  position:relative;
  margin-bottom:10px;
}

.search-box input{
  width:100%;
  height:44px;
  border:0;
  outline:none;
  background:#f2f2f7;
  border-radius:13px;
  padding:0 14px 0 40px;
  font-size:15px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:12px;
  color:var(--secondary);
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.filters select{
  width:100%;
  height:40px;
  border:0;
  background:#f2f2f7;
  border-radius:11px;
  padding:0 10px;
  color:var(--text);
  outline:none;
}

/* SECTION */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:22px 4px 10px;
}

.section-title h2{
  margin:0;
  font-size:19px;
  letter-spacing:-.2px;
}

.section-title span{
  color:var(--secondary);
  font-size:13px;
}

/* PRODUCT SUMMARY */

.products-card{
  background:#fff;
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.product-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 15px;
  border-bottom:1px solid var(--border);
}

.product-row:last-child{
  border-bottom:0;
}

.product-name{
  font-weight:600;
  font-size:14px;
}

.product-qty{
  color:var(--blue);
  font-weight:700;
  font-size:15px;
}

/* SALES */

.sales-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.sale-card{
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.sale-main{
  padding:16px;
}

.sale-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.customer-name{
  font-size:17px;
  font-weight:700;
  margin-bottom:4px;
}

.sale-date{
  color:var(--secondary);
  font-size:12px;
}

.sale-total{
  text-align:right;
}

.sale-total strong{
  display:block;
  font-size:19px;
}

.sale-total span{
  font-size:11px;
  color:var(--secondary);
}

.sale-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.info-box{
  background:#f2f2f7;
  border-radius:12px;
  padding:9px;
}

.info-label{
  color:var(--secondary);
  font-size:10px;
  margin-bottom:3px;
}

.info-value{
  font-size:13px;
  font-weight:600;
}

.balance-positive{
  color:var(--red);
}

.balance-zero{
  color:var(--green);
}

.products-detail{
  margin-top:14px;
  border-top:1px solid var(--border);
  padding-top:12px;
}

.products-detail-title{
  font-size:12px;
  color:var(--secondary);
  margin-bottom:7px;
  font-weight:600;
}

.sale-product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:6px 0;
  font-size:13px;
}

.sale-product-name{
  flex:1;
}

.sale-product-qty{
  color:var(--blue);
  font-weight:700;
}

.sale-product-price{
  min-width:70px;
  text-align:right;
}

/* ACTIONS */

.sale-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:12px;
  border-top:1px solid var(--border);
  background:#fafafa;
}

.action-button{
  min-height:40px;
  border:0;
  border-radius:12px;
  padding:0 10px;
  font-weight:600;
  font-size:13px;
  background:#e9e9ee;
  color:var(--text);
}

.action-button.primary{
  background:#007aff;
  color:#fff;
}

.action-button.success{
  background:#34c759;
  color:#fff;
}

.action-button.danger{
  background:#ff3b30;
  color:#fff;
}

.action-button.whatsapp{
  background:#34c759;
  color:#fff;
}

/* STATUS */

.status{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  margin-top:8px;
}

.status.open{
  background:#fff0ef;
  color:var(--red);
}

.status.paid{
  background:#eaf8ee;
  color:#248a3d;
}

.status.cancelled{
  background:#eeeef2;
  color:#636366;
}

/* CANCELLED */

.cancelled-card{
  opacity:.72;
}

/* EMPTY */

.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--secondary);
}

.loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:160px;
  color:var(--secondary);
  gap:10px;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #d1d1d6;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:1000;
  padding:0;
}

.modal.show{
  display:flex;
}

.modal-sheet{
  width:100%;
  max-width:600px;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  animation:sheetUp .22s ease;
  max-height:90vh;
  overflow:auto;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.modal-handle{
  width:38px;
  height:5px;
  background:#d1d1d6;
  border-radius:5px;
  margin:0 auto 18px;
}

.modal-title{
  font-size:21px;
  font-weight:700;
  margin-bottom:16px;
}

.modal-field{
  margin-bottom:14px;
}

.modal-field label{
  display:block;
  font-size:12px;
  color:var(--secondary);
  margin-bottom:6px;
}

.modal-field input,
.modal-field textarea,
.modal-field select{
  width:100%;
  border:0;
  background:#f2f2f7;
  border-radius:12px;
  min-height:44px;
  padding:10px 12px;
  outline:none;
}

.modal-field textarea{
  min-height:90px;
  resize:none;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.94);
  color:#fff;
  padding:11px 17px;
  border-radius:14px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:2000;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-width:700px){

  .app{
    padding:16px 12px 35px;
  }

  .summary-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr;
  }

  .sale-info{
    grid-template-columns:1fr 1fr 1fr;
  }

  .sale-actions{
    grid-template-columns:repeat(3,1fr);
  }

  .action-button{
    font-size:12px;
    padding:0 5px;
  }

  .header-title h1{
    font-size:25px;
  }
}

@media(max-width:420px){

  .sale-main{
    padding:14px;
  }

  .sale-actions{
    gap:6px;
    padding:10px;
  }

  .action-button{
    font-size:11px;
  }

  .sale-total strong{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-title">
      <h1>Cuentas</h1>
      <p>Historial y cuentas pendientes</p>
    </div>

    <button
      class="refresh-button"
      onclick="loadSales()"
      title="Actualizar"
    >
      ↻
    </button>
  </header>

  <!-- NEGOCIO -->
  <div class="segmented">
    <button
      id="businessBakeQuiri"
      class="active"
      onclick="changeBusiness('BakeQuiri')"
    >
      BakeQuiri
    </button>

    <button
      id="businessSpicyRoll"
      onclick="changeBusiness('SpicyRoll')"
    >
      SpicyRoll
    </button>
  </div>

  <!-- RESUMEN -->
  <div class="summary-grid">

    <div class="summary-card">
      <div class="summary-label">Cuentas</div>
      <div class="summary-value" id="summaryAccounts">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Piezas</div>
      <div class="summary-value" id="summaryPieces">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Ventas</div>
      <div class="summary-value small" id="summarySales">$0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">Por cobrar</div>
      <div class="summary-value small" id="summaryBalance">$0</div>
    </div>

  </div>

  <!-- BUSCADOR -->
  <div class="toolbar">

    <div class="search-box">
      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar cliente, teléfono o folio..."
        oninput="renderSales()"
      >
    </div>

    <div class="filters">

      <select id="statusFilter" onchange="renderSales()">
        <option value="all">Todas las cuentas</option>
        <option value="open">Pendientes</option>
        <option value="paid">Pagadas</option>
        <option value="cancelled">Canceladas</option>
      </select>

      <select id="dateFilter" onchange="renderSales()">
        <option value="all">Todas las fechas</option>
        <option value="today">Hoy</option>
        <option value="7days">Últimos 7 días</option>
        <option value="30days">Últimos 30 días</option>
      </select>

      <select id="sortFilter" onchange="renderSales()">
        <option value="newest">Más recientes</option>
        <option value="oldest">Más antiguas</option>
        <option value="highest">Mayor importe</option>
        <option value="lowest">Menor importe</option>
      </select>

    </div>

  </div>

  <!-- PRODUCTOS -->
  <div class="section-title">
    <h2>Productos vendidos</h2>
    <span id="productsCount">0 productos</span>
  </div>

  <div class="products-card" id="productsBreakdown">
    <div class="empty-state">
      Cargando productos...
    </div>
  </div>

  <!-- VENTAS -->
  <div class="section-title">
    <h2>Ventas</h2>
    <span id="salesCount">0 cuentas</span>
  </div>

  <div id="salesList" class="sales-list">
    <div class="loading">
      <div class="spinner"></div>
      Cargando ventas...
    </div>
  </div>

</div>

<!-- MODAL PAGO -->

<div id="paymentModal" class="modal">

  <div class="modal-sheet">

    <div class="modal-handle"></div>

    <div class="modal-title">
      Registrar pago
    </div>

    <div id="paymentSaleInfo"></div>

    <div class="modal-field">
      <label>Importe a pagar</label>

      <input
        id="paymentAmount"
        type="number"
        step="0.01"
        min="0"
        placeholder="0.00"
      >
    </div>

    <div class="modal-field">
      <label>Método de pago</label>

      <select id="paymentMethod">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Clip">Clip</option>
        <option value="BBVA">BBVA</option>
      </select>
    </div>

    <div class="modal-buttons">

      <button
        class="action-button"
        onclick="closeModal('paymentModal')"
      >
        Cancelar
      </button>

      <button
        class="action-button success"
        onclick="confirmPayment()"
      >
        Registrar pago
      </button>

    </div>

  </div>

</div>

<!-- MODAL DETALLE -->

<div id="detailModal" class="modal">

  <div class="modal-sheet">

    <div class="modal-handle"></div>

    <div class="modal-title">
      Detalle de la venta
    </div>

    <div id="detailContent"></div>

    <div class="modal-buttons">

      <button
        class="action-button"
        onclick="closeModal('detailModal')"
      >
        Cerrar
      </button>

    </div>

  </div>

</div>

<!-- MODAL CANCELAR -->

<div id="cancelModal" class="modal">

  <div class="modal-sheet">

    <div class="modal-handle"></div>

    <div class="modal-title">
      Cancelar venta
    </div>

    <div class="modal-field">

      <label>Motivo de cancelación</label>

      <textarea
        id="cancelReason"
        placeholder="Escribe el motivo..."
      ></textarea>

    </div>

    <div class="modal-buttons">

      <button
        class="action-button"
        onclick="closeModal('cancelModal')"
      >
        Regresar
      </button>

      <button
        class="action-button danger"
        onclick="confirmCancel()"
      >
        Cancelar venta
      </button>

    </div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   ESTADO
========================================================= */

let currentBusiness = "BakeQuiri";

let sales = [];
let saleItems = [];
let customers = [];

let selectedSale = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(value){

  const number = Number(value || 0);

  return number.toLocaleString("es-MX",{
    style:"currency",
    currency:"MXN"
  });

}


function formatDate(value){

  if(!value) return "Sin fecha";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleDateString(
    "es-MX",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function showToast(message){

  const toast = document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },3000);

}


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
  table,
  options={}
){

  const {
    select="*",
    filters=[],
    order=null,
    limit=null
  } = options;

  let url =
    `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(select)}`;

  filters.forEach(filter=>{

    url +=
      `&${filter.column}=${filter.operator}.${encodeURIComponent(filter.value)}`;

  });

  if(order){

    url +=
      `&order=${encodeURIComponent(order)}`;

  }

  if(limit){

    url +=
      `&limit=${limit}`;

  }

  const response = await fetch(
    url,
    {
      headers:{
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":
          `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type":"application/json"
      }
    }
  );

  if(!response.ok){

    const text = await response.text();

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );

  }

  return response.json();

}


/* =========================================================
   SUPABASE MUTATION
========================================================= */

async function supabaseInsert(
  table,
  data
){

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}`,
    {
      method:"POST",

      headers:{
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":
          `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },

      body:JSON.stringify(data)
    }
  );

  if(!response.ok){

    const text = await response.text();

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );

  }

  return response.json();

}


async function supabaseUpdate(
  table,
  filters,
  data
){

  let url =
    `${SUPABASE_URL}/rest/v1/${table}?`;

  filters.forEach((filter,index)=>{

    if(index > 0){
      url += "&";
    }

    url +=
      `${filter.column}=${filter.operator}.${encodeURIComponent(filter.value)}`;

  });

  const response = await fetch(
    url,
    {
      method:"PATCH",

      headers:{
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":
          `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },

      body:JSON.stringify(data)
    }
  );

  if(!response.ok){

    const text = await response.text();

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );

  }

  return response.json();

}


/* =========================================================
   CLIENTES
========================================================= */

async function loadCustomers(){

  customers =
    await supabaseFetch(
      "customers",
      {
        select:"id,name,phone,notes"
      }
    );

}


function getCustomer(customerId){

  if(!customerId){
    return null;
  }

  return customers.find(
    customer =>
      String(customer.id) === String(customerId)
  ) || null;

}


function getCustomerName(customerId){

  const customer =
    getCustomer(customerId);

  if(customer?.name){
    return customer.name;
  }

  return "Cliente";

}


function getCustomerPhone(customerId){

  const customer =
    getCustomer(customerId);

  return customer?.phone || "";

}


/* =========================================================
   PRODUCTOS DE UNA VENTA
========================================================= */

function getSaleItems(saleId){

  if(!saleId){
    return [];
  }

  return saleItems.filter(
    item =>
      String(item.sale_id) === String(saleId)
  );

}


function getSalePieces(saleId){

  return getSaleItems(saleId)
    .reduce(
      (total,item)=>
        total + Number(
          item.quantity ??
          item.qty ??
          0
        ),
      0
    );

}


function getItemDescription(item){

  return (
    item.description ||
    item.product_name ||
    item.name ||
    "Producto"
  );

}


/* =========================================================

/* =========================================================
   CARGAR VENTAS
========================================================= */

async function loadSales(){

  const salesList =
    document.getElementById("salesList");

  salesList.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Cargando ventas...
    </div>
  `;

  try{

    /*
      CLIENTES

      Si falla la consulta de clientes,
      NO bloqueamos las ventas.
    */

    try{

      await loadCustomers();

    }catch(error){

      console.warn(
        "No se pudieron cargar clientes:",
        error
      );

      customers = [];

    }


    const businessId =
      BUSINESS_IDS[currentBusiness];


    /*
      VENTAS

      Esta es la consulta principal.
    */

    sales =
      await supabaseFetch(
        "sales",
        {
          select:"*",

          filters:[
            {
              column:"business_id",
              operator:"eq",
              value:businessId
            }
          ],

          order:"created_at.desc"
        }
      );


    /*
      PRODUCTOS

      IMPORTANTE:
      NO usamos created_at aquí porque
      sale_items puede no tener esa columna.

      Si los productos fallan,
      las ventas siguen funcionando.
    */

    try{

      saleItems =
        await supabaseFetch(
          "sale_items",
          {
            select:"*"
          }
        );

    }catch(error){

      console.warn(
        "No se pudieron cargar productos:",
        error
      );

      saleItems = [];

    }


    renderSales();

  }catch(error){

    console.error(
      "ERROR REAL CARGANDO VENTAS:",
      error
    );

    salesList.innerHTML = `
      <div class="sale-card">

        <div class="empty-state">

          <div style="
            font-size:42px;
            margin-bottom:12px;
          ">
            ⚠️
          </div>

          <strong style="
            font-size:17px;
          ">
            No fue posible cargar las ventas
          </strong>

          <br><br>

          <span style="
            display:block;
            font-size:12px;
            line-height:1.5;
            color:#8e8e93;
            word-break:break-word;
            background:#f2f2f7;
            padding:12px;
            border-radius:12px;
            text-align:left;
          ">
            ${escapeHtml(
              error?.message ||
              "Error desconocido"
            )}
          </span>

          <br>

          <button
            class="action-button primary"
            type="button"
            style="
              width:100%;
              height:46px;
              border-radius:14px;
            "
            onclick="loadSales()"
          >
            Intentar nuevamente
          </button>

        </div>

      </div>
    `;

    showToast(
      "Error cargando ventas"
    );

  }

}


/* =========================================================
   FILTROS
========================================================= */

function filterSales(){

  const search =
    (
      document.getElementById(
        "searchInput"
      ).value || ""
    )
    .trim()
    .toLowerCase();

  const status =
    document.getElementById(
      "statusFilter"
    ).value;

  const dateFilter =
    document.getElementById(
      "dateFilter"
    ).value;

  const sort =
    document.getElementById(
      "sortFilter"
    ).value;


  let result =
    sales.filter(sale=>{

      const name =
        getCustomerName(
          sale.customer_id
        ).toLowerCase();

      const phone =
        getCustomerPhone(
          sale.customer_id
        ).toLowerCase();

      const id =
        String(
          sale.id || ""
        ).toLowerCase();


      const matchesSearch =
        !search ||
        name.includes(search) ||
        phone.includes(search) ||
        id.includes(search);


      if(!matchesSearch){
        return false;
      }


      const saleStatus =
        String(
          sale.status || ""
        ).toLowerCase();


      if(
        status !== "all" &&
        saleStatus !== status
      ){

        return false;

      }


      if(dateFilter !== "all"){

        const saleDate =
          new Date(
            sale.created_at ||
            sale.sale_date
          );

        const now =
          new Date();

        const diff =
          now.getTime() -
          saleDate.getTime();

        const day =
          24 * 60 * 60 * 1000;


        if(
          dateFilter === "today" &&
          saleDate.toDateString() !==
          now.toDateString()
        ){

          return false;

        }


        if(
          dateFilter === "7days" &&
          diff > 7 * day
        ){

          return false;

        }


        if(
          dateFilter === "30days" &&
          diff > 30 * day
        ){

          return false;

        }

      }


      return true;

    });


  result.sort((a,b)=>{

    if(sort === "highest"){

      return Number(b.total || 0) -
             Number(a.total || 0);

    }

    if(sort === "lowest"){

      return Number(a.total || 0) -
             Number(b.total || 0);

    }


    const dateA =
      new Date(
        a.created_at ||
        a.sale_date ||
        0
      ).getTime();

    const dateB =
      new Date(
        b.created_at ||
        b.sale_date ||
        0
      ).getTime();


    if(sort === "oldest"){
      return dateA - dateB;
    }

    return dateB - dateA;

  });


  return result;

}


/* =========================================================
   RENDER SALES
========================================================= */

function renderSales(){

  const result =
    filterSales();


  const salesList =
    document.getElementById(
      "salesList"
    );


  /*
    SUMMARY
  */

  const activeSales =
    result.filter(
      sale =>
        String(
          sale.status || ""
        ).toLowerCase()
        !== "cancelled"
    );


  const totalPieces =
    activeSales.reduce(
      (total,sale)=>
        total +
        getSalePieces(sale.id),
      0
    );


  const totalSales =
    activeSales.reduce(
      (total,sale)=>
        total +
        Number(sale.total || 0),
      0
    );


  const totalBalance =
    activeSales.reduce(
      (total,sale)=>
        total +
        Number(sale.balance || 0),
      0
    );


  const pendingAccounts =
    activeSales.filter(
      sale =>
        Number(sale.balance || 0) > 0
    ).length;


  document.getElementById(
    "summaryAccounts"
  ).textContent =
    pendingAccounts;


  document.getElementById(
    "summaryPieces"
  ).textContent =
    totalPieces;


  document.getElementById(
    "summarySales"
  ).textContent =
    money(totalSales);


  document.getElementById(
    "summaryBalance"
  ).textContent =
    money(totalBalance);


  document.getElementById(
    "salesCount"
  ).textContent =
    `${result.length} ${
      result.length === 1
        ? "cuenta"
        : "cuentas"
    }`;


  renderProductsBreakdown(
    activeSales
  );


  if(!result.length){

    salesList.innerHTML = `
      <div class="sale-card">
        <div class="empty-state">

          <div style="
            font-size:40px;
            margin-bottom:10px;
          ">
            🧾
          </div>

          No hay ventas para mostrar.

        </div>
      </div>
    `;

    return;

  }


  salesList.innerHTML =
    result
      .map(renderSaleCard)
      .join("");

}


/* =========================================================
   RESUMEN DE PRODUCTOS
========================================================= */

function renderProductsBreakdown(
  activeSales
){

  const container =
    document.getElementById(
      "productsBreakdown"
    );


  const counts = {};


  activeSales.forEach(sale=>{

    const items =
      getSaleItems(
        sale.id
      );


    items.forEach(item=>{

      const name =
        getItemDescription(item);


      const quantity =
        Number(
          item.quantity ??
          item.qty ??
          0
        );


      if(!counts[name]){
        counts[name] = 0;
      }


      counts[name] +=
        quantity;

    });

  });


  const entries =
    Object.entries(counts)
      .sort(
        (a,b)=>b[1]-a[1]
      );


  const totalPieces =
    entries.reduce(
      (sum,item)=>
        sum + item[1],
      0
    );


  document.getElementById(
    "productsCount"
  ).textContent =
    `${totalPieces} ${
      totalPieces === 1
        ? "pieza"
        : "piezas"
    }`;


  if(!entries.length){

    container.innerHTML = `
      <div class="empty-state">
        No hay productos registrados.
      </div>
    `;

    return;

  }


  container.innerHTML =
    entries
      .map(
        ([name,quantity])=>`

          <div class="product-row">

            <div class="product-name">
              ${escapeHtml(name)}
            </div>

            <div class="product-qty">
              ${quantity}
            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================================
   TARJETA DE VENTA
========================================================= */

function renderSaleCard(sale){

  const customerName =
    getCustomerName(
      sale.customer_id
    );

  const customerPhone =
    getCustomerPhone(
      sale.customer_id
    );


  const total =
    Number(
      sale.total || 0
    );


  const balance =
    Number(
      sale.balance || 0
    );


  const status =
    String(
      sale.status || "open"
    ).toLowerCase();


  const pieces =
    getSalePieces(
      sale.id
    );


  const items =
    getSaleItems(
      sale.id
    );


  let statusClass =
    "open";

  let statusText =
    "Pendiente";


  if(status === "paid"){

    statusClass =
      "paid";

    statusText =
      "Pagada";

  }


  if(status === "cancelled"){

    statusClass =
      "cancelled";

    statusText =
      "Cancelada";

  }


  let productsHtml = "";


  if(items.length){

    productsHtml = `

      <div class="products-detail">

        <div class="products-detail-title">
          Productos de la venta
        </div>

        ${items.map(item=>{

          const quantity =
            Number(
              item.quantity ??
              item.qty ??
              0
            );


          const price =
            Number(
              item.unit_price ??
              item.price ??
              0
            );


          return `

            <div class="sale-product">

              <div class="sale-product-name">
                ${escapeHtml(
                  getItemDescription(item)
                )}
              </div>

              <div class="sale-product-qty">
                ×${quantity}
              </div>

              <div class="sale-product-price">
                ${money(
                  Number(
                    item.subtotal ??
                    quantity * price
                  )
                )}
              </div>

            </div>

          `;

        }).join("")}

      </div>

    `;

  }else{

    productsHtml = `

      <div class="products-detail">

        <div class="products-detail-title">
          Productos de la venta
        </div>

        <div style="
          color:#8e8e93;
          font-size:13px;
        ">
          No hay productos registrados para esta venta.
        </div>

      </div>

    `;

  }


  return `

    <div
      class="sale-card ${
        status === "cancelled"
          ? "cancelled-card"
          : ""
      }"
    >

      <div class="sale-main">

        <div class="sale-top">

          <div>

            <div class="customer-name">
              ${escapeHtml(
                customerName
              )}
            </div>

            <div class="sale-date">
              ${formatDate(
                sale.created_at ||
                sale.sale_date
              )}
            </div>

            <div class="status ${statusClass}">
              ${statusText}
            </div>

          </div>


          <div class="sale-total">

            <strong>
              ${money(total)}
            </strong>

            <span>
              Total
            </span>

          </div>

        </div>


        <div class="sale-info">

          <div class="info-box">

            <div class="info-label">
              Piezas
            </div>

            <div class="info-value">
              ${pieces}
            </div>

          </div>


          <div class="info-box">

            <div class="info-label">
              Pagado
            </div>

            <div class="info-value">
              ${money(
                total - balance
              )}
            </div>

          </div>


          <div class="info-box">

            <div class="info-label">
              Saldo
            </div>

            <div class="
              info-value
              ${
                balance > 0
                  ? "balance-positive"
                  : "balance-zero"
              }
            ">

              ${money(balance)}

            </div>

          </div>

        </div>


        ${productsHtml}

      </div>


      <div class="sale-actions">

        ${
          balance > 0 &&
          status !== "cancelled"

          ?

          `
          <button
            class="action-button success"
            onclick="openPaymentModal('${sale.id}')"
          >
            💳 Pagar
          </button>
          `

          :

          `
          <button
            class="action-button"
            onclick="openDetailModal('${sale.id}')"
          >
            👁 Detalle
          </button>
          `
        }


        ${
          customerPhone &&
          status !== "cancelled"

          ?

          `
          <button
            class="action-button whatsapp"
            onclick="sendWhatsApp('${sale.id}')"
          >
            WhatsApp
          </button>
          `

          :

          `
          <button
            class="action-button"
            onclick="openDetailModal('${sale.id}')"
          >
            Detalle
          </button>
          `
        }


        ${
          status !== "cancelled"

          ?

          `
          <button
            class="action-button danger"
            onclick="openCancelModal('${sale.id}')"
          >
            Cancelar
          </button>
          `

          :

          `
          <button
            class="action-button"
            onclick="openDetailModal('${sale.id}')"
          >
            Ver
          </button>
          `
        }

      </div>

    </div>

  `;

}

/* =========================================================
   PAGO
========================================================= */

function openPaymentModal(
  saleId
){

  selectedSale =
    sales.find(
      sale =>
        String(sale.id) ===
        String(saleId)
    );


  if(!selectedSale){
    return;
  }


  const balance =
    Number(
      selectedSale.balance || 0
    );


  document.getElementById(
    "paymentAmount"
  ).value =
    balance.toFixed(2);


  document.getElementById(
    "paymentSaleInfo"
  ).innerHTML = `

    <div class="info-box" style="
      margin-bottom:14px;
    ">

      <div class="info-label">
        Cliente
      </div>

      <div class="info-value">
        ${escapeHtml(
          getCustomerName(
            selectedSale.customer_id
          )
        )}
      </div>

      <div style="
        margin-top:7px;
        color:#8e8e93;
        font-size:12px;
      ">
        Saldo pendiente:
        <strong>
          ${money(balance)}
        </strong>
      </div>

    </div>

  `;


  openModal(
    "paymentModal"
  );

}


async function confirmPayment(){

  if(!selectedSale){
    return;
  }


  const amount =
    Number(
      document.getElementById(
        "paymentAmount"
      ).value
    );


  const method =
    document.getElementById(
      "paymentMethod"
    ).value;


  const balance =
    Number(
      selectedSale.balance || 0
    );


  if(!amount || amount <= 0){

    showToast(
      "Ingresa un importe válido"
    );

    return;

  }


  if(amount > balance){

    showToast(
      "El pago no puede ser mayor al saldo"
    );

    return;

  }


  try{

    await supabaseInsert(
      "payments",
      {
        sale_id:selectedSale.id,
        customer_id:selectedSale.customer_id,
        amount:amount,
        payment_method:method
      }
    );


    const newBalance =
      Math.max(
        0,
        balance - amount
      );


    await supabaseUpdate(
      "sales",
      [
        {
          column:"id",
          operator:"eq",
          value:selectedSale.id
        }
      ],
      {
        balance:newBalance,
        status:
          newBalance <= 0
            ? "paid"
            : "open"
      }
    );


    closeModal(
      "paymentModal"
    );


    showToast(
      "Pago registrado correctamente"
    );


    await loadSales();

  }catch(error){

    console.error(
      "Error registrando pago:",
      error
    );

    showToast(
      "No fue posible registrar el pago"
    );

  }

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(
  saleId
){

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(saleId)
    );


  if(!sale){
    return;
  }


  const phone =
    getCustomerPhone(
      sale.customer_id
    );


  if(!phone){

    showToast(
      "El cliente no tiene teléfono registrado"
    );

    return;

  }


  const cleanPhone =
    String(phone)
      .replace(/\D/g,"");


  const name =
    getCustomerName(
      sale.customer_id
    );


  const balance =
    Number(
      sale.balance || 0
    );


  const message =
    `Hola ${name}, te compartimos un recordatorio de tu cuenta en ${currentBusiness}. Tu saldo pendiente es de ${money(balance)}. ¡Gracias!`;


  const url =
    `https://wa.me/52${cleanPhone}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   CANCELAR
========================================================= */

function openCancelModal(
  saleId
){

  selectedSale =
    sales.find(
      sale =>
        String(sale.id) ===
        String(saleId)
    );


  if(!selectedSale){
    return;
  }


  document.getElementById(
    "cancelReason"
  ).value = "";


  openModal(
    "cancelModal"
  );

}


async function confirmCancel(){

  if(!selectedSale){
    return;
  }


  const reason =
    document.getElementById(
      "cancelReason"
    ).value.trim();


  if(!reason){

    showToast(
      "Escribe el motivo de cancelación"
    );

    return;

  }


  try{

    await supabaseUpdate(
      "sales",
      [
        {
          column:"id",
          operator:"eq",
          value:selectedSale.id
        }
      ],
      {
        status:"cancelled",
        cancellation_reason:reason
      }
    );


    closeModal(
      "cancelModal"
    );


    showToast(
      "Venta cancelada"
    );


    await loadSales();

  }catch(error){

    console.error(
      "Error cancelando venta:",
      error
    );

    showToast(
      "No fue posible cancelar la venta"
    );

  }

}


/* =========================================================
   MODALES
========================================================= */

function openModal(
  id
){

  document
    .getElementById(id)
    .classList.add("show");

}


function closeModal(
  id
){

  document
    .getElementById(id)
    .classList.remove("show");

}


document
  .querySelectorAll(".modal")
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      event=>{

        if(
          event.target === modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    loadSales();
  }
);
