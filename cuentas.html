<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>Historial de ventas</title>

  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255,255,255,.94);
      --white: #ffffff;
      --text: #1c1c1e;
      --secondary: #6e6e73;
      --tertiary: #8e8e93;
      --separator: #e5e5ea;
      --blue: #007aff;
      --blue-soft: #eaf3ff;
      --green: #34c759;
      --green-soft: #eaf8ee;
      --orange: #ff9500;
      --orange-soft: #fff4df;
      --red: #ff3b30;
      --red-soft: #fff0ef;
      --purple: #af52de;
      --purple-soft: #f7edfb;

      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --shadow:
        0 8px 30px rgba(0,0,0,.055),
        0 2px 7px rgba(0,0,0,.035);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       APP
    ========================================================= */

    .app {
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .container {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding:
        calc(12px + env(safe-area-inset-top))
        0
        12px;

      background: rgba(242,242,247,.84);
      backdrop-filter: saturate(180%) blur(22px);
      -webkit-backdrop-filter: saturate(180%) blur(22px);

      border-bottom: 1px solid rgba(0,0,0,.04);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 3px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 5vw, 31px);
      line-height: 1.08;
      font-weight: 750;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.35;
    }

    .icon-button {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: var(--blue);
      display: grid;
      place-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      transition: transform .16s ease, background .16s ease;
    }

    .icon-button:active {
      transform: scale(.94);
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
    }

    /* =========================================================
       BUSINESS SWITCH
    ========================================================= */

    .business-switch-wrap {
      margin-top: 18px;
    }

    .segmented {
      width: 100%;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;

      background: #dedee3;
      border-radius: 13px;
      box-shadow:
        inset 0 1px 1px rgba(0,0,0,.07),
        0 1px 2px rgba(0,0,0,.03);
    }

    .segment {
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #55555a;
      font-weight: 650;
      font-size: 14px;
      transition: .18s ease;
    }

    .segment.active {
      background: #fff;
      color: var(--text);
      box-shadow:
        0 1px 4px rgba(0,0,0,.12),
        0 1px 1px rgba(0,0,0,.05);
    }

    /* =========================================================
       TOOLBAR
    ========================================================= */

    .toolbar {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 9px;
    }

    .toolbar-button {
      min-height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 13px;
      background: rgba(255,255,255,.88);
      color: var(--text);
      font-weight: 650;
      font-size: 13px;
      box-shadow: 0 2px 10px rgba(0,0,0,.045);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .15s ease;
    }

    .toolbar-button:active {
      transform: scale(.98);
    }

    .toolbar-button svg {
      width: 17px;
      height: 17px;
    }

    .toolbar-button.danger {
      color: var(--red);
    }

    /* =========================================================
       SUMMARY
    ========================================================= */

    .summary-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .summary-card {
      position: relative;
      min-height: 112px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .summary-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      margin-bottom: 12px;
    }

    .summary-icon svg {
      width: 18px;
      height: 18px;
    }

    .summary-card.blue .summary-icon {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .summary-card.orange .summary-icon {
      background: var(--orange-soft);
      color: var(--orange);
    }

    .summary-card.green .summary-icon {
      background: var(--green-soft);
      color: var(--green);
    }

    .summary-card.purple .summary-icon {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .summary-label {
      margin: 0;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .summary-value {
      margin: 3px 0 0;
      font-size: 23px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: -.025em;
    }

    /* =========================================================
       FILTERS
    ========================================================= */

    .filters-card {
      margin-top: 16px;
      padding: 14px;
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--tertiary);
      pointer-events: none;
    }

    .input,
    .select {
      width: 100%;
      height: 44px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: #f2f2f7;
      color: var(--text);
      outline: none;
      padding: 0 13px;
      font-size: 14px;
      transition: .16s ease;
    }

    .search-input {
      padding-left: 42px;
    }

    .input:focus,
    .select:focus {
      background: #fff;
      border-color: rgba(0,122,255,.45);
      box-shadow: 0 0 0 3px rgba(0,122,255,.10);
    }

    .filter-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 9px;
    }

    .clear-button {
      min-width: 92px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      padding: 0 13px;
    }

    /* =========================================================
       SECTION
    ========================================================= */

    .section {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 3px 9px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.025em;
      font-weight: 750;
    }

    .section-count {
      color: var(--secondary);
      font-size: 13px;
      font-weight: 600;
    }

    /* =========================================================
       PRODUCT BREAKDOWN
    ========================================================= */

    .products-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .product-summary-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--separator);
    }

    .product-summary-row:last-child {
      border-bottom: 0;
    }

    .product-summary-name {
      min-width: 0;
      font-size: 14px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-summary-qty {
      color: var(--secondary);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .product-summary-total {
      min-width: 72px;
      text-align: right;
      font-size: 14px;
      font-weight: 750;
    }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--secondary);
      font-size: 14px;
    }

    /* =========================================================
       SALE CARDS
    ========================================================= */

    .sales-list {
      display: grid;
      gap: 12px;
    }

    .sale-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sale-head {
      padding: 17px 17px 14px;
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .customer-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 750;
    }

    .customer-main {
      min-width: 0;
    }

    .customer-name {
      margin: 0;
      font-size: 16px;
      font-weight: 720;
      letter-spacing: -.015em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .customer-meta {
      margin-top: 3px;
      color: var(--secondary);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 7px;
    }

    .sale-amount {
      text-align: right;
    }

    .sale-total {
      font-size: 18px;
      font-weight: 780;
      letter-spacing: -.025em;
    }

    .balance-pill {
      display: inline-flex;
      margin-top: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: #b76b00;
      font-size: 11px;
      font-weight: 750;
    }

    .balance-pill.paid {
      background: var(--green-soft);
      color: #1c8c3a;
    }

    /* =========================================================
       PRODUCTS IN SALE
    ========================================================= */

    .sale-products {
      margin: 0 13px;
      padding: 2px 13px;
      border-radius: 15px;
      background: #f7f7f9;
    }

    .sale-product {
      min-height: 47px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--separator);
    }

    .sale-product:last-child {
      border-bottom: 0;
    }

    .sale-product-name {
      min-width: 0;
      font-size: 13px;
      font-weight: 620;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sale-product-qty {
      color: var(--secondary);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .sale-product-price {
      min-width: 62px;
      text-align: right;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================================================
       SALE FOOT
    ========================================================= */

    .sale-foot {
      padding: 14px 13px 15px;
    }

    .totals {
      display: grid;
      gap: 5px;
      padding: 0 4px 12px;
    }

    .total-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      font-size: 13px;
      color: var(--secondary);
    }

    .total-line strong {
      color: var(--text);
      font-size: 14px;
    }

    .total-line.balance strong {
      color: var(--orange);
      font-size: 16px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .action-button {
      min-height: 43px;
      border: 0;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 720;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .15s ease;
    }

    .action-button:active {
      transform: scale(.97);
    }

    .action-button svg {
      width: 16px;
      height: 16px;
    }

    .action-button.primary {
      background: var(--blue);
      color: white;
    }

    .action-button.whatsapp {
      background: var(--green-soft);
      color: #168638;
    }

    .action-button.secondary {
      background: #f2f2f7;
      color: var(--text);
    }

    .action-button.cancel {
      background: var(--red-soft);
      color: var(--red);
    }

    /* =========================================================
       CANCELLED
    ========================================================= */

    .cancelled-section {
      margin-top: 28px;
    }

    .cancelled-card {
      background: rgba(255,255,255,.82);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .cancelled-row {
      padding: 14px 16px;
      border-bottom: 1px solid var(--separator);
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 10px;
    }

    .cancelled-row:last-child {
      border-bottom: 0;
    }

    .cancelled-name {
      font-size: 14px;
      font-weight: 650;
    }

    .cancelled-meta {
      margin-top: 3px;
      color: var(--secondary);
      font-size: 12px;
    }

    .cancelled-total {
      color: var(--red);
      font-weight: 750;
      font-size: 14px;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      padding: 35px 15px;
      text-align: center;
      color: var(--secondary);
      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #d9d9de;
      border-top-color: var(--blue);
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       MODALS
    ========================================================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(520px, 100%);
      max-height: min(760px, calc(100vh - 30px));
      overflow: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,.22);
      animation: modalIn .2s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 17px 18px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      margin: 0;
      font-size: 19px;
      font-weight: 750;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f2f2f7;
      color: var(--secondary);
      display: grid;
      place-items: center;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-footer {
      padding: 12px 18px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .modal-button {
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
    }

    .modal-button.primary {
      background: var(--blue);
      color: white;
    }

    .modal-button.secondary {
      background: #f2f2f7;
      color: var(--text);
    }

    .field {
      margin-bottom: 13px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin: 0 0 6px 3px;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 650;
    }

    .field input,
    .field select {
      width: 100%;
      height: 46px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: #f2f2f7;
      padding: 0 13px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(0,122,255,.45);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,122,255,.10);
    }

    .payment-summary {
      padding: 15px;
      margin-bottom: 15px;
      background: #f7f7f9;
      border-radius: 16px;
    }

    .payment-summary-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--secondary);
      font-size: 13px;
    }

    .payment-summary-line:last-child {
      margin-bottom: 0;
    }

    .payment-summary-line strong {
      color: var(--text);
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 200;
      transform: translate(-50%, 120px);
      opacity: 0;
      pointer-events: none;

      width: min(calc(100% - 30px), 430px);
      padding: 13px 16px;

      border-radius: 15px;
      background: rgba(30,30,32,.94);
      color: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,.22);

      text-align: center;
      font-size: 13px;
      font-weight: 600;

      transition: .25s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 800px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-row {
        grid-template-columns: 1fr 1fr;
      }

      .clear-button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 1180px);
      }

      .topbar {
        padding-top: calc(10px + env(safe-area-inset-top));
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar-button:last-child {
        grid-column: 1 / -1;
      }

      .summary-card {
        min-height: 105px;
        padding: 14px;
      }

      .summary-value {
        font-size: 21px;
      }

      .sale-head {
        grid-template-columns: auto minmax(0,1fr);
      }

      .sale-amount {
        grid-column: 2;
        text-align: left;
        margin-top: -5px;
      }

      .actions {
        grid-template-columns: 1fr 1fr;
      }

      .action-button:last-child {
        grid-column: 1 / -1;
      }

      .modal {
        align-items: flex-end;
        padding: 0;
      }

      .modal-card {
        width: 100%;
        max-height: calc(100vh - 10px);
        border-radius: 25px 25px 0 0;
        animation: sheetIn .22s ease;
      }

      @keyframes sheetIn {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
    }

    @media (max-width: 420px) {
      .filter-row {
        grid-template-columns: 1fr;
      }

      .clear-button {
        grid-column: auto;
      }

      .sale-product {
        grid-template-columns: minmax(0,1fr) auto;
      }

      .sale-product-price {
        grid-column: 2;
      }

      .sale-product-qty {
        display: none;
      }
    }

    @media (min-width: 900px) {
      .sales-list {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .sale-card {
        height: 100%;
      }
    }

    /* =========================================================
       UTILITY
    ========================================================= */

    .hidden {
      display: none !important;
    }

    .text-danger {
      color: var(--red);
    }

    .text-success {
      color: var(--green);
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header class="topbar">
    <div class="container">

      <div class="topbar-inner">

        <div class="brand">
          <p class="eyebrow">Ventas</p>
          <h1 class="title">Historial de ventas</h1>
          <p class="subtitle" id="businessSubtitle">
            Cargando información...
          </p>
        </div>

        <button
          class="icon-button"
          id="refreshButton"
          type="button"
          title="Actualizar"
          aria-label="Actualizar"
          onclick="loadSales()"
        >

/* ============================================================

const SUPABASE_URL =

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {
  BakeQuiri: "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",
  SpicyRoll: "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"
};


/* ============================================================

/* ============================================================
   SUPABASE REQUEST
============================================================ */

async function supabaseFetch(
  table,
  options = {}
) {

  const {
    select = "*",
    filters = [],
    order = null,
    limit = null
  } = options;

  let url =
    `${SUPABASE_URL}/rest/v1/${table}?select=${encodeURIComponent(select)}`;

  filters.forEach(filter => {
    url += `&${filter.column}=${filter.operator}.${encodeURIComponent(filter.value)}`;
  });

  if (order) {
    url += `&order=${encodeURIComponent(order)}`;
  }

  if (limit) {
    url += `&limit=${limit}`;
  }

  const response = await fetch(url, {
    headers: {
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      "Content-Type": "application/json"
    }
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || `HTTP ${response.status}`);
  }

  return response.json();
}


/* ============================================================
   SUPABASE INSERT
============================================================ */

async function supabaseInsert(
  table,
  data
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}`,
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: JSON.stringify(data)
    }
  );

  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || `HTTP ${response.status}`);
  }

  return response.json();
}


/* ============================================================
   SUPABASE UPDATE
============================================================ */

async function supabaseUpdate(
  table,
  filters,
  data
) {

  let url =
    `${SUPABASE_URL}/rest/v1/${table}?`;

  url += filters
    .map(filter =>
      `${filter.column}=${filter.operator}.${encodeURIComponent(filter.value)}`
    )
    .join("&");

  const response = await fetch(url, {
    method: "PATCH",

    headers: {
      "apikey": SUPABASE_PUBLISHABLE_KEY,
      "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },

    body: JSON.stringify(data)
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || `HTTP ${response.status}`);
  }

  return response.json();
}


/* ============================================================
   FORMATTERS
============================================================ */

function money(value) {

  const number = Number(value || 0);

  return number.toLocaleString("es-MX", {
    style: "currency",
    currency: "MXN"
  });
}


function dateFormat(value) {

  if (!value) return "Sin fecha";

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString(
    "es-MX",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
}


function dateTimeFormat(value) {

  if (!value) return "";

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString(
    "es-MX",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getInitials(name) {

  if (!name) return "C";

  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if (!parts.length) return "C";

  if (parts.length === 1) {
    return parts[0].slice(0, 2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();
}


/* ============================================================
   TOAST
============================================================ */

let toastTimer = null;

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
}


/* ============================================================
   CUSTOMER FUNCTIONS
============================================================ */

async function loadCustomers() {

  try {

    customers = await supabaseFetch(
      "customers",
      {
        select: "id,name,phone,notes"
      }
    );

  } catch (error) {

    console.error(
      "Error cargando clientes:",
      error
    );

    customers = [];
  }
}


function getCustomer(customerId) {

  if (!customerId) {
    return null;
  }

  return customers.find(
    customer => customer.id === customerId
  ) || null;
}


function getCustomerName(customerId) {

  const customer =
    getCustomer(customerId);

  if (
    customer &&
    customer.name &&
    customer.name.trim()
  ) {
    return customer.name.trim();
  }

  return "Cliente";
}


function getCustomerPhone(customerId) {

  const customer =
    getCustomer(customerId);

  return customer?.phone || "";
}


/* ============================================================
   LOAD SALES
============================================================ */

async function loadSales() {

  const salesList =
    document.getElementById("salesList");

  salesList.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Cargando ventas...
    </div>
  `;

  try {

    await loadCustomers();

    const businessId =
      BUSINESS_IDS[currentBusiness];

    sales = await supabaseFetch(
      "sales",
      {
        select: "*",
        filters: [
          {
            column: "business_id",
            operator: "eq",
            value: businessId
          }
        ],
        order: "created_at.desc"
      }
    );

    saleItems = await supabaseFetch(
      "sale_items",
      {
        select: "*",
        order: "created_at.asc"
      }
    );

    renderSales();

  } catch (error) {

    console.error(
      "Error cargando ventas:",
      error
    );

    salesList.innerHTML = `
      <div class="empty-state">
        No fue posible cargar las ventas.
        <br><br>
        <button
          class="action-button primary"
          type="button"
          style="padding:0 20px"
          onclick="loadSales()"
        >
          Intentar nuevamente
        </button>
      </div>
    `;

    showToast("Error cargando ventas");

  }

}


/* ============================================================
   SWITCH BUSINESS
============================================================ */

function switchBusiness(business) {

/* ============================================================
   FILTERS
============================================================ */

function applyFilters() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const from =
    document.getElementById("dateFrom").value;

  const to =
    document.getElementById("dateTo").value;

  filteredSales =
    sales.filter(sale => {

      const isCancelled =
        sale.status === "cancelled";

      if (isCancelled) {
        return false;
      }

      const customerName =
        getCustomerName(
          sale.customer_id
        ).toLowerCase();

      const customerPhone =
        getCustomerPhone(
          sale.customer_id
        ).toLowerCase();

      const items =
        getSaleItems(sale.id);

      const productText =
        items
          .map(item =>
            String(
              item.description ||
              item.product_name ||
              ""
            )
          )
          .join(" ")
          .toLowerCase();

      const matchesSearch =
        !search ||
        customerName.includes(search) ||
        customerPhone.includes(search) ||
        productText.includes(search) ||
        String(sale.id)
          .toLowerCase()
          .includes(search);

      if (!matchesSearch) {
        return false;
      }

      const saleDate =
        String(
          sale.sale_date ||
          sale.created_at ||
          ""
        ).slice(0, 10);

      if (from && saleDate < from) {
        return false;
      }

      if (to && saleDate > to) {
        return false;
      }

      return true;
    });

  renderFilteredSales();
  renderProductBreakdown();
  updateSummary();
}


/* ============================================================
   GET SALE ITEMS
============================================================ */

function getSaleItems(saleId) {

  return saleItems.filter(
    item =>
      String(item.sale_id) ===
      String(saleId)
  );
}


/* ============================================================
   NORMALIZE ITEM
============================================================ */

function normalizeSaleItem(item) {

  const quantity =
    Number(
      item.quantity ??
      item.qty ??
      0
    );

  const unitPrice =
    Number(
      item.unit_price ??
      item.price ??
      0
    );

  const subtotal =
    Number(
      item.subtotal ??
      item.total ??
      quantity * unitPrice
    );

  return {
    ...item,
    quantity,
    unitPrice,
    subtotal,
    description:
      item.description ||
      item.product_name ||
      item.name ||
      "Producto"
  };
}


/* ============================================================
   RENDER SALES
============================================================ */

function renderSales() {

  applyFilters();

  renderCancelled();

    filteredSales

/* ============================================================
   PRODUCT BREAKDOWN
============================================================ */

function renderProductBreakdown() {

  const container =
    document.getElementById(
      "productsBreakdown"
    );

  const productMap = {};

  filteredSales.forEach(sale => {

    const items =
      getSaleItems(sale.id)
        .map(normalizeSaleItem);

    items.forEach(item => {

      const key =
        String(
          item.description
        ).trim()
        .toLowerCase();

      if (!productMap[key]) {

        productMap[key] = {
          name: item.description,
          quantity: 0,
          total: 0
        };

      }

      productMap[key].quantity +=
        Number(item.quantity || 0);

      productMap[key].total +=
        Number(item.subtotal || 0);

    });

  });

  const products =
    Object.values(productMap)
      .sort(
        (a,b) =>
          b.quantity - a.quantity
      );

  document.getElementById(
    "productsCount"
  ).textContent =
    `${products.length} ${
      products.length === 1
        ? "producto"
        : "productos"
    }`;

  if (!products.length) {

    container.innerHTML = `
      <div class="empty-state">
        No hay productos vendidos
        para los filtros seleccionados.
      </div>
    `;

    return;
  }

  container.innerHTML =
    products
      .map(product => `
        <div class="product-summary-row">

          <div class="product-summary-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-summary-qty">
            ×${product.quantity}
          </div>

          <div class="product-summary-total">
            ${money(product.total)}
          </div>

        </div>
      `)
      .join("");
}


/* ============================================================
   SUMMARY
============================================================ */

function updateSummary() {

  const accountCount =
    filteredSales.length;

  const pieces =
    filteredSales.reduce(
      (sum, sale) => {

        const items =
          getSaleItems(sale.id)
            .map(normalizeSaleItem);

        return sum +
          items.reduce(
            (total, item) =>
              total +
              Number(item.quantity || 0),
            0
          );

      },
      0
    );

  const total =
    filteredSales.reduce(
      (sum, sale) =>
        sum +
        Number(sale.total || 0),
      0
    );

  const balance =
    filteredSales.reduce(
      (sum, sale) =>
        sum +
        Number(sale.balance || 0),
      0
    );

  document.getElementById(
    "summaryAccounts"
  ).textContent = accountCount;

  document.getElementById(
    "summaryPieces"
  ).textContent = pieces;

  document.getElementById(
    "summarySales"
  ).textContent = money(total);

  document.getElementById(
    "summaryBalance"
  ).textContent = money(balance);
}


/* ============================================================

/* ============================================================
   PAYMENT MODAL
============================================================ */

function openPaymentModal(saleId) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(saleId)
    );

  if (!sale) return;

  currentPaymentSale = sale;

  const balance =
    Number(sale.balance || 0);

  const customerName =
    getCustomerName(
      sale.customer_id
    );

  document.getElementById(
    "paymentSummary"
  ).innerHTML = `

    <div class="payment-summary-line">
      <span>Cliente</span>
      <strong>
        ${escapeHtml(customerName)}
      </strong>
    </div>

    <div class="payment-summary-line">
      <span>Total</span>
      <strong>
        ${money(sale.total)}
      </strong>
    </div>

    <div class="payment-summary-line">
      <span>Pendiente</span>
      <strong class="text-danger">
        ${money(balance)}
      </strong>
    </div>

  `;

  const amountInput =
    document.getElementById(
      "paymentAmount"
    );

  amountInput.value =
    balance.toFixed(2);

  amountInput.max =
    balance.toFixed(2);

  document
    .getElementById("paymentModal")
    .classList.add("show");

  setTimeout(() => {
    amountInput.focus();
    amountInput.select();
  }, 100);
}


function closePaymentModal() {

  document
    .getElementById("paymentModal")
    .classList.remove("show");

  currentPaymentSale = null;
}


/* ============================================================
   SAVE PAYMENT
============================================================ */

async function savePayment() {

  if (!currentPaymentSale) {
    return;
  }

  const amount =
    Number(
      document.getElementById(
        "paymentAmount"
      ).value
    );

  const method =
    document.getElementById(
      "paymentMethod"
    ).value;

  const currentBalance =
    Number(
      currentPaymentSale.balance || 0
    );

  if (!amount || amount <= 0) {

    showToast(
      "Ingresa un monto válido"
    );

    return;
  }

  if (amount > currentBalance + 0.01) {

    showToast(
      "El pago no puede superar el saldo pendiente"
    );

    return;
  }

  try {

    const newBalance =
      Math.max(
        0,
        currentBalance - amount
      );

    const newStatus =
      newBalance <= 0
        ? "paid"
        : "open";

    await supabaseInsert(
      "payments",
      {
        sale_id:
          currentPaymentSale.id,

        customer_id:
          currentPaymentSale.customer_id,

        amount,

        payment_method:
          method
      }
    );

    await supabaseUpdate(
      "sales",
      [
        {
          column: "id",
          operator: "eq",
          value:
            currentPaymentSale.id
        }
      ],
      {
        balance: newBalance,
        status: newStatus
      }
    );

    closePaymentModal();

    showToast(
      "Pago registrado correctamente"
    );

    await loadSales();

  } catch (error) {

    console.error(
      "Error registrando pago:",
      error
    );

    showToast(
      "No fue posible registrar el pago"
    );

  }
}


/* ============================================================
   WHATSAPP
============================================================ */

function sendWhatsApp(
  phone,
  customerName,
  saleId
) {

  let cleanPhone =
    String(phone || "")
      .replace(/\D/g, "");

  if (
    cleanPhone.length === 10
  ) {
    cleanPhone =
      "52" + cleanPhone;
  }

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(saleId)
    );

  if (!sale) return;

  const balance =
    Number(sale.balance || 0);

  const message =
    balance > 0
      ? `Hola ${customerName}, te compartimos el recordatorio de tu cuenta. El saldo pendiente es de ${money(balance)}. ¡Gracias!`
      : `Hola ${customerName}, gracias por tu compra. ¡Esperamos verte pronto!`;

  const url =
    `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;

  window.open(
    url,
    "_blank"
  );
}


/* ============================================================
   CANCEL SALE
============================================================ */

function openCancelModal(saleId) {

  const sale =
    sales.find(
      item =>
        String(item.id) ===
        String(saleId)
    );

  if (!sale) return;

  currentCancelSale = sale;

  document.getElementById(
    "cancelReason"
  ).value = "";

  document
    .getElementById("cancelModal")
    .classList.add("show");

  setTimeout(() => {

    document.getElementById(
      "cancelReason"
    ).focus();

  }, 100);
}


function closeCancelModal() {

  document
    .getElementById("cancelModal")
    .classList.remove("show");

  currentCancelSale = null;
}


/* ============================================================
   CONFIRM CANCEL
============================================================ */

async function confirmCancelSale() {

  if (!currentCancelSale) {
    return;
  }

  const reason =
    document
      .getElementById("cancelReason")
      .value
      .trim();

  if (!reason) {

    showToast(
      "Escribe un motivo de cancelación"
    );

    return;
  }

  try {

    await supabaseUpdate(
      "sales",
      [
        {
          column: "id",
          operator: "eq",
          value:
            currentCancelSale.id
        }
      ],
      {
        status: "cancelled",
        cancellation_reason: reason
      }
    );

    closeCancelModal();

    showToast(
      "Venta cancelada"
    );

    await loadSales();

  } catch (error) {

    console.error(
      "Error cancelando venta:",
      error
    );

    showToast(
      "No fue posible cancelar la venta"
    );

  }
}


/* ============================================================
   CANCELLED
============================================================ */

function toggleCancelled() {

  cancelledVisible =
    !cancelledVisible;

  const section =
    document.getElementById(
      "cancelledSection"
    );

  section.classList.toggle(
    "hidden",
    !cancelledVisible
  );

  if (cancelledVisible) {
    renderCancelled();

    section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

}


function renderCancelled() {

  const container =
    document.getElementById(
      "cancelledList"
    );

  const cancelled =
    sales.filter(
      sale =>
        sale.status === "cancelled"
    );

  document.getElementById(
    "cancelledCount"
  ).textContent =
    cancelled.length;

  if (!cancelled.length) {

    container.innerHTML = `
      <div class="empty-state">
        No hay ventas canceladas.
      </div>
    `;

    return;
  }

  container.innerHTML =
    cancelled
      .map(sale => {

        const customerName =
          getCustomerName(
            sale.customer_id
          );

        return `
          <div class="cancelled-row">

            <div>

              <div class="cancelled-name">
                ${escapeHtml(
                  customerName
                )}
              </div>

              <div class="cancelled-meta">

                ${dateTimeFormat(
                  sale.created_at ||
                  sale.sale_date
                )}

                ${
                  sale.cancellation_reason
                    ? ` • ${escapeHtml(
                        sale.cancellation_reason
                      )}`
                    : ""
                }

              </div>

            </div>

            <div class="cancelled-total">
              ${money(sale.total)}
            </div>

          </div>
        `;

      })
      .join("");
}

   CLEAR FILTERS
============================================================ */

============================================================ */

document.addEventListener(

============================================================ */

document.addEventListener(
