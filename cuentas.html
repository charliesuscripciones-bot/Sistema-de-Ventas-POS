<!DOCTYPE html>
<html lang="es">
<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{

<script>

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentBusiness =
  localStorage.getItem("currentBusiness") ||
  "BakeQuiri";

let sales = [];
let saleItems = [];
let payments = [];
let products = [];
let paymentMethods = [];

let currentPaymentSale = null;
let currentCancelSale = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){

  return document.getElementById(id);

}


function money(value){

  return Number(value || 0).toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function normalizeId(value){

  return String(value || "").trim();

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showError(message){

  const box =
    $("errorBox");

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

}


function hideError(){

  $("errorBox")
    .classList.add(
      "hidden"
    );

}


function formatDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString(
    "es-MX",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function dateOnly(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =========================================================
   BUSINESS
========================================================= */

function setBusiness(name){

  if(!BUSINESS_IDS[name]){
    return;
  }

  currentBusiness =
    name;

  localStorage.setItem(
    "currentBusiness",
    name
  );

  updateBusinessUI();

  loadSales();

}


function updateBusinessUI(){

  $("currentBusinessLabel")
    .textContent =
      currentBusiness;

  $("btnBakeQuiri")
    .classList.toggle(
      "active",
      currentBusiness === "BakeQuiri"
    );

  $("btnSpicyRoll")
    .classList.toggle(
      "active",
      currentBusiness === "SpicyRoll"
    );

}


function goDashboard(){

  window.location.href =
    "index.html";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  products = [];

  const businessId =
    BUSINESS_IDS[currentBusiness];

  if(!businessId){
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq(
        "business_id",
        businessId
      );

  if(error){

    console.warn(
      "No se pudieron cargar productos:",
      error
    );

    return;
  }

  products =
    data || [];

}


/* =========================================================
   LOAD PAYMENT METHODS
========================================================= */

async function loadPaymentMethods(){

  paymentMethods = [];

  const businessId =
    BUSINESS_IDS[currentBusiness];

  if(!businessId){
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("payment_methods")
      .select(
        "id,name,provider,active,business_id"
      )
      .eq(
        "business_id",
        businessId
      )
      .eq(
        "active",
        true
      )
      .order(
        "name",
        {
          ascending:true
        }
      );

  if(error){

    console.warn(
      "No se pudieron cargar métodos de pago:",
      error
    );

    return;
  }

  paymentMethods =
    data || [];

}


/* =========================================================
   GET PAYMENT METHOD ID
========================================================= */

function getPaymentMethodId(
  selectedName
){

  const wanted =
    String(
      selectedName || ""
    )
    .trim()
    .toLowerCase();

  if(!wanted){
    return null;
  }

  /*
    Primero buscamos coincidencia exacta
    por nombre.
  */

  let method =
    paymentMethods.find(
      item =>
        String(
          item.name || ""
        )
        .trim()
        .toLowerCase() === wanted
    );

  /*
    Si no existe, intentamos también
    con provider.
  */

  if(!method){

    method =
      paymentMethods.find(
        item =>
          String(
            item.provider || ""
          )
          .trim()
          .toLowerCase() === wanted
      );

  }

  /*
    Último intento:
    coincidencia parcial.
  */

  if(!method){

    method =
      paymentMethods.find(
        item => {

          const name =
            String(
              item.name || ""
            )
            .trim()
            .toLowerCase();

          const provider =
            String(
              item.provider || ""
            )
            .trim()
            .toLowerCase();

          return (
            name.includes(wanted) ||
            wanted.includes(name) ||
            provider.includes(wanted) ||
            wanted.includes(provider)
          );

        }
      );

  }

  return method
    ? method.id
    : null;

}


/* =========================================================
   PRODUCT NAME
========================================================= */

function getProductName(
  productId,
  fallback=""
){

  const id =
    normalizeId(productId);

  if(!id){
    return fallback || "Producto";
  }

  const product =
    products.find(
      p =>
        normalizeId(p.id) === id
    );

  if(product){

    return (
      product.name ||
      product.nombre ||
      fallback ||
      "Producto"
    );

  }

  return fallback || "Producto";

}


/* =========================================================
   LOAD SALE ITEMS
========================================================= */

async function loadSaleItems(
  saleIds
){

  saleItems = [];

  const normalizedSaleIds =
    [
      ...new Set(
        (saleIds || [])
          .map(normalizeId)
          .filter(Boolean)
      )
    ];

  if(!normalizedSaleIds.length){

    console.log(
      "No hay saleIds para consultar."
    );

    return;
  }

  console.log(
    "Consultando sale_items:",
    normalizedSaleIds.length,
    "ventas"
  );

  const chunkSize = 100;

  for(
    let i = 0;
    i < normalizedSaleIds.length;
    i += chunkSize
  ){

    const chunk =
      normalizedSaleIds.slice(
        i,
        i + chunkSize
      );

    const {
      data,
      error
    } =
      await supabaseClient
        .from("sale_items")
        .select(
          "id,sale_id,product_id,description,quantity,unit_price,subtotal"
        )
        .in(
          "sale_id",
          chunk
        );

    if(error){

      console.error(
        "Error cargando sale_items:",
        error
      );

      throw new Error(
        "No se pudieron cargar los productos de las ventas: " +
        error.message
      );

    }

    if(data){

      saleItems.push(
        ...data.map(item => ({

          ...item,

          sale_id:
            normalizeId(
              item.sale_id
            ),

          product_id:
            normalizeId(
              item.product_id
            ),

          quantity:
            Number(
              item.quantity || 0
            ),

          unit_price:
            Number(
              item.unit_price || 0
            ),

          subtotal:
            Number(
              item.subtotal ||
              (
                Number(item.quantity || 0) *
                Number(item.unit_price || 0)
              )
            )

        }))
      );

    }

  }

  saleItems =
    saleItems.filter(
      item =>
        Number(
          item.quantity || 0
        ) > 0
    );

  await loadProductNames();

  const totalPieces =
    saleItems.reduce(
      (sum,item) =>
        sum +
        Number(
          item.quantity || 0
        ),
      0
    );

  console.log(
    "sale_items cargados:",
    saleItems.length
  );

  console.log(
    "PIEZAS TOTALES:",
    totalPieces
  );

  console.table(
    saleItems
  );

}


/* =========================================================
   LOAD PRODUCT NAMES
========================================================= */

async function loadProductNames(){

  const productIds =
    [
      ...new Set(
        saleItems
          .map(
            item =>
              normalizeId(
                item.product_id
              )
          )
          .filter(Boolean)
      )
    ];

  if(!productIds.length){
    return;
  }

  const missingIds =
    productIds.filter(
      id =>
        !products.some(
          p =>
            normalizeId(p.id) === id
        )
    );

  if(!missingIds.length){
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(
        "id,name,nombre"
      )
      .in(
        "id",
        missingIds
      );

  if(error){

    console.warn(
      "No se pudieron cargar nombres:",
      error
    );

    return;
  }

  if(data){
    products.push(
      ...data
    );
  }

}


/* =========================================================
   GET SALE ITEMS
========================================================= */

function getSaleItems(
  saleId
){

  const normalizedSaleId =
    normalizeId(
      saleId
    );

  return saleItems.filter(
    item =>
      normalizeId(
        item.sale_id
      ) === normalizedSaleId
  );

}


/* =========================================================
   LOAD PAYMENTS
========================================================= */

async function loadPayments(
  saleIds
){

  payments = [];

  const ids =
    [
      ...new Set(
        (saleIds || [])
          .map(normalizeId)
          .filter(Boolean)
      )
    ];

  if(!ids.length){
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("payments")
      .select("*")
      .in(
        "sale_id",
        ids
      )
      .order(
        "paid_at",
        {
          ascending:true
        }
      );

  if(error){

    console.warn(
      "No se pudieron cargar pagos:",
      error
    );

    return;
  }

  payments =
    data || [];

}


/* =========================================================
   PAYMENTS BY SALE
========================================================= */

function getSalePayments(
  saleId
){

  const id =
    normalizeId(
      saleId
    );

  return payments.filter(
    payment =>
      normalizeId(
        payment.sale_id
      ) === id
  );

}

/* =========================================================
   FILTERS
========================================================= */

function getFilteredSales(){

  const search =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const from =
    $("dateFrom")
      .value;

  const to =
    $("dateTo")
      .value;

  return sales.filter(
    sale => {

      const text =
        [
          sale.id,
          sale.customer_name,
          sale.customer,
          sale.client_name,
          sale.folio,
          sale.notes
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      if(
        search &&
        !text.includes(search)
      ){
        return false;
      }

      const saleDate =
        dateOnly(
          sale.created_at
        );

      if(
        from &&
        saleDate < from
      ){
        return false;
      }

      if(
        to &&
        saleDate > to
      ){
        return false;
      }

      return true;

    }
  );

}


function clearFilters(){

  $("search").value = "";
  $("dateFrom").value = "";
  $("dateTo").value = "";

  renderAccounts();

}

/* =========================================================
   PRODUCT BREAKDOWN
========================================================= */

function renderProductBreakdown(
  filteredRows
){

  const validSaleIds =
    new Set(
      filteredRows.map(
        sale =>
          normalizeId(
            sale.id
          )
      )
    );

  const items =
    saleItems.filter(
      item =>
        validSaleIds.has(
          normalizeId(
            item.sale_id
          )
        )
    );

  const grouped = {};

  items.forEach(
    item => {

      const productId =
        normalizeId(
          item.product_id
        );

      const key =
        productId ||
        (
          item.description ||
          "Producto"
        );

      const name =
        getProductName(
          productId,
          item.description ||
          "Producto"
        );

      if(!grouped[key]){

        grouped[key] = {

          name,
          quantity:0,
          total:0

        };

      }

      grouped[key].quantity +=
        Number(
          item.quantity || 0
        );

      grouped[key].total +=
        Number(
          item.subtotal || 0
        );

    }
  );

  const list =
    Object.values(
      grouped
    )
    .sort(
      (a,b) =>
        b.quantity -
        a.quantity
    );

  const totalPieces =
    list.reduce(
      (sum,item) =>
        sum +
        item.quantity,
      0
    );

  $("productBreakdownTotal")
    .textContent =
      `${totalPieces} piezas`;

  if(!list.length){

    $("productBreakdownList").innerHTML =
      `
        <div class="empty">
          No hay productos pendientes.
        </div>
      `;

    return;
  }

  $("productBreakdownList").innerHTML =
    list
      .map(
        item =>
          `
            <div class="product-row">

              <div>

                <strong>
                  ${escapeHtml(item.name)}
                </strong>

                <small>
                  ${item.quantity}
                  pieza${item.quantity === 1 ? "" : "s"}
                </small>

              </div>

              <div class="product-total">
                ${money(item.total)}
              </div>

            </div>
          `
      )
      .join("");

}

/* =========================================================
   SAVE PAYMENT
   AHORA UTILIZA register_payment()
========================================================= */

async function savePayment(){

  if(!currentPaymentSale){
    return;
  }

  const amount =
    Number(
      $("paymentAmount").value
    );

  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "Ingresa un monto válido."
    );

    return;
  }

  const currentBalance =
    Number(
      currentPaymentSale.balance || 0
    );

  if(amount > currentBalance){

    alert(
      "El pago no puede ser mayor al saldo pendiente."
    );

    return;
  }

  const method =
    $("paymentMethod").value;

  const note =
    $("paymentNote")
      .value
      .trim();

  try{

    const businessId =
      currentPaymentSale.business_id ||
      BUSINESS_IDS[currentBusiness];

    if(!businessId){

      throw new Error(
        "No se encontró el negocio de la cuenta."
      );

    }

    /*
      Obtener el UUID real del método de pago.
    */

    const paymentMethodId =
      getPaymentMethodId(
        method
      );

    if(!paymentMethodId){

      throw new Error(
        "No se encontró el método de pago \"" +
        method +
        "\" en payment_methods para " +
        currentBusiness +
        "."
      );

    }

    /*
      IMPORTANTE:
      Ya NO hacemos INSERT directo a payments.

      Usamos la función SQL:
      register_payment(
        p_business_id,
        p_sale_id,
        p_payment_method_id,
        p_amount
      )
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "register_payment",
          {
            p_business_id:
              businessId,

            p_sale_id:
              currentPaymentSale.id,

            p_payment_method_id:
              paymentMethodId,

            p_amount:
              Number(
                amount.toFixed(2)
              )
          }
        );

    if(error){
      throw error;
    }

    console.log(
      "Pago registrado correctamente:",
      data
    );

    /*
      La función SQL ya actualiza:
      balance
      status
      payments
    */

    closePaymentModal();

    await loadSales();

    /*
      La nota se conserva solamente
      si la tabla/function se amplía
      posteriormente. No se manda a
      payments porque actualmente
      payments no tiene columna note.
    */

    if(note){
      console.log(
        "Nota del pago:",
        note
      );
    }

    alert(
      "Pago registrado correctamente."
    );

  }catch(error){

    console.error(
      "Error registrando pago:",
      error
    );

    alert(
      "No se pudo registrar el pago:\n\n" +
      (
        error.message ||
        "Error desconocido"
      )
    );

  }

}

/* =========================================================
   CONFIRM CANCEL
   AHORA UTILIZA cancel_sale_and_restore_inventory()
========================================================= */

async function confirmCancel(){

  if(!currentCancelSale){
    return;
  }

  const reason =
    $("cancelReason")
      .value
      .trim();

  if(!reason){

    alert(
      "Escribe el motivo de la cancelación."
    );

    return;
  }

  if(
    !confirm(
      "¿Seguro que deseas cancelar esta cuenta?"
    )
  ){
    return;
  }

  try{

    /*
      IMPORTANTE:
      Ya NO hacemos UPDATE directo a sales.

      Usamos la función SQL que ya tienes:

      cancel_sale_and_restore_inventory(
        p_sale_id,
        p_cancel_reason
      )

      Esta función:
      - bloquea la venta
      - restaura inventario
      - registra inventory_movements
      - marca la venta como cancelled
      - guarda el motivo
      - registra audit_log
    */

    const {
      error
    } =
      await supabaseClient
        .rpc(
          "cancel_sale_and_restore_inventory",
          {
            p_sale_id:
              currentCancelSale.id,

            p_cancel_reason:
              reason
          }
        );

    if(error){
      throw error;
    }

    console.log(
      "Cuenta cancelada correctamente."
    );

    closeCancelModal();

    await loadSales();

    /*
      Ocultar también el panel de
      canceladas si estaba abierto,
      para evitar que quede información
      vieja en pantalla.
    */

    $("cancelledPanel")
      .classList.add(
        "hidden"
      );

    alert(
      "Cuenta cancelada correctamente.\n\nEl inventario fue restaurado."
    );

  }catch(error){

    console.error(
      "Error cancelando cuenta:",
      error
    );

    alert(
      "No se pudo cancelar la cuenta:\n\n" +
      (
        error.message ||
        "Error desconocido"
      )
    );

  }

}

                </div>

                <div class="sale-meta">
                  Motivo:
                  ${escapeHtml(
                    sale.cancellation_reason ||
                    "Sin motivo registrado"
                  )}
                </div>

              </div>
            `;

          }
        )
        .join("");

  }catch(error){

    console.error(
      error
    );

    $("cancelledList").innerHTML =
      `
        <div class="error">
          No se pudieron cargar
          las cuentas canceladas.
        </div>
      `;

  }

}


function hideCancelled(){

  $("cancelledPanel")
    .classList.add(
      "hidden"
    );

}


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateBusinessUI();

    loadSales();

  }
);


/* =========================================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
========================================================= */

$("paymentModal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("paymentModal")
      ){

        closePaymentModal();

      }

    }
  );


$("cancelModal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target ===
        $("cancelModal")
      ){

        closeCancelModal();

      }

    }
  );

</script>
