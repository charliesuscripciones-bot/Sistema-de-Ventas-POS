<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas pendientes</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:#f5f6f8;
  color:#202124;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1180px,94%);
  margin:0 auto;
  padding:20px 0 40px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:24px;
  font-weight:800;
}

.header p{
  margin:4px 0 0;
  color:#6b7280;
  font-size:13px;
}

/* TITULO REGRESAR AL POS */

.pos-home-title{
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  text-align:left;
  color:#202124;
  transition:
    opacity .15s ease,
    transform .15s ease;
}

.pos-home-title:hover{
  opacity:.72;
}

.pos-home-title:active{
  transform:scale(.98);
}

.pos-home-title h1{
  cursor:pointer;
}

/* BUSINESS */

.business-switch{
  display:flex;
  gap:8px;
  background:#fff;
  padding:5px;
  border-radius:12px;
  border:1px solid #e5e7eb;
}

.business-switch button{
  border:0;
  background:transparent;
  padding:9px 14px;
  border-radius:8px;
  font-weight:700;
  color:#6b7280;
}

.business-switch button.active{
  background:#111827;
  color:white;
}

/* FILTERS */

.filters{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  display:grid;
  grid-template-columns:
    minmax(180px,1fr)
    150px
    150px
    auto;
  gap:10px;
  margin-bottom:15px;
}

.input,
.select{
  width:100%;
  height:42px;
  border:1px solid #d9dde4;
  border-radius:9px;
  padding:0 12px;
  outline:none;
  background:white;
}

.input:focus,
.select:focus{
  border-color:#111827;
}

.btn{
  border:0;
  border-radius:9px;
  padding:0 14px;
  min-height:42px;
  font-weight:700;
}

.btn-dark{
  background:#111827;
  color:white;
}

.btn-light{
  background:#f3f4f6;
  color:#374151;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-blue{
  background:#2563eb;
  color:white;
}

.btn-orange{
  background:#f59e0b;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

/* SUMMARY */

.summary{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:12px;
  margin-bottom:15px;
}

.summary-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:15px;
}

.summary-label{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.summary-value{
  margin-top:5px;
  font-size:22px;
  font-weight:800;
}

/* PRODUCTS */

.products-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
}

.products-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:13px;
  color:#202124;
}

.product-list{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.product-pill{
  background:#f3f4f6;
  border-radius:10px;
  padding:9px 12px;
  font-size:14px;
  color:#374151;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid #e5e7eb;
}

.product-name{
  font-weight:700;
}

.product-quantity{
  font-size:16px;
  font-weight:900;
  color:#111827;
  white-space:nowrap;
}

/* SALES */

.sales-list{
  display:grid;
  gap:10px;
}

.sale-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

.sale-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.sale-main{
  min-width:0;
}

.customer-name{
  font-size:16px;
  font-weight:800;
  margin-bottom:3px;
}

.customer-phone{
  font-size:12px;
  color:#6b7280;
}

.sale-meta{
  margin-top:7px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  color:#6b7280;
  font-size:11px;
}

.sale-meta span{
  background:#f7f7f8;
  border-radius:6px;
  padding:4px 7px;
}

.sale-amount{
  text-align:right;
  white-space:nowrap;
}

.sale-total{
  font-size:18px;
  font-weight:800;
}

.sale-balance{
  color:#dc2626;
  font-size:13px;
  font-weight:800;
  margin-top:2px;
}

.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  background:#16a34a;
}

.sale-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
  color:#6b7280;
  font-size:11px;
}

.sale-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.sale-actions button{
  border:0;
  border-radius:8px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
}

/* EMPTY */

.empty{
  background:white;
  border:1px dashed #d1d5db;
  border-radius:14px;
  padding:35px 20px;
  text-align:center;
  color:#6b7280;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-content{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:#f3f4f6;
  width:34px;
  height:34px;
  border-radius:8px;
  font-size:18px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}

.detail-item{
  background:#f8f9fa;
  border-radius:9px;
  padding:9px 11px;
}

.detail-label{
  font-size:10px;
  text-transform:uppercase;
  color:#6b7280;
  font-weight:700;
}

.detail-value{
  margin-top:3px;
  font-size:13px;
  font-weight:700;
}

.items-table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.items-table th,
.items-table td{
  padding:9px 6px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:12px;
}

.items-table th:last-child,
.items-table td:last-child{
  text-align:right;
}

.total-box{
  margin-top:15px;
  background:#f8f9fa;
  border-radius:10px;
  padding:12px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
}

.total-row:last-child{
  margin-bottom:0;
  font-weight:800;
  font-size:16px;
}

/* PAYMENT */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
  color:#374151;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #d9dde4;
  border-radius:9px;
  padding:10px;
  outline:none;
}

.form-group textarea{
  min-height:75px;
  resize:vertical;
}

.payment-balance{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:12px;
  border-radius:10px;
  margin-bottom:14px;
  font-weight:800;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

/* LOADING */

.loading{
  padding:30px;
  text-align:center;
  color:#6b7280;
}

/* CANCELLED */

.cancelled-reason{
  color:#991b1b;
  font-size:12px;
  margin-top:5px;
}

/* RESPONSIVE */

@media(max-width:850px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .container{
    width:96%;
    padding-top:14px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .business-switch{
    width:100%;
  }

  .business-switch button{
    flex:1;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .sale-top{
    flex-direction:column;
  }

  .sale-amount{
    text-align:left;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

  .products-title{
    font-size:17px;
  }

  .product-pill{
    width:100%;
    justify-content:space-between;
    padding:10px 12px;
  }

  .product-quantity{
    font-size:17px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">

    <button
      class="pos-home-title"
      onclick="goToPOS()"
      title="Regresar al POS">

      <h1>💳 Cuentas pendientes</h1>

      <p>
        Consulta, abona y liquida las cuentas de tus clientes.
      </p>

    </button>


    <div class="business-switch">

      <button
        id="businessBakeQuiri"
        onclick="changeBusiness('BakeQuiri')">
        BakeQuiri
      </button>

      <button
        id="businessSpicyRoll"
        onclick="changeBusiness('SpicyRoll')">
        SpicyRoll
      </button>

    </div>

  </div>


  <div class="filters">

    <input
      id="searchInput"
      class="input"
      type="text"
      placeholder="Buscar cliente, teléfono o folio..."
      oninput="renderSales"
    >

    <select
      id="statusFilter"
      class="select"
      onchange="renderSales()">

      <option value="pending">
        Pendientes
      </option>

      <option value="paid">
        Liquidadas
      </option>

      <option value="cancelled">
        Canceladas
      </option>

      <option value="all">
        Todas
      </option>

    </select>

    <input
      id="dateFilter"
      class="input"
      type="date"
      onchange="renderSales()"
    >

    <button
      class="btn btn-dark"
      onclick="loadSales()">

      🔄 Actualizar

    </button>

  </div>


  <div class="summary">

    <div class="summary-card">

      <div class="summary-label">
        Cuentas
      </div>

      <div
        id="summaryAccounts"
        class="summary-value">

        0

      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Total
      </div>

      <div
        id="summaryTotal"
        class="summary-value">

        $0.00

      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Pagado
      </div>

      <div
        id="summaryPaid"
        class="summary-value">

        $0.00

      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Pendiente
      </div>

      <div
        id="summaryBalance"
        class="summary-value">

        $0.00

      </div>

    </div>

  </div>


  <div class="products-box">

    <div class="products-title">
      Productos vendidos a crédito
    </div>

    <div
      id="productList"
      class="product-list">
    </div>

  </div>


  <div
    id="salesList"
    class="sales-list">

    <div class="loading">
      Cargando cuentas...
    </div>

  </div>

</div>


<!-- DETAILS MODAL -->

<div
  id="detailsModal"
  class="modal"
  onclick="closeModalOutside(event,'detailsModal')">

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Detalle de cuenta
      </h2>

      <button
        class="close"
        onclick="closeModal('detailsModal')">

        ×

      </button>

    </div>

    <div id="detailsContent"></div>

  </div>

</div>


<!-- PAYMENT MODAL -->

<div
  id="paymentModal"
  class="modal"
  onclick="closeModalOutside(event,'paymentModal')">

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Registrar abono
      </h2>

      <button
        class="close"
        onclick="closeModal('paymentModal')">

        ×

      </button>

    </div>

    <div id="paymentSaleInfo"></div>

    <div class="payment-balance">

      Saldo pendiente:

      <span id="paymentBalance">
        $0.00
      </span>

    </div>

    <div class="form-group">

      <label>
        Monto del abono
      </label>

      <input
        id="paymentAmount"
        type="number"
        step="0.01"
        min="0"
        placeholder="0.00"
      >

    </div>

    <div class="form-group">

      <label>
        Método de pago
      </label>

      <select id="paymentMethod">

        <option value="">
          Seleccionar método...
        </option>

      </select>

    </div>

    <div class="form-group">

      <label>
        Nota
      </label>

      <textarea
        id="paymentNote"
        placeholder="Nota opcional...">
      </textarea>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('paymentModal')">

        Cancelar

      </button>

      <button
        class="btn btn-orange"
        onclick="fillLiquidationAmount()">

        ⚡ Liquidar cuenta

      </button>

      <button
        class="btn btn-green"
        onclick="savePayment()">

        💰 Registrar pago

      </button>

    </div>

  </div>

</div>


<!-- CANCEL MODAL -->

<div
  id="cancelModal"
  class="modal"
  onclick="closeModalOutside(event,'cancelModal')">

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        Cancelar cuenta
      </h2>

      <button
        class="close"
        onclick="closeModal('cancelModal')">

        ×

      </button>

    </div>

    <div id="cancelSaleInfo"></div>

    <div class="form-group">

      <label>
        Motivo de cancelación
      </label>

      <textarea
        id="cancelReason"
        placeholder="Escribe el motivo...">
      </textarea>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('cancelModal')">

        Regresar

      </button>

      <button
        class="btn btn-red"
        onclick="confirmCancellation()">

        Cancelar cuenta

      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jrxklpstlloeckihcduv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XNTaRpicaIpdgNnzLy8yAA_5M4K_pWp";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   BUSINESSES
========================================================= */

const BUSINESS_IDS = {

  BakeQuiri:
    "c435ee25-6a2b-4134-b3f8-90b38d6bde0c",

  SpicyRoll:
    "ebaf1740-2398-49d5-a3aa-3f6fd6fb40cf"

};


/* =========================================================
   STATE
========================================================= */

let currentBusiness =
  "BakeQuiri";

let businessId =
  BUSINESS_IDS[currentBusiness];

let sales = [];

let customers = [];

let products = [];

let paymentMethods = [];

let currentPaymentSale = null;

let currentCancelSale = null;


/* =========================================================
   REGRESAR AL POS
========================================================= */

function goToPOS(){

  window.location.href =
    "index.html";

}


/* =========================================================
   HELPERS
========================================================= */

function normalizeId(value){

  return String(value || "")
    .trim()
    .toLowerCase();

}


function money(value){

  const amount =
    Number(value || 0);

  return amount.toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "—";

  }

  return date.toLocaleString(
    "es-MX",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function dateOnly(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );

  return `${year}-${month}-${day}`;

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   BUSINESS
========================================================= */

function changeBusiness(
  name
){

  currentBusiness =
    name;

  businessId =
    BUSINESS_IDS[name];


  document
    .getElementById(
      "businessBakeQuiri"
    )
    .classList.toggle(
      "active",
      name === "BakeQuiri"
    );


  document
    .getElementById(
      "businessSpicyRoll"
    )
    .classList.toggle(
      "active",
      name === "SpicyRoll"
    );


  loadSales();

}


/* =========================================================
   LOAD CUSTOMERS
========================================================= */

async function loadCustomers(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("customers")
        .select(
          "id,name,phone,notes,created_at"
        );


    if(error){

      console.error(
        "Error cargando clientes:",
        error
      );

      customers = [];

      return;

    }


    customers =
      data || [];


  }catch(error){

    console.error(error);

    customers = [];

  }

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq(
          "business_id",
          businessId
        );


    if(error){

      console.error(
        "Error cargando productos:",
        error
      );

      products = [];

      return;

    }


    products =
      data || [];


  }catch(error){

    console.error(error);

    products = [];

  }

}


/* =========================================================
   LOAD PAYMENT METHODS
========================================================= */

async function loadPaymentMethods(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("payment_methods")
        .select(
          "id,name,provider,active,business_id"
        )
        .eq(
          "business_id",
          businessId
        )
        .eq(
          "active",
          true
        )
        .order(
          "name"
        );


    if(error){

      console.error(
        "Error cargando métodos:",
        error
      );

      paymentMethods = [];

      return;

    }


    paymentMethods =
      data || [];


    renderPaymentMethods();


  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   LOAD SALES
========================================================= */

async function loadSales(){

  const salesList =
    document.getElementById(
      "salesList"
    );


  salesList.innerHTML =
    `<div class="loading">
      Cargando cuentas...
    </div>`;


  try{

    await Promise.all([
      loadCustomers(),
      loadProducts(),
      loadPaymentMethods()
    ]);


    const {
      data,
      error
    } =
      await supabaseClient
        .from("sales")
        .select(`
          id,
          business_id,
          journey_id,
          customer_id,
          sale_date,
          total,
          balance,
          status,
          created_at,
          cancellation_reason,
          customers (
            id,
            name,
            phone
          ),
          sale_items (
            id,
            sale_id,
            product_id,
            description,
            quantity,
            unit_price,
            subtotal
          )
        `)
        .eq(
          "business_id",
          businessId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.error(
        "Error cargando ventas:",
        error
      );


      salesList.innerHTML =
        `<div class="empty">
          No fue posible cargar las cuentas.
        </div>`;


      return;

    }


    sales =
      data || [];


    renderSales();


  }catch(error){

    console.error(error);


    salesList.innerHTML =
      `<div class="empty">
        Ocurrió un error al cargar las cuentas.
      </div>`;

  }

}


/* =========================================================
   CUSTOMER HELPERS
========================================================= */

function getCustomerName(
  sale
){

  if(
    sale.customer_name
  ){

    return sale.customer_name;

  }


  if(
    sale.customers &&
    sale.customers.name
  ){

    return sale.customers.name;

  }


  if(
    sale.customer &&
    sale.customer.name
  ){

    return sale.customer.name;

  }


  if(
    sale.client_name
  ){

    return sale.client_name;

  }


  const customer =
    customers.find(
      c =>
        normalizeId(c.id) ===
        normalizeId(
          sale.customer_id
        )
    );


  return customer?.name ||
    "Cliente";

}


function getCustomerPhone(
  sale
){

  if(
    sale.customer_phone
  ){

    return sale.customer_phone;

  }


  if(
    sale.customers &&
    sale.customers.phone
  ){

    return sale.customers.phone;

  }


  if(
    sale.customer &&
    sale.customer.phone
  ){

    return sale.customer.phone;

  }


  const customer =
    customers.find(
      c =>
        normalizeId(c.id) ===
        normalizeId(
          sale.customer_id
        )
    );


  return customer?.phone ||
    "";

}


/* =========================================================
   PRODUCT HELPERS
========================================================= */

function getProductName(
  productId,
  fallback
){

  const product =
    products.find(
      p =>
        normalizeId(p.id) ===
        normalizeId(productId)
    );


  return product?.name ||
    fallback ||
    "Producto";

}


function getSaleItems(
  saleId
){

  const sale =
    sales.find(
      s =>
        normalizeId(s.id) ===
        normalizeId(saleId)
    );


  if(
    sale &&
    Array.isArray(
      sale.sale_items
    )
  ){

    return sale.sale_items;

  }


  return [];

}


/* =========================================================
   STATUS
========================================================= */

function getSaleStatus(
  sale
){

  const balance =
    Number(
      sale.balance || 0
    );

  const total =
    Number(
      sale.total || 0
    );


  if(
    sale.status === "cancelled"
  ){

    return "cancelled";

  }


  if(
    balance <= 0 ||
    sale.status === "paid"
  ){

    return "paid";

  }


  if(
    balance < total
  ){

    return "partial";

  }


  return "pending";

}


/* =========================================================
   RENDER SALES
========================================================= */

function renderSales(){

  const search =
    String(
      document.getElementById(
        "searchInput"
      ).value || ""
    )
    .trim()
    .toLowerCase();


  const statusFilter =
    document.getElementById(
      "statusFilter"
    ).value;


  const selectedDate =
    document.getElementById(
      "dateFilter"
    ).value;


  let filtered =
    sales.filter(
      sale => {

        const customer =
          getCustomerName(
            sale
          ).toLowerCase();


        const phone =
          getCustomerPhone(
            sale
          ).toLowerCase();


        const folio =
          String(
            sale.id || ""
          ).toLowerCase();


        const matchesSearch =
          !search ||
          customer.includes(search) ||
          phone.includes(search) ||
          folio.includes(search);


        const status =
          getSaleStatus(
            sale
          );


        let matchesStatus =
          true;


        if(
          statusFilter === "pending"
        ){

          matchesStatus =
            status === "pending" ||
            status === "partial";

        }else if(
          statusFilter === "paid"
        ){

          matchesStatus =
            status === "paid";

        }else if(
          statusFilter === "cancelled"
        ){

          matchesStatus =
            status === "cancelled";

        }


        const matchesDate =
          !selectedDate ||
          dateOnly(
            sale.created_at ||
            sale.sale_date
          ) === selectedDate;


        return (
          matchesSearch &&
          matchesStatus &&
          matchesDate
        );

      }
    );


  updateSummary(
    filtered
  );


  renderProductSummary(
    filtered
  );


  const salesList =
    document.getElementById(
      "salesList"
    );


  if(
    !filtered.length
  ){

    salesList.innerHTML =
      `<div class="empty">
        No hay cuentas para mostrar.
      </div>`;

    return;

  }


  salesList.innerHTML =
    filtered
      .map(
        sale =>
          renderSaleCard(
            sale
          )
      )
      .join("");

}


/* =========================================================
   SALE CARD
========================================================= */

function renderSaleCard(
  sale
){

  const customer =
    getCustomerName(
      sale
    );


  const phone =
    getCustomerPhone(
      sale
    );


  const total =
    Number(
      sale.total || 0
    );


  const balance =
    Number(
      sale.balance || 0
    );


  const paid =
    Math.max(
      0,
      total - balance
    );


  const percentage =
    total > 0
      ? Math.min(
          100,
          Math.max(
            0,
            (paid / total) * 100
          )
        )
      : 0;


  const items =
    getSaleItems(
      sale.id
    );


  const pieces =
    items.reduce(
      (
        sum,
        item
      ) =>
        sum +
        Number(
          item.quantity || 0
        ),
      0
    );


  const status =
    getSaleStatus(
      sale
    );


  const statusText =
    status === "cancelled"
      ? "Cancelada"
      : status === "paid"
        ? "Liquidada"
        : status === "partial"
          ? "Abono parcial"
          : "Pendiente";


  const statusClass =
    status === "paid"
      ? "background:#dcfce7;color:#166534;"
      : status === "cancelled"
        ? "background:#fee2e2;color:#991b1b;"
        : status === "partial"
          ? "background:#fef3c7;color:#92400e;"
          : "background:#fee2e2;color:#991b1b;";


  const shortId =
    String(
      sale.id || ""
    ).slice(
      0,
      8
    ).toUpperCase();


  return `

    <div class="sale-card">

      <div class="sale-top">

        <div class="sale-main">

          <div class="customer-name">
            ${escapeHtml(customer)}
          </div>

          ${
            phone
              ? `<div class="customer-phone">
                  📱 ${escapeHtml(phone)}
                </div>`
              : ""
          }

          <div class="sale-meta">

            <span>
              Folio: ${shortId}
            </span>

            <span>
              ${formatDate(
                sale.created_at ||
                sale.sale_date
              )}
            </span>

            <span style="${statusClass}">
              ${statusText}
            </span>

          </div>

        </div>


        <div class="sale-amount">

          <div class="sale-total">
            ${money(total)}
          </div>

          ${
            balance > 0
              ? `<div class="sale-balance">
                  Debe ${money(balance)}
                </div>`
              : `<div style="color:#16a34a;font-size:13px;font-weight:800;">
                  Liquidada
                </div>`
          }

        </div>

      </div>


      <div class="progress">

        <div
          class="progress-bar"
          style="width:${percentage}%">
        </div>

      </div>


      <div class="sale-info">

        <span>
          Pagado: ${money(paid)}
        </span>

        <span>
          ${pieces}
          pieza${pieces === 1 ? "" : "s"}
        </span>

      </div>


      <div class="sale-actions">

        <button
          class="btn-light"
          onclick="openDetailsModal('${sale.id}')">

          🔎 Detalles

        </button>


        ${
          balance > 0
            ? `

              <button
                class="btn-orange"
                onclick="openPaymentModal('${sale.id}')">

                💰 Abonar

              </button>


              <button
                class="btn-green"
                onclick="liquidateSale('${sale.id}')">

                ⚡ Liquidar

              </button>


              <button
                class="btn-blue"
                onclick="sendWhatsApp('${sale.id}')">

                💬 WhatsApp

              </button>


              <button
                class="btn-red"
                onclick="openCancelModal('${sale.id}')">

                ✕ Cancelar

              </button>

            `
            : ""
        }

      </div>

    </div>

  `;

}

){

  const total =
    list.reduce(
      (
        sum,
        sale
      ) =>
        sum +
        Number(
          sale.total || 0
        ),

    );


  const balance =
    list.reduce(

/* =========================================================
   PRODUCT SUMMARY
========================================================= */

function renderProductSummary(
  list
){

  const quantities = {};


  list.forEach(
    sale => {

      const items =
        getSaleItems(
          sale.id
        );


      items.forEach(
        item => {

          const name =
            getProductName(
              item.product_id,
              item.description ||
              "Producto"
            );


          const quantity =
            Number(
              item.quantity || 0
            );


          quantities[name] =
            (
              quantities[name] || 0
            ) +
            quantity;

        }
      );

    }
  );


  const container =
    document.getElementById(
      "productList"
    );


  const entries =
    Object.entries(
      quantities
    )
    .sort(
      (
        a,
        b
      ) =>
        b[1] - a[1]
    );


  if(
    !entries.length
  ){

    container.innerHTML =
      `<span class="product-pill">
        <span class="product-name">
          Sin productos
        </span>
      </span>`;

    return;

  }


  container.innerHTML =
    entries
      .map(
        ([name,quantity]) =>
          `
          <span class="product-pill">

            <span class="product-name">
              ${escapeHtml(name)}
            </span>

            <span class="product-quantity">
              × ${quantity}
            </span>

          </span>
          `
      )
      .join("");

}

async function savePayment(){

    !currentPaymentSale
  ){

  }


  const amount =
    Number(
      document.getElementById(
        "paymentAmount"
      ).value
    );


  const paymentMethodId =
    document.getElementById(
      "paymentMethod"
    ).value;


  const note =
    document.getElementById(
      "paymentNote"
    ).value.trim();


  const balance =
    Number(
      currentPaymentSale.balance || 0
    );


  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "Ingresa un monto válido."
    );

    return;

  }


  if(
    amount > balance + 0.01
  ){

    alert(
      "El abono no puede ser mayor al saldo pendiente."
    );

    return;

  }


  if(
    !paymentMethodId
  ){

    alert(
      "Selecciona un método de pago."
    );

    return;

  }


  try{

    const {
      error
    } =
      await supabaseClient.rpc(
        "register_payment",
        {
          p_business_id:
            businessId,

          p_sale_id:
            currentPaymentSale.id,

          p_payment_method_id:
            paymentMethodId,

          p_amount:
            Number(
              amount.toFixed(2)
            )
        }
      );


    if(error){

      console.error(error);


      alert(

    closeModal(

  }catch(error){

    console.error(error);


    alert(
      "Ocurrió un error al registrar el pago."
    );

  }

    cleanPhone;


  if(
    whatsappPhone.length === 10
  ){

    whatsappPhone =
      "52" +
      whatsappPhone;

  }


  let url;


  if(
    whatsappPhone
  ){

    url =
      "https://wa.me/" +
      whatsappPhone +
      "?text=" +
      encodeURIComponent(
        message
      );

  }else{

    url =
      "https://wa.me/?text=" +
      encodeURIComponent(
        message
      );

  }


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   MODALS
========================================================= */

function openModal(
  id
){

  document
    .getElementById(id)
    .classList.add(
      "show"
    );

}


function closeModal(
  id
){

  document
    .getElementById(id)
    .classList.remove(
      "show"
    );

}


function closeModalOutside(
  event,
  id
){

  if(
    event.target.id === id
  ){

    closeModal(
      id
    );

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      [
        "detailsModal",
        "paymentModal",
        "cancelModal"
      ]
      .forEach(
        id =>
          closeModal(id)
      );

    }

  }
);


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    changeBusiness(
      "BakeQuiri"
    );

  }
);

</script>
